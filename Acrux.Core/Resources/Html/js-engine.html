<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>JS Engine Manager</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 20px; background: #f0f2f5; color: #333; }
  h1 { font-size: 24px; margin: 0 0 20px 0; }
  .card { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 16px; border: 1px solid #e0e0e0; }
  .card.active { border: 2px solid #1a73e8; background: #e8f0fe; }
  .card h2 { margin: 0 0 8px 0; font-size: 18px; }
  .status { font-size: 14px; color: #666; margin-bottom: 12px; }
  .status .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
  .badge.builtin { background: #e6f4ea; color: #1e8e3e; }
  .badge.ready { background: #e6f4ea; color: #1e8e3e; }
  .badge.missing { background: #fce8e6; color: #d93025; }
  .badge.active { background: #1a73e8; color: #fff; }
  .actions { margin-top: 8px; }
  button { padding: 6px 14px; margin-right: 8px; margin-bottom: 4px; border: 1px solid #dadce0; border-radius: 4px; background: #fff; cursor: pointer; font-size: 13px; }
  button:hover { background: #f1f3f4; }
  button.primary { background: #1a73e8; color: #fff; border-color: #1a73e8; }
  button.primary:hover { background: #1557b0; }
  button:disabled { opacity: 0.5; cursor: default; }
  #message { padding: 10px; border-radius: 4px; margin-bottom: 16px; display: none; }
  #message.success { background: #e6f4ea; color: #1e8e3e; display: block; }
  #message.error { background: #fce8e6; color: #d93025; display: block; }
  #message.info { background: #e8f0fe; color: #1a73e8; display: block; }
  .hint { font-size: 12px; color: #999; margin-top: 4px; }
  #refresh-btn { float: right; padding: 4px 12px; font-size: 13px; }
</style>
</head>
<body>
<h1>JavaScript 引擎管理 <button id="refresh-btn" onclick="refreshStatus()">↻ 刷新</button></h1>
<div id="message"></div>
<div id="engine-list"></div>
<div class="hint">提示：下载/本地安装后，点击「应用此引擎」即可切换。更改需要重启浏览器或新建标签页才完全生效。</div>

<script>
function showMsg(text, type) {
  var el = document.getElementById('message');
  el.textContent = text;
  el.className = type;
  el.style.display = 'block';
  if (type !== 'error') {
    setTimeout(function() { el.style.display = 'none'; }, 5000);
  }
}

function refreshStatus() {
  try {
    var data = __acrux.engineGetStatus();
    var engines = JSON.parse(data);
    var html = '';
    for (var i = 0; i < engines.length; i++) {
      var e = engines[i];
      var activeClass = e.active ? ' active' : '';
      var badgeClass = e.builtIn ? 'builtin' : (e.downloaded ? 'ready' : 'missing');
      var badgeText = e.builtIn ? '内置' : (e.downloaded ? '已就绪' : '未下载');
      if (e.active) badgeText += ' ● 当前使用';

      html += '<div class="card' + activeClass + '">';
      html += '<h2>' + e.name + '</h2>';
      html += '<div class="status"><span class="badge ' + badgeClass + '">' + badgeText + '</span></div>';

      if (e.name === 'Jint') {
        html += '<div class="hint">纯 C# 引擎，跨平台，无需下载</div>';
      } else if (e.active) {
        html += '<div class="actions">';
        html += '<button onclick="downloadEngine(\'' + e.name + '\')">重新下载</button>';
        html += '<button onclick="browseEngine(\'' + e.name + '\')">从本地选择...</button>';
        html += '</div>';
      } else if (e.downloaded) {
        html += '<div class="actions">';
        html += '<button class="primary" onclick="applyEngine(\'' + e.name + '\')">应用此引擎</button>';
        html += '<button onclick="browseEngine(\'' + e.name + '\')">从本地选择...</button>';
        html += '</div>';
      } else {
        html += '<div class="actions">';
        html += '<button class="primary" onclick="downloadEngine(\'' + e.name + '\')">下载</button>';
        html += '<button onclick="browseEngine(\'' + e.name + '\')">从本地选择...</button>';
        html += '</div>';
      }
      html += '</div>';
    }
    document.getElementById('engine-list').innerHTML = html;
  } catch (ex) {
    showMsg('获取引擎状态失败: ' + ex.message, 'error');
  }
}

function downloadEngine(name) {
  try {
    var result = __acrux.engineDownload(name);
    var r = JSON.parse(result);
    if (r.success) {
      showMsg('开始下载 ' + name + ' 引擎...', 'info');
      setTimeout(refreshStatus, 3000);
    } else {
      showMsg('下载失败: ' + (r.error || result), 'error');
    }
  } catch (ex) {
    showMsg('下载出错: ' + ex.message, 'error');
  }
}

function browseEngine(name) {
  try {
    var result = __acrux.engineBrowse(name);
    var r = JSON.parse(result);
    if (r.success) {
      showMsg('成功从本地安装 ' + name + ' 引擎!', 'success');
      refreshStatus();
    } else {
      showMsg('安装失败: ' + (r.error || result), 'error');
    }
  } catch (ex) {
    showMsg('安装出错: ' + ex.message, 'error');
  }
}

function applyEngine(name) {
  try {
    var result = __acrux.engineApply(name);
    var r = JSON.parse(result);
    if (r.success) {
      showMsg('已切换到 ' + name + ' 引擎！新标签页将使用新引擎。', 'success');
      refreshStatus();
    } else {
      showMsg('切换失败: ' + (r.error || result), 'error');
    }
  } catch (ex) {
    showMsg('切换出错: ' + ex.message, 'error');
  }
}

refreshStatus();
</script>
</body>
</html>
