<!DOCTYPE html><html><body><div id="root"></div>
<script>
(function () {
    function eq(label, got, wantValue) {
        window.__T(label, String(got) === String(wantValue),
            'got=[' + String(got) + '] want=[' + String(wantValue) + ']');
    }
    function safe(fn) {
        try { return 'ok:' + fn(); }
        catch (e) { return 'ERR:' + String(e && e.name) + ':' + String(e && e.message).slice(0, 40); }
    }
    function el(tag) { return document.getElementById('root').appendChild(document.createElement(tag || 'div')); }

    // ── A. node construction and nodeType ───────────────────────────────────
    eq('A1 createElement produces an element nodeType 1', document.createElement('div').nodeType, '1');
    eq('A2 createTextNode produces a text nodeType 3', document.createTextNode('x').nodeType, '3');
    eq('A3 createComment produces a comment nodeType 8', document.createComment('x').nodeType, '8');
    eq('A4 createDocumentFragment produces a fragment nodeType 11', document.createDocumentFragment().nodeType, '11');
    eq('A5 createElement tagName is uppercase', document.createElement('span').tagName, 'SPAN');
    eq('A6 createElementNS preserves the lowercase localName', document.createElementNS('http://www.w3.org/2000/svg', 'svg').localName, 'svg');
    eq('A7 createTextNode stores the data', document.createTextNode('hello').data, 'hello');

    // ── B. tree structure after construction ─────────────────────────────────
    eq('B1 appendChild sets parentNode', (function () {
        var p = el('div'); var c = document.createElement('span'); p.appendChild(c);
        var r = c.parentNode === p; p.remove(); return r;
    })(), 'true');
    eq('B2 a fragment appends its children, not itself', (function () {
        var frag = document.createDocumentFragment();
        var a = document.createElement('span'); frag.appendChild(a);
        var p = el('div'); p.appendChild(frag);
        var r = p.firstChild === a && !p.contains(frag); p.remove(); return r;
    })(), 'true');
    eq('B3 childNodes includes text nodes between elements', (function () {
        var d = el('div'); d.innerHTML = 'a<b>c</b>d';
        var n = d.childNodes.length; d.remove(); return n;
    })(), '3');
    eq('B4 children excludes text nodes', (function () {
        var d = el('div'); d.innerHTML = 'a<b>c</b>d';
        var n = d.children.length; d.remove(); return n;
    })(), '1');

    // ── C. sibling walking ───────────────────────────────────────────────────
    eq('C1 nextSibling skips to the next node of any kind', (function () {
        var d = el('div'); d.innerHTML = '<b>x</b>y<b>z</b>';
        var r = d.firstChild.nextSibling.nodeType; d.remove(); return r;
    })(), '3');
    eq('C2 nextElementSibling skips text nodes', (function () {
        var d = el('div'); d.innerHTML = '<b>x</b>y<b>z</b>';
        var r = d.firstElementChild.nextElementSibling.tagName; d.remove(); return r;
    })(), 'B');
    eq('C3 previousElementSibling from the last child', (function () {
        var d = el('div'); d.innerHTML = '<b>x</b><i>y</i>';
        var r = d.lastElementChild.previousElementSibling.tagName; d.remove(); return r;
    })(), 'B');

    // ── D. firstChild / lastChild ────────────────────────────────────────────
    eq('D1 firstChild of an empty element is null', el('div').firstChild, 'null');
    eq('D2 lastChild of an empty element is null', el('div').lastChild, 'null');
    eq('D3 firstChild after innerHTML is the first node', (function () {
        var d = el('div'); d.innerHTML = '<b>x</b>';
        var r = d.firstChild.tagName; d.remove(); return r;
    })(), 'B');

    // ── E. removeChild / replaceChild errors ─────────────────────────────────
    eq('E1 removeChild on a non-child throws', safe(function () {
        var p = el('div'); var orphan = document.createElement('span');
        p.removeChild(orphan); return 'removed';
    }).slice(0, 3), 'ERR');
    eq('E2 insertBefore with a reference not a child throws', safe(function () {
        var p = el('div'); var ref = document.createElement('span');
        var c = document.createElement('span');
        p.insertBefore(c, ref); return 'inserted';
    }).slice(0, 3), 'ERR');

    // ── F. innerHTML round-trip ──────────────────────────────────────────────
    eq('F1 innerHTML round-trips a simple element', (function () {
        var d = el('div'); d.innerHTML = '<b class="x">y</b>';
        var r = d.innerHTML; d.remove(); return r;
    })(), '<b class="x">y</b>');
    eq('F2 innerHTML round-trips nested elements', (function () {
        var d = el('div'); d.innerHTML = '<div><span>t</span></div>';
        var r = d.innerHTML; d.remove(); return r;
    })(), '<div><span>t</span></div>');
    eq('F3 outerHTML includes the element itself', (function () {
        var d = el('div'); d.innerHTML = '<b>x</b>';
        var r = d.firstChild.outerHTML; d.remove(); return r;
    })(), '<b>x</b>');
    eq('F4 setting outerHTML replaces the element', (function () {
        var parent = el('div'); var c = document.createElement('span');
        parent.appendChild(c); c.outerHTML = '<b>z</b>';
        var tag = parent.firstChild.tagName; parent.remove(); return tag;
    })(), 'B');

    // ── G. textContent writes replace all children ───────────────────────────
    eq('G1 setting textContent clears existing children', (function () {
        var d = el('div'); d.innerHTML = '<b>x</b><i>y</i>';
        d.textContent = 'plain';
        var n = d.childNodes.length; d.remove(); return n;
    })(), '1');
    eq('G2 the single child after textContent is a text node', (function () {
        var d = el('div'); d.textContent = 'plain';
        var r = d.firstChild.nodeType; d.remove(); return r;
    })(), '3');
})();
</script></body></html>
