<!DOCTYPE html>
<html>
<head>

</head>

<div class="box"><span class="inner">x</span></div>
<script>

  __T('rule.style is CSSStyleDeclaration', rule && typeof rule.style.getPropertyValue === 'function');

  } catch (e) {
    __T('insertRule rejects bad css', /SyntaxError/.test(String(e.name || e.message)), 'name=' + e.name + ' msg=' + e.message);
  }

  // --- CSS constructor helpers ---
  try {
    __T('CSS.supports works', typeof CSS.supports === 'function');
    __T('CSS escapes', typeof CSS.escape === 'function' ? CSS.escape('a b') === 'a\\ b' : false, 'esc=' + (typeof CSS.escape==='function'?CSS.escape('a b'):'none'));
  } catch (e) { __T('CSS namespace', false, e.message); }
})();
</script>
</body>
</html>
