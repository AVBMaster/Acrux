(function () {

    fr.onloadend = function () { seen.push('end' + fr.readyState); };
    fr.readAsText(new Blob(['hello']));
    setTimeout(function () {
        ckAll('R1 a reader reports the read through its events', [
            ['the four events in order', seen.join(',') === 'start1,prog1,load:load:2:true,end2'],
            ['the text arrived', fr.result === 'hello'],
            ['the reader is done', fr.readyState === 2],
            ['nothing failed', fr.error === null]
        ], 'seen=' + seen.join(','));
    }, 0);
})();
