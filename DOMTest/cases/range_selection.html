    var r = contentsOf(p1);
    sel.removeAllRanges(); sel.addRange(r);
    var list = sel.getComposedRanges();
    return Array.isArray(list) && list.length === 1 && list[0] !== r
        && list[0].startContainer === t1.parentNode && list[0].toString() === r.toString();
}, function () { return sel.getComposedRanges().length; });
ck('F5 getComposedRanges of an empty selection', function () {
    sel.removeAllRanges();
    var list = sel.getComposedRanges();
    return Array.isArray(list) && list.length === 0;
});
ckErr('F6 a range that is not in the selection is refused',
    "NotFoundError",
    "Failed to execute 'removeRange' on 'Selection': Range not found.",
    function () {
        var a = contentsOf(p1), b = contentsOf(p2);
        sel.removeAllRanges(); sel.addRange(a); sel.removeRange(b);
    });
ck('F7 removeRange takes the range out', function () {
    var a = contentsOf(p1);
    sel.removeAllRanges(); sel.addRange(a); sel.removeRange(a);
    return sel.rangeCount === 0 && sel.type === 'None' && sel.direction === 'none';
});
ck('F8 a document built by the implementation has the parts a page expects', function () {
    var other = doc.implementation.createHTMLDocument('A title');
    return other.body !== null && other.body.tagName === 'BODY'
        && other.documentElement.tagName === 'HTML'
        && other.getElementsByTagName('head').length === 1
        && other.title === 'A title';
}, function () {
    var other = doc.implementation.createHTMLDocument('A title');
    return String(other.body) + '/' + String(other.documentElement);
});
ck('F9 a range over another document is ignored', function () {
    var other = doc.implementation.createHTMLDocument();
    var r = other.createRange(); r.selectNodeContents(other.body);
    sel.removeAllRanges(); sel.addRange(r);
    return sel.rangeCount === 0 && sel.type === 'None' && other.getSelection().rangeCount === 0;
}, function () { return sel.rangeCount; });
ck('F10 a range over a detached subtree is ignored', function () {
    var div = doc.createElement('div');
    div.appendChild(doc.createTextNode('x'));
    var r = contentsOf(div);
    sel.removeAllRanges(); sel.addRange(r);
    return sel.rangeCount === 0 && sel.type === 'None';
});
ckErr('F11 an empty selection cannot be collapsed at either end', 'InvalidStateError',
    "Failed to execute 'collapseToStart' on 'Selection': there is no selection.",
    function () { sel.removeAllRanges(); sel.collapseToStart(); });
ckErr('F12 the same at the end', 'InvalidStateError',
    "Failed to execute 'collapseToEnd' on 'Selection': there is no selection.",
    function () { sel.removeAllRanges(); sel.collapseToEnd(); });
ck('F13 collapseToStart and collapseToEnd move the caret', function () {
    var r = contentsOf(t1);
    sel.removeAllRanges(); sel.addRange(r);
    sel.collapseToStart();
    var start = sel.anchorOffset === 0 && sel.isCollapsed === true && sel.type === 'Caret'
        && sel.direction === 'none';
    var r2 = contentsOf(t1);
    sel.removeAllRanges(); sel.addRange(r2);
    sel.collapseToEnd();
    return start && sel.anchorOffset === 11 && sel.focusOffset === 11;
}, function () { return sel.anchorOffset; });
ck('F14 empty clears the selection', function () {
    sel.removeAllRanges(); sel.addRange(contentsOf(p1)); sel.empty();
    return sel.rangeCount === 0 && sel.type === 'None';
});

// ── G: the arguments the page forgot ─────────────────────────────────────────
// The reference counts the arguments before it looks at their types, so these refusals name the
// method and the number that is missing rather than parameter 1.
ckErr('G1 addRange()', 'TypeError',
    "Failed to execute 'addRange' on 'Selection': 1 argument required, but only 0 present.",
    function () { sel.addRange(); });
ckErr('G2 removeRange()', 'TypeError',
    "Failed to execute 'removeRange' on 'Selection': 1 argument required, but only 0 present.",
    function () { sel.removeRange(); });
ckErr('G3 getRangeAt()', 'TypeError',
    "Failed to execute 'getRangeAt' on 'Selection': 1 argument required, but only 0 present.",
    function () { sel.getRangeAt(); });
ckErr('G4 collapse()', 'TypeError',
    "Failed to execute 'collapse' on 'Selection': 1 argument required, but only 0 present.",
    function () { sel.collapse(); });
ckErr('G5 setPosition()', 'TypeError',
    "Failed to execute 'setPosition' on 'Selection': 1 argument required, but only 0 present.",
    function () { sel.setPosition(); });
ckErr('G6 extend()', 'TypeError',
    "Failed to execute 'extend' on 'Selection': 1 argument required, but only 0 present.",
    function () { sel.extend(); });
ckErr('G7 selectAllChildren()', 'TypeError',
    "Failed to execute 'selectAllChildren' on 'Selection': 1 argument required, but only 0 present.",
    function () { sel.selectAllChildren(); });
ckErr('G8 containsNode()', 'TypeError',
    "Failed to execute 'containsNode' on 'Selection': 1 argument required, but only 0 present.",
    function () { sel.containsNode(); });
ckErr('G9 setBaseAndExtent()', 'TypeError',
    "Failed to execute 'setBaseAndExtent' on 'Selection': 4 arguments required, but only 0 present.",
    function () { sel.setBaseAndExtent(); });
ckErr('G10 setBaseAndExtent with three', 'TypeError',
    "Failed to execute 'setBaseAndExtent' on 'Selection': 4 arguments required, but only 3 present.",
    function () { sel.setBaseAndExtent(p1, 0, p1, 1); sel.setBaseAndExtent(p1, 0, p1); });
ckErr('G11 addRange with something that is not a Range', 'TypeError',
    "Failed to execute 'addRange' on 'Selection': parameter 1 is not of type 'Range'.",
    function () { sel.addRange('x'); });
ckErr('G12 removeRange with something that is not a Range', 'TypeError',
    "Failed to execute 'removeRange' on 'Selection': parameter 1 is not of type 'Range'.",
    function () { sel.removeRange(p1); });
ckErr('G13 collapse with something that is not a Node', 'TypeError',
    "Failed to execute 'collapse' on 'Selection': parameter 1 is not of type 'Node'.",
    function () { sel.collapse('x', 0); });
ckErr('G14 setBaseAndExtent names the parameter it reached', 'TypeError',
    "Failed to execute 'setBaseAndExtent' on 'Selection': parameter 1 is not of type 'Node'.",
    function () { sel.setBaseAndExtent('x', 0, p1, 0); });
ck('G15 and the third parameter has its own sentence', function () {
    try { sel.setBaseAndExtent(p1, 0, 'x', 0); return false; }
    catch (e) {
        return e.name === 'TypeError'
            && e.message === "Failed to execute 'setBaseAndExtent' on 'Selection': parameter 3 is"
            + " not of type 'Node'.";
    }
});

// ── H: anchor, focus, direction ──────────────────────────────────────────────
ck('H1 collapse puts both points on one place', function () {
    sel.collapse(t1, 4);
    return sel.anchorNode === t1 && sel.anchorOffset === 4 && sel.focusNode === t1
        && sel.focusOffset === 4 && sel.isCollapsed === true && sel.type === 'Caret'
        && sel.direction === 'none' && sel.rangeCount === 1;
});
ck('H2 collapse(null) and collapse(undefined) clear it', function () {
    sel.collapse(t1, 1); sel.collapse(null);
    var cleared = sel.rangeCount === 0 && sel.type === 'None';
    sel.collapse(t1, 1); sel.collapse(undefined);
    return cleared && sel.rangeCount === 0;
}, function () { return sel.rangeCount; });
ck('H3 setPosition is collapse with its own name', function () {
    sel.setPosition(t1, 6);
    return sel.anchorOffset === 6 && sel.focusOffset === 6 && sel.type === 'Caret';
});
ckErr('H4 setPosition validates the offset it was given', 'IndexSizeError',
    "Failed to execute 'setPosition' on 'Selection': The offset 99 is larger than the node's length (11).",
    function () { sel.setPosition(t1, 99); });
ckErr('H5 an element offset is refused by its children', 'IndexSizeError',
    "Failed to execute 'setBaseAndExtent' on 'Selection': There is no child at offset 9.",
    function () { sel.setBaseAndExtent(p1, 9, p1, 0); });
ckErr('H6 extend validates too', 'IndexSizeError',
    "Failed to execute 'extend' on 'Selection': There is no child at offset 5.",
    function () { sel.setPosition(p1, 0); sel.extend(p1, 5); });
ck('H7 a forward selection reads base as anchor', function () {
    sel.setBaseAndExtent(t1, 1, t1, 5);
    return sel.anchorNode === t1 && sel.anchorOffset === 1 && sel.focusOffset === 5
        && sel.baseNode === sel.anchorNode && sel.baseOffset === sel.anchorOffset
        && sel.extentNode === sel.focusNode && sel.extentOffset === sel.focusOffset
        && sel.direction === 'forward' && sel.type === 'Range' && sel.toString() === 'ello';
});
ck('H8 a backward selection keeps the range ordered', function () {
    sel.setBaseAndExtent(t1, 5, t1, 1);
    return sel.anchorOffset === 5 && sel.focusOffset === 1 && sel.direction === 'backward'
        && sel.isCollapsed === false && sel.getRangeAt(0).startOffset === 1
        && sel.getRangeAt(0).endOffset === 5 && sel.toString() === 'ello';
}, function () { return sel.anchorOffset + '/' + sel.focusOffset + '/' + sel.direction; });
ck('H9 extend moves the focus and keeps the anchor', function () {
    sel.setPosition(t1, 1); sel.extend(t1, 5);
    return sel.anchorOffset === 1 && sel.focusOffset === 5 && sel.direction === 'forward'
        && sel.toString() === 'ello';
});
ck('H10 extending back past the anchor turns the selection round', function () {
    sel.setPosition(t1, 5); sel.extend(t1, 1);
    return sel.anchorOffset === 5 && sel.focusOffset === 1 && sel.direction === 'backward'
        && sel.toString() === 'ello';
}, function () { return sel.anchorOffset + '/' + sel.focusOffset + '/' + sel.direction; });
ck('H11 selectAllChildren takes the whole content', function () {
    sel.selectAllChildren(p1);
    return sel.anchorNode === p1 && sel.anchorOffset === 0 && sel.focusOffset === 1
        && sel.type === 'Range' && sel.toString() === 'hello world';
});
ck('H12 selectAllChildren of a text node counts characters', function () {
    sel.selectAllChildren(t1);
    return sel.focusOffset === 11 && sel.toString() === 'hello world';
}, function () { return sel.focusOffset; });
ck('H13 a detached node still answers a caret', function () {
    var div = doc.createElement('div');
    sel.setBaseAndExtent(div, 0, div, 0);
    return sel.rangeCount === 1 && sel.isCollapsed === true && sel.type === 'Caret'
        && sel.anchorNode === div;
});

// ── I: the questions a selection answers about itself ────────────────────────
ck('I1 an element is contained only inside both edges', function () {
    sel.selectAllChildren(doc.getElementById('d'));
    var d = doc.getElementById('d');
    // #d holds p1 and p2: the selection starts before p1 and ends after p2, so neither of them is
    // strictly inside it, while the text each one holds is (measured rule).
    return sel.containsNode(p1) === false && sel.containsNode(p2) === false
        && sel.containsNode(t1) === true && sel.containsNode(t1, false) === true
        && sel.containsNode(p1, true) === true && sel.containsNode(d) === false;
}, function () {
    sel.selectAllChildren(doc.getElementById('d'));
    return sel.containsNode(p1) + '/' + sel.containsNode(t1);
});
ck('I2 the element between two edges is contained', function () {
    var host = doc.createElement('div');
    var a = doc.createElement('p'), b = doc.createElement('p'), c = doc.createElement('p');
    a.appendChild(doc.createTextNode('aa'));
    b.appendChild(doc.createTextNode('bb'));
    c.appendChild(doc.createTextNode('cc'));
    host.appendChild(a); host.appendChild(b); host.appendChild(c);
    doc.getElementById('d').appendChild(host);
    sel.selectAllChildren(host);
    var middle = sel.containsNode(b) === true && sel.containsNode(a) === false
        && sel.containsNode(c) === false;
    b.parentNode.removeChild(b);
    host.parentNode.removeChild(host);
    return middle;
});
ck('I3 a partially touched text node still counts, an element does not', function () {
    sel.setBaseAndExtent(t1, 2, t2, 3);
    return sel.containsNode(t1) === true && sel.containsNode(p1) === false
        && sel.containsNode(t1, true) === true && sel.containsNode(p1, true) === true
        && sel.containsNode(t2, true) === true;
});
ck('I4 an empty selection contains nothing', function () {
    sel.removeAllRanges();
    return sel.containsNode(p1) === false && sel.containsNode(p1, true) === false;
});
ck('I5 deleteFromDocument takes the selection out', function () {
    var host = doc.createElement('div');
    host.appendChild(doc.createTextNode('one two'));
    doc.getElementById('d').appendChild(host);
    sel.selectAllChildren(host);
    sel.deleteFromDocument();
    var emptied = host.textContent === '' && sel.isCollapsed === true;
    host.parentNode.removeChild(host);
    return emptied;
});
ck('I6 modify moves a caret a character at a time', function () {
    sel.setPosition(t1, 0);
    sel.modify('move', 'forward', 'character');
    var forward = sel.anchorOffset === 1 && sel.focusOffset === 1 && sel.direction === 'none';
    sel.modify('move', 'backward', 'character');
    return forward && sel.anchorOffset === 0;
}, function () { return sel.anchorOffset; });
ck('I7 modify moves a caret a word at a time', function () {
    sel.setPosition(t1, 6);
    sel.modify('move', 'backward', 'word');
    var back = sel.anchorOffset === 0;
    sel.setPosition(t1, 6);
    sel.modify('move', 'forward', 'word');
    return back && sel.anchorOffset === 11;
}, function () { return sel.anchorOffset; });
ck('I8 modify can keep the anchor where it was', function () {
    sel.setPosition(t1, 0);
    sel.modify('extend', 'forward', 'word');
    return sel.anchorOffset === 0 && sel.focusOffset === 5 && sel.toString() === 'hello'
        && sel.direction === 'forward';
}, function () { return sel.anchorOffset + '/' + sel.focusOffset; });
ck('I9 modify validates nothing and changes nothing it does not know', function () {
    sel.setPosition(t1, 3);
    sel.modify();
    var quiet = sel.anchorOffset === 3;
    sel.modify(null, null, null);
    quiet = quiet && sel.anchorOffset === 3;
    sel.modify('x', 'forward', 'word');
    quiet = quiet && sel.anchorOffset === 3;
    sel.modify('move', 'forward', 'line');
    return quiet && sel.anchorOffset === 3;
}, function () { return sel.anchorOffset; });
ck('I10 modify with no selection does nothing', function () {
    sel.removeAllRanges();
    sel.modify('move', 'forward', 'character');
    return sel.rangeCount === 0;
});

// ── J: the selection reaches the tree it was made in ─────────────────────────
ck('J1 the range the page added is the range the selection reports', function () {
    var host = doc.createElement('div');
    host.appendChild(doc.createTextNode('one two'));
    doc.getElementById('d').appendChild(host);
    var r = contentsOf(host);
    sel.removeAllRanges(); sel.addRange(r);
    r.deleteContents();
    var took = sel.toString() === '' && sel.isCollapsed === true && sel.getRangeAt(0) === r
        && host.textContent === '';
    host.parentNode.removeChild(host);
    return took;
});
ck('J2 a selection made by setBaseAndExtent survives the range being read', function () {
    sel.setBaseAndExtent(t1, 0, t1, 5);
    var r = sel.getRangeAt(0);
    return r.toString() === 'hello' && r.startOffset === 0 && r.endOffset === 5
        && sel.getRangeAt(0) === r;
});
ck('J3 the selection survives a document that was never selected in', function () {
    var other = doc.implementation.createHTMLDocument();
    sel.removeAllRanges(); sel.addRange(contentsOf(p1));
    return other.getSelection() !== sel && other.getSelection().rangeCount === 0;
});

</script>
</body>
