<!DOCTYPE html><html><body><div id="root"></div>
<script>
(function () {
    function eq(label, got, wantValue) {
        window.__T(label, String(got) === String(wantValue),
            'got=[' + String(got) + '] want=[' + String(wantValue) + ']');
    }
    function safe(fn) {
        try { return 'ok:' + fn(); }
        catch (e) { return 'ERR:' + String(e && e.name) + ':' + String(e && e.message).slice(0, 40); }
    }

    // ── A. Map edge semantics ────────────────────────────────────────────────
    eq('A1 Map keys use SameValueZero (0 and -0 same, NaN equals NaN)', safe(function () {
        var m = new Map(); m.set(0, 'zero'); m.set(-0, 'negzero'); m.set(NaN, 'nan');
        return [m.size, m.get(NaN)].join(',');
    }), 'ok:2,nan');
    eq('A2 Map.get on a missing key is undefined', safe(function () {
        return new Map().get('nope');
    }), 'ok:undefined');
    eq('A3 Map preserves insertion order across key types', safe(function () {
        var m = new Map(); m.set('b', 1); m.set(1, 2); m.set('a', 3);
        var s = []; m.forEach(function (v, k) { s.push(k); }); return s.join(',');
    }), 'ok:b,1,a');
    eq('A4 Map constructor from an entries array', safe(function () {
        var m = new Map([['x', 1], ['y', 2]]); return m.get('x') + ',' + m.size;
    }), 'ok:1,2');
    eq('A5 Map.clear empties it', safe(function () {
        var m = new Map([[1, 1], [2, 2]]); m.clear(); return m.size;
    }), 'ok:0');
    eq('A6 Map can use objects as keys', safe(function () {
        var k = {}; var m = new Map(); m.set(k, 'v'); return m.get(k) + ',' + m.get({});
    }), 'ok:v,undefined');
    eq('A7 setting an existing key updates in place', safe(function () {
        var m = new Map(); m.set('k', 1); m.set('k', 2); return m.size + ',' + m.get('k');
    }), 'ok:1,2');

    // ── B. Set edge semantics ────────────────────────────────────────────────
    eq('B1 Set dedupes by SameValueZero (0/-0, NaN)', safe(function () {
        var s = new Set(); s.add(0); s.add(-0); s.add(NaN); s.add(NaN);
        return [s.size, s.has(NaN)].join(',');
    }), 'ok:2,true');
    eq('B2 Set iteration order is insertion order', safe(function () {
        var s = new Set([3, 1, 2]); return Array.from(s).join(',');
    }), 'ok:3,1,2');
    eq('B3 Set constructor dedupes an array', safe(function () {
        return new Set([1, 1, 2, 2, 3]).size;
    }), 'ok:3');
    eq('B4 Set.values and Set.keys are the same', safe(function () {
        var s = new Set(['a']); return s.values().next().value + ',' + s.keys().next().value;
    }), 'ok:a,a');
    eq('B5 Set can hold objects by identity', safe(function () {
        var o1 = {}, o2 = {}; var s = new Set([o1]); return s.has(o1) + ',' + s.has(o2);
    }), 'ok:true,false');

    // ── C. Iterator protocol edge cases ──────────────────────────────────────
    eq('C1 Array iterator done flag', safe(function () {
        var it = [9].values(); var a = it.next(); var b = it.next();
        return a.value + ',' + a.done + ',' + b.done;
    }), 'ok:9,false,true');
    eq('C2 manually iterating a Map entries iterator', safe(function () {
        var it = new Map([['a', 1]]).entries(); var r = it.next();
        return r.value[0] + ',' + r.value[1];
    }), 'ok:a,1');
    eq('C3 spread consumes any iterable', safe(function () {
        var s = new Set([1, 2, 3]); return [...s].join(',');
    }), 'ok:1,2,3');
    eq('C4 String is iterable by code points', safe(function () {
        return [...'a😀b'].length;
    }), 'ok:3');

    // ── D. structuredClone edge semantics ────────────────────────────────────
    eq('D1 structuredClone deep-copies nested objects', safe(function () {
        var o = { a: { b: [1, 2, { c: 3 }] } }; var c = structuredClone(o);
        c.a.b[2].c = 99; return o.a.b[2].c;
    }), 'ok:3');
    eq('D2 structuredClone copies arrays as arrays', safe(function () {
        var c = structuredClone([1, 2, 3]); return Array.isArray(c) + ',' + c.length;
    }), 'ok:true,3');
    eq('D3 structuredClone copies Maps and Sets', safe(function () {
        var c = structuredClone({ m: new Map([['k', 1]]), s: new Set([2]) });
        return c.m.get('k') + ',' + c.s.has(2);
    }), 'ok:1,true');
    eq('D4 structuredClone copies Dates', safe(function () {
        var d = structuredClone(new Date(0)); return (d instanceof Date) + ',' + d.getTime();
    }), 'ok:true,0');
    eq('D5 structuredClone copies Blobs', safe(function () {
        var b = structuredClone(new Blob(['x'], { type: 'text/plain' }));
        return (b instanceof Blob) + ',' + b.type;
    }), 'ok:true,text/plain');
    eq('D6 structuredClone rejects functions', safe(function () {
        structuredClone(function () { }); return 'cloned';
    }).slice(0, 3), 'ERR');

    // ── E. Typed array edge semantics ────────────────────────────────────────
    eq('E1 TypedArray.of and from', safe(function () {
        return Int32Array.of(1, 2, 3).length + ',' + Uint8Array.from([255]).length;
    }), 'ok:3,1');
    eq('E2 TypedArray overflow wraps for Uint8', safe(function () {
        var a = new Uint8Array(1); a[0] = 256; return a[0];
    }), 'ok:0');
    eq('E3 TypedArray clamps negative for Uint8', safe(function () {
        var a = new Uint8Array(1); a[0] = -1; return a[0];
    }), 'ok:255');
    eq('E4 TypedArray.index beyond length is undefined', safe(function () {
        return new Int16Array(2)[5];
    }), 'ok:undefined');
    eq('E5 TypedArray.sort is numeric by default', safe(function () {
        return new Int32Array([10, 2, 30]).sort().join(',');
    }), 'ok:2,10,30');
    eq('E6 TypedArray.includes/indexOf', safe(function () {
        return new Uint8Array([1, 2, 3]).includes(2) + ',' + new Uint8Array([1, 2, 3]).indexOf(3);
    }), 'ok:true,2');

    // ── F. Array edge semantics ──────────────────────────────────────────────
    eq('F1 Array holes are skipped by forEach but kept by length', safe(function () {
        var a = [1, , 3]; var count = 0; a.forEach(function () { count++; }); return count + ',' + a.length;
    }), 'ok:2,3');
    eq('F2 Array.prototype.push returns the new length', safe(function () {
        var a = [1]; return a.push(2, 3);
    }), 'ok:3');
    eq('F3 Array.prototype.shift/unshift', safe(function () {
        var a = [1, 2, 3]; var s = a.shift(); a.unshift(9); return s + ',' + a.join(',');
    }), 'ok:1,9,2,3');
    eq('F4 Array.prototype.splice removes and inserts', safe(function () {
        var a = [1, 2, 3, 4]; var removed = a.splice(1, 2, 9);
        return removed.join(',') + '|' + a.join(',');
    }), 'ok:2,3|1,9,4');
    eq('F5 Array.prototype.reverse is in place', safe(function () {
        var a = [1, 2, 3]; a.reverse(); return a.join(',');
    }), 'ok:3,2,1');
    eq('F6 Array.prototype.concat flattens one level', safe(function () {
        return [1].concat([2, [3]]).join(',');
    }), 'ok:1,2,3');
    eq('F7 Array.isArray vs Array.isArray on a typed array', safe(function () {
        return Array.isArray([1]) + ',' + Array.isArray(new Uint8Array(1));
    }), 'ok:true,false');
    eq('F8 sort without a comparator is lexicographic', safe(function () {
        return [10, 9, 100].sort().join(',');
    }), 'ok:10,100,9');
})();
</script></body></html>
