<!DOCTYPE html>

<body>
<div id="t">hello<b id="b">x</b>world<!-- tail --></div>
<form id="f"><input id="i1" name="a" value="v"><textarea id="ta">tx</textarea></form>

<script>
// A probe that throws must not read as a pass: the old d(fn) helpers returned an 'ERR@…'
// string, which is truthy, so a broken assertion hid inside its own failure message.
function ck(name, fn, info) {
    try {
        var v = fn();
        var extra = '';
        if (info !== undefined) {
            try { extra = String(typeof info === 'function' ? info() : info); }
            catch (e2) { extra = 'info threw ' + (e2 && e2.message); }
        }
        __T(name, !!v, extra);
    } catch (e) {
        __T(name, false, 'threw ' + (e && e.name ? e.name + ': ' : '') + (e && e.message ? e.message : e));
    }
}

var el = document.getElementById('t');
var b = document.getElementById('b');
var i1 = document.getElementById('i1');

// ── §2.8: one object per node, whatever path the page took to it ──────────────
ck('A1 firstChild === childNodes[0]', function () { return el.firstChild === el.childNodes[0]; },
    function () { return el.firstChild + '/' + el.childNodes[0]; });

    function () { return el.childNodes.length; });

    var c = document.createComment('hi');

    var f = document.getElementById('f');
    return f.elements[0] === i1 && f.elements.namedItem('a') === i1;
}, function () { var f = document.getElementById('f'); return f.elements.length + '/' + f.elements[0].id; });
ck('A14 text node of an element', function () { return b.firstChild === b.childNodes[0] && b.firstChild.data === 'x'; });
ck('A15 cloneNode is a different object', function () {
    var c = b.cloneNode(true);
    return c !== b && c.firstChild !== b.firstChild;
});
ck('A16 attribute identity across calls', function () {
    return i1.attributes.getNamedItem('name') === i1.attributes.getNamedItem('name')
        && i1.attributes.item(0) === i1.attributes.getNamedItem('id');
}, function () { return i1.attributes.length; });

    var k = el.childNodes;
    var n = k.length;
    var p = document.createElement('p');
    el.appendChild(p);
    return k.length === n + 1 && k[k.length - 1] === p;
}, function () { return el.childNodes.length; });

    return el.textContent.indexOf('hello') === 0 && el.textContent.indexOf('x') > 0;
}, function () { return JSON.stringify(el.textContent); });

// ── DocumentFragment: a node, with the node surface ──────────────────────────
ck('A19 fragment node surface', function () {
    var frag = document.createDocumentFragment();
    var a = document.createElement('i');
    var t = document.createTextNode('hi');
    frag.appendChild(a);
    frag.appendChild(t);
    return frag.nodeType === 11
        && frag.firstChild === a
        && frag.lastChild === t
        && frag.childNodes.length === 2
        && frag.hasChildNodes() === true
        && frag.parentNode === null
        && frag.textContent === 'hi';
}, function () { var f = document.createDocumentFragment(); return f.nodeType + '/' + typeof f.firstChild; });
ck('A20 fragment textContent setter', function () {
    var frag = document.createDocumentFragment();
    frag.textContent = 'set';
    return frag.childNodes.length === 1 && frag.firstChild.data === 'set';
});
ck('A21 fragment insertBefore keeps identity', function () {
    var frag = document.createDocumentFragment();
    var one = document.createElement('b');
    var two = document.createElement('em');
    frag.appendChild(one);
    frag.insertBefore(two, one);
    return frag.firstChild === two && frag.childNodes[1] === one;
});
ck('A22 fragment cloneNode', function () {
    var frag = document.createDocumentFragment();
    frag.appendChild(document.createTextNode('deep'));
    var c = frag.cloneNode(true);
    return c !== frag && c.firstChild.data === 'deep' && c.firstChild !== frag.firstChild;
}, function () { var f = document.createDocumentFragment(); f.appendChild(document.createTextNode('x')); return typeof f.cloneNode; });

// ── TreeWalker / NodeIterator (DOM 4 §4.7) ───────────────────────────────────
// A dedicated subtree (#wroot > wa['ta', wb['tb'], 'ta2'], wc['tc']) so the mutation cases above
// cannot move what a walk answers. The expected sequences are the reference's own answers, taken
// from the same tree shape.
var wroot = document.getElementById('wroot');
var wa = document.getElementById('wa');
var wb = document.getElementById('wb');
var wc = document.getElementById('wc');
function nm(n) { return n === null ? 'null' : (n === wroot ? 'ROOT' : (n.id || n.nodeName + ':' + (n.data || ''))); }
function forward(t, count) {
    var out = [];
    for (var i = 0; i < count; i++) out.push(nm(t.nextNode()));
    return out.join(',');
}
function untilEnd(t) {
    var out = []; var n = t.nextNode();
    while (n) { out.push(nm(n)); n = t.nextNode(); }
    return out.join(',');
}
function rejectWa(node) { return node === wa ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT; }
function skipWa(node) { return node === wa ? NodeFilter.FILTER_SKIP : NodeFilter.FILTER_ACCEPT; }

ck('A23 treeWalker walks elements, never its root', function () {
    return untilEnd(document.createTreeWalker(wroot, NodeFilter.SHOW_ELEMENT, null)) === 'wa,wb,wc';
}, function () { return untilEnd(document.createTreeWalker(wroot, NodeFilter.SHOW_ELEMENT, null)); });

    var w = document.createTreeWalker(wroot, NodeFilter.SHOW_ELEMENT, null);
    return w.root === wroot && w.currentNode === wroot && w.whatToShow === NodeFilter.SHOW_ELEMENT
        && w.filter === null;
}, function () {
    var w = document.createTreeWalker(wroot, NodeFilter.SHOW_ELEMENT, null);
    return 'root=' + (w.root === wroot) + ' cur=' + nm(w.currentNode) + ' mask=' + w.whatToShow + ' filter=' + String(w.filter);
});
ck('A25 nodeIterator offers its root first', function () {
    return forward(document.createNodeIterator(wroot, NodeFilter.SHOW_ALL, null), 9)
        === 'ROOT,wa,#text:ta,wb,#text:tb,#text:ta2,wc,#text:tc,null';
}, function () { return forward(document.createNodeIterator(wroot, NodeFilter.SHOW_ALL, null), 9); });

    var w = document.createTreeWalker(wroot, NodeFilter.SHOW_ALL, { acceptNode: rejectWa });
    var i = document.createNodeIterator(wroot, NodeFilter.SHOW_ALL, { acceptNode: rejectWa });
    return untilEnd(w) === 'wc,#text:tc'
        && untilEnd(i) === 'ROOT,#text:ta,wb,#text:tb,#text:ta2,wc,#text:tc';
}, function () {
    var w = document.createTreeWalker(wroot, NodeFilter.SHOW_ALL, { acceptNode: rejectWa });
    var i = document.createNodeIterator(wroot, NodeFilter.SHOW_ALL, { acceptNode: rejectWa });
    return 'walker=' + untilEnd(w) + ' iterator=' + untilEnd(i);
});
ck('A27 filter SKIP leaves the children of a walker', function () {
    return untilEnd(document.createTreeWalker(wroot, NodeFilter.SHOW_ALL, { acceptNode: skipWa }))
        === '#text:ta,wb,#text:tb,#text:ta2,wc,#text:tc';
}, function () {
    return untilEnd(document.createTreeWalker(wroot, NodeFilter.SHOW_ALL, { acceptNode: skipWa }));
});
ck('A28 NodeFilter constants', function () {
    return NodeFilter.FILTER_ACCEPT === 1 && NodeFilter.FILTER_REJECT === 2
        && NodeFilter.FILTER_SKIP === 3 && NodeFilter.SHOW_ALL === 4294967295
        && NodeFilter.SHOW_TEXT === 4 && NodeFilter.SHOW_ELEMENT === 1
        && NodeFilter.SHOW_ENTITY_REFERENCE === 16 && NodeFilter.SHOW_ENTITY === 32
        && NodeFilter.SHOW_COMMENT === 128 && NodeFilter.SHOW_DOCUMENT === 256

ck('A29 SHOW_TEXT walks the text under masked elements', function () {
    return untilEnd(document.createTreeWalker(wroot, NodeFilter.SHOW_TEXT, null))
        === '#text:ta,#text:tb,#text:ta2,#text:tc';

ck('A30 iterator pointer sits beside its reference node', function () {
    // measured on the reference: next, next, next, prev answers the node it had just handed back,
    // and the next after that answers it once more before moving on.
    var it = document.createNodeIterator(wroot, NodeFilter.SHOW_ALL, null);
    var out = [];
    out.push(nm(it.nextNode())); out.push(nm(it.nextNode())); out.push(nm(it.nextNode()));
    out.push('p=' + nm(it.previousNode()));
    out.push('n=' + nm(it.nextNode()));
    out.push('p=' + nm(it.previousNode()));
    out.push('p2=' + nm(it.previousNode()));
    return out.join(',') === 'ROOT,wa,#text:ta,p=#text:ta,n=#text:ta,p=#text:ta,p2=wa';
}, function () {
    var it = document.createNodeIterator(wroot, NodeFilter.SHOW_ALL, null);

    o.push(nm(it.nextNode())); o.push(nm(it.nextNode())); o.push(nm(it.nextNode()));

    var it = document.createNodeIterator(wroot, NodeFilter.SHOW_ALL, null);
    var before = it.previousNode();
    var atStart = before === null && it.referenceNode === wroot && it.pointerBeforeReferenceNode === true;
    var next = it.nextNode();

        && it.pointerBeforeReferenceNode === false;

    var it = document.createNodeIterator(wroot, NodeFilter.SHOW_ALL, null);
    var p = it.previousNode();

});
ck('A32 iterator detach is kept and does nothing', function () {
    var it = document.createNodeIterator(wroot, NodeFilter.SHOW_ELEMENT, null);
    it.detach();

    var it = document.createNodeIterator(wroot, NodeFilter.SHOW_ELEMENT, null);

    var w = document.createTreeWalker(wroot, NodeFilter.SHOW_ELEMENT, null);

    out.push('fc=' + nm(w.firstChild()));
    out.push('fc=' + nm(w.firstChild()));
    out.push('ns=' + nm(w.nextSibling()));

ck('A34 walker sibling reads answer the subtree start', function () {
    var w = document.createTreeWalker(wroot, NodeFilter.SHOW_ELEMENT, null);
    w.currentNode = wc;
    var back = w.previousSibling();
    w.currentNode = wa;
    var on = w.nextSibling();
    w.currentNode = wroot;
    var last = w.lastChild();
    var parent = (w.currentNode = wc, w.parentNode());
    return back === wa && on === wc && last === wc && parent === wroot;
}, function () {
    var w = document.createTreeWalker(wroot, NodeFilter.SHOW_ELEMENT, null);
    w.currentNode = wc; var back = nm(w.previousSibling());
    w.currentNode = wa; var on = nm(w.nextSibling());
    w.currentNode = wroot; var last = nm(w.lastChild());
    w.currentNode = wc; var parent = nm(w.parentNode());
    return 'ps=' + back + ' ns=' + on + ' lc=' + last + ' parent=' + parent;
});
ck('A35 parentNode climbs to the nearest accepted ancestor', function () {
    var w = document.createTreeWalker(wroot, NodeFilter.SHOW_TEXT, null);
    var first = w.nextNode();
    var up = w.parentNode();
    var root = document.createTreeWalker(wroot, NodeFilter.SHOW_ALL, null);
    return first && first.data === 'ta' && up === null && root.parentNode() === null;

    var w = document.createTreeWalker(wroot, NodeFilter.SHOW_TEXT, null);
    var first = nm(w.nextNode());
    return 'first=' + first + ' parent=' + nm(w.parentNode());
});
ck('A36 currentNode setter moves where a step starts', function () {
    // measured: the step back from <b> answers the text node that precedes it, the step on from
    // there answers the <b> again, and a node outside the walked tree is kept by identity.
    var w = document.createTreeWalker(wroot, NodeFilter.SHOW_ALL, null);
    w.currentNode = wb;
    var back = w.previousNode();
    var on = w.nextNode();
    var t = document.createTextNode('x');
    w.currentNode = t;
    return back === wa.firstChild && on === wb && w.currentNode === t && w.currentNode.nodeType === 3;
}, function () {
    var w = document.createTreeWalker(wroot, NodeFilter.SHOW_ALL, null);
    w.currentNode = wb;
    var back = w.previousNode();
    return 'prev=' + nm(back) + ' isTextBeforeWb=' + (back === wa.firstChild) + ' next=' + nm(w.nextNode());

ck('A37 a bare function is a filter too', function () {
    var w = document.createTreeWalker(wroot, 1, function (node) {
        return node === wb ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
    });
    return untilEnd(w) === 'wa,wc';

    var w = document.createTreeWalker(wroot, 1, function (node) {
        return node === wb ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
    });
    return untilEnd(w);
});
ck('A38 a filter that answers nonsense skips the node', function () {
    var w = document.createTreeWalker(wroot, NodeFilter.SHOW_ALL, {
        acceptNode: function (node) { return node === wb ? 99 : NodeFilter.FILTER_ACCEPT; }
    });
    return untilEnd(w) === 'wa,#text:ta,#text:ta2,wc,#text:tc';

    var w = document.createTreeWalker(wroot, NodeFilter.SHOW_ALL, {
        acceptNode: function (node) { return node === wb ? 99 : NodeFilter.FILTER_ACCEPT; }
    });
    return untilEnd(w);

ck('A39 filter is answered back by identity', function () {
    var f = { acceptNode: function () { return NodeFilter.FILTER_ACCEPT; } };
    var w = document.createTreeWalker(wroot, 1, f);
    var i = document.createNodeIterator(wroot, 1, f);
    return w.filter === f && i.filter === f;
}, function () {
    var f = { acceptNode: function () { return 1; } };
    return 'w=' + (document.createTreeWalker(wroot, 1, f).filter === f);
});
ck('A40 a walk sees a node the page inserted', function () {
    var w = document.createTreeWalker(wroot, NodeFilter.SHOW_ELEMENT, null);
    var before = untilEnd(w);
    var added = document.createElement('em');
    added.id = 'wem';
    wc.appendChild(added);
    var after = untilEnd(document.createTreeWalker(wroot, NodeFilter.SHOW_ELEMENT, null));

    var added = document.createElement('em');

ck('A41 whatToShow is an unsigned mask', function () {
    var w = document.createTreeWalker(wroot, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT, null);
    return w.whatToShow === 5 && untilEnd(w) === 'wa,#text:ta,wb,#text:tb,#text:ta2,wc,#text:tc';

    var w = document.createTreeWalker(wroot, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT, null);

ck('A42 a walker over a text root has nothing to walk', function () {
    var t = wa.firstChild;
    var w = document.createTreeWalker(t, NodeFilter.SHOW_ALL, null);
    return w.nextNode() === null && w.currentNode === t && w.root === t;
}, function () {
    var w = document.createTreeWalker(wa.firstChild, NodeFilter.SHOW_ALL, null);
    return nm(w.nextNode()) + '/' + nm(w.currentNode);
});
ck('A43 a mask of zero shows nothing', function () {
    return untilEnd(document.createTreeWalker(wroot, 0, null)) === ''
        && document.createNodeIterator(wroot, 0, null).nextNode() === null;
}, function () { return untilEnd(document.createTreeWalker(wroot, 0, null)) || 'empty'; });
ck('A44 whatToShow is an unsigned long, however the page spells it', function () {
    // measured on the reference: '4' shows text, 'abc' and null show nothing, 4.7 truncates to 4,

        && document.createTreeWalker(wroot, -1).whatToShow === 4294967295

ck('A45 the factory refuses what it cannot take', function () {

        && e2 && e2.name === 'TypeError'
