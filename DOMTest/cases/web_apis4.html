<!DOCTYPE html>
<html>
<head><title>Web APIs probe 4 (Headers/FormData/Abort/DOMImplementation)</title></head>
<body>
<script>
(function () {
  // indirect eval → global scope, so 'typeof Missing' answers 'undefined' instead of throwing.
  function exists(n){ try { return (0, eval)('typeof ' + n); } catch(e){ return 'err'; } }

  ['Headers','FormData','AbortController','AbortSignal','DOMImplementation','TreeWalker','NodeIterator',
   'Image','Option','BroadcastChannel','MessageChannel','MessagePort','MessageEvent',
   // The name the canvas measures with exists as an interface even though this engine has no 2D
   // context to hand one out from; only its constructor refuses.
   'TextMetrics'].forEach(function (g) {
    __T('exists:'+g, exists(g) === 'function', 'typeof=' + exists(g));
  });

  // Genuinely-absent subsystems (no XSLT engine yet): their names must NOT be defined, so a feature
  // check on them answers false rather than lying.
  ['XSLTProcessor'].forEach(function (g) {
    __T('absent:'+g, exists(g) === 'undefined', 'typeof=' + exists(g));
  });

  // --- the message interfaces (HTML §8.6) -----------------------------------
  // A posted message is a task, so nothing has arrived while the script still runs; the harness
  // drains the timers before it reads the results, which is what lets these assertions land.
  try {
    var a = new BroadcastChannel('acrux-test');
    var b = new BroadcastChannel('acrux-test');
    __T('BroadcastChannel.name', a.name === 'acrux-test', 'n=' + a.name);
    __T('BroadcastChannel.onmessage init', a.onmessage === null);
    var heard = [], selfHeard = false;
    b.onmessage = function (ev) { heard.push(ev.data); };
    a.addEventListener('message', function (ev) { heard.push('l:' + ev.data); });
    a.onmessage = function () { selfHeard = true; };
    a.postMessage('ping');
    __T('postMessage is a task', heard.length === 0, 'sync=' + heard.length);
    setTimeout(function () {
      __T('BroadcastChannel delivers to the other channel',
          heard.length === 1 && heard[0] === 'ping', 'heard=' + JSON.stringify(heard));
      __T('the posting channel does not hear itself', selfHeard === false);
      // The event a channel brings is a MessageEvent with the members the interface names, and a
      // channel the page closed stops hearing — the close, not the post, is what ends it.
      var ev = null;
      var probe = new BroadcastChannel('acrux-shape');
      var other = new BroadcastChannel('acrux-shape');
      other.onmessage = function (e) { ev = e; };
      probe.postMessage({ k: 1 });
      var c2 = new BroadcastChannel('acrux-test');
      var after = 0;
      c2.onmessage = function () { after++; };
      var stillLive = 0;
      b.onmessage = function () { stillLive++; };
      b.close();
      c2.close();
      a.postMessage('after-close');
      setTimeout(function () {
        __T('MessageEvent.type/data', !!ev && ev.type === 'message' && ev.data && ev.data.k === 1,
            ev ? ev.type + '/' + JSON.stringify(ev.data) : 'no event');
        __T('MessageEvent has the IDL members',
            !!ev && 'origin' in ev && 'ports' in ev && 'lastEventId' in ev && ev.ports.length === 0,
            ev ? ('origin=' + typeof ev.origin + ' ports=' + JSON.stringify(ev.ports)) : 'no event');
        __T('a closed channel hears nothing', after === 0, 'after=' + after);
        __T('a channel closed twice still hears nothing', stillLive === 0, 'stillLive=' + stillLive);
      }, 0);
    }, 0);
  } catch (e) { __T('BroadcastChannel', false, e && e.message); }

  try {
    var mc = new MessageChannel();
    __T('MessageChannel ports', !!mc.port1 && !!mc.port2 && mc.port1 !== mc.port2);
    var got = null;
    mc.port1.onmessage = function (ev) { got = ev.data; };
    mc.port2.postMessage('through');
    setTimeout(function () {
      __T('MessagePort delivers to the other end', got === 'through', 'got=' + JSON.stringify(got));
    }, 0);
  } catch (e) { __T('MessageChannel', false, e && e.message); }

  try {
    var winGot = null;
    window.addEventListener('message', function (ev) { if (ev && ev.data === 'to-window') winGot = ev.data; });
    window.postMessage('to-window', '*');
    setTimeout(function () {
      __T('window.postMessage reaches the window listeners', winGot === 'to-window', 'got=' + JSON.stringify(winGot));
    }, 0);
  } catch (e) { __T('window.postMessage', false, e && e.message); }

  // --- Headers ---
  try {
    var h = new Headers({ 'Content-Type': 'text/plain', 'X-Custom': 'a' });
    __T('Headers.get', h.get('content-type') === 'text/plain', 'ct=' + h.get('content-type'));
    h.append('X-Multi', '1'); h.append('X-Multi', '2');
    __T('Headers.getAll', (h.getAll ? h.getAll('x-multi').length : h.get('x-multi')) >= 1, 'all=' + JSON.stringify(h.getAll && h.getAll('x-multi')));
    h.set('x-custom', 'b');
    __T('Headers.set overwrites', h.get('x-custom') === 'b', 'xc=' + h.get('x-custom'));
    __T('Headers.has', h.has('content-type') === true && h.has('nope') === false);
    h.delete('x-custom');
    __T('Headers.delete', h.has('x-custom') === false);
    var keys = []; h.forEach(function(v,k){ keys.push(k); });
    __T('Headers.forEach', keys.length >= 1, 'keys=' + keys.join(','));
  } catch (e) { __T('Headers', false, e.message); }

  // --- FormData ---
  try {
    var fd = new FormData();
    fd.append('a', '1'); fd.append('b', '2'); fd.append('a', '3');
    __T('FormData.get first', fd.get('a') === '1', 'a=' + fd.get('a'));
    __T('FormData.getAll', fd.getAll('a').length === 2, 'all=' + fd.getAll('a').length);
    __T('FormData.has', fd.has('b') === true && fd.has('z') === false);
    fd.set('b', '20');
    __T('FormData.set', fd.get('b') === '20', 'b=' + fd.get('b'));
    fd.delete('a');
    __T('FormData.delete', fd.has('a') === false);
  } catch (e) { __T('FormData', false, e.message); }

  // --- AbortController / AbortSignal ---
  try {
    var ac = new AbortController();
    __T('signal present', !!ac.signal && ac.signal.aborted === false, 'ab=' + (ac.signal && ac.signal.aborted));
    var fired = 0;
    ac.signal.addEventListener('abort', function () { fired++; });
    ac.abort();
    __T('abort sets signal.aborted', ac.signal.aborted === true);
    __T('abort fires listener', fired === 1, 'fired=' + fired);
  } catch (e) { __T('AbortController', false, e.message); }

  // --- DOMImplementation.createHTMLDocument ---
  try {
    var nd = document.implementation.createHTMLDocument('New Title');
    __T('createHTMLDocument docType', nd && nd.nodeType === 9, 'nt=' + (nd && nd.nodeType));
    __T('createHTMLDocument has html', nd && nd.documentElement && nd.documentElement.tagName === 'HTML', 'de=' + (nd && nd.documentElement && nd.documentElement.tagName));
    __T('createHTMLDocument title', nd && /New Title/.test(nd.title), 't=' + (nd && nd.title));
  } catch (e) { __T('createHTMLDocument', false, e.message); }

  // --- TreeWalker ---
  try {
    var tw = document.createTreeWalker(document.body, 1 /*SHOW_ELEMENT*/, null);
    __T('createTreeWalker exists', !!tw, 'tw=' + typeof tw);
  } catch (e) { __T('createTreeWalker', false, e.message); }

  // --- URLSearchParams from pairs array ---
  try {
    var usp = new URLSearchParams([['a','1'],['b','2']]);
    __T('URLSearchParams array init', usp.get('a') === '1', 'a=' + usp.get('a'));
  } catch (e) { __T('usp array init', false, e.message); }
})();
</script>
</body>
</html>
