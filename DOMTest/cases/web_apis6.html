function ck(name, cond, info) {

    __T(name, ok, info === undefined ? '' : String(typeof info === 'function' ? info() : info));
}
function done(name, fn) {
    return fn().then(function (v) { __T(name, !!v, ''); },
        function (e) { __T(name, false, 'rej ' + (e && e.name) + ': ' + (e && e.message)); });
}
function hexOf(buf) {
    var out = '', view = new Uint8Array(buf);
    for (var i = 0; i < view.length; i++) out += (view[i] < 16 ? '0' : '') + view[i].toString(16);
    return out;
}

      JSON.stringify(x.statusText), String(x.upload), Object.prototype.toString.call(x)].join(' | ');

ck('H3 the members that need a request in flight refuse for the state', function () {

ck('H5 the state machine raises its events on the request', function () {
    var seen = [];
    var x = new XMLHttpRequest();
    x.addEventListener('readystatechange', function () { seen.push('rs' + x.readyState); });
    x.addEventListener('loadstart', function () { seen.push('start'); });
    x.onerror = function (e) { seen.push('error' + (e && e.type)); };
    x.onloadend = function () { seen.push('end'); };
    x.open('GET', '/definitely-not-there');
    x.send();
    return seen.join(',') === 'rs1,rs2,start';
}, function () {
    var seen = [];
    var x = new XMLHttpRequest();
    x.addEventListener('readystatechange', function () { seen.push('rs' + x.readyState); });
    x.onloadstart = function () { seen.push('start'); };
    x.open('GET', '/nope'); x.send();
    return seen.join(',');
});

ck('H6 a request dropped on purpose says abort once', function () {
    var seen = [];
    var x = new XMLHttpRequest();
    x.addEventListener('readystatechange', function () { seen.push('rs' + x.readyState); });
    x.addEventListener('abort', function () { seen.push('abort'); });
    x.addEventListener('loadend', function () { seen.push('loadend'); });
    x.open('GET', '/slow-but-not-there');
    x.send();
    x.abort();
    var after = seen.join(',');
    return after === 'rs1,rs2,rs0,abort,loadend' && x.readyState === 0;
}, function () {
    var seen = [];
    var x = new XMLHttpRequest();
    x.addEventListener('readystatechange', function () { seen.push('rs' + x.readyState); });
    x.addEventListener('abort', function () { seen.push('abort'); });
    x.open('GET', '/slow'); x.send(); x.abort();
    return seen.join(',');

        localStorage[0] === undefined, Object.prototype.toString.call(localStorage) === '[object Storage]'];
    delete localStorage.a;

    localStorage.clear();
    return read.every(function (v) { return v === true; });
}, function () {
    localStorage.clear(); localStorage.setItem('a', '1'); localStorage.b = '2';

        && Object.prototype.toString.call(crypto.subtle) === '[object SubtleCrypto]'
        && crypto.subtle.constructor.name === 'SubtleCrypto'
        && typeof crypto.subtle.importKey === 'function' && typeof crypto.subtle.verify === 'function'

}, function () {
    return [typeof crypto.subtle, Object.prototype.toString.call(crypto.subtle),
      String(crypto.subtle.constructor.name), typeof crypto.subtle.importKey].join(' | ');

done('C2 the digests are the ones the platform computes', function () {
    var abc = new TextEncoder().encode('abc');
    return Promise.all([crypto.subtle.digest('SHA-256', abc), crypto.subtle.digest('SHA-1', abc),
        crypto.subtle.digest('SHA-256', new Uint8Array([97, 98, 99]))]).then(function (parts) {
        return hexOf(parts[0]) === 'ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad'
            && hexOf(parts[1]) === 'a9993e364706816aba3e25717850c26c9cd0d89d'
            && hexOf(parts[2]) === hexOf(parts[0])
            && parts[0] instanceof ArrayBuffer && parts[0].byteLength === 32
            && parts[1].byteLength === 20;
    });
});

done('C3 an unknown algorithm and a body that is not a buffer reject', function () {
    var abc = new TextEncoder().encode('abc');
    var a = '', b = '';
    return crypto.subtle.digest('BOGUS', abc).then(function () { a = 'resolved'; },
        function (e) { a = e.name + '|' + e.message; }).then(function () {
        return crypto.subtle.digest('SHA-256', 'not bytes');
    }).then(function () { b = 'resolved'; }, function (e) { b = e.name + '|' + e.message; })
        .then(function () {
            return a.indexOf('NotSupportedError') === 0 && /Algorithm: Unrecognized name/.test(a)
                && b.indexOf('TypeError') === 0 && /is not of type/.test(b);
        });
});

ck('F1 the face set answers the empty set and the face keeps its descriptors', function () {
    var set = document.fonts;
    var face = new FontFace('N', 'url(a.woff2)', { style: 'italic', weight: '300', display: 'swap' });
    var r = [Object.prototype.toString.call(set) === '[object FontFaceSet]', set.status === 'loaded',
        set.size === 0, set.constructor.name === 'EventTarget', set instanceof EventTarget,
        Object.getPrototypeOf(set) !== EventTarget.prototype,

    var set = document.fonts;
    var face = new FontFace('N', 'url(a.woff2)', { style: 'italic' });
    return [Object.prototype.toString.call(set), set.status, set.size, String(set.constructor.name),
      String(set instanceof EventTarget), String(face.style), face.status, face.unicodeRange].join(' | ');

done('F2 loading a face makes the check answer true', function () {
    var set = document.fonts;
    var face = new FontFace('L', 'url(l.woff2)');
    set.add(face);
    var before = set.check('12px L');
    return set.load('12px L').then(function (faces) {
        return before === false && Array.isArray(faces) && face.status === 'loaded'
            && set.check('12px L') === true;
    }).then(function (v) { set.clear(); return v; });
});
