    __T(name, fails.length === 0, (fails.length ? fails.join(' ; ') + ' | ' : '') + (extra || ''));

    ['tag', Object.prototype.toString.call(new DOMParser().parseFromString('<a/>', 'text/xml'))
        === '[object XMLDocument]'],
    ['html tag', Object.prototype.toString.call(document) === '[object HTMLDocument]'],
    ['version', new DOMParser().parseFromString('<a/>', 'text/xml').xmlVersion === '1.0'],
    ['html has no version', document.xmlVersion === null],
    ['encoding', new DOMParser().parseFromString('<a/>', 'text/xml').xmlEncoding === null],
    ['strict', new DOMParser().parseFromString('<a/>', 'text/xml').strictErrorChecking === false],
    ['charset', new DOMParser().parseFromString('<a/>', 'text/xml').characterSet === 'UTF-8']
]);

ck('H3 a document the implementation builds keeps its name too', function () {
    var doc = document.implementation.createDocument(null, 'root', null);
    var other = document.implementation.createDocument('urn:x', 'p:Root', null);
    return doc.documentElement.nodeName === 'root'
        && other.documentElement.nodeName === 'p:Root'
        && other.documentElement.namespaceURI === 'urn:x'
        && Object.prototype.toString.call(other) === '[object XMLDocument]'
        && other.contentType === 'application/xml';
});

ck('H4 an XML serialisation writes the names it was given', function () {
    var doc = new DOMParser().parseFromString('<root><Child a="1">t</Child></root>', 'text/xml');
    var text = new XMLSerializer().serializeToString(doc.documentElement);
    return text === '<root><Child a="1">t</Child></root>'
        && doc.documentElement.firstChild.outerHTML === '<Child a="1">t</Child>';
}, function () {
    var doc = new DOMParser().parseFromString('<root><Child a="1">t</Child></root>', 'text/xml');
    return [new XMLSerializer().serializeToString(doc.documentElement),
        doc.documentElement.firstChild.outerHTML].join(' | ');
});
</script>
