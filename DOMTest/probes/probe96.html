    later('finallyOrder', src([1],'error').finally(function(){ out.finallyRan=true; }).toArray());

    // C. from(), and the shapes the operators demand.
    out.fromBad=g(function(){return [g(function(){return Observable.from('ab');}),

    out.fromLengths=g(function(){return Observable.from.length+'/'+Observable.length;});
    out.needFn=g(function(){return [g(function(){return src([1]).filter(7);}),
        g(function(){return src([1]).reduce(7);}),

    out.catchBadReturn=g(function(){return g(function(){var heard=[];

    out.subscriberThis=g(function(){var seen='none';
        var o=new Observable(function (s) { seen=[Object.getPrototypeOf(s)===Subscriber?
            'Subscriber proto':'no global', typeof Subscriber].join('/'); });
        o.subscribe({}); return seen;});
    out.subscriberProto=g(function(){try{var s=null;new Observable(function(x){s=x;}).subscribe({});
        return [Object.getOwnPropertyNames(s).sort().join(','),
            Object.getOwnPropertyNames(Object.getPrototypeOf(s)).sort().join(','),
            Object.getPrototypeOf(Object.getPrototypeOf(s))===Object.prototype,

            String(Object.getOwnPropertyDescriptor(Object.getPrototypeOf(s),'active').get)].join('|');}
        catch(e){return 'ERR '+e.message;}});

    setTimeout(function () {
        window.__REPORT2 = J(out);
