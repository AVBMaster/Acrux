<!DOCTYPE html><html><head><meta charset="utf-8"><title>probe121 — the answers the specifications determine by themselves</title></head>
<body><div id="box"></div>
<script>
// Rounds 19 to 21 measured the interface SURFACE — which names exist and what a level says about
// them. This probe asks the other kind of question: the values a specification fixes on its own,
// where no running browser is needed to decide one (WHATWG URL §5–§10, ECMAScript as the rows cite,
// Encoding §2.4–§5, JSON, ECMAScript Date). A difference below is an engine answer that contradicts
// the text, not a disagreement between implementations.
(function () {
    var bad = [];
    var total = 0;
    function safe(fn) {
        try { return 'ok:' + fn(); }
        catch (e) { return 'ERR:' + String(e && e.name) + ':' + String(e && e.message).slice(0, 48); }
    }
    function eq(label, got, want) {
        var g = String(got), w = String(want);
        total++;
        if (g !== w) bad.push(label + ' got=[' + g + '] want=[' + w + ']');
    }
    // Some refusals are pinned here only as far as the specification carries them — the kind of the
    // error — because the sentence is the implementation's own and the reference cannot be asked.
    function eqp(label, got, prefix) {
        var g = String(got);
        total++;
        if (g.slice(0, prefix.length) !== prefix) bad.push(label + ' got=[' + g + '] want['
            + prefix + ']');
    }

    // ── A. WHATWG URL: the parts and their normalisation ──────────────────────
    function parts(text) {
        var u = new URL(text);
        return [u.protocol, u.username, u.password, u.hostname, u.port, u.pathname, u.search,
            u.hash, u.href, u.origin].join('|');
    }
    eq('A1 a scheme and a host fold', safe(function () { return parts('HTTP://WWW.Example.COM/Path'); }),
        'ok:http:|||www.example.com||/Path|||http://www.example.com/Path|http://www.example.com');
    eq('A2 the default port is dropped', safe(function () { return parts('https://example.com:443/a'); }),
        'ok:https:|||example.com||/a|||https://example.com/a|https://example.com');
    eq('A3 a port that is not the default is kept',
        safe(function () { return parts('http://example.com:8080/x?q=1#h'); }),
        'ok:http:|||example.com|8080|/x|?q=1|#h|http://example.com:8080/x?q=1#h|http://example.com:8080');
    eq('A4 a file url has no host and no origin', safe(function () { return parts('file:///tmp/a.html'); }),
        'ok:file:|||||/tmp/a.html|||file:///tmp/a.html|null');
    eq('A5 an opaque path is the rest of the url', safe(function () { return parts('about:blank'); }),
        'ok:about:|||||blank|||about:blank|null');
    eq('A6 the credentials are read', safe(function () {
        var u = new URL('https://user:pw@example.com/p');
        return [u.username, u.password, u.host, u.href].join('|');
    }), 'ok:user|pw|example.com|https://user:pw@example.com/p');
    eq('A7 an IPv6 host keeps its brackets in host and loses them in hostname', safe(function () {
        var u = new URL('http://[::1]:8080/x');
        return [u.hostname, u.host, u.port].join('|');
    }), 'ok:[::1]|[::1]:8080|8080');
    eq('A8 a path encodes a space and leaves a plus alone', safe(function () {
        return new URL('http://e.com/a b/c+d').pathname;
    }), 'ok:/a%20b/c+d');
    eq('A9 a query encodes a space and leaves a plus alone', safe(function () {
        return new URL('http://e.com/?a+b c').search;
    }), 'ok:?a+b%20c');
    eq('A10 a non-special scheme keeps the case of its host', safe(function () {
        return new URL('foo://Example.COM/A B').href;
    }), 'ok:foo://Example.COM/A%20B');
    eq('A11 a backslash separates segments only for a special scheme', safe(function () {
        return [new URL('http://e.com/a\\b').pathname, new URL('foo://e/a\\b').pathname].join(';');
    }), 'ok:/a/b;/a\\b');
    eq('A12 the origin of a data url is null', safe(function () {
        return new URL('data:text/plain,hi').origin;
    }), 'ok:null');
    eq('A13 a part written on the url is read back encoded', safe(function () {
        var u = new URL('http://a.example/x');
        u.pathname = '/y z'; u.search = '?x=1&y=2'; u.hash = '#f'; u.port = '8443';
        return u.href;
    }), 'ok:http://a.example:8443/y%20z?x=1&y=2#f');
    eq('A14 a relative url walks the base it is given', safe(function () {
        return new URL('/deep/../x.html?v=2', 'http://e.com/a/b/c').href;
    }), 'ok:http://e.com/x.html?v=2');
    eqp('A15 a url that cannot be read is refused', safe(function () { return new URL('not a url'); }),
        'ERR:TypeError:');
    eq('A16 canParse answers the same yes and no', safe(function () {
        return [typeof URL.canParse, URL.canParse('http://e.com'), URL.canParse('not a url')].join('|');
    }), 'ok:function|true|false');
    eq('A17 the search params are the live view of the query', safe(function () {
        var u = new URL('http://e.com/?a=1');
        u.searchParams.append('b', '2');
        return [u.href, u.search, u.searchParams.get('b')].join('|');
    }), 'ok:http://e.com/?a=1&b=2|?a=1&b=2|2');

    // ── B. URLSearchParams ───────────────────────────────────────────────────
    eq('B1 the pairs read back', safe(function () {
        var p = new URLSearchParams('a=1&b=2&a=3&');
        return [p.get('a'), p.getAll('a').join(','), String(p.get('c')), p.size, p.toString()].join('|');
    }), 'ok:1|1,3|null|3|a=1&b=2&a=3');
    eq('B2 a plus is a space and a decoded byte re-encodes', safe(function () {
        var p = new URLSearchParams('x=a+b&y=c%20d&z=e%2Df');
        return [p.get('x'), p.get('y'), p.get('z'), p.toString()].join('|');
    }), 'ok:a b|c d|e-f|x=a+b&y=c+d&z=e-f');
    eq('B3 a semicolon is not a separator', safe(function () {
        return new URLSearchParams('a=1;b=2').get('a');
    }), 'ok:1;b=2');
    eq('B4 append, set, delete and has', safe(function () {
        var p = new URLSearchParams();
        p.append('k', 1); p.append('k', 'v w'); p.set('j', 'x');
        return [p.get('k'), p.getAll('k').join(','), p.has('j'), String(p.delete('k')), p.has('k'),
            p.toString()].join('|');
    }), 'ok:1|1,v w|true|undefined|false|j=x');
    eq('B5 the iteration follows the pairs', safe(function () {
        var p = new URLSearchParams('b=2&a=1&b=3');
        return [Array.from(p.keys()).join(','), Array.from(p.entries()).map(function (e) {
            return e.join('=');
        }).join(',')].join(';');
    }), 'ok:b,a,b;b=2,a=1,b=3');
    eq('B6 sort orders by the key and keeps the run of one key together', safe(function () {
        var p = new URLSearchParams('b=2&a=1&b=3&a=0');
        p.sort();
        return p.toString();
    }), 'ok:a=1&a=0&b=2&b=3');
    eq('B7 forEach, entries and the iterator', safe(function () {
        var p = new URLSearchParams('a=1&b=2');
        var seen = [];
        p.forEach(function (v, k) { seen.push(k + ':' + v); });
        return [seen.join(','), typeof p[Symbol.iterator], typeof p.entries, p.size].join('|');
    }), 'ok:a:1,b:2|function|function|2');
    eq('B8 a query written over the whole wins', safe(function () {
        var u = new URL('http://e.com/?a=1');
        u.search = '?x=1&y=2';
        return [u.search, u.searchParams.get('x'), u.href].join('|');
    }), 'ok:?x=1&y=2|1|http://e.com/?x=1&y=2');
    eq('B9 a list of pairs builds the same view', safe(function () {
        return new URLSearchParams([['a', '1'], ['b', '2']]).toString();
    }), 'ok:a=1&b=2');
    eq('B10 a percent that is not an escape survives the round trip', safe(function () {
        var p = new URLSearchParams('a=%2526b&b=%zz');
        return [p.get('a'), p.get('b'), p.toString()].join('|');
    }), 'ok:%26b|%zz|a=%2526b&b=%25zz');

    // ── C. the ECMAScript faces a page writes against ────────────────────────
    eq('C1 the copy-on-write array methods', safe(function () {
        var a = [3, 1, 2];
        return [a.toSorted().join(','), a.toReversed().join(','), a.toSpliced(1, 1).join(','),
            a.join(',')].join('|');
    }), 'ok:1,2,3|2,1,3|3,2|3,1,2');
    eq('C2 the grouping and the last searches', safe(function () {
        var g = Object.groupBy([1, 2, 3], function (n) { return n % 2 ? 'odd' : 'even'; });
        return [g.odd.join(','), g.even.join(','), [1, 2, 3].findLast(function (n) { return n < 3; }),
            [1, 2, 3].findLastIndex(function (n) { return n < 3; })].join('|');
    }), 'ok:1,3|2|2|1');
    eq('C3 at, hasOwn and the structured copy', safe(function () {
        return ['abcdef'.at(-1), [1, 2].at(-2), Object.hasOwn({ a: 1 }, 'a'),
            Object.hasOwn({ a: 1 }, 'toString'), structuredClone({ a: [1] }).a[0]].join('|');
    }), 'ok:f|1|true|false|1');
    eq('C4 the settled promise families and the resolver a page holds', safe(function () {
        var w = Promise.withResolvers();
        w.resolve('r');
        return [typeof Promise.allSettled, typeof Promise.any, typeof w.promise,
            typeof w.reject, w.status === undefined].join('|');
    }), 'ok:function|function|object|function|true');
    eq('C5 an error keeps its cause and an aggregate keeps its list', safe(function () {
        var e = new Error('outer', { cause: new Error('inner') });
        return [e.cause && e.cause.message, new AggregateError([1], 'many').errors.join(','),
            new AggregateError([1], 'many').name].join('|');
    }), 'ok:inner|1|AggregateError');
    eq('C6 the regex faces: indices, named groups, matchAll, lookbehind', safe(function () {
        var m = /(?<y>\d+)/d.exec('a12b');
        return [m.indices[0], m.groups.y, 'x1y2'.matchAll(/\d/g).next().value[0],
            /(?<=a)b/.test('ab'), /\p{L}/u.test('\u00e9'),
            'ab'.replace(/(?<x>a)/, '[$<x>]')].join('|');
    }), 'ok:1,3|12|1|true|true|[a]b');
    eq('C7 the iterator helpers', safe(function () {
        return [typeof [0, 1].values().map, typeof [0, 1].values().take,
            Array.from([0, 1].values().filter(function (v) { return true; }))].join('|');
    }), 'ok:function|function|0,1');
    eq('C8 numeric separators, logical assignment, class fields and privates', safe(function () {
        var o = { a: 1 }; o ??= 2; o.a ||= 5;
        var K = class { x = 7; #p = 1; get p() { return this.#p; } };
        return [1_000 + 0b11, o.a, new K().x, new K().p].join('|');
    }), 'ok:1003|1|7|1');
    eq('C9 the well-formed checks and the raw template', safe(function () {
        return ['\uD800'.isWellFormed(), '\uD800'.toWellFormed().length,
            String.raw`a\nb`.length, /\uD800/.test('\uD800')].join('|');
    }), 'ok:false|1|4|true');
    eq('C10 the flat and spread faces an ES page expects', safe(function () {
        return [[1, [2, [3]]].flat(Infinity).join(','), [1, [2]].flat().join(','),
            Math.max(...[1, 5, 2]), Object.entries({ a: 1 }).map(function (e) { return e.join('='); }).join(','),
            Object.fromEntries([['a', 1]]).a].join('|');
    }), 'ok:1,2,3|1,2|5|a=1|1');

    // ── D. Encoding §2.4–§5 and the two old converters ───────────────────────
    eq('D1 the encoder counts the bytes of a non-ASCII string', safe(function () {
        var e = new TextEncoder().encode('\u00e9\u20ac');
        return [e.length, e.join(','), new TextEncoder().encode('a').buffer.byteLength].join('|');
    }), 'ok:5|195,169,226,130,172|1');
    eq('D2 the decoder reads the labels it names', safe(function () {
        return [new TextDecoder().decode(new Uint8Array([195, 169])),
            new TextDecoder('latin1').decode(new Uint8Array([233])),
            new TextDecoder('windows-1252').decode(new Uint8Array([128])),
            new TextDecoder('utf-16le').decode(new Uint8Array([0x69, 0, 0x3d, 0x04]))].join('|');
    }), 'ok:\u00e9|\u00e9|\u20ac|i\u043d');
    eq('D3 the byte-order mark is stripped unless the page says not to', safe(function () {
        var bom = new Uint8Array([0xef, 0xbb, 0xbf, 97]);
        return [new TextDecoder().decode(bom).charCodeAt(0),
            new TextDecoder('utf-8', { ignoreBOM: true }).decode(bom).charCodeAt(0)].join('|');
    }), 'ok:97|65279');
    eqp('D4 a byte that cannot stand alone is refused by the fatal decoder', safe(function () {
        return new TextDecoder('utf-8', { fatal: true }).decode(new Uint8Array([0xff]));
    }), 'ERR:TypeError:');
    eq('D5 a stream holds the cut code point until the next chunk', safe(function () {
        var d = new TextDecoder('utf-8');
        return d.decode(new Uint8Array([0xe4, 0xb8]), { stream: true }).length + '|' +
            d.decode(new Uint8Array([0x80]), { stream: true });
    }), 'ok:0|\u4e00');
    eq('D6 atob and btoa keep every byte', safe(function () {
        var bin = String.fromCharCode(0, 128, 255, 65);
        return [btoa(bin).length, atob(btoa(bin)).charCodeAt(2), typeof atob('QQ')].join('|');
    }), 'ok:8|255|string');
    eqp('D7 a string that is not a base64 run is refused', safe(function () {
        return atob('!!!!');
    }), 'ERR:InvalidCharacterError:');

    // ── E. Date and JSON ─────────────────────────────────────────────────────
    eq('E1 a date-only string is UTC and a naked date-time is local', safe(function () {
        return [new Date('2026-01-01').getTime() === Date.UTC(2026, 0, 1),
            new Date('2026-01-01T00:00:00').getTime() === new Date(2026, 0, 1).getTime(),
            new Date('2026-01-01T00:00:00Z').getTime() === Date.UTC(2026, 0, 1)].join('|');
    }), 'ok:true|true|true');
    eq('E2 the ISO printer and the UTC factory', safe(function () {
        var d = new Date(Date.UTC(2026, 0, 2, 3, 4, 5, 6));
        return [d.toISOString(), d.toJSON() === d.toISOString(), String(Date.UTC()),
            new Date(0).toISOString()].join('|');
    }), 'ok:2026-01-02T03:04:05.006Z|true|NaN|1970-01-01T00:00:00.000Z');
    eq('E3 a date outside the range prints the invalid form', safe(function () {
        var thrown = '';
        try { new Date(NaN).toISOString(); } catch (e) { thrown = String(e.name); }
        return [thrown, String(new Date(NaN))].join('|');
    }), 'ok:RangeError|Invalid Date');
    eq('E4 JSON drops what it cannot write and prints what it can', safe(function () {
        return [JSON.stringify({ a: undefined, b: [undefined] }), JSON.stringify(-0),
            JSON.stringify({ x: 1, y: 2 }, ['x']), JSON.stringify({ toJSON: function () { return 5; } }),
            JSON.parse('{"a":1}', function (k, v) { return typeof v === 'number' ? v * 2 : v; }).a].join(';');
    }), 'ok:{"b":[null]};0;{"x":1};5;2');
    eq('E5 a BigInt and a cycle are refused by name', safe(function () {
        var o = { }; o.self = o;
        var a = '', c = '';
        try { JSON.stringify(1n); } catch (e) { a = String(e.name); }
        try { JSON.stringify(o); } catch (e) { c = String(e.name); }
        return a + '|' + c;
    }), 'ok:TypeError|TypeError');

    // ── F. the object urls and the statics the interface adds ────────────────
    eq('F1 an object url is a blob url of the document it was made in', safe(function () {
        var made = URL.createObjectURL(new Blob(['abc']));
        var u = new URL(made);
        return [made.slice(0, 5), u.protocol, u.pathname.length > 0, typeof u.origin].join('|');
    }), 'ok:blob:|blob:|true|string');
    eq('F2 the same url read back is the same address', safe(function () {
        var made = URL.createObjectURL(new Blob(['x']));
        return [new URL(made).href === made, String(URL.revokeObjectURL(made))].join('|');
    }), 'ok:true|undefined');
    eq('F3 parse answers null where the constructor throws', safe(function () {
        return [String(URL.parse('not a url')), URL.parse('/x', 'http://e.com/a').href,
            String(URL.parse('http://e.com') !== null), String(URL.parse(''))].join('|');
    }), 'ok:null|http://e.com/x|true|null');
    eq('F4 canParse refuses the empty input and takes a base', safe(function () {
        return [URL.canParse(''), URL.canParse('', 'http://e.com'),
            URL.canParse('/deep/x', 'http://e.com')].join('|');
    }), 'ok:false|false|true');
    eqp('F5 the base64 face strips its whitespace and counts its characters', safe(function () {
        return [atob('  QQ  '), safe(function () { return atob('A'); })].join('|');
    }), 'ok:A|ERR:InvalidCharacterError:');
    eq('F6 a url written part by part comes back the same as one written whole', safe(function () {
        var u = new URL('http://a.example/');
        u.protocol = 'https';
        u.hostname = 'b.example';
        u.port = '8443';
        u.pathname = '/x/y';
        u.search = '?q=1';
        u.hash = '#top';
        return u.href;
    }), 'ok:https://b.example:8443/x/y?q=1#top');
    eq('F7 a part the syntax refuses leaves the address as it was', safe(function () {
        var u = new URL('http://a.example/x');
        u.port = 'not-a-port';
        u.hostname = 'has space';
        u.protocol = 'http';
        return [u.href, u.port].join('|');
    }), 'ok:http://a.example/x|');
    eq('F8 the empty query is a query and the empty fragment is not', safe(function () {
        return [new URL('http://e.com/?').href, new URL('http://e.com/#').href,
            new URL('http://e.com/?#').href].join('|');
    }), 'ok:http://e.com/?|http://e.com/|http://e.com/?');
    eq('F9 a host of every form comes back in the form the standard writes', safe(function () {
        return [new URL('http://0x7f.1/').hostname, new URL('http://2130706433/').hostname,
            new URL('http://[2001:DB8::1:0:0:1]/').hostname,
            new URL('http://[::ffff:1.2.3.4]/').hostname].join('|');
    }), 'ok:127.0.0.1|127.0.0.1|[2001:db8::1:0:0:1]|[::ffff:1.2.3.4]');
    eq('F10 a path that folds its dots is written folded', safe(function () {
        return [new URL('http://e/a/b/../c').pathname, new URL('http://e/a/./b').pathname,
            new URL('http://e/a/b/..').pathname, new URL('http://e/../a').pathname].join('|');
    }), 'ok:/a/c|/a/b|/a/|/a');
    eq('F11 the userinfo a page writes is encoded and read back', safe(function () {
        var u = new URL('http://e/');
        u.username = 'a b:c/d';
        u.password = 'p%20q';
        return [u.username, u.password, u.host, u.href.slice(0, 24)].join('|');
    }), 'ok:a%20b%3Ac%2Fd|p%20q|e|http://a%20b%3Ac%2Fd:p%2');

    window.__REPORT = bad;
    document.title = 'P121';
    window.__T && window.__T('spec_surface_audit', bad.length === 0,
        bad.length + ' of ' + total + ' rows differ: ' + bad.join(' || ').slice(0, 3000));
})();
</script></body></html>
