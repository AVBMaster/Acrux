<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font: 16px "Segoe UI", sans-serif; margin: 8px; }
.probe { display: inline; }
#log { white-space: pre; font: 12px Consolas, monospace; }
</style>
</head>
<body>
<div id="host"></div>
<div id="log"></div>
<script>
var styles = [
  "japanese-informal", "japanese-formal",
  "korean-hangul-formal", "korean-hanja-informal", "korean-hanja-formal",
  "simp-chinese-informal", "simp-chinese-formal", "trad-chinese-informal", "cjk-decimal",
  "hebrew", "armenian", "lower-armenian", "georgian",
  "decimal-leading-zero", "decimal", "gujarati", "gurmukhi", "kannada", "malayalam", "oriya", "tibetan",
  "cjk-earthly-branch", "cjk-heavenly-stem", "ethiopic-numeric"
];
var values = [0, 1, 2, 9, 10, 11, 14, 15, 16, 17, 19, 20, 99, 100, 101, 110, 115, 200, 400, 450,
              500, 900, 999, 1000, 1005, 1010, 1100, 1111, 2000, 9999, 10000, 10999, 11000, 20000,
              110000, 1000000, 100000000, -1, -11];
var host = document.getElementById("host");
var lines = [];
for (var s = 0; s < styles.length; s++) {
  var st = styles[s];
  var out = [];
  for (var v = 0; v < values.length; v++) {
    var el = document.createElement("span");
    el.className = "probe";
    el.style.cssText = "counter-reset: p " + values[v] + ";";
    var sheet = document.createElement("style");
    sheet.textContent = ".probe" + s + "::after{content: counter(p, " + st + ")}";
    document.head.appendChild(sheet);
    el.className = "probe probe" + s;
    host.appendChild(el);
    var text = el.innerText + "|" + el.textContent;
    host.removeChild(el);
    out.push(values[v] + "=" + text);
  }
  lines.push(st + "\n  " + out.join("  "));
}
document.getElementById("log").textContent = lines.join("\n");
</script>
</body>
</html>
