<!doctype html><html><head><meta charset="utf-8"><style>body{margin:8px;font:14px monospace}</style></head><body><div id="out"></div>
<script>
const out=[];
function L(t,v){out.push("L~"+t+"~"+String(v).split(" ").join("_"));}
function gc(tag,css,prop){
  const d=document.createElement("div");d.setAttribute("style",css);document.body.appendChild(d);
  const v=getComputedStyle(d).getPropertyValue(prop).trim();
  L(tag,prop+"="+(v===""?"(empty)":v.split(" ").join("_")));d.remove();
}
// individual transform properties
gc("translate-none","translate:none","translate");
gc("translate-px","translate:10px 20px","translate");
gc("translate-1val","translate:30px","translate");
gc("translate-pct","translate:10% 20%","translate");
gc("translate-calc","translate:calc(10px + 5px) 0","translate");
gc("rotate-none","rotate:none","rotate");
gc("rotate-deg","rotate:45deg","rotate");
gc("rotate-rad","rotate:1rad","rotate");
gc("rotate-x","rotate:x 30deg","rotate");
gc("rotate-xyz","rotate:1 1 0 45deg","rotate");
gc("scale-none","scale:none","scale");
gc("scale-1","scale:1","scale");
gc("scale-xy","scale:2 3","scale");
gc("scale-neg","scale:-1","scale");
// overflow-clip-margin
gc("ocm-auto","overflow:clip;overflow-clip-margin:auto","overflow-clip-margin");
gc("ocm-px","overflow:clip;overflow-clip-margin:10px","overflow-clip-margin");
gc("ocm-border","overflow:clip;overflow-clip-margin:border-box","overflow-clip-margin");
gc("ocm-content","overflow:clip;overflow-clip-margin:content-box","overflow-clip-margin");
// mask-composite
gc("mc-add","-webkit-mask-composite:add","-webkit-mask-composite");
gc("mc-subtract","-webkit-mask-composite:subtract","-webkit-mask-composite");
gc("mc-intersect","-webkit-mask-composite:intersect","-webkit-mask-composite");
gc("mc-exclude","-webkit-mask-composite:exclude","-webkit-mask-composite");
gc("mc-none","-webkit-mask-composite:none","-webkit-mask-composite");
// contain-intrinsic-inline-size / block-size
gc("ciis","contain-intrinsic-inline-size:100px","contain-intrinsic-inline-size");
gc("cibs","contain-intrinsic-block-size:50px","contain-intrinsic-block-size");
gc("cis-both","contain-intrinsic-size:100px 50px","contain-intrinsic-size");
// contain-intrinsic-width / height (legacy)
gc("ciw","contain-intrinsic-width:100px","contain-intrinsic-width");
gc("cih","contain-intrinsic-height:50px","contain-intrinsic-height");
document.getElementById("out").textContent=out.join("\n");
</script></body></html>
