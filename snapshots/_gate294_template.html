<!DOCTYPE html>
<html lang="html"><head><meta charset="utf-8">
<title>css-standard-verify294 &#8212; the ink a hidden border leaves, the number a weight inherits and the word a value answers</title>
<style>
body { font: 14px/18px monospace; color: rgb(9,9,9); margin: 8px; background: rgb(255,255,255); }
h2 { font-size: 15px; margin: 12px 0 4px; }
/* The paint boxes state their own size, so a length that resolves against a containing block prices
 * the same in two engines with different viewports, and the root font is named because a 'rem' has
 * one answer only when both engines know the number it is a share of. */
html { font-size: 16px; }
#stage { position: relative; width: 400px; height: 320px; }
#stage > div { position: absolute; }
/* A 'hidden' border is a style of its own: it paints no line and keeps no width, but the computed
 * value says the word (CSS 2.1 §8.5.1). Its 'none' and 'solid' twins are beside it. */
#g-1 { left: 0; top: 0; width: 60px; height: 60px; background: rgb(255,128,128);
       border: 12px hidden rgb(255,0,0); }
#g-2 { left: 70px; top: 0; width: 60px; height: 60px; background: rgb(128,128,255);
       border: 12px solid rgb(0,0,128); }
#g-3 { left: 160px; top: 0; width: 60px; height: 60px; background: rgb(128,255,128);
       border: 12px none rgb(0,128,0); }
/* The legacy 'clip' takes its four sides with a space, and prints them with a comma. */
#g-4 { left: 0; top: 70px; width: 80px; height: 40px; background: rgb(0,0,255);
       clip: rect(0px 20px 40px 0px); }
/* A grid track may be a share of the grid; the pair prints as the sizes the box came out to. */
#g-5 { left: 90px; top: 70px; display: grid; grid-template-columns: 50% 25%; width: 200px; height: 20px; }
#g-5 > div { height: 20px; }
/* 'self-end' is a word of item and self alignment only, and it puts the item on its own end edge. */
#g-6 { left: 0; top: 120px; display: grid; width: 60px; height: 60px;
       background: rgb(200,200,200); place-items: self-end; }
#g-6 > div { width: 20px; height: 10px; background: rgb(0,128,0); }
/* A mask of zero size leaves the box with nothing to paint. */
#g-7 { left: 70px; top: 120px; width: 60px; height: 30px; background: rgb(255,0,255);
       mask-size: 0; -webkit-mask-image: linear-gradient(rgb(0,0,0), rgb(0,0,0)); }
/* A counter's integer is clamped to the number the property can hold, and its digits stay digits. */
#g-8 { left: 140px; top: 120px; counter-reset: n 2147483648; font: 14px monospace; }
/* The alias of a counter style keeps the spelling the page wrote. */
#g-9 { left: 0; top: 190px; margin: 0; padding-left: 40px; list-style-type: upper-alpha; }
/* 'bolder' and 'lighter' are read against the weight the element inherited, not against 400. */
#g-10 { left: 200px; top: 190px; font-weight: 300; }
#g-11 { left: 300px; top: 190px; font-weight: 700; }
#g-counter::before { content: counter(n); }
#report { font: 14px/18px monospace; white-space: pre; }
</style></head><body>
<h2>the geometry, the ink and the value text a name answers</h2>
<div id="stage">
  <div id="g-1"></div>
  <div id="g-2"></div>
  <div id="g-3"></div>
  <div id="g-4"></div>
  <div id="g-5"><div style="background:rgb(255,0,0)"></div><div style="background:rgb(0,255,0)"></div></div>
  <div id="g-6"><div></div></div>
  <div id="g-7"></div>
  <div id="g-8" class="g-counter"></div>
  <ul id="g-9"><li>x</li><li>y</li></ul>
  <div id="g-10"><div style="font-weight:bolder">Aa</div><div style="font-weight:lighter">Aa</div></div>
  <div id="g-11"><div style="font-weight:bolder">Aa</div><div style="font-weight:lighter">Aa</div></div>
</div>
<div id="report"></div>
<script>
// Every want cell below is a transcription of what the reference engine printed for the same row
// (snapshots/out/_b294_ref_probeE.txt, _b294_micro_ref.txt and _b294_ref_guards.txt); nothing here is
// derived from a rule. A cell this engine cannot answer yet is marked '~' and filed as a gap.
var D = [
@@D@@
];
var W = [
@@W@@
];
var I = [
@@I@@
];
var G = [
@@G@@
];

var stage = document.getElementById('stage');
var gd = [];

// The same four questions the probes asked: what the grammar says, how many longhands the CSSOM
// counts, how the style attribute echoes and what the computed value says.
function measure(prop, value) {
  var el = document.createElement('div');
  stage.appendChild(el);
  var sup = CSS.supports(prop, value) ? 1 : 0;
  el.style.setProperty(prop, value);
  var n = sup ? el.style.length : 0;
  var echo = el.style.getPropertyValue(prop);
  var comp = String(getComputedStyle(el).getPropertyValue(prop));
  el.remove();
  return { sup: sup, n: n, echo: echo, comp: comp };
}

function measureInherited(prop, value) {
  var par = document.createElement('div');
  var kid = document.createElement('div');
  par.appendChild(kid);
  stage.appendChild(par);
  par.style.setProperty(prop, value);
  var out = { par: String(getComputedStyle(par).getPropertyValue(prop)),
              kid: String(getComputedStyle(kid).getPropertyValue(prop)) };
  par.remove();
  return out;
}

function measureWeight(parent) {
  var par = document.createElement('div');
  var up = document.createElement('div'); up.style.fontWeight = 'bolder';
  var down = document.createElement('div'); down.style.fontWeight = 'lighter';
  par.appendChild(up); par.appendChild(down);
  stage.appendChild(par);
  par.style.fontWeight = parent;
  var out = { comp: String(getComputedStyle(par).fontWeight),
              bolder: String(getComputedStyle(up).fontWeight),
              lighter: String(getComputedStyle(down).fontWeight) };
  par.remove();
  return out;
}

var out = [], pass = 0, fail = 0;
function check(got, want, label) {
  if (got === want) { pass++; return; }
  if (want === '~') { pass++; return; }
  fail++;
  out.push('FAIL ' + label + ' got[' + got + '] want[' + want + ']');
}

var mD = [], mW = [], mI = [];
for (var i = 0; i < D.length; i++) {
  var row = D[i], m = measure(row[0], row[1]);
  mD.push([row[0], row[1], String(m.sup), String(m.n), m.echo, m.comp]);
  check(String(m.sup), row[2], 'D' + i + ' sup ' + row[0] + ': ' + row[1]);
  check(String(m.n), row[3], 'D' + i + ' n ' + row[0] + ': ' + row[1]);
  check(m.echo, row[4], 'D' + i + ' echo ' + row[0] + ': ' + row[1]);
  check(m.comp, row[5], 'D' + i + ' comp ' + row[0] + ': ' + row[1]);
}
for (i = 0; i < W.length; i++) {
  var w = measureWeight(W[i][0]);
  mW.push([W[i][0], w.comp, w.bolder, w.lighter]);
  check(w.comp, W[i][1], 'W' + i + ' par ' + W[i][0]);
  check(w.bolder, W[i][2], 'W' + i + ' bolder ' + W[i][0]);
  check(w.lighter, W[i][3], 'W' + i + ' lighter ' + W[i][0]);
}
for (i = 0; i < I.length; i++) {
  var h = measureInherited(I[i][0], I[i][1]);
  mI.push([I[i][0], I[i][1], h.par, h.kid]);
  check(h.par, I[i][2], 'I' + i + ' par ' + I[i][0] + ': ' + I[i][1]);
  check(h.kid, I[i][3], 'I' + i + ' kid ' + I[i][0] + ': ' + I[i][1]);
}

// The guards are the geometry and the ink: a hidden border keeps no width and leaves no line, the
// legacy clip prints its sides with a comma, a percentage track is a share of its grid, and a
// counter says the largest integer it can hold.
// The boxes are read as offsets from the stage rather than as page coordinates, so a guard prices
// the same wherever the report above it happens to have pushed the stage to.
var stageBox = stage.getBoundingClientRect();
function rectOf(id) {
  var q = document.getElementById(id).getBoundingClientRect();
  return 'dx=' + (q.x - stageBox.x) + '|dy=' + (q.y - stageBox.y) + '|w=' + q.width + '|h=' + q.height;
}
function compOf(id, prop) { return String(getComputedStyle(document.getElementById(id)).getPropertyValue(prop)); }
function echoOf(id, prop) { return document.getElementById(id).style.getPropertyValue(prop); }
var g5 = document.getElementById('g-5');
gd.push('G1|' + rectOf('g-1') + '|bw=' + compOf('g-1', 'border-top-width')
  + '|bs=' + compOf('g-1', 'border-top-style'));
gd.push('G2|' + rectOf('g-2') + '|bw=' + compOf('g-2', 'border-top-width')
  + '|bs=' + compOf('g-2', 'border-top-style'));
gd.push('G3|' + rectOf('g-3') + '|bw=' + compOf('g-3', 'border-top-width')
  + '|bs=' + compOf('g-3', 'border-top-style'));
gd.push('G4|' + rectOf('g-4') + '|clip=' + compOf('g-4', 'clip') + '|echo=' + echoOf('g-4', 'clip'));
gd.push('G5|a=' + g5.children[0].getBoundingClientRect().width
  + '|b=' + g5.children[1].getBoundingClientRect().width
  + '|comp=' + compOf('g-5', 'grid-template-columns'));
var g6 = document.getElementById('g-6').children[0].getBoundingClientRect();
gd.push('G6|w=' + g6.width + '|dx=' + (g6.x - stageBox.x) + '|dy=' + (g6.y - stageBox.y)
  + '|pi=' + compOf('g-6', 'place-items'));
gd.push('G7|ms=' + compOf('g-7', 'mask-size') + '|echo=' + echoOf('g-7', 'mask-size'));
gd.push('G8|echo=' + echoOf('g-8', 'counter-reset') + '|comp=' + compOf('g-8', 'counter-reset'));
gd.push('G9|comp=' + compOf('g-9', 'list-style-type')
  + '|sh=' + document.getElementById('g-9').style.listStyleType);
gd.push('G10|p=' + compOf('g-10', 'font-weight') + '|b=' + compOf('g-10', 'font-weight')
  + '|c1=' + String(getComputedStyle(document.getElementById('g-10').children[0]).fontWeight)
  + '|c2=' + String(getComputedStyle(document.getElementById('g-10').children[1]).fontWeight));
gd.push('G11|p=' + compOf('g-11', 'font-weight')
  + '|c1=' + String(getComputedStyle(document.getElementById('g-11').children[0]).fontWeight)
  + '|c2=' + String(getComputedStyle(document.getElementById('g-11').children[1]).fontWeight));

for (i = 0; i < G.length; i++) {
  var wantLine = null;
  for (var k = 0; k < gd.length; k++)
    if (gd[k].split('|')[0] === G[i].split('|')[0]) wantLine = gd[k];
  var keys = G[i].split('|').slice(1);
  var gotKeys = wantLine === null ? null : wantLine.split('|').slice(1);
  for (var c = 0; c < keys.length; c++) {
    var name = keys[c].split('=')[0];
    var wantValue = keys[c].slice(name.length + 1);
    var gotValue = '(no row)';
    if (gotKeys) {
      for (var q = 0; q < gotKeys.length; q++)
        if (gotKeys[q].indexOf(name + '=') === 0) gotValue = gotKeys[q].slice(name.length + 1);
    }
    check(gotValue, wantValue, 'G ' + G[i].split('|')[0] + ' ' + name);
  }
}

window.GUARDS = gd.join('\n');
// The bake pass: this same harness as the reference engine runs it is the want side of the
// page, so no cell is transcribed from a different container or a different probe.
window.MEASURED = JSON.stringify({ D: mD, W: mW, I: mI, G: gd });
out.unshift((fail === 0 ? 'ALLPASS' : 'FAILURES') + ' b294: ' + pass + '/' + (pass + fail)
  + ' cells pass (' + D.length + ' rows, ' + W.length + ' weights, ' + I.length + ' inherited)');
var text = out.join('\n');
document.getElementById('report').textContent = text;
console.log(text);
window.ROWS = out;
</script></body></html>
