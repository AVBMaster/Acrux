<!DOCTYPE html>
<html><head><style>
body { margin: 0; background: white; }
.g {
  position: absolute; left: 12px; top: 12px;
  display: grid; grid-template-columns: 80px 80px 80px; grid-template-rows: 40px 40px;
  gap: 8px; width: 256px;
}
.g div:nth-child(1) { background: #ff0000; }
.g div:nth-child(2) { background: #00ff00; }
.g div:nth-child(3) { background: #0000ff; }
.g div:nth-child(4) { background: #ff8000; }
.g div:nth-child(5) { background: #00ffff; }
.g div:nth-child(6) { background: #ff00ff; }
</style></head><body>
<div class="g">
  <div></div><div></div><div></div><div></div><div></div><div></div>
</div>
</body></html>
