<!doctype html><html><head><style>
  #a { width: initial; }
  #b { width: 100px; width: initial; }
  #c { color: red; all: unset; color: blue; }
  #d { color: red; all: unset; }
</style></head><body>
<div id="a">a</div>
<div id="b">b</div>
<div id="c">c</div>
<div id="d">d</div>
<pre id="rec"></pre>
<script>
const out=[];
['a','b'].forEach(id=>out.push(id+' width='+JSON.stringify(getComputedStyle(document.getElementById(id)).width)));
['c','d'].forEach(id=>out.push(id+' color='+JSON.stringify(getComputedStyle(document.getElementById(id)).color)));
document.getElementById('rec').textContent=out.join('\n');
</script></body></html>
