<!doctype html><html><head><meta charset="utf-8"></head><body>
<div id="c"><a class="k">1</a><b>b1</b><a>2</a></div>
<script>
const c = document.getElementById('c');
const lines = [];
lines.push('doc=' + Array.from(document.querySelectorAll('#c a:nth-child(1)')).map(e=>e.textContent).join(','));
lines.push('el=' + Array.from(c.querySelectorAll('a')).map(e=>e.textContent).join(','));
lines.push('el2=' + Array.from(c.querySelectorAll('a:nth-of-type(2)')).map(e=>e.textContent).join(','));
lines.push('el3=' + Array.from(c.querySelectorAll(':scope > b')).map(e=>e.textContent).join(','));
lines.push('typeof=' + typeof c.querySelectorAll);
console.log(lines.join('\n'));
</script></body></html>
