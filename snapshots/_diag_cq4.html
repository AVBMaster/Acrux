<!doctype html><html><head><meta charset=utf-8><style>
#cn{container-type:inline-size;width:180px}
#cw{container-type:inline-size;container-name:card;width:200px}
</style></head><body><meta charset=utf-8>
<div id=cn><span>cn</span></div>
<div id=cw><span>cw</span></div>
<script>
const g=id=>{const e=document.getElementById(id);const s=getComputedStyle(e);
 return id+":ct=["+s.containerType+"]cn=["+s.containerName+"]w="+Math.round(e.getBoundingClientRect().width);};
document.body.appendChild(document.createTextNode(["cn","cw"].map(g).join(" ## ")));
</script></body></html>
