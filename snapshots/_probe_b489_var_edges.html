<!doctype html><html><body><pre id=rec></pre><script>
const out=[];
function row(label, setup, decl){
  try{
    const d=document.createElement('div');
    if(setup) d.setAttribute('style', setup);
    document.body.appendChild(d);
    const cs=getComputedStyle(d);
    const before=cs.getPropertyValue(decl.prop);
    d.style.setProperty(decl.prop, decl.val);
    const after=getComputedStyle(d).getPropertyValue(decl.prop);
    out.push(label+' echo='+JSON.stringify(after)+' | '+decl.prop+':'+JSON.stringify(decl.val));
    d.remove();
  }catch(e){ out.push(label+' ERR '+e.message); }
}
// b489: var() edge cases
row('var-undef-nofallback', null, {prop:'color', val:'var(--missing)'});
row('var-undef-fallback', null, {prop:'color', val:'var(--missing, blue)'});
row('var-cycle', '--a: var(--b); --b: var(--a);', {prop:'color', val:'var(--a, red)'});
row('var-empty', '--x: ;', {prop:'color', val:'var(--x, blue)'});
row('var-ws', '--x:   blue   ;', {prop:'color', val:'var(--x)'});
row('var-nested', '--a: var(--b); --b: green;', {prop:'color', val:'var(--a)'});
row('var-fallback-comma', null, {prop:'font-family', val:'var(--missing, a, b)'});
row('var-fallback-nested', null, {prop:'color', val:'var(--m, var(--n, red))'});
row('var-in-calc', '--w: 10px;', {prop:'width', val:'calc(var(--w) + 5px)'});
row('var-unit-px', '--n: 10;', {prop:'width', val:'calc(var(--n) * 1px)'});
row('var-whitespace-only', '--x: ;', {prop:'margin-top', val:'var(--x, 5px)'});
row('var-inherited', null, {prop:'color', val:'inherit'});
row('var-case', '--X: red;', {prop:'color', val:'var(--x)'});
row('var-numeric-echo', '--n: 42;', {prop:'opacity', val:'var(--n)'});
row('var-bad-decl', '--x: blue;; --y: red', {prop:'color', val:'var(--x)'});
row('var-empty-fallback', null, {prop:'margin-top', val:'var(--missing,)'});
document.getElementById('rec').textContent=out.join('\n');
</script></body></html>
