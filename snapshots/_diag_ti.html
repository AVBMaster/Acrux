<!doctype html><html><head><meta charset=utf-8><style>body{font:14px monospace;margin:0}
#t1{text-indent:20px;width:80px;background:#fdd}
#t2{text-indent:-10px;width:80px;background:#dfd}
#t3{text-indent:20%;width:80px;background:#ddf}
#t4{text-indent:2em;width:80px;background:#fdf}
#t5{text-indent:20px;text-align:right;width:80px;background:#ffd}
</style></head><body>
<div id=t1>the quick brown fox</div>
<div id=t2>the quick brown fox</div>
<div id=t3>the quick brown fox</div>
<div id=t4>the quick brown fox</div>
<div id=t5>the quick brown fox</div>
<script>
const g=id=>{const e=document.getElementById(id);const r=e.getBoundingClientRect();const s=getComputedStyle(e);return id+"="+Math.round(r.width)+"x"+Math.round(r.height)+" ti="+s.textIndent+" lines="+Math.round(r.height/20);};
document.body.appendChild(document.createTextNode(["t1","t2","t3","t4","t5"].map(g).join("#")));
</script></body></html>
