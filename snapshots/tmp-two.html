<!DOCTYPE html><html><head><style>
body{margin:0;padding:10px;background:#fff}
.b{width:60px;height:30px;background:#c0c0c0;margin-bottom:6px}
#x1{animation:f1 1s linear -400ms paused}
#x2{animation:f2 1s linear -400ms paused}
@keyframes f1{from{opacity:1}to{opacity:0}}
@keyframes f2{from{opacity:0.4}to{opacity:1}}
</style></head><body>
<div class="b" id="x1"></div>
<div class="b" id="x2"></div>
</body></html>
