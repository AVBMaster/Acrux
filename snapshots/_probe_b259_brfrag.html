<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;font:16px/20px Arial}#log{font:12px monospace;white-space:pre}</style></head>
<body><div id="stage" style="position:absolute;left:-4000px;top:0"></div><div id="log"></div><script>
var log=document.getElementById('log'),stage=document.getElementById('stage');
function emit(t){log.textContent+=t+'\n';}
var cases=[
 ['plain','<span id="s">a<br>b</span>'],
 ['bg','<span id="s" style="background:#fee">a<br>b</span>'],
 ['underline','<span id="s" style="text-decoration:underline">a<br>b</span>'],
 ['padding','<span id="s" style="padding:0 6px">a<br>b</span>'],
 ['pad-bg','<span id="s" style="padding:0 6px;background:#fee">a<br>b</span>'],
 ['br-first','<span id="s"><br>a</span>'],
 ['br-last','<span id="s">a<br></span>'],
 ['two-br','<span id="s">a<br><br>b</span>'],
 ['br-inside-child','<span id="s">a<em><br></em>b</span>'],
 ['sibling-br','<span id="s">a</span><br>'],
 ['br-with-text-after','<span id="s">ab<br>cd</span>'],
 ['trailing-space','<span id="s">aa  <br>bb</span>'],
 ['nested-break','<span id="s">a<span id="i">b</span><br>c</span>']
];
for(var i=0;i<cases.length;i++){
 stage.innerHTML='<div style="width:300px">'+cases[i][1]+'</div>';
 var s=stage.querySelector('#s'),r=s.getClientRects(),b=s.getBoundingClientRect();
 var parts=[];for(var j=0;j<r.length;j++)parts.push('['+Math.round(r[j].left+4000)+','+Math.round(r[j].top)+','+Math.round(r[j].width)+','+Math.round(r[j].height)+']');
 emit(cases[i][0]+' n='+r.length+' union=['+Math.round(b.left+4000)+','+Math.round(b.top)+','+Math.round(b.width)+','+Math.round(b.height)+'] '+parts.join(''));
}
stage.innerHTML='';
console.log(log.textContent);
</script></body></html>
