<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>b132 text-indent larger than the line</title>
<style>
body { font: 16px "Segoe UI", sans-serif; margin: 0; padding: 0; }
.box { width: 300px; background: rgb(240,240,240); margin-bottom: 8px; }
p { margin: 0; background: rgb(255,255,255); }
.t280 { text-indent: 280px; }
.t295 { text-indent: 295px; }
.t300 { text-indent: 100%; }
.toolong { text-indent: 200px; }
.nested { text-indent: 280px; }
span { background: rgb(255,220,220); }
</style>
</head>
<body>
<div class="box"><p class="t280" id="q1">EEEE first line</p></div>
<div class="box"><p class="t295" id="q2">IIII second line</p></div>
<div class="box"><p class="t300" id="q3">OOOO third line</p></div>
<div class="box"><p class="toolong" id="q4">WWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWW fourth line</p></div>
<div class="box"><p class="nested" id="q5"><span>EEEE</span> first line</p></div>
</body>
</html>
