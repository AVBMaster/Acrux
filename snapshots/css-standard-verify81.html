<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS Standard Verification Batch 81 - object-fit / object-position</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; font-size: 14px; }
h2 { background:#eee; padding:4px; margin:14px 0 6px; font-size:15px; }
.row { display:flex; gap:24px; flex-wrap:wrap; }
figure { margin:0; }
figcaption { text-align:center; font-size:12px; color:#333; }
img { display:block; background:#ddf; outline:1px solid #88a; }
.box { width:120px; height:80px; }
.cover { object-fit:cover; }
.contain { object-fit:contain; }
.fill { object-fit:fill; }
.none { object-fit:none; }
.sdown { object-fit:scale-down; }
.pos-r { object-position:right center; }
.pos-bl { object-position:left bottom; }
.pos-pct { object-position:25% 75%; }
</style>
</head>
