<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{font:12px monospace;margin:0}#log{white-space:pre}</style></head>
<body><div id="host"><i>1</i><i>2</i><i>3</i><i>4</i><i>5</i></div><div id="log"></div><script>
var log=document.getElementById('log'),lines=[];
function nth(sel){
 var st=document.createElement('style');st.textContent=sel+'{color:rgb(255,0,0)}';document.head.appendChild(st);
 var hits=[];var kids=document.querySelectorAll('#host i');
 for(var i=0;i<kids.length;i++){if(getComputedStyle(kids[i]).color=='rgb(255, 0, 0)')hits.push(i+1);}
 st.remove();return sel+' -> ['+hits.join(',')+']';}
['i:nth-child(3)','i:nth-child(1n+3)','i:nth-child(0n+3)','i:nth-child(0n + 3)','i:nth-child(0)','i:nth-child(2n+0)',
 'i:nth-child(-n+2)','i:nth-child(-n + 2)','i:nth-child(-1n+2)','i:nth-child(n+2)','i:nth-child(4)','i:nth-child(-n+4)'
].forEach(function(s){lines.push(nth(s));});
log.textContent=lines.join('\n');
console.log(lines.join(' ||| '));
</script></body></html>
