<!doctype html><html><head><meta charset=utf-8><style>
body{font:12px monospace;margin:4px}
.row{white-space:pre;font:12px monospace}
#o1{width:80px;height:30px;border:1px solid #ccc;outline:3px solid red;outline-offset:4px;background:#fff}
#o2{width:80px;height:30px;border:1px solid #ccc;outline:2px dashed blue;outline-offset:0;background:#fff}
#d1{width:120px;height:30px;text-decoration:underline;text-decoration-color:red;text-decoration-thickness:4px;font-size:16px}
#d2{width:120px;height:30px;text-decoration:line-through wavy green 3px;font-size:16px}
#d3{width:140px;height:30px;text-decoration:overline underline;text-decoration-style:dotted;font-size:16px}
#s1{width:140px;height:30px;text-shadow:2px 2px 0 red, -2px -2px 0 blue;font-size:18px}
#s2{width:140px;height:30px;text-shadow:0 0 4px green;font-size:18px}
</style></head><body>
<div id=out></div>
<div id=o1>outline</div>
<div id=o2>outline2</div>
<div id=d1>underline</div>
<div id=d2>linethrough</div>
<div id=d3>overunder</div>
<div id=s1>shadow2</div>
<div id=s2>shadowblur</div>
<script>
const out=document.getElementById("out");
function row(t){const d=document.createElement("div");d.className="row";d.textContent=t;out.appendChild(d);}
for(const id of ["o1","o2","d1","d2","d3","s1","s2"]){
  const e=document.getElementById(id);const s=getComputedStyle(e);const r=e.getBoundingClientRect();
  row("L|"+id+"|"+Math.round(r.width)+"x"+Math.round(r.height)+"@"+Math.round(r.left)+","+Math.round(r.top)+"|oo="+(s.outlineOffset||"-")+"|os="+(s.outlineStyle||"-")+"|tdc="+(s.textDecorationColor||"-")+"|tds="+(s.textDecorationStyle||"-")+"|tdt="+(s.textDecorationThickness||"-"));
}
</script></body></html>
