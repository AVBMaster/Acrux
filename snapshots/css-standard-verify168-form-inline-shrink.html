<!DOCTYPE html><html><head><meta charset="utf-8"><title>b168 form control shrink-to-fit</title><style>
body{margin:8px;font:16px/20px "Segoe UI",Arial,sans-serif;color:#111}
.row{margin:4px 0;background:#eef3ff}
.ib{display:inline-block;background:#ffd;padding:0 2px}
</style></head><body>
<div class="row" id="r1">A <span class="ib" id="s1">ab</span> B</div>
<div class="row" id="r2">A <select id="s2"><option>a</option></select> B</div>
<div class="row" id="r3">A <select id="s3" size="2"><option>alpha</option><option>beta</option></select> B</div>
<div class="row" id="r4">A <input id="s4" value="abc"> B</div>
<div class="row" id="r5">A <input id="s6" type="checkbox"> B</div>
<div class="row" id="s7r">A <textarea id="s7">hello</textarea> B</div>
<div class="row" id="r6">A <button id="s8">ok</button> B</div>
<div class="row" id="r7">A <progress id="s9" value="50" max="100"></progress> B</div>
</body></html>
