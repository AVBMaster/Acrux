<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#fff;font-family:Arial;}
.a{position:absolute;left:0;width:120px;height:30px;font-size:20px;background:rgb(255,0,0);}
.b{position:absolute;left:0;width:120px;height:30px;font-size:20px;background:linear-gradient(to right, rgb(255,0,0), rgb(0,0,255));}
.c{position:absolute;left:0;width:120px;height:30px;font-size:20px;background:rgb(0,255,0);background-clip:text;color:transparent;}
#x{top:0} #y{top:40px} #z{top:80px}
</style></head><body>
<div class="a" id="x">HELLO</div>
<div class="b" id="y">HELLO</div>
<div class="c" id="z">HELLO</div>
</body></html>
