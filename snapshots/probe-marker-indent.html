<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#fff;font-family:Arial;font-size:16px;}
ul{margin:0;padding-left:60px;}
li.img{list-style-image:url("quad40.png");}
#hi{width:200px;font-size:14px;text-indent:hanging 20px;margin-top:50px;}
#ni{width:200px;font-size:14px;margin-top:8px;}
</style></head><body>
<ul>
<li class="img">image marker item</li>
<li class="img">second item</li>
</ul>
<div id="hi">hanging indent pulls the first line to the left edge and the rest of the paragraph is indented</div>
<div id="ni">normal paragraph with no indent at all so the two lines start at the same x position</div>
</body></html>
