<!doctype html>
<html><head><meta charset="utf-8"><title>b309 sets sweep</title></head>
<body>
<div id="host"></div>
<script>
// sets
function build() {
const host = document.createElement('div');
document.body.appendChild(host);
let rows = [];
const cases = [["position-try-order","normal"],["position-try-order","most-width"],["position-try-order","most-height"],["position-try-order","most-inline-size"],["position-try-order","most-block-size"],["position-try-order","least-width"],["position-try-order","least-height"],["position-try-order","least-inline-size"],["position-try-order","least-block-size"],["position-try-order","MOST-WIDTH"],["position-try-order","most-inline-size most-block-size"],["position-try-order","most-width most-height"],["dominant-baseline","TEXT-BEFORE-EDGE"],["dominant-baseline","text-before-edge"],["dominant-baseline","text-after-edge"],["dominant-baseline","reset-size"],["dominant-baseline","no-change"],["dominant-baseline","use-script"],["dominant-baseline","auto"],["dominant-baseline","middle"],["dominant-baseline","central"],["dominant-baseline","baseline"],["dominant-baseline","before-edge"],["dominant-baseline","after-edge"],["-webkit-app-region","no-drag"],["-webkit-app-region","drag"],["-webkit-app-region","NO-DRAG"],["-webkit-app-region","none"],["-webkit-app-region","auto"],["-webkit-app-region","no-drag drag"],["-webkit-app-region","foo"],["font-size-adjust","ex-height 0.5"],["font-size-adjust","cap-height 0.8"],["font-size-adjust","ch-width 0.5"],["font-size-adjust","ic-height 0.5"],["font-size-adjust","bu-scale 0.5"],["font-size-adjust","ex-height 0"],["font-size-adjust","cap-height 0"],["font-size-adjust","ex-height -1"],["font-size-adjust","EX-HEIGHT 0.5"],["font-size-adjust","cap-height calc(0.5)"],["font-size-adjust","cap-height 50%"],["font-size-adjust","0.5 cap-height"],["font-size-adjust","cap-height from-font"],["font-size-adjust","ex-height calc(1px/0)"]];
for (let i = 0; i < cases.length; i++) {
const el = document.createElement('div');
host.appendChild(el);
  if (cases[i][1] !== '~') el.style.setProperty(cases[i][0], cases[i][1]);
  rows.push(i + '|' + cases[i][0] + '|' + cases[i][1]
      + '|sup=' + (cases[i][1] === '~' ? '-' : (CSS.supports(cases[i][0], cases[i][1]) ? 1 : 0))
      + '|echo=' + el.style.getPropertyValue(cases[i][0])
      + '|comp=' + getComputedStyle(el).getPropertyValue(cases[i][0]));
}

// The same three questions on a CHILD of the box the page wrote on: a property that inherits
// answers the parent's value, and one that does not answers its initial.
const childRows = [];
for (const [name, value] of [['-webkit-app-region', 'drag'],
                             ['dominant-baseline', 'text-before-edge'],
                             ['position-try-order', 'most-inline-size'],
                             ['font-size-adjust', 'cap-height 0.8']]) {
  const parent = document.createElement('div');
  parent.style.setProperty(name, value);
  const child = document.createElement('div');
  parent.appendChild(child);
  host.appendChild(parent);
  childRows.push('child|' + name + '|echo=' + parent.style.getPropertyValue(name)
      + '|childComp=' + getComputedStyle(child).getPropertyValue(name));
}
rows = rows.concat(childRows);

document.body.insertAdjacentHTML('beforeend',
    '<pre id="record" style="font:10px/1.35 monospace;white-space:pre-wrap">'
    + rows.join('\n') + '</pre>');
console.log(rows.join('\n'));
host.remove();
}
build();
</script>
</body></html>
