<!doctype html><html><head><meta charset="utf-8"><style>body{margin:8px;font:14px monospace}</style></head><body><div id="out"></div>
<script>
const out=[];
function L(t,v){out.push("L~"+t+"~"+v);}
const f=document.createElement("div");
f.style.cssText="display:flex;width:300px";
[1,3].forEach(g=>{const c=document.createElement("div");c.style.flexGrow=g;c.style.flexBasis="0";f.appendChild(c);});
document.body.appendChild(f);
const a=f.children[0].getBoundingClientRect().width, b=f.children[1].getBoundingClientRect().width;
L("grow-1-3",Math.round(a)+"_and_"+Math.round(b));
f.remove();
document.getElementById("out").textContent=out.join("\n");
</script></body></html>
