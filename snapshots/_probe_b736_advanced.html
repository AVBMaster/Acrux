<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:8px;font:14px monospace}
@layer base, components;
@layer base{.layered{color:red}}
@layer components{.layered{color:blue}}
@counter-style thumbs{system:cyclic;symbols:"👍" "👎"}
.counted{list-style-type:thumbs}
</style></head><body><div id="out"></div>
<script>
const out=[];
function L(t,v){out.push("L~"+t+"~"+String(v).split(" ").join("_"));}
function rect(el){const r=el.getBoundingClientRect();return Math.round(r.width)+"x"+Math.round(r.height);}
// @layer
const ly=document.createElement("div");ly.className="layered";document.body.appendChild(ly);
L("layer-color",getComputedStyle(ly).color.split(" ").join("_"));
ly.remove();
// subgrid
const sg=document.createElement("div");
sg.style.cssText="display:grid;grid-template-columns:1fr 1fr;gap:5px";
const sgInner=document.createElement("div");
sgInner.style.cssText="display:grid;grid-template-columns:subgrid;grid-column:span 2";
const sc1=document.createElement("div");sc1.textContent="A";sgInner.appendChild(sc1);
const sc2=document.createElement("div");sc2.textContent="B";sgInner.appendChild(sc2);
sg.appendChild(sgInner);document.body.appendChild(sg);
L("subgrid-w1",Math.round(sc1.getBoundingClientRect().width));
L("subgrid-w2",Math.round(sc2.getBoundingClientRect().width));
sg.remove();
// @counter-style
const ol=document.createElement("ol");ol.className="counted";
ol.innerHTML="<li>One</li><li>Two</li>";
document.body.appendChild(ol);
L("counter-style",getComputedStyle(ol.children[0]).listStyleType);
ol.remove();
// font-variant-numeric
function gc(tag,css,prop){
  const d=document.createElement("div");d.setAttribute("style",css);document.body.appendChild(d);
  const v=getComputedStyle(d).getPropertyValue(prop).trim();
  L(tag,prop+"="+(v===""?"(empty)":v.split(" ").join("_")));d.remove();
}
gc("fvn-normal","font-variant-numeric:normal","font-variant-numeric");
gc("fvn-tabular","font-variant-numeric:tabular-nums","font-variant-numeric");
gc("fvn-proportional","font-variant-numeric:proportional-nums","font-variant-numeric");
gc("fvn-lining","font-variant-numeric:lining-nums","font-variant-numeric");
gc("fvn-oldstyle","font-variant-numeric:oldstyle-nums","font-variant-numeric");
gc("fvn-slashed","font-variant-numeric:slashed-zero","font-variant-numeric");
gc("fvn-diagonal","font-variant-numeric:diagonal-fractions","font-variant-numeric");
gc("fvn-stacked","font-variant-numeric:stacked-fractions","font-variant-numeric");
gc("fvn-ordinal","font-variant-numeric:ordinal","font-variant-numeric");
// scroll-margin
gc("sm-top","scroll-margin-top:10px","scroll-margin-top");
gc("sm-all","scroll-margin:5px 10px 15px 20px","scroll-margin");
// scroll-padding
gc("sp-top","scroll-padding-top:10px","scroll-padding-top");
gc("sp-all","scroll-padding:5px 10px","scroll-padding");
// gap shorthand in flex
gc("gap-flex","display:flex;gap:10px","gap");
gc("gap-grid","display:grid;gap:10px 20px","gap");
// place-items
gc("pi-center","display:grid;place-items:center","place-items");
gc("pc-center","display:grid;place-content:center","place-content");
gc("ps-center","display:grid;place-self:center","place-self");
document.getElementById("out").textContent=out.join("\n");
</script></body></html>
