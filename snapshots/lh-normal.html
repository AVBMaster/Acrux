<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
html, body { margin: 0; padding: 4px; }
p { margin: 0; }
.f { font-family: sans-serif; font-size: 16px; }
.g { font-family: Arial, sans-serif; font-size: 16px; }
.h { font-family: serif; font-size: 16px; }
.i { font-family: monospace; font-size: 16px; }
.j { font-family: sans-serif; font-size: 32px; }
.k { font-size: 16px; }
</style></head><body>
<p class="f">sans normal</p>
<p class="g">arial normal</p>
<p class="h">serif normal</p>
<p class="i">mono normal</p>
<p class="j">sans 32 normal</p>
<p class="k">default normal</p>
</body></html>
