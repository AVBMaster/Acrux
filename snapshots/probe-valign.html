<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body { margin: 0; padding: 0; font-family: Arial, sans-serif; font-size: 16px; line-height: 20px; }
h2 { margin: 0; font-size: 13px; }
div { background: rgb(238,238,238); }
.lh-len { line-height: 30px; }
.lh-num { line-height: 2; }
.lh-pct { line-height: 150%; }
.lh-norm { line-height: normal; }
#g4 { font-size: 30px; }
#g4 span { font-size: 12px; }
.pct { vertical-align: 50%; background: rgb(255,0,0); }
.tt { vertical-align: text-top; background: rgb(0,255,0); }
.tb { vertical-align: text-bottom; background: rgb(0,0,255); }
.mid { vertical-align: middle; background: rgb(255,255,0); }
.base { background: rgb(255,0,255); }
.top { vertical-align: top; background: rgb(0,255,255); }
.bot { vertical-align: bottom; background: rgb(128,0,255); }
.sub { vertical-align: sub; background: rgb(0,128,255); }
</style>
</head>
<body>
<h2>lh</h2>
<div class="lh-len">line</div>
<div class="lh-num">line</div>
<div class="lh-pct">line</div>
<div class="lh-norm">line</div>
<h2>g4</h2>
<div id="g4">X<span class="base">n</span><span class="pct">p</span><span class="tt">t</span><span class="tb">b</span><span class="mid">m</span><span class="top">T</span><span class="bot">B</span><span class="sub">s</span>X</div>
</body>
</html>
