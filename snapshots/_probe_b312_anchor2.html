<!doctype html>
<html><head><meta charset="utf-8"><title>b312 anchor 2</title></head>
<body>
<div id="host"></div>
<script>
// b312_anchor_2
function build() {
const host = document.createElement('div');
document.body.appendChild(host);
const rows = [];
const cases = [["width","calc(anchor-size(width) + 1em)"],["width","calc(1em + anchor-size(width))"],["width","calc(anchor-size(width) + 10px + 1em)"],["width","calc(anchor-size(width) - 10px)"],["width","calc(10px - anchor-size(width))"],["width","calc(anchor-size(width) + anchor-size(width))"],["width","calc(2 * anchor-size(width))"],["width","calc(anchor-size(width))"],["width","anchor-size(width, 10px)"],["width","anchor-size(self-inline, 10px)"],["width","anchor-size(width width)"],["width","anchor-size(width 10px)"],["width","anchor-size(--a, 10px)"],["width","anchor-size(--a width, 10px)"],["width","anchor-size(self-end)"],["width","anchor-size(inline)"],["width","anchor-size(block)"],["width","anchor-size(top)"],["width","anchor-size(left)"],["margin-left","anchor-size(width)"],["padding","anchor-size(width)"],["height","calc(anchor-size(height) + 10px)"],["width","min(anchor-size(width), 100px)"],["width","max(10px, anchor-size(width))"],["width","clamp(10px, anchor-size(width), 100px)"],["width","calc(anchor-size(width) + 10px + anchor-size(height))"]];
for (let i = 0; i < cases.length; i++) {
const el = document.createElement('div');
host.appendChild(el);
  el.style.setProperty(cases[i][0], cases[i][1]);
  rows.push(i + '|' + cases[i][0] + '|' + cases[i][1]
      + '|sup=' + (CSS.supports(cases[i][0], cases[i][1]) ? 1 : 0)
      + '|echo=' + el.style.getPropertyValue(cases[i][0])
      + '|comp=' + getComputedStyle(el).getPropertyValue(cases[i][0]));
}
document.body.insertAdjacentHTML('beforeend',
    '<pre id="record" style="font:10px/1.35 monospace;white-space:pre-wrap">'
    + rows.join('\n') + '</pre>');
console.log(rows.join('\n'));
host.remove();
}
build();
</script>
</body></html>
