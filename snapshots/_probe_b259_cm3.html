<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0}
div{width:40px;height:20px;margin:2px}
#a{background:color-mix(in hsl, hsl(0 100% 50%), hsl(240 100% 50%))}
#b{background:color-mix(in hsl, rgb(255, 0, 0), rgb(0, 0, 255))}
#c{background:color-mix(in srgb, rgb(255, 0, 0), rgb(0, 0, 255))}
</style></head><body><div id="a"></div><div id="b"></div><div id="c"></div></body></html>
