<!doctype html><html><body><pre id=rec></pre><script>
const out=[];
function t(p,v){const box=document.createElement('div');document.body.appendChild(box);box.style.setProperty(p,v);out.push(p+'='+JSON.stringify(v)+' || sup='+CSS.supports(p,v)+' || echo='+JSON.stringify(box.style.getPropertyValue(p))+' || comp='+JSON.stringify(getComputedStyle(box).getPropertyValue(p)));box.remove();}
// text-decoration longhands
t('text-decoration-line','none');
t('text-decoration-line','underline');
t('text-decoration-line','overline');
t('text-decoration-line','line-through');
t('text-decoration-line','underline overline');
t('text-decoration-line','underline line-through');
t('text-decoration-line','overline line-through underline');
t('text-decoration-line','bogus');
t('text-decoration-line','underline overline line-through');
t('text-decoration-style','solid');
t('text-decoration-style','double');
t('text-decoration-style','dotted');
t('text-decoration-style','dashed');
t('text-decoration-style','wavy');
t('text-decoration-style','bogus');
t('text-decoration-color','red');
t('text-decoration-color','transparent');
t('text-decoration-color','currentcolor');
t('text-decoration-color','rgba(0,0,0,0.5)');
t('text-decoration-color','bogus');
t('text-decoration-thickness','auto');
t('text-decoration-thickness','from-font');
t('text-decoration-thickness','1px');
t('text-decoration-thickness','2px');
t('text-decoration-thickness','10%');
t('text-decoration-thickness','-1px');
t('text-decoration-thickness','bogus');
t('text-decoration-skip-ink','none');
t('text-decoration-skip-ink','auto');

// text-underline-offset and position
t('text-underline-offset','auto');
t('text-underline-offset','2px');
t('text-underline-offset','0.5em');
t('text-underline-offset','bogus');
t('text-underline-position','auto');
t('text-underline-position','from-font');
t('text-underline-position','under');
t('text-underline-position','left');
t('text-underline-position','right');
t('text-underline-position','under right');
t('text-underline-position','left under');
t('text-underline-position','bogus');
// animation longhands
t('animation-name','none');
t('animation-name','slide');
t('animation-name','slide, fade');
t('animation-name','bogus');
t('animation-duration','0s');
t('animation-duration','1s');
t('animation-duration','0.5s, 1s');
t('animation-duration','-1s');

t('animation-timing-function','ease');

t('animation-timing-function','bogus');
t('animation-delay','0s');
t('animation-delay','0.5s');
t('animation-delay','-1s');
t('animation-delay','bogus');
t('animation-iteration-count','1');

t('animation-iteration-count','2.5');
t('animation-iteration-count','-1');
t('animation-iteration-count','bogus');

t('animation-direction','reverse');

t('animation-direction','alternate-reverse');

t('animation-fill-mode','bogus');

console.log(out.join('\n'));
</script></body></html>
