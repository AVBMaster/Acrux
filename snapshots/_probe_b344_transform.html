<!doctype html><html><body><pre id=rec></pre><script>
const out=[];
function t(p,v){const box=document.createElement('div');document.body.appendChild(box);box.style.setProperty(p,v);out.push(p+'='+JSON.stringify(v)+' || sup='+CSS.supports(p,v)+' || echo='+JSON.stringify(box.style.getPropertyValue(p))+' || comp='+JSON.stringify(getComputedStyle(box).getPropertyValue(p)));box.remove();}
// transform
t('transform','none');
t('transform','translate(10px, 20px)');
t('transform','translateX(10px)');
t('transform','translateY(10px)');
t('transform','scale(2)');
t('transform','scale(2, 3)');
t('transform','rotate(45deg)');
t('transform','skewX(30deg)');
t('transform','skewY(30deg)');
t('transform','matrix(1, 0, 0, 1, 10, 20)');
t('transform','translate(10px) rotate(45deg)');
t('transform','bogus');
t('transform','translate()');
t('transform','rotate()');
t('transform','scale()');
t('transform-origin','center');
t('transform-origin','left top');
t('transform-origin','10px 20px');
t('transform-origin','50% 50% 0');
t('transform-origin','bogus');
t('transform-origin','center center center');
// filter
t('filter','none');
t('filter','blur(5px)');
t('filter','brightness(1.5)');
t('filter','brightness(0)');
t('filter','contrast(200%)');
t('filter','grayscale(100%)');
t('filter','sepia(100%)');
t('filter','saturate(200%)');
t('filter','invert(100%)');
t('filter','opacity(50%)');
t('filter','drop-shadow(2px 2px 2px black)');
t('filter','hue-rotate(90deg)');
t('filter','blur(5px) brightness(1.5)');
t('filter','bogus');
t('filter','blur()');
// mask
t('mask','none');
t('mask','url(a.png)');
t('mask','url(a.png) center / 100px no-repeat');
t('mask','bogus');
t('mask-image','none');
t('mask-image','url(a.png)');
t('mask-image','linear-gradient(red,blue)');
t('mask-mode','match-source');
t('mask-mode','alpha');
t('mask-mode','luminance');
t('mask-mode','bogus');
t('mask-repeat','no-repeat');
t('mask-repeat','repeat-x');
t('mask-repeat','round');
t('mask-repeat','space');
t('mask-repeat','bogus');
t('mask-position','center');
t('mask-position','10px 20px');
t('mask-position','bogus');
t('mask-size','auto');
t('mask-size','100px');
t('mask-size','100px 50px');
t('mask-size','cover');
t('mask-size','contain');
t('mask-size','bogus');
t('mask-clip','border-box');
t('mask-clip','padding-box');
t('mask-clip','content-box');
t('mask-clip','no-clip');
t('mask-clip','text');
t('mask-clip','bogus');
t('mask-composite','add');
t('mask-composite','subtract');
t('mask-composite','intersect');
t('mask-composite','exclude');
t('mask-composite','bogus');
// clip-path
t('clip-path','none');
t('clip-path','inset(10px)');
t('clip-path','circle(50%)');
t('clip-path','circle(50% at 50% 50%)');
t('clip-path','ellipse(50% 50%)');
t('clip-path','polygon(50% 0%, 0% 100%, 100% 100%)');
t('clip-path','path("M10 10 L 20 20")');
t('clip-path','bogus');
document.getElementById('rec').textContent=out.join('\n');
console.log(out.join('\n'));
</script></body></html>
