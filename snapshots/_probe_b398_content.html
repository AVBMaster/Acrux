<!doctype html><html><body><pre id=rec></pre><script>
const out=[];

t('content','close-quote');
t('content','counter(x)');

t('content','bogus');
t('counter-reset','none');

t('counter-reset','x 5');
t('counter-reset','x y');
t('counter-increment','none');
