<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  body { font-family: Arial; font-size: 24px; margin: 8px; }
  p { margin: 4px 0; }
  .c1 { text-decoration: underline #e33; }
  .c2 { text-decoration: underline #e33; text-decoration-thickness: 6px; }
</style></head><body>
<p style="text-decoration: underline #e33; text-decoration-thickness: 6px">V1 bothInline</p>
<p class="c1" style="text-decoration-thickness: 6px">V2 classColor+inlineThick</p>
<p class="c2">V3 allInClass</p>
<p style="text-decoration-line: underline; text-decoration-color: #e33; text-decoration-thickness: 6px">V4 allLonghand</p>
<p class="c1" style="text-underline-offset: 4px">V5 classColor+inlineOffset</p>
<p class="c1" style="text-decoration-style: dashed">V6 classColor+inlineStyle</p>
</body></html>
