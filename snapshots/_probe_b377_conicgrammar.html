<!doctype html><html><body><pre id=rec></pre><script>
const out=[];
function t(v){const el=document.createElement('div');document.body.appendChild(el);el.style.cssText='';el.style.backgroundImage=v;out.push(v+' -> sup='+CSS.supports('background-image',v)+' echo='+JSON.stringify(el.style.backgroundImage));el.remove();}
// conic prologue grammar edges
t('conic-gradient(from 10deg 20deg, red, blue)');
t('conic-gradient(from red, blue)');
t('conic-gradient(from, red, blue)');
t('conic-gradient(at, red, blue)');
t('conic-gradient(from 10deg from 20deg, red, blue)');
t('conic-gradient(10deg, red, blue)');
t('conic-gradient(circle, red, blue)');
t('conic-gradient(from 10deg at, red, blue)');
document.getElementById('rec').textContent=out.join('\n');
console.log(out.join('\n'));
</script></body></html>
