<!doctype html><html><body><pre id=rec></pre><script>
const out=[];
function s(label,el,props){ try{ const cs=getComputedStyle(el); const parts=[];
  for(const p of props) parts.push(p+'='+cs.getPropertyValue(p));
  out.push(label+' '+parts.join(' | ')); }catch(e){ out.push(label+' ERR '+e.message); } }
function mk(css){const d=document.createElement('div');d.style.cssText=css;document.body.appendChild(d);return d;}
function sup(prop,val){ try{ return CSS.supports(prop,val)?'Y':'N'; }catch(e){ return 'ERR'; } }
// b435: fragmentation/break + multicol + ruby
s('break-before-page', mk('break-before:page'), ['break-before']);
s('break-after-column', mk('break-after:column'), ['break-after']);
s('break-inside-avoid', mk('break-inside:avoid'), ['break-inside']);
s('break-before-bogus', mk('break-before:bogus'), ['break-before']);
s('break-inside-region', mk('break-inside:avoid-region'), ['break-inside']);
s('columns-sh', mk('columns:3'), ['column-count','column-width']);
s('columns-wgap', mk('columns:2 40px'), ['column-count','column-width']);
s('column-count', mk('column-count:5'), ['column-count']);
s('column-width', mk('column-width:120px'), ['column-width']);
s('column-gap', mk('column-gap:30px'), ['column-gap']);
s('column-rule', mk('column-rule:2px solid red'), ['column-rule']);
s('column-span', mk('column-span:all'), ['column-span']);
s('column-fill-bal', mk('column-fill:balance'), ['column-fill']);
s('column-fill-auto', mk('column-fill:auto'), ['column-fill']);
s('ruby-align', mk('ruby-align:center'), ['ruby-align']);
s('ruby-position', mk('ruby-position:over'), ['ruby-position']);
s('ruby-merge', mk('ruby-merge:collapse'), ['ruby-merge']);
out.push('SUP break-before:page = '+sup('break-before','page'));
out.push('SUP break-before:bogus = '+sup('break-before','bogus'));
out.push('SUP columns:3 = '+sup('columns','3'));
out.push('SUP column-span:all = '+sup('column-span','all'));
out.push('SUP column-fill:balance = '+sup('column-fill','balance'));
out.push('SUP ruby-align:center = '+sup('ruby-align','center'));
document.getElementById('rec').textContent=out.join('\n');
</script></body></html>
