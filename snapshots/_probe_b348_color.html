<!doctype html><html><body><pre id=rec></pre><script>
const out=[];
function t(p,v){const box=document.createElement('div');document.body.appendChild(box);box.style.setProperty(p,v);out.push(p+'='+JSON.stringify(v)+' || sup='+CSS.supports(p,v)+' || echo='+JSON.stringify(box.style.getPropertyValue(p))+' || comp='+JSON.stringify(getComputedStyle(box).getPropertyValue(p)));box.remove();}
// color values
t('color','red');
t('color','#f00');
t('color','#ff0000');
t('color','#ff000080');
t('color','rgb(255,0,0)');
t('color','rgb(255 0 0)');
t('color','rgb(255, 0, 0, 0.5)');
t('color','rgba(255, 0, 0, 0.5)');
t('color','hsl(0, 100%, 50%)');
t('color','hsl(120deg 100% 50%)');
t('color','hsla(0, 100%, 50%, 0.5)');
t('color','lab(50% 40 59.5)');
t('color','oklab(0.5 0.1 0.1)');
t('color','lch(50% 70 40)');
t('color','oklch(0.5 0.1 40)');
t('color','color(display-p3 1 0 0)');
t('color','color(srgb 1 0.5 0)');
t('color','color-mix(in srgb, red, blue)');
t('color','transparent');
t('color','currentcolor');
t('color','inherit');
t('color','bogus');
t('background-color','#123456');
t('background-color','rgb(18 52 86 / 50%)');
document.getElementById('rec').textContent=out.join('\n');
console.log(out.join('\n'));
</script></body></html>
