<!doctype html>
<html><head><meta charset="utf-8"><title>b322 color-mix computed</title></head>
<body>
<pre id="record" style="font:10px/1.35 monospace;white-space:pre-wrap"></pre>
<script>
const host=document.createElement('div');document.body.appendChild(host);
const rows=[];
const cases=[
 'color-mix(in srgb, red, blue)',
 'color-mix(in srgb, red 30%, blue)',
 'color-mix(in srgb, red 30%, blue 70%)',
 'color-mix(in srgb, red 50%, blue)',
 'color-mix(in srgb, red, blue 40%)',
 'color-mix(in srgb, rgb(255 0 0), rgb(0 0 255))',
 'color-mix(in srgb, #f00, #00f)',
 'color-mix(in srgb-linear, red, blue)',
 'color-mix(in hsl, red, blue)',
 'color-mix(in hsl longer hue, red, blue)',
 'color-mix(in hwb, red, blue)',
 'color-mix(in lab, red, blue)',
 'color-mix(in lch, red, blue)',
 'color-mix(in oklab, red 30%, blue)',
 'color-mix(in oklch, red, blue)',
 'color-mix(in oklch longer hue, red 20%, blue)',
 'color-mix(in srgb, red, blue, green)',
 'color-mix(in srgb, red)',
 'color-mix(in bogus, red, blue)',
 'color-mix(in srgb, red 120%, blue)',
 'color-mix(in srgb, transparent, blue)',
 'color-mix(in srgb, currentcolor, blue)'];
for (const c of cases){
const el=document.createElement('div'); host.appendChild(el);
el.style.color=c;
const spec=el.style.getPropertyValue('color');
const comp=getComputedStyle(el).getPropertyValue('color');
rows.push(c+' || spec='+spec+' || comp='+comp);
el.remove();}
document.getElementById('record').textContent=rows.join('\n');
console.log(rows.join('\n'));
</script></body></html>
