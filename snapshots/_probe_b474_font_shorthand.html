<!doctype html><html><body><pre id=rec></pre><script>
const out=[];
function s(label,css,props){ try{ const d=document.createElement('div'); d.style.cssText=css;
  document.body.appendChild(d); const cs=getComputedStyle(d); const parts=[];
  for(const p of props) parts.push(p+'='+cs.getPropertyValue(p));
  out.push(label+' '+parts.join(' | ')); d.remove(); }
  catch(e){ out.push(label+' ERR '+e.message); } }
// b474: font shorthand detailed
s('fs-basic','font:bold 16px serif',['font-style','font-weight','font-size','line-height','font-family']);
s('fs-italic','font:italic 16px serif',['font-style','font-weight','font-size','font-family']);
s('fs-oblique','font:oblique 16px serif',['font-style','font-size','font-family']);
s('fs-weight','font:300 16px serif',['font-weight','font-size','font-family']);
s('fs-weight-900','font:900 16px serif',['font-weight','font-size','font-family']);
s('fs-variant','font:small-caps 16px serif',['font-variant','font-size','font-family']);
s('fs-stretch','font:condensed 16px serif',['font-stretch','font-size','font-family']);
s('fs-lh','font:16px/1.5 serif',['font-size','line-height','font-family']);
s('fs-lh-px','font:16px/24px serif',['font-size','line-height','font-family']);
s('fs-lh-em','font:16px/2em serif',['font-size','line-height','font-family']);
s('fs-lh-num','font:16px/2 serif',['font-size','line-height','font-family']);
s('fs-multi-family','font:16px Arial, sans-serif',['font-size','font-family']);
s('fs-quoted','font:16px "Times New Roman"',['font-size','font-family']);
s('fs-caption','font:caption',['font-size','font-family']);
s('fs-menu','font:menu',['font-size','font-family']);
out.push('SUP font:italic bold 16px/1.5 serif = '+(()=>{try{return CSS.supports('font','italic bold 16px/1.5 serif')?'Y':'N';}catch(e){return 'ERR';}})());
out.push('SUP font:caption = '+(()=>{try{return CSS.supports('font','caption')?'Y':'N';}catch(e){return 'ERR';}})());
out.push('SUP font:16px/24px serif = '+(()=>{try{return CSS.supports('font','16px/24px serif')?'Y':'N';}catch(e){return 'ERR';}})());
out.push('SUP font:300 16px serif = '+(()=>{try{return CSS.supports('font','300 16px serif')?'Y':'N';}catch(e){return 'ERR';}})());
document.getElementById('rec').textContent=out.join('\n');
</script></body></html>
