<!doctype html><html><head><meta charset=utf-8><style>
body{font:14px monospace;margin:0}
#cw{container-type:inline-size;container-name:card;width:200px}
#cw>div{color:initial}
@container card (min-width:150px){#cw>div{color:red}}
@container (min-width:150px){#cn>p{color:green}}
#cn{container-type:inline-size;width:180px}
#cn>p{color:initial}
</style></head><body><meta charset=utf-8>
<div id=cw><div>cwchild</div></div>
<div id=cn><p>cnchild</p></div>
<script>
const hex=c=>{const m=/rgb\((\d+), (\d+), (\d+)/.exec(c);return m?"#"+m.slice(1).map(n=>(+n).toString(16).padStart(2,"0")).join(""):"init";};
document.body.appendChild(document.createTextNode(
 "cw="+hex(getComputedStyle(document.querySelector("#cw>div")).color)+
 "#cn="+hex(getComputedStyle(document.querySelector("#cn>p")).color)));
</script></body></html>
