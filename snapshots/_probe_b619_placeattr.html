<!doctype html><html><head><meta charset="utf-8"><style>
body{font:12px monospace;margin:8px}
.row{white-space:pre;font:12px monospace}
.c{display:grid;width:100px;height:60px;border:1px solid #999}
</style></head><body>
<div id="out"></div>
<script>
const out=[];
function probe(html,prop){
  const host=document.createElement("div");host.className="c";
  host.setAttribute("style",html);
  document.body.appendChild(host);
  const g=n=>getComputedStyle(host).getPropertyValue(n);
  out.push(["L",html,"ac="+g("align-content"),"jc="+g("justify-content"),"pc="+g("place-content")].join("~"));
  host.remove();
}
probe("place-content:space-between center");
probe("place-content:space-between");
probe("align-content:space-between;justify-content:center");
document.getElementById("out").textContent=out.join("\n");
</script></body></html>
