<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>b139 symbolic marker box rule</title>
<style>
body { font: 16px "Segoe UI", sans-serif; margin: 0; padding: 0; }
.pm { display: list-item; list-style-position: inside; margin: 0 0 3px 90px; padding: 0; background: rgb(238,238,238); }
.pm span { background: rgb(255,200,200); }
.disc { list-style-type: disc; }
.circle { list-style-type: circle; }
.square { list-style-type: square; }
.s13 { font-size: 13px; }
.s20 { font-size: 20px; }
.s32 { font-size: 32px; }
.qmark { list-style-type: "\2022"; }
.mArial::marker { font-family: Arial; }
.mSmall::marker { font-size: 8px; }
.mBig::marker { font-size: 24px; }
</style>
</head>
<body>
<div class="pm disc" id="p1"><span>A</span></div>
<div class="pm circle" id="p2"><span>A</span></div>
<div class="pm square" id="p3"><span>A</span></div>
<div class="pm disc s13" id="p4"><span>A</span></div>
<div class="pm disc s20" id="p5"><span>A</span></div>
<div class="pm disc s32" id="p6"><span>A</span></div>
<div class="pm qmark" id="p7"><span>A</span></div>
<div class="pm disc mArial" id="p8"><span>A</span></div>
<div class="pm disc mSmall" id="p9"><span>A</span></div>
<div class="pm disc mBig" id="p10"><span>A</span></div>
<div class="pm disc mBig s32" id="p11"><span>A</span></div>
<div class="pm mSmall" id="p12"><span>A</span></div>
</body>
</html>
