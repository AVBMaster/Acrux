<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>probe: BFC root contains its floats (clearfix)</title>
<style>
html, body { margin: 0; padding: 4px; background: rgb(255,255,255); font-family: Arial, sans-serif; font-size: 16px; line-height: 20px; }
div { box-sizing: border-box; }
.c1 { width: 200px; overflow: hidden; background: rgb(238,238,238); }
.c1 .f { float: left; width: 60px; height: 40px; background: rgb(0,0,255); }
.c2 { width: 200px; background: rgb(238,238,238); }
.c2 .f { float: left; width: 60px; height: 40px; background: rgb(0,0,255); }
.c3 { width: 200px; overflow: hidden; background: rgb(238,238,238); }
.c3 .f { float: left; width: 60px; height: 40px; margin: 10px; background: rgb(0,0,255); }
.c4 { width: 200px; height: 20px; overflow: hidden; background: rgb(238,238,238); }
.c4 .f { float: left; width: 60px; height: 40px; background: rgb(0,0,255); }
.after { width: 200px; height: 20px; background: rgb(0,255,0); }
</style>
</head>
<body>
<div class="c1" id="c1"><div class="f"></div></div>
<div class="after"></div>
<div class="c2" id="c2"><div class="f"></div></div>
<div class="after"></div>
<div class="c3" id="c3"><div class="f"></div></div>
<div class="after"></div>
<div class="c4" id="c4"><div class="f"></div></div>
<div class="after"></div>
</body>
</html>
