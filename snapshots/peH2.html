<!DOCTYPE html>
<html>
<head>
<style>
body { font-family: sans-serif; font-size: 13px; margin: 10px; color: #222; }
h3 { margin: 8px 0 4px; }
.p1::before { content: "[B]"; color: #a00; }
.p1::after { content: "[A]"; color: #00a; }
.p2::before { content: ""; }
.p3::before { content: "quoted \"x\" here"; background: #ff0; }
.p4::after { content: "block-ish"; display: block; background: #cfc; }
ul li::marker { }
li.a::marker { content: "» "; }
ol li { }
.p5::first-line { }
.bx::before { content: "prefix-"; font-weight: bold; }
.bx { border: 1px solid #888; }
.gen::after { content: normal; }
.cont::after { content: ""; border: 2px solid #e60; display: inline-block; width: 20px; height: 8px; }
</style></head><body>
<h3>4. display:block pseudo after</h3>
<div class="p4">inline-part</div>
<h3>5. ul with ::marker override</h3>
<ul>
  <li class="a">marker-arrow</li>
  <li>normal-disc</li>
</ul>
<h3>6. bold prefix via before</h3>
<div class="bx">sufix</div>
<h3>7. content:normal and empty inline-block pseudo</h3>
<div class="gen">gen-normal</div>
<div class="cont">cont-box</div>
</body></html>
