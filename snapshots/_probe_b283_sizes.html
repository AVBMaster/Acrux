<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><div id="probe" style="width:200px"></div><pre id="report"></pre>
<script>
var host=document.getElementById('probe');
function both(p,v){ host.setAttribute('style','font-size:16px;width:200px'); host.style.setProperty(p,v);
  return p+'['+v+'] spec='+JSON.stringify(host.style.getPropertyValue(p))+' comp='+JSON.stringify(getComputedStyle(host).getPropertyValue(p)); }
var out=[];
['width','min-width','max-width','height','min-height','max-height'].forEach(function(p){
  out.push(both(p,'50%')); out.push(both(p,'auto')); out.push(both(p,'none')); });
['inline-size','block-size','min-inline-size','max-inline-size'].forEach(function(p){
  out.push(both(p,'50%')); out.push(both(p,'auto')); out.push(both(p,'none')); });
document.getElementById('report').textContent=out.join('\n');
console.log(out.join('\n'));
</script></body></html>
