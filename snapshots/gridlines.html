<!DOCTYPE html>
<html><head><style>
body { margin: 0; background: white; }
.g1 {
  display: grid;
  grid-template-columns: 100px 100px 100px;
  grid-auto-rows: 30px;
  margin: 10px;
}
.a { grid-column: 1 / -1; background: #ff0000; }
.b { grid-column: -3 / -1; background: #00ff00; }
.c { grid-column: -2 / -1; background: #0000ff; }
.d { grid-column: 2; grid-row: 3; background: #ff8000; }
.g2 {
  display: grid;
  grid-template-columns: 50% 25% 25%;
  grid-template-rows: 30px 30px;
  width: 200px;
  margin: 10px;
}
.g2 div:nth-child(1) { background: #ff00ff; }
.g2 div:nth-child(2) { background: #00ffff; }
</style></head><body>
<div class="g1">
  <div class="a">a</div>
  <div class="b">b</div>
  <div class="c">c</div>
  <div class="d">d</div>
</div>
<div class="g2"><div>1</div><div>2</div></div>
</body></html>
