<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>b274 svg props</title>
<style>body{font:12px monospace;margin:0}</style></head><body>
<div id="probe"></div>
<pre id="report"></pre>
<script>
var CASES = [
  ["fill","red"],["fill","#00ff00"],["fill","none"],["fill","currentColor"],
  ["stroke","blue"],["stroke-width","2"],["stroke-width","2px"],["stroke-width","50%"],
  ["stroke-opacity","0.5"],["fill-opacity","0.25"],
  ["stroke-dasharray","5 3"],["stroke-dasharray","none"],["stroke-dasharray","5,3"],
  ["stroke-dashoffset","4"],["stroke-dashoffset","4px"],
  ["stroke-linecap","round"],["stroke-linejoin","bevel"],["stroke-miterlimit","4"],
  ["fill-rule","evenodd"],["clip-rule","evenodd"],
  ["stop-color","red"],["stop-opacity","0.5"],
  ["marker-start","none"],["paint-order","normal"],
  ["shape-rendering","auto"],["vector-effect","none"]
];
var host = document.getElementById('probe');
function spec(p,v){ host.setAttribute('style',''); host.style.setProperty(p,v); return host.style.getPropertyValue(p); }
function comp(p,v){ host.setAttribute('style',''); host.style.setProperty(p,v); return getComputedStyle(host).getPropertyValue(p); }
var out=[];
for (var i=0;i<CASES.length;i++){ var p=CASES[i][0],v=CASES[i][1];
  out.push(i+'|'+p+'|'+v+'|S='+spec(p,v)+'|C='+comp(p,v)); }
document.getElementById('report').textContent=out.join('\n');
console.log(out.join('\n'));
</script></body></html>
