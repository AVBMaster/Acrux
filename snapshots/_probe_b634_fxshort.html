<!doctype html><html><head><meta charset="utf-8"><style>
body{font:12px monospace;margin:8px}
.row{white-space:pre;font:12px monospace}
div{width:80px;height:40px;border:1px solid #999}
</style></head><body>
<div id="out"></div>
<script>
const out=[];
const cases=[
  ["text-shadow","none"],
  ["text-shadow","2px 2px red"],
  ["text-shadow","1px 1px 2px blue, -1px -1px 2px green"],
  ["box-shadow","none"],
  ["box-shadow","inset 2px 2px 4px red"],
  ["box-shadow","2px 2px 0 black, 4px 4px 0 gray"],
  ["filter","drop-shadow(2px 2px red)"],
  ["backdrop-filter","blur(4px)"],
  ["text-emphasis","filled dot red"],
];
for(const [p,v] of cases){
  const el=document.createElement("div");
  el.style.setProperty(p,v);
  document.body.appendChild(el);
  const sup=CSS.supports(p,v)?"Y":"n";
  const comp=getComputedStyle(el).getPropertyValue(p)||"(empty)";
  // compact: strip spaces/commas so the whole value survives one text run
  const short=comp.replace(/[ ,]+/g,"_");
  out.push(["L",p+"="+v.replace(/[ ,]+/g,"_"),"sup="+sup,"len="+comp.length,"comp="+short].join("~"));
  el.remove();
}
document.getElementById("out").textContent=out.join("\n");
</script></body></html>
