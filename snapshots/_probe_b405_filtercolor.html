<!doctype html><html><body><pre id=rec></pre><script>
const out=[];
function t(p,v){const el=document.createElement('div');document.body.appendChild(el);el.style.cssText='';el.style.setProperty(p,v);out.push(p+'='+JSON.stringify(v)+' sup='+CSS.supports(p,v)+' echo='+JSON.stringify(el.style.getPropertyValue(p)));el.remove();}
// filter functions
t('filter','none');
t('filter','blur(5px)');
t('filter','brightness(1.5)');
t('filter','contrast(0.5)');
t('filter','grayscale(1)');
t('filter','hue-rotate(90deg)');
t('filter','invert(0.5)');
t('filter','opacity(0.5)');
t('filter','saturate(2)');
t('filter','sepia(0.5)');
t('filter','drop-shadow(2px 2px 2px red)');
t('filter','blur(2px) brightness(1.5)');
t('filter','bogus');
// backdrop-filter
t('backdrop-filter','none');
t('backdrop-filter','blur(5px)');
t('backdrop-filter','brightness(0.8)');
t('backdrop-filter','blur(2px) saturate(1.5)');
// color functions
t('color','rgb(255, 0, 0)');
t('color','rgba(255, 0, 0, 0.5)');
t('color','hsl(120, 100%, 50%)');
t('color','hsla(120, 100%, 50%, 0.5)');
t('color','hwb(120, 0%, 0%)');
t('color','lab(50% 40 30)');
t('color','lch(50% 40 30)');
t('color','oklab(0.5 0.1 0.1)');
t('color','oklch(0.5 0.1 120)');
t('color','color(srgb 1 0 0)');
t('color','color-mix(in srgb, red, blue)');
t('color','light-dark(red, blue)');
document.getElementById('rec').textContent=out.join('\n');
console.log(out.join('\n'));
</script></body></html>
