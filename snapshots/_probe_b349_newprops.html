<!doctype html><html><body><pre id=rec></pre><script>

t('backdrop-filter','none');
t('backdrop-filter','blur(5px)');
t('backdrop-filter','blur(5px) brightness(0.8)');
t('backdrop-filter','bogus');
t('interpolate-size','numeric-only');
t('interpolate-size','allow-keywords');

t('text-wrap','wrap');
t('text-wrap','nowrap');
t('text-wrap','balance');
t('text-wrap','stable');
t('text-wrap','pretty');
t('text-wrap','bogus');
t('text-wrap-mode','wrap');
t('text-wrap-mode','nowrap');
t('text-wrap-mode','bogus');
t('text-wrap-style','auto');
t('text-wrap-style','balance');
t('text-wrap-style','stable');
t('text-wrap-style','pretty');
t('text-wrap-style','bogus');
t('text-spacing-trim','normal');
t('text-spacing-trim','trim-start');
t('text-spacing-trim','space-all');
t('text-spacing-trim','trim-adjacent');

t('text-autospace','normal');
t('text-autospace','no-autospace');
t('text-autospace','bogus');
t('text-underline-position','auto');
t('text-underline-position','from-font');
t('text-underline-position','under');

t('text-underline-position','under left');

console.log(out.join('\n'));
</script></body></html>
