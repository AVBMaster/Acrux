<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body { margin: 0; padding: 0; }
div { width: 80px; height: 80px; float: left; margin-right: 8px; }
#a { background: conic-gradient(rgb(255,0,0) 0 25%, rgb(0,255,0) 25% 50%, rgb(0,0,255) 50% 75%, rgb(255,255,0) 75% 100%); }
#b { background: conic-gradient(rgb(255,0,0) 0%, rgb(255,0,0) 25%, rgb(0,255,0) 25%, rgb(0,255,0) 50%, rgb(0,0,255) 50%, rgb(0,0,255) 75%, rgb(255,255,0) 75%, rgb(255,255,0) 100%); }
#c { background: conic-gradient(rgb(255,0,0), rgb(0,255,0), rgb(0,0,255), rgb(255,255,0)); }
#d { background: conic-gradient(rgb(255,0,0) 0deg 90deg, rgb(0,255,0) 90deg 180deg, rgb(0,0,255) 180deg 270deg, rgb(255,255,0) 270deg 360deg); }
</style>
</head>
<body>
<div id="a"></div><div id="b"></div><div id="c"></div><div id="d"></div>
</body>
</html>
