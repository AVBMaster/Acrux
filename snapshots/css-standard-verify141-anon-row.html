<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>b141 anonymous table row</title>
<style>
body { font: 16px "Segoe UI", sans-serif; margin: 0; padding: 0; }
.tbl { display: table; margin-bottom: 10px; background: rgb(235,235,235); }
.cell { display: table-cell; border: 2px solid rgb(200,0,0); padding: 6px; background: rgb(255,240,240); }
.row { display: table-row; }
.hd { display: table-header-group; }
.w { width: 200px; }
</style>
</head>
<body>
<div class="tbl" id="t1"><div class="cell" id="a1">alpha</div><div class="cell" id="a2">beta</div></div>
<div class="tbl w" id="t2"><div class="cell" id="b1">one</div></div>
<div class="tbl" id="t3"><div class="hd" id="g1"><div class="row" id="r1"><div class="cell" id="c1">gamma</div></div></div></div>
<div class="tbl" id="t4"><div class="row" id="r2"><div class="cell" id="d1">delta</div><div class="cell" id="d2">eps</div></div><div class="row" id="r3"><div class="cell" id="d3">zeta</div></div></div>
<div class="tbl" id="t5"><div class="cell" id="e1">first row</div></div><div class="cell" id="e2" style="display:table-cell">after table</div>
</body>
</html>
