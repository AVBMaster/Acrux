<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS Standard Verification Batch 58 — text-decoration-style and border-style variants</title>
<style>
body { font-family: Arial, sans-serif; margin: 24px; font-size: 16px; }
h2 { background: #eee; padding: 4px; margin: 20px 0 12px; }
.wrap { border: 1px dashed #999; padding: 10px; margin: 12px 0; }

/* 1. text-decoration-style variants */
.td { font-size: 26px; text-decoration-line: underline; text-decoration-thickness: 2px; }
.s-solid { text-decoration-style: solid; }
.s-double { text-decoration-style: double; }
.s-dotted { text-decoration-style: dotted; }
.s-dashed { text-decoration-style: dashed; }
.s-wavy { text-decoration-style: wavy; }

/* 2. border-style variants, 8px borders */
.b { width: 120px; height: 60px; border-width: 8px; display: inline-block; margin: 10px; background: #fff; }
.b-solid { border-style: solid; border-color: #369; }
.b-double { border-style: double; border-color: #c33; }
.b-groove { border-style: groove; border-color: #393; }
.b-ridge { border-style: ridge; border-color: #939; }
.b-inset { border-style: inset; border-color: #666; }
.b-outset { border-style: outset; border-color: #666; }
</style>
</head>
<body>

<h2>1. text-decoration-style: solid / double / dotted / dashed / wavy</h2>
<div class="wrap"><span class="td s-solid">Underline</span></div>
<div class="wrap"><span class="td s-double">Underline</span></div>
<div class="wrap"><span class="td s-dotted">Underline</span></div>
<div class="wrap"><span class="td s-dashed">Underline</span></div>
<div class="wrap"><span class="td s-wavy">Underline</span></div>

<h2>2. border-style: solid / double / groove / ridge / inset / outset (8px)</h2>
<div class="wrap">
  <div class="b b-solid">solid</div>
  <div class="b b-double">double</div>
  <div class="b b-groove">groove</div>
  <div class="b b-ridge">ridge</div>
  <div class="b b-inset">inset</div>
  <div class="b b-outset">outset</div>
</div>

</body>
</html>
