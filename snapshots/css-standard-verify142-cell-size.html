<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>b142 table cell block size</title>
<style>
body { font: 16px "Segoe UI", sans-serif; margin: 0; padding: 0; }
table { border-collapse: separate; border-spacing: 0; margin-bottom: 10px; }
td, th { border: 0; padding: 0; }
.p6 { padding: 6px; }
.b2 { border: 2px solid rgb(200,0,0); }
.lh1 { line-height: 1; }
.lh2 { line-height: 2; }
.two td { padding: 6px; }
</style>
</head>
<body>
<table id="t1"><tr><td id="c1" class="p6 b2">alpha</td></tr></table>
<table id="t2"><tr><td id="c2" class="p6">alpha</td></tr></table>
<table id="t3"><tr><td id="c3" class="p6 b2 lh1">alpha</td></tr></table>
<table id="t4"><tr><td id="c4" class="p6 b2 lh2">alpha</td></tr></table>
<table id="t5"><tr><td id="c5" class="b2">alpha</td></tr></table>
<table id="t6"><tr><td id="c6" class="p6 b2">alpha</td><td id="c7" class="p6 b2">beta</td></tr><tr><td id="c8" class="p6 b2">gamma</td><td id="c9" class="p6 b2">x</td></tr></table>
</body>
</html>
