<!doctype html><html><head><meta charset="utf-8"></head><body><script>
const out = [];
const t=(prop,v)=>{ const d=document.createElement('div'); d.style.setProperty(prop, v); out.push(prop+' <'+v+'> => cssText['+d.style.cssText+'] get['+d.style.getPropertyValue(prop)+']'); };
t('background','none');
t('flex-flow','row nowrap');
t('text-decoration','underline solid red');
t('text-decoration','none');
t('column-rule','2px solid red');
t('border','medium none currentcolor');
t('outline','medium none currentcolor');
t('list-style','disc outside none');
t('transition','none 0s ease 0s');
t('animation','none 0s ease 0s 1 normal none running');
console.log(out.join('\n'));
</script></body></html>
