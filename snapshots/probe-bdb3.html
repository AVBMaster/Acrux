<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body { margin: 0; padding: 0; background: #ffffff; }
body { font: 20px/40px Arial; color: #000000; }
#box { width: 260px; background: #dddddd; padding: 6px; }
span { background: #ffff00; border: 4px solid #ff0000; padding: 0px 20px; }
.slice { box-decoration-break: slice; }
.clone { box-decoration-break: clone; }
p { margin: 0; }
</style>
</head>
<body>
<div id="box">
<p><span class="clone">aaaa bbbb cccc dddd eeee ffff</span></p>
<p><span class="slice">hhhh iiii jjjj kkkk llll mmmm</span></p>
</div>
</body>
</html>
