<!doctype html><html><head><meta charset="utf-8"><style>body{margin:8px;font:14px monospace}</style></head><body><div id="out"></div>
<script>
const out=[];
function L(t,v){out.push("L~"+t+"~"+String(v).split(" ").join("_"));}
function gc(tag,css,prop){
  const d=document.createElement("div");d.setAttribute("style",css);document.body.appendChild(d);
  const v=getComputedStyle(d).getPropertyValue(prop).trim();
  L(tag,prop+"="+(v===""?"(empty)":v.split(" ").join("_")));d.remove();
}
// flex properties computed
gc("fd-row","display:flex;flex-direction:row","flex-direction");
gc("fd-col","display:flex;flex-direction:column","flex-direction");
gc("fd-row-rev","display:flex;flex-direction:row-reverse","flex-direction");
gc("fw-nowrap","display:flex;flex-wrap:nowrap","flex-wrap");
gc("fw-wrap","display:flex;flex-wrap:wrap","flex-wrap");
gc("jc-start","display:flex;justify-content:flex-start","justify-content");
gc("jc-center","display:flex;justify-content:center","justify-content");
gc("jc-sb","display:flex;justify-content:space-between","justify-content");
gc("jc-sa","display:flex;justify-content:space-around","justify-content");
gc("jc-se","display:flex;justify-content:space-evenly","justify-content");
gc("ai-start","display:flex;align-items:flex-start","align-items");
gc("ai-center","display:flex;align-items:center","align-items");
gc("ai-baseline","display:flex;align-items:baseline","align-items");
gc("as-auto","display:flex;align-self:auto","align-self");
gc("ac-start","display:flex;flex-wrap:wrap;align-content:flex-start","align-content");
// flex item properties
gc("fi-grow","display:flex;flex-grow:2","flex-grow");
gc("fi-shrink","display:flex;flex-shrink:0","flex-shrink");
gc("fi-basis","display:flex;flex-basis:200px","flex-basis");
gc("fi-basis-auto","display:flex;flex-basis:auto","flex-basis");
gc("fi-basis-content","display:flex;flex-basis:content","flex-basis");
// flex shorthand
gc("flex-1","flex:1","flex-grow");
gc("flex-none","flex:none","flex-shrink");
gc("flex-auto","flex:auto","flex-basis");
// grid properties
gc("gac-row","display:grid;grid-auto-flow:row","grid-auto-flow");
gc("gac-col","display:grid;grid-auto-flow:column","grid-auto-flow");
gc("gac-dense","display:grid;grid-auto-flow:row dense","grid-auto-flow");
gc("gac-row-gap","display:grid;row-gap:10px","row-gap");
gc("gac-col-gap","display:grid;column-gap:20px","column-gap");
gc("gac-justify-items","display:grid;justify-items:center","justify-items");
gc("gac-align-items","display:grid;align-items:center","align-items");
gc("gac-justify-content","display:grid;justify-content:center","justify-content");
document.getElementById("out").textContent=out.join("\n");
</script></body></html>
