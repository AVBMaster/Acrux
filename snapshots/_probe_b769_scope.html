<!doctype html><html><head><meta charset="utf-8"><style>body{margin:8px;font:14px monospace}</style></head><body><div id="out"></div>
<script>
const out=[];
function L(t,v){out.push("L~"+t+"~"+String(v).split(" ").join("_"));}
// @scope CSSOM
const ss=document.createElement("style");document.head.appendChild(ss);
try{
  ss.sheet.insertRule("@scope (.scope-root){p{color:red}}",0);
  const scopeRoot=document.createElement("div");scopeRoot.className="scope-root";
  const p=document.createElement("p");p.textContent="scoped";
  scopeRoot.appendChild(p);document.body.appendChild(scopeRoot);
  L("scope-p-color",getComputedStyle(p).color.split(" ").join("_"));
  scopeRoot.remove();
}catch(e){L("scope-error",e.message);}
try{
  ss.sheet.insertRule("@scope(.sr) to (.lim){span{color:blue}}",0);
  const sr=document.createElement("div");sr.className="sr";
  sr.innerHTML="<span>in scope</span><div class='lim'><span>in limit</span></div>";
  document.body.appendChild(sr);
  const inScope=sr.querySelector("span");
  const inLimit=sr.querySelector(".lim span");
  L("scope-in-color",inScope?getComputedStyle(inScope).color.split(" ").join("_"):"none");
  L("scope-limit-color",inLimit?getComputedStyle(inLimit).color.split(" ").join("_"):"none");
  sr.remove();
}catch(e){L("scope-limit-error",e.message);}
// :scope in querySelector
const outer=document.createElement("div");
outer.innerHTML="<p>direct</p><section><p>nested</p></section>";
document.body.appendChild(outer);
L("scope-direct-count",outer.querySelectorAll(":scope > p").length);
L("scope-all-count",outer.querySelectorAll("p").length);
L("scope-nested-count",outer.querySelectorAll(":scope section p").length);
outer.remove();
// :host and :host() in shadow
const host=document.createElement("div");document.body.appendChild(host);
const sr=host.attachShadow({mode:"open"});
sr.innerHTML="<style>:host{background:#eee}:host(.highlight){background:#fcc}</style><p>shadow</p>";
L("host-bg-default",getComputedStyle(host).backgroundColor.split(" ").join("_"));
host.classList.add("highlight");
L("host-bg-highlight",getComputedStyle(host).backgroundColor.split(" ").join("_"));
sr.innerHTML="<p>shadow</p>";
host.remove();
while(ss.sheet.cssRules.length>0)ss.sheet.deleteRule(0);
ss.remove();
document.getElementById("out").textContent=out.join("\n");
</script></body></html>
