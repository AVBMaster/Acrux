<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:8px;font:14px monospace}
.row{white-space:pre;font:12px monospace}
</style></head><body><div id="out"></div>
<script>
const out=[];
function L(t,v){out.push("L~"+t+"~"+String(v).split(" ").join("_"));}
function gc(tag,css,prop){
  const d=document.createElement("div");d.setAttribute("style",css);document.body.appendChild(d);
  const v=getComputedStyle(d).getPropertyValue(prop).trim();
  L(tag,prop+"="+(v===""?"(empty)":v.split(" ").join("_")));d.remove();
}
// background-attachment
gc("ba-scroll","background-attachment:scroll","background-attachment");
gc("ba-fixed","background-attachment:fixed","background-attachment");
gc("ba-local","background-attachment:local","background-attachment");
// background-repeat
gc("br-repeat-x","background-repeat:repeat-x","background-repeat");
gc("br-no-repeat","background-repeat:no-repeat","background-repeat");
gc("br-space","background-repeat:space","background-repeat");
gc("br-round","background-repeat:round","background-repeat");
// background-origin / clip
gc("bo-border","background-origin:border-box","background-origin");
gc("bo-padding","background-origin:padding-box","background-origin");
gc("bc-border","background-clip:border-box","background-clip");
gc("bc-content","background-clip:content-box","background-clip");
// background-position edge values
gc("bp-center","background-position:center","background-position");
gc("bp-px","background-position:10px 20px","background-position");
gc("bp-pct","background-position:25% 75%","background-position");
// background-size
gc("bs-cover","background-size:cover","background-size");
gc("bs-contain","background-size:contain","background-size");
gc("bs-px","background-size:100px 50px","background-size");
gc("bs-auto","background-size:auto","background-size");
// shorthand roundtrip
gc("bg-full","background:red url(x.png) no-repeat center/cover","background-color");
gc("bg-color-only","background:red","background-color");
document.getElementById("out").textContent=out.join("\n");
</script></body></html>
