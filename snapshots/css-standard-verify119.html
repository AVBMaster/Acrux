<!DOCTYPE html><head><style>
body{margin:20px;font:16px Arial}
p{border:1px solid #ccc;margin:8px 0;width:300px;background:#eef}
.a{text-indent:calc(50% + 10px)}
.b{text-indent:calc(25% - 1em)}
.c{text-indent:calc(2em)}
.d{text-indent:30%}
</style><body>
<p class="a">A: calc(50%+10px) of 300 → 160</p>
<p class="b">B: calc(25%-1em) → 75-16=59</p>
<p class="c">C: calc(2em) → 32</p>
<p class="d">D: 30% → 90</p>
</body></html>
