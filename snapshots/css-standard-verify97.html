<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:20px;font:16px Arial}
.ls{letter-spacing:calc(2px + 0.25em)}   /* 2 + 4 = 6px */
.ws{word-spacing:calc(1em + 4px)}         /* 16+4 = 20px */
.ti{text-indent:calc(2em + 5px);width:200px;border:1px solid #999}  /* 32+5=37 */
.ti2{text-indent:calc(10% + 3px);width:200px;border:1px solid #999} /* 20+3=23 */
</style></head><body>
<div class="ls">ABCD</div>
<div class="ws">one two three</div>
<div class="ti">indented first line text here</div>
<div class="ti2">indented percent</div>
</body></html>
