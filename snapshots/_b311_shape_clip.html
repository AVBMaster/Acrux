<!doctype html>
<html><head><meta charset="utf-8"><title>b311 shape clip</title>
<style>
  body { margin: 0; font: 12px monospace; background: #ffffff; }
  .box { position: absolute; width: 60px; height: 60px; }
  #c0    { left: 10px; top: 10px; background: #00ff00; clip-path: circle(0); }
  #cn10  { left: 90px; top: 10px; background: #00ff00; clip-path: circle(10); }
  #cin0  { left: 10px; top: 90px; background: #ff8000; clip-path: inset(0); }
  #cin1  { left: 90px; top: 90px; background: #ff8000; clip-path: inset(1); }
  #cxywh { left: 170px; top: 10px; background: #0000ff; clip-path: xywh(0 0 30px 30px); }
  #cxyb  { left: 170px; top: 90px; background: #0000ff; clip-path: xywh(1 2 3 4); }
  #cpx   { left: 250px; top: 10px; background: #800080; clip-path: circle(0px); }
  #cpct  { left: 250px; top: 90px; background: #800080; clip-path: circle(50% at 50% 50%); }
</style></head>
<body>
<div class="box" id="c0"></div>
<div class="box" id="cn10"></div>
<div class="box" id="cin0"></div>
<div class="box" id="cin1"></div>
<div class="box" id="cxywh"></div>
<div class="box" id="cxyb"></div>
<div class="box" id="cpx"></div>
<div class="box" id="cpct"></div>
<script>
// record
function build() {
  const rows = [];
  const cases = ['circle(0)', 'circle(0px)', 'circle(10)', 'circle(50% at 50% 50%)',
      'inset(0)', 'inset(1)', 'inset(10px)', 'inset(0 round 1)', 'xywh(0 0 30px 30px)',
      'xywh(1 2 3 4)', 'xywh(0 0 100% 100%)', 'margin-box', 'none'];
  const host = document.createElement('div');
  document.body.appendChild(host);
  for (let i = 0; i < cases.length; i++) {
    const el = document.createElement('div');
    host.appendChild(el);
    el.style.setProperty('clip-path', cases[i]);
    rows.push(i + '|clip-path|' + cases[i]
        + '|sup=' + (CSS.supports('clip-path', cases[i]) ? 1 : 0)
        + '|echo=' + el.style.getPropertyValue('clip-path')
        + '|comp=' + getComputedStyle(el).getPropertyValue('clip-path'));
    el.remove();
  }
  host.remove();
  const ids = ['c0', 'cn10', 'cin0', 'cin1', 'cxywh', 'cxyb', 'cpx', 'cpct'];
  for (const id of ids) {
    const el = document.getElementById(id);
    rows.push(id + '|sheet|comp=' + getComputedStyle(el).getPropertyValue('clip-path'));
  }
  document.body.insertAdjacentHTML('beforeend',
      '<pre id="record" style="position:absolute;left:10px;top:170px;font:11px/1.3 monospace">'
      + rows.join('\n') + '</pre>');
  console.log(rows.join('\n'));
}
build();
</script>
</body></html>
