<!DOCTYPE html><html><head><style>body{margin:0}div{width:40px;height:20px}</style></head><body>
<div style="background-color: color-mix(in srgb, rgb(255 0 0) 25%, rgb(0 255 0))"></div>
<div style="background-color: color-mix(in srgb, #f00 25%, #0f0)"></div>
<div style="background-color: color-mix(in hsl, red, blue)"></div>
<div style="background-color: color-mix(in hsl, hsl(0 100% 50%), hsl(240 100% 50%))"></div>
<div style="background-color: rgb(from #783cc8 r g 255)"></div>
<div style="background-color: hsl(from #ff0000 h s calc(l + 20))"></div>
<div style="background-color: color-mix(in oklab, red, blue)"></div>
<div style="background-color: color-mix(in lab, red, blue)"></div>
<div style="background-color: color-mix(in lch, red, blue)"></div>
<div style="background-color: color-mix(in oklch, red, blue)"></div>
<div style="background-color: color-mix(in xyz, red, blue)"></div>
<div style="background-color: color-mix(in srgb-linear, red, blue)"></div>
</body></html>
