<!DOCTYPE html>
<html>
<head>
<style>
body { font-family: sans-serif; font-size: 13px; margin: 10px; color: #222; }
h3 { margin: 8px 0 4px; }
.b1 { width: 200px; height: 60px; background: url(bg-dot.png) no-repeat; background-color: #eee; border: 1px solid #999; }
.b2 { width: 200px; height: 60px; background: url(bg-dot.png) repeat-x; background-color: #fed; border: 1px solid #999; }
.b3 { width: 200px; height: 60px; background: url(bg-dot.png) 50% 50% no-repeat #def; border: 1px solid #999; }
.b4 { width: 100px; height: 60px; background: url(bg-dot.png); background-size: cover; border: 1px solid #999; }
.b5 { width: 100px; height: 60px; background: url(bg-dot.png); background-size: contain; background-color: #eee; border: 1px solid #999; }
.b6 { width: 100px; height: 60px; background: url(bg-dot.png); background-size: 20px 40px; background-color: #eee; border: 1px solid #999; }
.b7 { width: 200px; height: 40px; background: linear-gradient(90deg, #f00, #00f), linear-gradient(#0f0, #0f0); background-size: 100% 50%; background-repeat: no-repeat; background-position: 0 100%; border: 1px solid #999; }
.b8 { width: 150px; height: 50px; padding: 10px; border: 4px dashed #888; background: #cde; background-clip: content-box; }
.b9 { width: 150px; height: 50px; padding: 10px; border: 4px dashed #888; background: #cde; background-clip: padding-box; }
.b10 { width: 120px; height: 40px; background: url(bg-dot.png) right bottom no-repeat #eee; background-position: calc(100% - 5px) calc(100% - 5px); border: 1px solid #999; }
</style>
</head>
<body>
<h3>1-3. url no-repeat / repeat-x / centered</h3>
<div class="b1"></div>
<div class="b2"></div>
<div class="b3"></div>
<h3>4-6. background-size cover/contain/20x40</h3>
<div style="display:flex;gap:10px">
<div class="b4"></div><div class="b5"></div><div class="b6"></div>
</div>
<h3>7. two gradients layered</h3>
<div class="b7"></div>
<h3>8-9. background-clip content vs padding</h3>
<div class="b8">clip-content</div>
<div class="b9">clip-padding</div>
<h3>10. calc position</h3>
<div class="b10">pos-calc</div>
</body>
</html>
