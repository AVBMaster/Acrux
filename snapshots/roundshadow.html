<!DOCTYPE html><html><head><style>
body{margin:20px;font:16px Arial;background:#fff}
.box{width:150px;height:100px;background:#4a90d9;margin-bottom:30px;border-radius:15px}
.s1{box-shadow:10px 10px 5px rgba(0,0,0,0.5)}
.s2{box-shadow:0 0 20px rgba(255,0,0,0.8)}
.s3{box-shadow:inset 0 0 15px rgba(0,0,0,0.5)}
.t1{font-size:28px;margin-bottom:20px;text-shadow:2px 2px 3px rgba(0,0,0,0.5)}
.r1{height:40px;background:#f5a623;margin-bottom:20px}
.r2{height:40px;background:#7ed321;margin-bottom:20px}
</style></head><body>
<div class="box s1">rounded + shadow</div>
<div class="box s2">red glow shadow</div>
<div class="box s3">inset shadow</div>
<div class="t1">Text with shadow</div>
<div class="r1"></div><div class="r2"></div>
</body></html>
