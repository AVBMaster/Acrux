<!DOCTYPE html><html><head><style>body{margin:0}div{width:40px;height:20px}</style></head><body>
<div style="background-color: rgb(255 0 0)"></div>
<div style="background-color: rgb(255,0,0)"></div>
<div style="background-color: color-mix(in srgb, rgb(255 0 0), rgb(0 0 255))"></div>
<div style="background-color: color-mix(in srgb, rgb(255,0,0), rgb(0,0,255))"></div>
<div style="background-color: color-mix(in srgb, #ff0000, #0000ff)"></div>
<div style="background-color: color-mix(in srgb, rgb(255 0 0) 50%, rgb(0 0 255))"></div>
<div style="background-color: hsl(0 100% 50%)"></div>
<div style="background-color: color-mix(in hsl, hsl(0 100% 50%), hsl(240 100% 50%))"></div>
<div style="background-color: rgb(from rgb(120, 60, 200) r g 255)"></div>
<div style="background-color: rgb(from #783cc8 r g 255)"></div>
</body></html>
