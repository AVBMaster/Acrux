<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:8px;font:14px monospace}
.row{white-space:pre;font:12px monospace}
</style></head><body><div id="out"></div>
<script>
const out=[];
function L(t,v){out.push("L~"+t+"~"+String(v).split(" ").join("_"));}
function rect(el){const r=el.getBoundingClientRect();return Math.round(r.x)+","+Math.round(r.y)+"_"+Math.round(r.width)+"x"+Math.round(r.height);}

// flex + gap + wrap
let f=document.createElement("div");
f.style.cssText="display:flex;flex-wrap:wrap;gap:10px;width:220px";
for(let i=0;i<4;i++){const c=document.createElement("div");c.style.cssText="width:100px;height:30px;background:#fcc";f.appendChild(c);}
document.body.appendChild(f);
L("flex-wrap-gap-h",Math.round(f.getBoundingClientRect().height));
f.remove();
// grid + gap
let g=document.createElement("div");
g.style.cssText="display:grid;grid-template-columns:repeat(3,60px);gap:10px";
for(let i=0;i<6;i++){const c=document.createElement("div");c.style.cssText="height:20px;background:#ccf";g.appendChild(c);}
document.body.appendChild(g);
L("grid-gap-h",Math.round(g.getBoundingClientRect().height));
g.remove();
// table + colspan + caption
let t=document.createElement("table");t.style.cssText="width:200px;border-collapse:collapse";
const cap=document.createElement("caption");cap.textContent="Table";t.appendChild(cap);
const tr=document.createElement("tr");t.appendChild(tr);
const td1=document.createElement("td");td1.textContent="A";tr.appendChild(td1);
const td2=document.createElement("td");td2.textContent="B";tr.appendChild(td2);
document.body.appendChild(t);
L("table-caption-h",Math.round(t.getBoundingClientRect().height));
L("table-td1-w",Math.round(td1.getBoundingClientRect().width));
t.remove();
// inline-block with margin/padding
let ib=document.createElement("span");
ib.style.cssText="display:inline-block;width:50px;height:30px;margin:5px;padding:3px;background:#cfc";
ib.textContent="IB";
document.body.appendChild(ib);
L("inline-block-w",Math.round(ib.getBoundingClientRect().width));
L("inline-block-h",Math.round(ib.getBoundingClientRect().height));
ib.remove();
// absolute + z-index + transform
const ab=document.createElement("div");
ab.style.cssText="position:absolute;top:50px;left:50px;width:100px;height:50px;background:#fcc;transform:rotate(10deg);z-index:5";
document.body.appendChild(ab);
L("abs-transform-z",getComputedStyle(ab).zIndex);
L("abs-transform-tf",getComputedStyle(ab).transform.split(" ").join("_"));
ab.remove();
// text with letter-spacing + text-align center
const ta=document.createElement("div");
ta.style.cssText="width:200px;text-align:center;letter-spacing:2px";
ta.textContent="Centered text";
document.body.appendChild(ta);
L("text-align-w",Math.round(ta.getBoundingClientRect().width));
ta.remove();
// multi-line text with line-height
const ml=document.createElement("div");
ml.style.cssText="width:100px;line-height:2;font-size:14px";
ml.textContent="Some text that wraps across lines here";
document.body.appendChild(ml);
L("lineheight-h",Math.round(ml.getBoundingClientRect().height));
ml.remove();
document.getElementById("out").textContent=out.join("\n");
</script></body></html>
