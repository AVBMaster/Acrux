<!DOCTYPE html><html><head><style>body{margin:8px;font-size:16px}div{height:6px}</style></head><body>
<div style="width: calc(10%)"></div>
<div style="width: calc(2em)"></div>
<div style="width: calc(10% + 2em)"></div>
<div style="width: calc(2em + 10%)"></div>
<div style="width: calc(50px + 10%)"></div>
<div style="width: calc(2em + 50px)"></div>
<div style="width: calc(calc(10%) + 2em)"></div>
<div style="width: calc(100% - 2em)"></div>
<div style="width: calc(2em * 3)"></div>
<div style="width: calc(3 * 2em)"></div>
</body></html>
