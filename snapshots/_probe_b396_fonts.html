<!doctype html><html><body><pre id=rec></pre><script>
const out=[];

t('visibility','bogus');
t('opacity','1');
t('opacity','0');
t('opacity','0.5');
t('opacity','-1');
t('opacity','2');
// font family / size / weight / style
t('font-family','serif');
t('font-family','sans-serif');
t('font-family','monospace');
t('font-family','Arial');
t('font-family','Arial, sans-serif');
t('font-family','"My Font", serif');
t('font-size','medium');
t('font-size','16px');
t('font-size','1.5em');
t('font-size','120%');
t('font-size','larger');
t('font-size','smaller');
t('font-size','xx-large');
t('font-weight','normal');
t('font-weight','bold');
t('font-weight','100');
t('font-weight','900');
t('font-weight','bolder');
t('font-weight','lighter');
t('font-style','normal');
t('font-style','italic');
t('font-style','oblique');
t('font-variant','normal');
t('font-variant','small-caps');
// list properties
t('list-style-type','none');

t('float','none');
t('float','left');
t('float','right');
t('float','inline-start');
t('float','inline-end');

t('clear','left');
t('clear','both');
t('clear','inline-end');

console.log(out.join('\n'));
</script></body></html>
