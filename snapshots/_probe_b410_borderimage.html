<!doctype html><html><body><pre id=rec></pre><script>
const out=[];
function t(p,v){const el=document.createElement('div');document.body.appendChild(el);el.style.cssText='';el.style.setProperty(p,v);out.push(p+'='+JSON.stringify(v)+' sup='+CSS.supports(p,v)+' echo='+JSON.stringify(el.style.getPropertyValue(p)));el.remove();}
// border-image
t('border-image','none');
t('border-image','url(a.png)');
t('border-image','url(a.png) 27');
t('border-image','url(a.png) 27 / 10px');
t('border-image','url(a.png) 27 / 10px / 5px');
t('border-image','url(a.png) 27 round');
t('border-image','url(a.png) 27 / 10px round');
t('border-image','url(a.png) fill 27 / 10px stretch');
t('border-image','linear-gradient(red, blue) 30');
t('border-image','url(a.png) 27 30 40 50 / 10px 20px / 5px 6px round space');
t('border-image','url(a.png) 27 stretch round');
t('border-image','bogus');
// border-image longhands
t('border-image-source','none');
t('border-image-source','url(a.png)');
t('border-image-source','linear-gradient(red, blue)');
t('border-image-slice','27');
t('border-image-slice','27 fill');
t('border-image-slice','27 30 40 50');
t('border-image-width','auto');
t('border-image-width','10px');
t('border-image-outset','0');
t('border-image-outset','5px');
t('border-image-repeat','stretch');
t('border-image-repeat','round');
t('border-image-repeat','space round');
// mask longhands
t('mask-image','none');
t('mask-image','url(a.png)');
t('mask-image','linear-gradient(red, blue)');
t('mask-repeat','repeat');
t('mask-repeat','no-repeat');
t('mask-position','center');
t('mask-position','10px 20px');
t('mask-size','auto');
t('mask-size','cover');
t('mask-size','100px 50px');
t('mask-clip','border-box');
t('mask-clip','content-box');
t('mask-origin','padding-box');
t('mask-composite','add');
t('mask-composite','subtract');
t('mask-mode','alpha');
t('mask-mode','luminance');
document.getElementById('rec').textContent=out.join('\n');
console.log(out.join('\n'));
</script></body></html>
