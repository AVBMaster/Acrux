<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>b274 font-size keywords</title>
<style>body{margin:0;font:12px monospace}</style></head><body>
<div id="p"><span id="s"></span></div>
<pre id="report"></pre>
<script>
var WORDS=["xx-small","x-small","small","medium","large","x-large","xx-large","xxx-large"];
var out=[]; var s=document.getElementById('s');
// parent 16px (default) — the reference engine's keyword table is absolute
for (var i=0;i<WORDS.length;i++){ s.setAttribute('style','font-size:'+WORDS[i]);
  out.push('p16 '+WORDS[i]+'='+getComputedStyle(s).fontSize); }
// parent 12px (body) — does the table shift with the parent?
document.getElementById('p').setAttribute('style','font-size:12px');
for (var i=0;i<WORDS.length;i++){ s.setAttribute('style','font-size:'+WORDS[i]);
  out.push('p12 '+WORDS[i]+'='+getComputedStyle(s).fontSize); }
document.getElementById('p').setAttribute('style','font-size:40px');
for (var i=0;i<WORDS.length;i++){ s.setAttribute('style','font-size:'+WORDS[i]);
  out.push('p40 '+WORDS[i]+'='+getComputedStyle(s).fontSize); }
s.setAttribute('style','font-size:larger'); out.push('larger@p40='+getComputedStyle(s).fontSize);
s.setAttribute('style','font-size:smaller'); out.push('smaller@p40='+getComputedStyle(s).fontSize);
document.getElementById('report').textContent=out.join('\n');
console.log(out.join('\n'));
</script></body></html>
