<!doctype html><html><head><meta charset="utf-8"><style>
body{font:12px monospace;margin:8px}
.row{white-space:pre;font:12px monospace}
.c{display:grid;width:100px;height:60px;border:1px solid #999}
</style></head><body>
<div id="out"></div>
<script>
const out=[];
function probe(val){
  const host=document.createElement("div");host.className="c";
  document.body.appendChild(host);
  host.style.setProperty("place-content",val);
  const stored=[];
  for(let i=0;i<host.style.length;i++){const n=host.style.item(i);stored.push(n+"="+host.style.getPropertyValue(n));}
  out.push(["L","pc="+val,"block=["+stored.join(";")+"]"].join("~"));
  host.remove();
}
probe("space-between center");
probe("center");
probe("center start");
document.getElementById("out").textContent=out.join("\n");
</script></body></html>
