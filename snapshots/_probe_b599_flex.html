<!doctype html><html><head><meta charset=utf-8><style>
body{font:12px monospace;margin:4px}
.row{white-space:pre;font:12px monospace}
.fl{display:flex;border:1px solid #000;margin:2px 0}
.f1{display:flex;gap:10px}
.f2{display:flex}
.f2 .o{order:2}.f2 .o2{order:1}
.f3{display:flex;justify-content:space-between}
.f4{display:flex;align-items:flex-end;height:50px}
.f5{display:flex;flex-wrap:wrap;width:100px}
.f6{display:flex}
.f6 .g{flex-grow:1}.f6 .s{flex-shrink:0;width:80px}
.f7{display:flex;align-content:center;height:80px;flex-wrap:wrap}
.gd{display:grid;grid-template-columns:100px 1fr 2fr;gap:6px;border:1px solid #000}
.gd2{display:grid;grid-template-rows:40px auto;border:1px solid #000}
.i{background:#eef;border:1px solid #999;min-width:20px;min-height:20px}
</style></head><body>
<div id=out></div>
<div class="fl f1" id=f1><div class=i>1</div><div class=i>2</div><div class=i>3</div></div>
<div class="fl f2" id=f2><div class=i o>a</div><div class=i o2>b</div></div>
<div class="fl f3" id=f3><div class=i>L</div><div class=i>M</div><div class=i>R</div></div>
<div class="fl f4" id=f4><div class=i>lo</div><div class=i>hi</div></div>
<div class="fl f5" id=f5><div class=i style="width:40px">w1</div><div class=i style="width:40px">w2</div><div class=i style="width:40px">w3</div></div>
<div class="fl f6" id=f6><div class=i g>grow</div><div class=i s>fixed</div></div>
<div class="gd" id=g1><div class=i>c1</div><div class=i>c2</div><div class=i>c3</div><div class=i>c4</div></div>
<script>
const out=document.getElementById("out");
function row(t){const d=document.createElement("div");d.className="row";d.textContent=t;out.appendChild(d);}
for(const id of ["f1","f2","f3","f4","f5","f6","g1"]){
  const e=document.getElementById(id);const r=e.getBoundingClientRect();
  const kids=[...e.children].map(k=>Math.round(k.getBoundingClientRect().left)+":"+Math.round(k.getBoundingClientRect().width)).join(",");
  row("L|"+id+"|box="+Math.round(r.width)+"x"+Math.round(r.height)+"|kids="+kids);
}
</script></body></html>
