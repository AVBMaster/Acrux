<!doctype html><html><body><pre id=rec></pre><script>
const out=[];
function t(v){const el=document.createElement('div');document.body.appendChild(el);el.style.cssText='';el.style.backgroundImage=v;out.push(v+' -> sup='+CSS.supports('background-image',v)+' echo='+JSON.stringify(el.style.backgroundImage));el.remove();}
// repeating-linear
t('repeating-linear-gradient(to bottom, red, blue)');
t('repeating-linear-gradient(to top right, red, blue)');
t('repeating-linear-gradient(red, blue 10px)');
t('repeating-linear-gradient(45deg, red, blue)');
// repeating-radial
t('repeating-radial-gradient(circle at center, red, blue)');
t('repeating-radial-gradient(ellipse at top, red, blue)');
t('repeating-radial-gradient(red, blue 20px)');
t('repeating-radial-gradient(circle farthest-side, red, blue)');
// repeating-conic
t('repeating-conic-gradient(from 0deg, red, blue)');
t('repeating-conic-gradient(at center, red, blue)');
t('repeating-conic-gradient(from 90deg at top, red, blue)');
t('repeating-conic-gradient(red, blue 10deg)');
document.getElementById('rec').textContent=out.join('\n');
console.log(out.join('\n'));
</script></body></html>
