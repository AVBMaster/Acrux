<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:8px;font:16px serif}
.t{font-size:16px;margin:6px 0}
</style></head><body>
<div id="out" style="font:12px monospace"></div>
<div>
<div class="t" style="text-decoration:underline">Underline text</div>
<div class="t" style="text-decoration:overline">Overline text</div>
<div class="t" style="text-decoration:line-through">Line-through text</div>
<div class="t" style="text-decoration:underline overline">Underline overline</div>
<div class="t" style="text-decoration:underline wavy red">Wavy red underline</div>
<div class="t" style="text-decoration:underline dotted blue">Dotted blue underline</div>
<div class="t" style="text-decoration:underline dashed green">Dashed green underline</div>
<div class="t" style="text-decoration:underline double purple">Double purple</div>
<div class="t" style="text-decoration:underline;text-decoration-thickness:3px">Thick underline</div>
<div class="t" style="text-decoration:underline;text-underline-offset:5px">Offset underline</div>
</div>
<script>
const out=[];
function L(t,v){out.push("L~"+t+"~"+String(v).split(" ").join("_"));}
function gc(tag,css,prop){
  const d=document.createElement("div");d.setAttribute("style",css);document.body.appendChild(d);
  const v=getComputedStyle(d).getPropertyValue(prop).trim();
  L(tag,prop+"="+(v===""?"(empty)":v.split(" ").join("_")));d.remove();
}
// text-decoration shorthand longhands
gc("td-underline","text-decoration:underline","text-decoration-line");
gc("td-overline","text-decoration:overline","text-decoration-line");
gc("td-linethrough","text-decoration:line-through","text-decoration-line");
gc("td-underline-overline","text-decoration:underline overline","text-decoration-line");
gc("td-style-wavy","text-decoration:underline wavy","text-decoration-style");
gc("td-style-dotted","text-decoration:underline dotted","text-decoration-style");
gc("td-style-dashed","text-decoration:underline dashed","text-decoration-style");
gc("td-style-double","text-decoration:underline double","text-decoration-style");
gc("td-color-red","text-decoration:underline red","text-decoration-color");
gc("td-thickness","text-decoration:underline;text-decoration-thickness:3px","text-decoration-thickness");
// text-underline-position
gc("tup-auto","text-underline-position:auto","text-underline-position");
gc("tup-under","text-underline-position:under","text-underline-position");
gc("tup-from-font","text-underline-position:from-font","text-underline-position");
document.getElementById("out").textContent=out.join("\n");
</script></body></html>
