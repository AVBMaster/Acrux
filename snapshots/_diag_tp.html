<!doctype html><html><head><meta charset=utf-8><style>
#t3{transition-property:opacity,transform;transition-duration:1s,2s,3s;height:20px}
</style></head><body><meta charset=utf-8>
<div id=t3>t3</div>
<script>
const s=getComputedStyle(document.getElementById("t3"));
const td=s.transitionDuration.split(",").map(x=>x.trim().replace(" ",""));
document.body.appendChild(document.createTextNode("D0="+td[0]+"D1="+td[1]+"D2="+td[2]));
</script></body></html>
