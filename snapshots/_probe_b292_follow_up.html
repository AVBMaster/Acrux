var out = [];
for (var i = 0; i < CASES.length; i++) {
  var decl = CASES[i];
  var prop = decl.slice(0, decl.indexOf(':')).trim();
  var value = decl.slice(decl.indexOf(':') + 1).trim();
  var d = document.createElement('div');
  document.getElementById('box').appendChild(d);
  d.style.setProperty(prop, value);
  var names = [];
  for (var j = 0; j < d.style.length; j++) names.push(d.style.item(j));
  void d.offsetHeight;
  var sup = 'ERR';
  try { sup = CSS.supports(prop, value) ? '1' : '0'; } catch (e) {}
  out.push(i + '|' + prop + '|' + value + '|n=' + d.style.length + '|names=' + names.join(',')
    + '|echo=' + d.style.getPropertyValue(prop) + '|comp=' + getComputedStyle(d).getPropertyValue(prop)
    + '|sup=' + sup + '|text=' + d.style.cssText);
}
function door(d, prop) {
  var names = []; for (var j = 0; j < d.style.length; j++) names.push(d.style.item(j));
  return 'names=' + names.join(',') + '|echo=' + d.style.getPropertyValue(prop)
    + '|comp=' + getComputedStyle(d).getPropertyValue(prop) + '|text=' + d.style.cssText;
}
var host = document.getElementById('box');
var a = document.createElement('div'); a.setAttribute('style', 'outline-style: auto');
host.appendChild(a); void a.offsetHeight; out.push('D|attr|' + door(a, 'outline-style'));
var s = document.createElement('div'); s.className = 'sheet-tsa'; host.appendChild(s); void s.offsetHeight;
out.push('D|sheet|' + door(s, 'text-size-adjust'));
var r = document.createElement('div'); host.appendChild(r);
r.style.setProperty('-webkit-text-stroke', '1px red'); r.style.removeProperty('-webkit-text-stroke');
void r.offsetHeight; out.push('D|remove|' + door(r, '-webkit-text-stroke'));
var w = document.createElement('div'); host.appendChild(w); w.style.verticalAlign = 'text-bottom';
void w.offsetHeight; out.push('D|idlset|' + door(w, 'vertical-align'));
var p = document.createElement('div'); host.appendChild(p);
p.style.setProperty('text-size-adjust', '50%'); p.style.setProperty('initial-letter', '2.5');
p.style.setProperty('-webkit-line-break', 'after-white-space');
var c = document.createElement('div'); p.appendChild(c); void c.offsetHeight;
out.push('D|inherit|parent=' + getComputedStyle(p).getPropertyValue('text-size-adjust') + '/'
  + getComputedStyle(p).getPropertyValue('initial-letter') + '/'
  + getComputedStyle(p).getPropertyValue('-webkit-line-break')
  + '|child=' + getComputedStyle(c).getPropertyValue('text-size-adjust') + '/'
  + getComputedStyle(c).getPropertyValue('initial-letter') + '/'
  + getComputedStyle(c).getPropertyValue('-webkit-line-break'));
var text = out.join('\n');
document.getElementById('report').textContent = text;
console.log(text);
</script></body></html>
