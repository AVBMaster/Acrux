<!doctype html><html><body><pre id=rec></pre><script>
const out=[];
function t(v){const el=document.createElement('div');document.body.appendChild(el);el.style.cssText='';el.style.backgroundImage=v;out.push(v+' -> sup='+CSS.supports('background-image',v)+' echo='+JSON.stringify(el.style.backgroundImage));el.remove();}
// bare length with no shape — is it a circle radius?
t('radial-gradient(100px, red, blue)');
t('radial-gradient(50%, red, blue)');
t('radial-gradient(100px 50px, red, blue)');
// colour stop that is a bare length/percentage
t('radial-gradient(100px at center, red, blue)');
// invalid: shape/size mismatch
t('radial-gradient(ellipse 100px, red, blue)');
t('radial-gradient(circle 100px 50px, red, blue)');
// valid: keyword sizes
t('radial-gradient(circle closest-side, red, blue)');
t('radial-gradient(ellipse farthest-corner, red, blue)');
document.getElementById('rec').textContent=out.join('\n');
console.log(out.join('\n'));
</script></body></html>
