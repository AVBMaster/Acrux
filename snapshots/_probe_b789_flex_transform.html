<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:8px;font:12px monospace}
</style></head><body>
<div id="out"></div>
<script>
const out=[];
function L(t,v){out.push("L~"+t+"~"+String(v).split(" ").join("_"));}
function gc(tag,css,prop){
  const d=document.createElement("div");d.setAttribute("style",css);document.body.appendChild(d);
  const v=getComputedStyle(d).getPropertyValue(prop).trim();
  L(tag,prop+"="+(v===""?"(empty)":v.split(" ").join("_")));d.remove();
}
function rect(tag,css){
  const d=document.createElement("div");d.setAttribute("style","position:absolute;"+css);document.body.appendChild(d);
  const r=d.getBoundingClientRect();
  L(tag,"x="+Math.round(r.x)+"_y="+Math.round(r.y)+"_w="+Math.round(r.width)+"_h="+Math.round(r.height));d.remove();
}
// flex longhands
gc("fx-grow","display:flex;flex-grow:2","flex-grow");
gc("fx-shrink","display:flex;flex-shrink:0","flex-shrink");
gc("fx-basis","display:flex;flex-basis:100px","flex-basis");
gc("fx-basis-auto","display:flex;flex-basis:auto","flex-basis");
gc("fx-basis-content","display:flex;flex-basis:content","flex-basis");
gc("fx-sh","display:flex;flex:1","flex-grow");
gc("fx-sh-basis","display:flex;flex:1","flex-basis");
gc("fx-sh2","display:flex;flex:2 3 200px","flex-basis");
// flex-direction / wrap
gc("fxd-row","display:flex;flex-direction:row","flex-direction");
gc("fxd-col","display:flex;flex-direction:column","flex-direction");
gc("fxd-rrev","display:flex;flex-direction:row-reverse","flex-direction");
gc("fxw-wrap","display:flex;flex-wrap:wrap","flex-wrap");
gc("fxw-nowrap","display:flex;flex-wrap:nowrap","flex-wrap");
gc("fxw-rev","display:flex;flex-wrap:wrap-reverse","flex-wrap");
// flex flow shorthand
gc("fxf-row","display:flex;flex-flow:row wrap","flex-direction");
gc("fxf-col","display:flex;flex-flow:column nowrap","flex-flow");
// align / justify
gc("ai-center","display:flex;align-items:center","align-items");
gc("ai-baseline","display:flex;align-items:baseline","align-items");
gc("ai-stretch","display:flex;align-items:stretch","align-items");
gc("ac-space","display:flex;align-content:space-between","align-content");
gc("jc-center","display:flex;justify-content:center","justify-content");
gc("jc-evenly","display:flex;justify-content:space-evenly","justify-content");
gc("ji-center","display:flex;justify-items:center","justify-items");
// order
gc("ord-2","display:flex;order:2","order");
gc("ord-neg","display:flex;order:-1","order");
// gap
gc("gap-10","display:flex;gap:10px","gap");
gc("gap-rc","display:flex;gap:5px 15px","row-gap");
gc("gap-rc2","display:flex;gap:5px 15px","column-gap");
// transforms
gc("tf-none","transform:none","transform");gc("tf-tr","transform:translate(10px,20px)","transform");
gc("tf-rot","transform:rotate(45deg)","transform");
gc("tf-sc","transform:scale(2,0.5)","transform");
gc("tf-skew","transform:skew(10deg,20deg)","transform");
gc("tf-matrix","transform:matrix(1,0,0,1,10,20)","transform");
gc("tf-origin","transform-origin:10px 20px","transform-origin");
gc("tf-o-center","transform-origin:center","transform-origin");
document.getElementById("out").textContent=out.join("\n");
</script></body></html>
