<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  body { font-family: Arial; margin: 8px; font-size: 20px; }
  .a { line-height: normal; background: #eee; }
  .b { line-height: 1; background: #fed; }
  .e { text-emphasis: filled dot; }
  .u { text-emphasis: filled dot; text-emphasis-position: under; }
</style></head><body>
<div class="a">plain text</div>
<div class="a e">emphasis over</div>
<div class="a u">emphasis under</div>
<div class="b e">em over lh1</div>
<div class="b">plain lh1</div>
</body></html>
