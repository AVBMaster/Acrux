<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>b288 probe 4 — calc spelling and colour slots</title>
<style>body { font: 14px/18px monospace; color: rgb(9,9,9); margin: 4px; }</style></head><body>
<pre id="report"></pre>
<script>
// The same shapes read through the CSSOM echo, the sheet echo, CSS.supports and getComputedStyle:
// a math expression the page wrote without spaces is not a math expression at all, and a colour
// slot inside a multi-word value has to print the way the property's own colour prints.
var CASES = [
  'margin-top: calc(1px+1px)', 'margin-top: calc(1px + 1px)', 'margin-top: calc(1+1)',
  'width: calc(10+5)', 'width: calc(10px-5px)', 'width: calc(10px*2)', 'width: calc(2*10px)',
  'flex-grow: calc(1+1)', 'flex-grow: calc(1 + 1)', 'flex-grow: calc(1)', 'flex-grow: calc(2*3)',
  'opacity: calc(1+1)', 'order: calc(1+1)', 'z-index: calc(1+1)', 'padding-left: calc(1px+1px)',
  'border-spacing: calc(1px+1px)', 'letter-spacing: calc(0.5em+0.5em)', 'flex: calc(1+1) 1 auto',
  'color: #f00', 'border-top-color: #f00', 'outline-color: #f00', 'text-emphasis-color: #f00',
  'background-color: #FF0000', 'caret-color: #00f', 'column-rule-color: #abc',
  'text-decoration-color: #f00', 'fill: #f00', 'text-emphasis: dot #f00',
  'outline: 2px solid #f00', 'border: 1px solid #f00', 'list-style-type: normal',
  'text-emphasis-style: normal', 'text-emphasis: filled normal', 'text-emphasis-style: auto dot',
  'text-emphasis-position: over auto', 'text-emphasis: dot filled rgb(1,2,3)',
  'flex: 1 1 calc(1px + 2px)', 'flex-basis: calc(1px+2px)', 'flex-basis: calc(1px + 2px)',
  'flex: content', 'flex: 1 content', 'flex: 1 1 1e2px', 'flex-basis: 1e2px', 'flex-basis: content content',
  'flex: 0% 0%', 'flex: 1 1 calc(10px + 5px)', 'flex-basis: calc(10px + 5px)',
];
function propOf(decl) { return decl.split(':')[0].trim(); }
var out = [];
for (var i = 0; i < CASES.length; i++) {
  var decl = CASES[i], prop = propOf(decl);
  var d = document.createElement('div');
  document.body.appendChild(d);
  d.style.cssText = decl;
  var sheet = document.createElement('style');
  sheet.textContent = '.c' + i + ' { ' + decl + ' }';
  document.head.appendChild(sheet);
  var host = document.createElement('div');
  host.className = 'c' + i;
  document.body.appendChild(host);
  void host.offsetHeight;
  var supports = 'ERR';
  try { supports = CSS.supports(prop, decl.slice(prop.length + 1).trim()) ? 'yes' : 'no'; } catch (e) {}
  out.push(i + '|' + decl + '|n=' + d.style.length + '|cssText=' + d.style.cssText
           + '|sheet=' + sheet.sheet.cssRules[0].style.getPropertyValue(prop)
           + '|comp=' + getComputedStyle(host).getPropertyValue(prop) + '|sup=' + supports);
}
var text = out.join('\n');
document.getElementById('report').textContent = text;
console.log(text);
window.ROWS = out;
</script></body></html>
