const out = [];
const emit = (name, value) => out.push(name + '=' + String(value).replace(/\n/g, '\\n'));
// A rule record of one fixed shape, so the two engines cannot disagree about how many fields a
// rule has: an absent value prints 'U' (undefined) or 'N' (null) and a present one prints its text.
const f = v => (v === undefined ? 'U' : v === null ? 'N' : '"' + v + '"');
function record(r) {
  const media = (r.media === undefined || r.media === null) ? 'none'
                : f(r.media.mediaText) + '#' + r.media.length;
  return [f(r.type), f(r.cssText), 'href=' + f(r.href), 'ns=' + f(r.namespaceURI),
          'prefix=' + f(r.prefix), 'layer=' + f(r.layerName), 'sup=' + f(r.supportsText),
          'media=' + media, 'cond=' + f(r.conditionText), 'sel=' + f(r.selectorText),
          'style=' + ((r.style === undefined || r.style === null) ? 'none' : '"' + r.style.cssText + '"')
         ].join(' ');
}
function sheet(text) {
  const st = document.createElement('style');
  st.textContent = text;
  document.head.appendChild(st);
  const rules = st.sheet.cssRules;
  const parts = ['#' + rules.length];
  for (let k = 0; k < rules.length; k++) parts.push(record(rules[k]));
  st.remove();
  return parts.join(' ~ ');
}

function paints(text, id, prop) {
  const div = document.createElement('div');
  div.id = 'probe-' + id;
  document.body.appendChild(div);
  const st = document.createElement('style');
  st.textContent = text;
  document.head.appendChild(st);
  const v = getComputedStyle(div)[prop];
  st.remove(); div.remove();
  return v;
}
emit('c01_mediaOnSheet', paints('@media screen { #probe-a { color: rgb(9, 9, 9) } }', 'a', 'color'));
emit('c02_pageThenStyle', paints('@page { margin: 1cm } #probe-b { color: rgb(8, 8, 8) }', 'b', 'color'));
emit('c03_namespaceId', paints('@namespace url(n.css); #probe-c { color: rgb(7, 7, 7) }', 'c', 'color'));
emit('c04_namespaceType', paints('@namespace url(n.css); div#probe-d { color: rgb(6, 6, 6) }', 'd', 'color'));
