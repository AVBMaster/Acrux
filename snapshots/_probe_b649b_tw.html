<!doctype html><html><head><meta charset="utf-8"><style>body{margin:8px}</style></head><body><div id="out"></div>
<script>
const out=[];
function tw(css){const d=document.createElement("div");d.setAttribute("style",css);document.body.appendChild(d);const v=getComputedStyle(d).textWrapStyle;d.remove();return v.split(" ").join("_");}
out.push("L~balance~"+tw("text-wrap:balance"));
out.push("L~tw-style~"+tw("text-wrap-style:balance"));
out.push("L~tw-plain~"+tw("text-wrap:wrap"));
document.getElementById("out").textContent=out.join("\n");
</script></body></html>
