<!DOCTYPE html><html><head><style>

.pa{position:absolute;left:0;top:0;width:200px;height:100px;border:10px solid #333;}
.nm{width:200px;height:100px;border:10px solid #333}
.pr{position:relative;width:200px;height:100px;border:10px solid #333}
.kid{width:40px;height:40px;background:#f00;margin:0}
</style></head><body>
<div class="pa"><div class="kid"></div></div>

<div class="pr" style="margin-left:600px"><div class="kid"></div></div>
</body></html>
