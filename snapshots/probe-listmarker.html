<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#fff;font-family:Arial;font-size:16px;}
ul{margin:0;padding-left:40px;}
li.outside{list-style-position:outside;}
li.inside{list-style-position:inside;}
li.red::marker{color:rgb(255,0,0);}
ol.dec{padding-left:40px;}
</style></head><body>
<ul>
<li class="outside">outside one</li>
<li class="inside red">inside red marker</li>
<li class="inside">inside two</li>
</ul>
<ol class="dec"><li>decimal one</li><li class="red">decimal red</li></ol>
</body></html>
