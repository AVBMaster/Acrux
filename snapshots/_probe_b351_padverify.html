<!doctype html><html><body><pre id=rec></pre><script>
const out=[];
const box=document.createElement('div');document.body.appendChild(box);
function t(v){box.style.cssText='';box.style.padding=v;out.push('padding='+JSON.stringify(v)+' || sup='+CSS.supports('padding',v)+' || echo='+JSON.stringify(box.style.padding));}
t('0'); t('10px'); t('10px 20px'); t('10px 20px 30px 40px');
t('auto'); t('-10px'); t('10%'); t('bogus');
box.remove();
document.getElementById('rec').textContent=out.join('\n');
console.log(out.join('\n'));
</script></body></html>
