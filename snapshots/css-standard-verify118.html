<!DOCTYPE html><head><style>
body{margin:20px;font:16px/24px Arial}
p{border:1px solid #ccc;margin:6px 0;background:#eef}
.lhu{font-size:1lh}            /* 24px (line-height of parent) */
.lhu2{line-height:2lh}         /* 48px */
.rlh{font-size:1rlh}           /* root line-height 24 */
.vw{font-size:calc(10vw)}      /* 10% of viewport width */
.vh{height:10vh}
.svh{font-size:10svh}
.lvh{font-size:10lvh}
.cap{font-size:2cap}           /* 2 * cap-height */
.ex{font-size:4ex}             /* 4 * x-height */
.ic{font-size:2ic}
</style><body>
<p class="lhu">Aa</p>
<p class="lhu2">Line one<br>two</p>
<p class="rlh">Bb</p>
<p class="vw">Cc</p>
<p class="svh">Dd</p>
<p class="lvh">Ee</p>
<p class="cap">Ff</p>
<p class="ex">Gg</p>
<p class="ic">Hh</p>
</body></html>
