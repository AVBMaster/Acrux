<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body{margin:0;font:14px sans-serif;background:#000}
.g{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);
   width:301px;height:101px;background:#fff;margin:10px}
.g>div{color:#fff}
.r{background:#d2691e}.p{background:#6a5acd}.t{background:#2e8b57}
</style></head>
<body>
<div class="g">
 <div class="r">a</div><div class="p">b</div><div class="t">c</div>
 <div class="t">d</div><div class="r">e</div><div class="p">f</div>
</div>
<div style="display:grid;grid-template-columns:100.5px 100.5px 100.5px;height:40px;margin:10px;background:#fff">
 <div style="background:#d2691e">x</div><div style="background:#6a5acd">y</div><div style="background:#2e8b57">z</div>
</div>
</body></html>
