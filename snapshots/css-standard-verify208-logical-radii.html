<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS Standard Verification Batch 208 - logical corner radii and the grid/overscroll aliases</title>
<style>
/* An audit of every CssPropertyId against the applier's switch found 134 ids with no
   case at all — declarations that parse, match, and are then thrown away. This batch
   covers the alias family of that list, which is self-contained and measurable:

     border-start-start-radius / border-start-end-radius /
     border-end-start-radius  / border-end-end-radius      (CSS Backgrounds 3 §5.3)
     overscroll-behavior-block / overscroll-behavior-inline (CSS Overscroll 1 §3)
     grid-gap / grid-row-gap / grid-column-gap              (CSS Grid 1 §2.1.1 legacy)

   The logical corners address EDGES, so 'direction: rtl' swaps the horizontal pair —
   and, like the logical box properties of b201, they resolve against the FINAL
   computed 'direction' through the same replay queue.

   EDGE TRUTH (dpr 1, viewport 383), computed per corner after the fix (ours matches):
     r1 LTR  border-start-start-radius:20  -> TL=20, TR=0,  BR=0,  BL=0
     r2 RTL  border-start-start-radius:20  -> TL=0,  TR=20, BR=0,  BL=0
     r3 RTL  border-end-end-radius:20      -> TL=0,  TR=0,  BR=0,  BL=20
     e1 border-top-left-radius:10px 30px   -> '10px 30px' (the elliptical pair survives)
     g1 grid-gap:10px 20px                 -> row-gap 10 / column-gap 20
     g2 grid-row-gap:7px grid-column-gap:9px -> 7 / 9
     o1 overscroll-behavior-block:contain; overscroll-behavior-inline:none
        -> overscroll-behavior-y=contain, -x=none
   Also fixed here: every 'border-<corner>-radius' Copy case in CssPropertyTraits copied
   ONLY the horizontal radius, so 'inherit'/'initial' flattened every elliptical corner,
   and 'border-radius' copied just the top-left corner instead of all four.
*/
body { font: 12px/16px Arial, sans-serif; margin: 8px; color: #111; background: #fff; }
div { margin: 4px 0; }
.tile { width: 60px; height: 60px; background: rgb(255, 128, 128); }
.r1 { border-start-start-radius: 20px; }
.r2 { border-start-start-radius: 20px; direction: rtl; }
.r3 { border-start-end-radius: 20px; direction: rtl; }
.r4 { border-end-start-radius: 20px; }
.r5 { border-end-end-radius: 20px; }
.rtl-after { border-start-start-radius: 20px; }
.e1 { border-top-left-radius: 10px 30px; }
.g1 { display: grid; grid-template-columns: 20px 20px; grid-template-rows: 20px 20px;
      grid-gap: 10px 20px; width: 100px; }
.g2 { display: grid; grid-template-columns: 20px 20px; grid-template-rows: 20px 20px;
      grid-row-gap: 7px; grid-column-gap: 9px; width: 100px; }
.o1 { overscroll-behavior-block: contain; overscroll-behavior-inline: none;
      overflow: auto; width: 40px; height: 40px; background: #ddf; }
</style></head>
<body>

<h2>1. logical corner radii, LTR and RTL (pixel-probed)</h2>
<div id="r1" class="tile r1"></div>
<div id="r2" class="tile r2"></div>
<div id="r3" class="tile r3"></div>
<div id="r4" class="tile r4"></div>
<div id="r5" class="tile r5"></div>
<div class="rtl-after" style="direction:rtl"><div id="r6" class="tile r1">start-start under an RTL parent</div></div>

<h2>2. elliptical corners through inherit/initial</h2>
<div id="e1" class="tile e1"></div>
<div style="border-top-left-radius:10px 30px"><div id="e2" class="tile" style="border-top-left-radius:inherit">inherited elliptical</div></div>

<h2>3. legacy grid gap aliases</h2>
<div id="g1" class="g1"><p>a</p><p>b</p><p>c</p><p>d</p></div>
<div id="g2" class="g2"><p>a</p><p>b</p><p>c</p><p>d</p></div>

<h2>4. logical overscroll axes</h2>
<div id="o1" class="o1">scroll me</div>

</body>
</html>
