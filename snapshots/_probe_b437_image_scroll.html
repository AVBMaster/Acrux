<!doctype html><html><body><pre id=rec></pre><script>
const out=[];
function s(label,el,props){ try{ const cs=getComputedStyle(el); const parts=[];
  for(const p of props) parts.push(p+'='+cs.getPropertyValue(p));
  out.push(label+' '+parts.join(' | ')); }catch(e){ out.push(label+' ERR '+e.message); } }
function mk(css){const d=document.createElement('div');d.style.cssText=css;document.body.appendChild(d);return d;}
function sup(prop,val){ try{ return CSS.supports(prop,val)?'Y':'N'; }catch(e){ return 'ERR'; } }
// b437: image handling + scroll behavior family
s('img-orient-none', mk('image-orientation:none'), ['image-orientation']);
s('img-orient-from', mk('image-orientation:from-image'), ['image-orientation']);
s('img-orient-flip', mk('image-orientation:flip'), ['image-orientation']);
s('img-orient-90', mk('image-orientation:90deg'), ['image-orientation']);
s('img-orient-flip90', mk('image-orientation:90deg flip'), ['image-orientation']);
s('img-render-auto', mk('image-rendering:auto'), ['image-rendering']);
s('img-render-crisp', mk('image-rendering:crisp-edges'), ['image-rendering']);
s('img-render-pixel', mk('image-rendering:pixelated'), ['image-rendering']);
s('img-render-bogus', mk('image-rendering:bogus'), ['image-rendering']);
s('img-set-res', mk('image-set-resolution:1dppx'), ['image-set-resolution']);
s('scroll-beh-smooth', mk('scroll-behavior:smooth'), ['scroll-behavior']);
s('scroll-beh-auto', mk('scroll-behavior:auto'), ['scroll-behavior']);
s('scrollbar-gutter', mk('scrollbar-gutter:stable'), ['scrollbar-gutter']);
s('scrollbar-gutter-both', mk('scrollbar-gutter:stable both-edges'), ['scrollbar-gutter']);
s('scrollbar-width', mk('scrollbar-width:thin'), ['scrollbar-width']);
s('scrollbar-color', mk('scrollbar-color:red blue'), ['scrollbar-color']);
s('scroll-start', mk('scroll-start-block:start'), ['scroll-start-block']);
s('scroll-start-center', mk('scroll-start-inline:center'), ['scroll-start-inline']);
s('scroll-marker-group', mk('scroll-marker-group:auto'), ['scroll-marker-group']);
out.push('SUP image-orientation:from-image = '+sup('image-orientation','from-image'));
out.push('SUP image-orientation:90deg flip = '+sup('image-orientation','90deg flip'));
out.push('SUP image-rendering:pixelated = '+sup('image-rendering','pixelated'));
out.push('SUP scrollbar-gutter:stable both-edges = '+sup('scrollbar-gutter','stable both-edges'));
out.push('SUP scrollbar-width:thin = '+sup('scrollbar-width','thin'));
out.push('SUP scrollbar-color:red blue = '+sup('scrollbar-color','red blue'));
out.push('SUP scroll-behavior:smooth = '+sup('scroll-behavior','smooth'));
out.push('SUP scroll-marker-group:auto = '+sup('scroll-marker-group','auto'));
document.getElementById('rec').textContent=out.join('\n');
</script></body></html>
