<!DOCTYPE html><head><style>
body{margin:20px;font:16px Arial}
.wrap{width:300px;border:1px solid #ccc;margin-bottom:14px;padding:4px}
.b1{width:max-content;background:#cfe;border:1px solid #080}
.b2{width:min-content;background:#fec;border:1px solid #a80}
.b3{width:fit-content;background:#eef;border:1px solid #55a}
.ib1{display:inline-block;width:max-content;background:#cfc;border:1px solid #080}
.ib2{display:inline-block;width:min-content;background:#fcc;border:1px solid #a00}
.pad{width:max-content;padding:10px;border:1px solid #000;background:#eee}
.long{width:max-content;background:#dff}
</style><body>
<div class="wrap"><div class="b1">Maximum content width of this line</div></div>
<div class="wrap"><div class="b2">Supercalifragilisticexpialidocious</div></div>
<div class="wrap"><div class="b3">Fit content behavior here</div></div>
<div class="wrap"><div class="ib1">inline-block max-content text</div></div>
<div class="wrap"><div class="ib2">inline-block min-content</div></div>
<div class="wrap"><div class="pad">padded max-content</div></div>
<div class="wrap"><div class="long">word1 word2 word3 word4 word5 word6 word7 word8</div></div>
</body></html>
