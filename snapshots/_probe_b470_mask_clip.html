<!doctype html><html><body><pre id=rec></pre><script>
const out=[];
function s(label,css,props){ try{ const d=document.createElement('div'); d.style.cssText=css;
  document.body.appendChild(d); const cs=getComputedStyle(d); const parts=[];
  for(const p of props) parts.push(p+'='+cs.getPropertyValue(p));
  out.push(label+' '+parts.join(' | ')); d.remove(); }
  catch(e){ out.push(label+' ERR '+e.message); } }
// b470: mask + clip-path
s('mask-none','mask:none',['mask-image','mask-mode']);
s('mask-img','mask-image:url(m.png)',['mask-image']);
s('mask-size','mask-size:50% 50%',['mask-size']);
s('mask-repeat','mask-repeat:no-repeat',['mask-repeat']);
s('mask-pos','mask-position:center',['mask-position']);
s('mask-clip','mask-clip:border-box',['mask-clip']);
s('mask-origin','mask-origin:padding-box',['mask-origin']);
s('mask-composite','mask-composite:add',['mask-composite']);
s('mask-mode-alpha','mask-mode:alpha',['mask-mode']);
s('mask-mode-lum','mask-mode:luminance',['mask-mode']);
s('clip-none','clip-path:none',['clip-path']);
s('clip-circle','clip-path:circle(50%)',['clip-path']);
s('clip-ellipse','clip-path:ellipse(50% 50%)',['clip-path']);
s('clip-inset','clip-path:inset(10px)',['clip-path']);
s('clip-polygon','clip-path:polygon(0% 0%,100% 0%,100% 100%)',['clip-path']);
s('clip-path','clip-path:path("M 0 0 L 100 100")',['clip-path']);
s('clip-margin-box','clip-path:circle(50% at center)',['clip-path']);
s('clip-rule','clip-path:polygon(evenodd,0% 0%,100% 0%,100% 100%)',['clip-path']);
out.push('SUP mask-image:url(m.png) = '+(()=>{try{return CSS.supports('mask-image','url(m.png)')?'Y':'N';}catch(e){return 'ERR';}})());
out.push('SUP clip-path:circle(50%) = '+(()=>{try{return CSS.supports('clip-path','circle(50%)')?'Y':'N';}catch(e){return 'ERR';}})());
out.push('SUP clip-path:polygon(0% 0%,100% 0%,100% 100%) = '+(()=>{try{return CSS.supports('clip-path','polygon(0% 0%,100% 0%,100% 100%)')?'Y':'N';}catch(e){return 'ERR';}})());
out.push('SUP mask-mode:alpha = '+(()=>{try{return CSS.supports('mask-mode','alpha')?'Y':'N';}catch(e){return 'ERR';}})());
document.getElementById('rec').textContent=out.join('\n');
</script></body></html>
