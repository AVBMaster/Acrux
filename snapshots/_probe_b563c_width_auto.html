<!doctype html><html><head><style>
  #plain { }
  #initial { width: initial; }
  #explicit-auto { width: auto; }
</style></head><body>
<div id="plain">plain</div>
<div id="initial">initial</div>
<div id="explicit-auto">auto</div>
<pre id="rec"></pre>
<script>
const out=[];
['plain','initial','explicit-auto'].forEach(id=>{
  out.push(id+' width='+JSON.stringify(getComputedStyle(document.getElementById(id)).width));
});
document.getElementById('rec').textContent=out.join('\n');
</script></body></html>
