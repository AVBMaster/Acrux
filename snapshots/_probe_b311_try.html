<!doctype html>
<html><head><meta charset="utf-8"><title>b311 try</title></head>
<body>
<div id="host"></div>
<script>
// b311_try
function build() {
const host = document.createElement('div');
document.body.appendChild(host);
const rows = [];
const cases = [["position-try-fallbacks","top left"],["position-try-fallbacks","left top"],["position-try-fallbacks","top center"],["position-try-fallbacks","block-start inline-end"],["position-try-fallbacks","inline-start block-end"],["position-try-fallbacks","span-all start"],["position-try-fallbacks","start span-all"],["position-try-fallbacks","top span-all"],["position-try-fallbacks","flip-start top left"],["position-try-fallbacks","flip-block span-all center"],["position-try-fallbacks","none"],["position-try-fallbacks","center center"],["position-try-fallbacks","self-start center"],["position-try-fallbacks","top self-start"],["position-try","top left"],["position-try","most-width inline-start block-end"],["position-try","flip-block left top"],["position-area","top left"],["position-area","block-start inline-start"]];
for (let i = 0; i < cases.length; i++) {
const el = document.createElement('div');
host.appendChild(el);
  el.style.setProperty(cases[i][0], cases[i][1]);
  rows.push(i + '|' + cases[i][0] + '|' + cases[i][1]
      + '|sup=' + (CSS.supports(cases[i][0], cases[i][1]) ? 1 : 0)
      + '|echo=' + el.style.getPropertyValue(cases[i][0])
      + '|comp=' + getComputedStyle(el).getPropertyValue(cases[i][0]));
}
document.body.insertAdjacentHTML('beforeend',
    '<pre id="record" style="font:10px/1.35 monospace;white-space:pre-wrap">'
    + rows.join('\n') + '</pre>');
console.log(rows.join('\n'));
host.remove();
}
build();
</script>
</body></html>
