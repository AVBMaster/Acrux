<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{font:14px Arial;color:#111;margin:8px}
#a{border:3px solid linktext;width:60px;height:16px}
#b{border:4px outset buttonface;background:field;width:60px;height:16px}
#c{outline:3px solid highlight;width:60px;height:16px}
#d{box-shadow:0 0 0 4px graytext;width:60px;height:16px}
#e{border:3px solid LINKTEXT;width:60px;height:16px}
#f{background:BUTTONFACE;width:60px;height:16px}
#g{border:3px solid boguscolour;width:60px;height:16px}
#log{font:12px Consolas,monospace;white-space:pre}
</style></head><body>
<div id="a"></div><div id="b"></div><div id="c"></div><div id="d"></div>
<div id="e"></div><div id="f"></div><div id="g"></div>
<div id="log"></div>
<script>
var log=document.getElementById("log");
function emit(t){log.textContent+=t+"\n";}
["a","b","c","d","e","f","g"].forEach(function(id){
 var el=document.getElementById(id),cs=getComputedStyle(el);
 emit(id+" bt="+cs.borderTopColor+" bw="+cs.borderTopWidth+" bg="+cs.backgroundColor+" out="+cs.outlineColor+" shadow="+cs.boxShadow+" cssText="+el.currentStyle);
});
</script></body></html>
