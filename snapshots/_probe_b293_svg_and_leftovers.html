var out = [];
for (var i = 0; i < CASES.length; i++) {
  var decl = CASES[i];
  var prop = decl.slice(0, decl.indexOf(':')).trim();
  var value = decl.slice(decl.indexOf(':') + 1).trim();
  var d = document.createElement('div');
  document.getElementById('box').appendChild(d);
  d.style.setProperty(prop, value);
  var names = [];
  for (var j = 0; j < d.style.length; j++) names.push(d.style.item(j));
  void d.offsetHeight;
  var sup = 'ERR';
  try { sup = CSS.supports(prop, value) ? '1' : '0'; } catch (e) {}
  var extra = '';
  if (prop === 'border-spacing') {
    extra = '|h=' + d.style.getPropertyValue('-webkit-border-horizontal-spacing')
          + '|v=' + d.style.getPropertyValue('-webkit-border-vertical-spacing');
  }
  out.push(i + '|' + prop + '|' + value + '|n=' + d.style.length + '|names=' + names.join(',')
    + '|echo=' + d.style.getPropertyValue(prop) + '|comp=' + getComputedStyle(d).getPropertyValue(prop)
    + '|sup=' + sup + '|text=' + d.style.cssText + extra);
}

document.getElementById('report').textContent = text;
