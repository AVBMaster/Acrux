<!doctype html><html><head><style>
body{margin:0;font:20px/1.2 Arial}
.clip-text{font-size:48px;font-weight:bold;background:linear-gradient(to right,red,blue);-webkit-background-clip:text;-webkit-text-fill-color:transparent;color:transparent;padding:10px}
.multi-bg{width:200px;height:100px;background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==),linear-gradient(to right,red,blue);background-size:cover,cover;background-position:center,center;padding:10px}
.ratio{width:200px;aspect-ratio:16/9;background:#fcc}
.object-fit{width:100px;height:100px;object-fit:cover;background:#ccf}
.filter{width:100px;height:50px;background:red;filter:blur(2px) brightness(1.2)}
.transform{width:100px;height:50px;background:green;transform:rotate(15deg) translate(10px,10px)}
</style></head><body>
<div class="clip-text">Gradient Text</div>
<div class="ratio">16:9</div>
<div class="filter">blur</div>
<div class="transform">transform</div>
</body></html>
