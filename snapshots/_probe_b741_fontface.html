<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:8px;font:14px monospace}
@font-face{
  font-family:"TestFont";
  src:url("data:font/woff2;base64,d09GMgABAAAAAAAA") format("woff2");
  font-weight:400;
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:"BoldFont";
  src:url("data:font/woff2;base64,d09GMgABAAAAAAAA") format("woff2");
  font-weight:700;
  font-display:block;
}
</style></head><body><div id="out"></div>
<script>
const out=[];
function L(t,v){out.push("L~"+t+"~"+String(v).split(" ").join("_"));}
// document.fonts API
const fs=document.fonts;
L("fonts-type",fs instanceof FontFaceSet);
L("fonts-status",fs.status);
L("fonts-size",fs.size);
// check FontFace entries
const entries=[...fs];
L("fonts-entries",entries.length);
if(entries.length>0){
  const ff=entries[0];
  L("ff-family",ff.family);
  L("ff-weight",ff.weight);
  L("ff-style",ff.style);
  L("ff-display",ff.display);
  L("ff-status",ff.status);
}
// document.fonts.check
L("fonts-check-serif",document.fonts.check("16px serif"));
L("fonts-check-test",document.fonts.check("16px TestFont"));
// font-display values
function gc(tag,css,prop){
  const d=document.createElement("div");d.setAttribute("style",css);document.body.appendChild(d);
  const v=getComputedStyle(d).getPropertyValue(prop).trim();
  L(tag,prop+"="+(v===""?"(empty)":v.split(" ").join("_")));d.remove();
}
gc("fd-swap","font-family:TestFont;font-display:swap","font-display");
gc("fd-block","font-family:BoldFont;font-display:block","font-display");
gc("fd-auto","font-display:auto","font-display");
gc("fd-fallback","font-display:fallback","font-display");
gc("fd-optional","font-display:optional","font-display");
document.getElementById("out").textContent=out.join("\n");
</script></body></html>
