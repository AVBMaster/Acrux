<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>b273 sweep2</title>
<style>body{font:12px monospace;margin:0}</style></head><body>
<pre id="report"></pre>
<script>
var CASES = [
  ["text-transform","capitalize"],["text-transform","full-width"],["text-transform","uppercase first-letter"],
  ["white-space","break-spaces"],["word-break","keep-all"],["overflow-wrap","anywhere"],
  ["vertical-align","text-top"],["vertical-align","20%"],
  ["float","inline-start"],["clear","both"],
  ["display","flow-root"],["display","list-item inline-block"],["display","table caption"],
  ["font","bold 12px/1.5 Arial"],["font","italic small-caps 14px serif"],
  ["direction","rtl"],["unicode-bidi","isolate"],["writing-mode","vertical-lr"],
  ["cursor","pointer"],["cursor","grab"],["resize","both"],
  ["border-top-left-radius","10px 20px"],
  ["column-gap","normal"],["row-gap","10px"],
  ["break-before","page"],["page-break-after","always"],
  ["text-orientation","mixed"],["all","initial"],
  ["scroll-snap-type","y mandatory"],["touch-action","pan-x pinch-zoom"],
  ["text-align","justify"],["text-align","start"],
  ["hyphens","manual"],["tab-size","4em"],
  ["line-height","150%"],["letter-spacing","normal"],
  ["word-spacing","normal"],["text-indent","3em"]
];
var host = document.createElement('div'); document.body.appendChild(host);
function spec(p,v){ host.setAttribute('style',''); host.style.setProperty(p,v); return host.style.getPropertyValue(p); }
function comp(p,v){ host.setAttribute('style',''); host.style.setProperty(p,v); return getComputedStyle(host).getPropertyValue(p); }
var out=[];
for (var i=0;i<CASES.length;i++){ var p=CASES[i][0],v=CASES[i][1];
  out.push(i+'|'+p+'|'+v+'|S='+spec(p,v)+'|C='+comp(p,v)); }
document.getElementById('report').textContent=out.join('\n');
console.log(out.join('\n'));
</script></body></html>
