<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  body { margin: 0; }
  .g { width: 160px; height: 80px; margin: 0; }
  #a { background: linear-gradient(45deg, #f00 0 50%, #00f 50% 100%); }
  #b { background: linear-gradient(90deg, #f00 0 50%, #00f 50% 100%); }
  #c { background: linear-gradient(180deg, #f00 0 50%, #00f 50% 100%); }
  #d { background: linear-gradient(30deg, #f00 0 50%, #00f 50% 100%); }
  #e { background: linear-gradient(#e33, #33e); }
</style></head><body>
<div id="a" class="g"></div>
<div id="b" class="g" style="position:absolute; top:0; left:170px"></div>
<div id="c" class="g" style="position:absolute; top:90px; left:0"></div>
<div id="d" class="g" style="position:absolute; top:90px; left:170px"></div>
<div id="e" class="g" style="position:absolute; top:180px; left:0"></div>
</body></html>
