<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>b248 individual transforms</title><!--
  The individual transform properties and their neighbours (CSS Transforms 2 &sect;4&ndash;&sect;6, &sect;5). Every case
  is a div that carries ONE declaration inline and names the property in a data-p attribute; the
  script at the bottom reads the computed value of exactly that property for every case and prints
  one assertion per row, so the whole grammar of the four properties is gated through the CSSOM
  rather than through screenshots.

  The rules recorded here were each measured against a reference engine:
   * 'translate' is 'none | <length-percentage> [<length-percentage> <length>?]?' -- the third
     component is NOT a percentage, and the computed value is the shortest list that still means the
     same thing: a zero z is dropped, then a zero y, so 'translate: 0 0' computes '0px' while
     'translate: 0%% 0%%' keeps both, because a percentage and a length are different values.
   * 'rotate' normalises a coordinate axis onto the x/y/z keyword and folds the sign of the vector
     component into the angle, and only keeps the three-number spelling for an axis that is not one
     of the three; angles always compute to 'deg'.
   * 'scale' takes numbers (percentages become numbers) and serialises the shortest list: a z of one
     is dropped, then a y equal to x.
   * 'perspective' is a non-negative length only -- no percentage, no 'auto' -- resolved to px at
     computed-value time.
   * 'transform-box' and 'backface-visibility' keyword grammars, and the initial value of all eight.
   * 'transform-origin' / 'perspective-origin' are asserted on a 200x100 box, because a reference
     engine resolves the percentages of an origin against the border box at computed-value time
     ('50% 25%' of that box is '100px 25px') -- the keywords resolve to the same thing ('center' is
     50%, 'right' is 100% of the width), and a one-component origin leaves the other at its initial
     'center'.

  The painted boxes above the report prove the engine draws with those same values: a red 60x60 box
  inside a dotted frame, so the frame is where the box WAS and the fill is where it got to.
--><style>
