<!doctype html><html><head><meta charset="utf-8"><style>body{margin:8px}</style></head><body><div id="out"></div>
<script>
const out=[];
function L(t,v){out.push("L~"+t+"~"+v);}
function gc(tag,css,prop){
  const d=document.createElement("div");d.setAttribute("style",css);document.body.appendChild(d);
  const v=getComputedStyle(d).getPropertyValue(prop).trim();
  L(tag,prop+"="+(v===""?"EMPTY":v));
  d.remove();
}
gc("bs-inset","box-shadow:inset 5px 5px 10px rgba(0,0,0,0.5)","box-shadow");
gc("bs-multi","box-shadow:2px 2px red,4px 4px blue","box-shadow");
gc("bs-spread","box-shadow:0 0 10px 5px green","box-shadow");
gc("bs-none","box-shadow:none","box-shadow");
gc("radial","background:radial-gradient(circle at 30% 30%,white,black)","background-image");
document.getElementById("out").textContent=out.join("\n");
</script></body></html>
