<!doctype html><html><body><pre id=rec></pre><script>
const out=[];
function s(label,css,props){ try{ const d=document.createElement('div'); d.style.cssText=css;
  document.body.appendChild(d); const cs=getComputedStyle(d); const parts=[];
  for(const p of props) parts.push(p+'='+cs.getPropertyValue(p));
  out.push(label+' '+parts.join(' | ')); d.remove(); }
  catch(e){ out.push(label+' ERR '+e.message); } }
// b472: columns family
s('col-count','column-count:3',['column-count']);
s('col-width','column-width:100px',['column-width']);
s('col-width-auto','column-width:auto',['column-width']);
s('col-gap','column-gap:20px',['column-gap']);
s('col-gap-normal','column-gap:normal',['column-gap']);
s('col-rule-w','column-rule-width:3px',['column-rule-width']);
s('col-rule-style','column-rule-style:dashed',['column-rule-style']);
s('col-rule-color','column-rule-color:red',['column-rule-color']);
s('col-rule','column-rule:2px solid blue',['column-rule-width','column-rule-style','column-rule-color']);
s('col-rule-none','column-rule:none',['column-rule-style','column-rule-width']);
s('col-span','column-span:all',['column-span']);
s('col-span-none','column-span:none',['column-span']);
s('col-fill','column-fill:balance',['column-fill']);
s('col-fill-auto','column-fill:auto',['column-fill']);
s('columns-sh','columns:3',['column-count','column-width']);
s('columns-sh-px','columns:100px',['column-count','column-width']);
s('columns-sh-2','columns:2 100px',['column-count','column-width']);
out.push('SUP column-count:3 = '+(()=>{try{return CSS.supports('column-count','3')?'Y':'N';}catch(e){return 'ERR';}})());
out.push('SUP column-rule:2px solid blue = '+(()=>{try{return CSS.supports('column-rule','2px solid blue')?'Y':'N';}catch(e){return 'ERR';}})());
out.push('SUP column-span:all = '+(()=>{try{return CSS.supports('column-span','all')?'Y':'N';}catch(e){return 'ERR';}})());
out.push('SUP column-fill:balance = '+(()=>{try{return CSS.supports('column-fill','balance')?'Y':'N';}catch(e){return 'ERR';}})());
document.getElementById('rec').textContent=out.join('\n');
</script></body></html>
