<!doctype html>
<html><head><meta charset="utf-8"><title>b312 anchor</title></head>
<body>
<div id="host"></div>
<script>
// b312_anchor
function build() {
const host = document.createElement('div');
document.body.appendChild(host);
const rows = [];
const cases = [["width","anchor-size(width)"],["width","anchor-size(self-inline)"],["width","anchor-size(self-block)"],["width","anchor-size(--a width)"],["width","anchor-size(--a self-end)"],["width","anchor-size(width, 10px)"],["width","calc(anchor-size(width) + 10px)"],["width","calc(10px + anchor-size(width))"],["width","calc(anchor-size(width) * 2)"],["width","calc(10px + 1em)"],["width","calc(1em + 10px)"],["width","calc(1px + 2% + 3em)"],["width","calc(anchor-size(width) + anchor-size(height))"],["width","calc(anchor-size(self-inline) + 10px)"],["width","calc(10px + anchor-size(--a width))"],["width","calc(anchor-size(width))"],["width","anchor-size()"],["width","anchor-size(self-inline, 10px)"],["height","anchor-size(height)"],["width","min(anchor-size(width), 100px)"]];
for (let i = 0; i < cases.length; i++) {
const el = document.createElement('div');
host.appendChild(el);
  el.style.setProperty(cases[i][0], cases[i][1]);
  rows.push(i + '|' + cases[i][0] + '|' + cases[i][1]
      + '|sup=' + (CSS.supports(cases[i][0], cases[i][1]) ? 1 : 0)
      + '|echo=' + el.style.getPropertyValue(cases[i][0])
      + '|comp=' + getComputedStyle(el).getPropertyValue(cases[i][0]));
}
document.body.insertAdjacentHTML('beforeend',
    '<pre id="record" style="font:10px/1.35 monospace;white-space:pre-wrap">'
    + rows.join('\n') + '</pre>');
console.log(rows.join('\n'));
host.remove();
}
build();
</script>
</body></html>
