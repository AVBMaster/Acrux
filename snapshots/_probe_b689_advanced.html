<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:8px;font:14px monospace}
.row{white-space:pre;font:12px monospace}
</style></head><body><div id="out"></div>
<script>
const out=[];
function L(t,v){out.push("L~"+t+"~"+String(v).split(" ").join("_"));}
function gc(tag,css,prop){
  const d=document.createElement("div");d.setAttribute("style",css);document.body.appendChild(d);
  const v=getComputedStyle(d).getPropertyValue(prop).trim();
  L(tag,prop+"="+(v===""?"(empty)":v.split(" ").join("_")));d.remove();
}
// contain
gc("contain-layout","contain:layout","contain");
gc("contain-paint","contain:paint","contain");
gc("contain-size","contain:size","contain");
gc("contain-content","contain:content","contain");
gc("contain-strict","contain:strict","contain");
gc("contain-none","contain:none","contain");
gc("contain-inline-size","contain:inline-size","contain");
// content-visibility
gc("cv-visible","content-visibility:visible","content-visibility");
gc("cv-hidden","content-visibility:hidden","content-visibility");
gc("cv-auto","content-visibility:auto","content-visibility");
// ruby
gc("ruby-align","ruby-align:center","ruby-align");
gc("ruby-position","ruby-position:over","ruby-position");
// print / page break
gc("page-break-before","page-break-before:always","page-break-before");
gc("page-break-inside","page-break-inside:avoid","page-break-inside");
gc("break-inside","break-inside:avoid-column","break-inside");
gc("break-before","break-before:column","break-before");
// columns
gc("columns-short","columns:2","column-count");
gc("columns-2","columns:2","column-width");
gc("column-fill","column-fill:balance","column-fill");
gc("column-rule","column-rule:1px solid red","column-rule");
// will-change
gc("wc-multi","will-change:transform,opacity","will-change");
gc("wc-auto","will-change:auto","will-change");
// isolation / mix-blend
gc("isolate","isolation:isolate","isolation");
gc("blend-multiply","mix-blend-mode:multiply","mix-blend-mode");
// forced-colors media
L("forced-colors",matchMedia("(forced-colors:active)").matches);
// print media
L("print-media",matchMedia("print").matches);
document.getElementById("out").textContent=out.join("\n");
</script></body></html>
