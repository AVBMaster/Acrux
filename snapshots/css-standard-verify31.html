<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  body { font-family: Arial; font-size: 24px; margin: 8px; }
  h2 { font-size: 14px; background: #eee; margin: 8px 0 4px; }
  .box { width: 90px; height: 46px; border: 5px solid #36c; background: #fd8; margin-bottom: 10px; }
</style></head><body>
<h2>1. border-radius percentages and ellipses (blocked by #92)</h2>
<h2>6. border-radius percentages and ellipses</h2>
<div class="box" style="border-radius: 50%"></div>
<div class="box" style="border-radius: 100%"></div>
<div class="box" style="border-radius: 50% / 100%"></div>
<div class="box" style="border-radius: 20% 40% 20% 40%"></div>
<div class="box" style="border-radius: 40px 0 40px 0"></div>
</body></html>
