<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body { margin: 0; padding: 0; font-family: Arial, sans-serif; font-size: 16px; line-height: 20px; }
table { border-collapse: collapse; width: 120px; }
td { border: 1px solid rgb(0,0,0); }
caption { text-align: left; }
#c1 { height: 14px; background: rgb(255,0,0); }
#c2 { height: 14px; box-sizing: border-box; background: rgb(0,255,0); }
#c3 { height: 14px; line-height: 8px; background: rgb(0,0,255); }
#c4 { height: 14px; padding: 0; border: 0; background: rgb(255,255,0); }
#c5 { background: rgb(255,0,255); }
</style>
</head>
<body>
<table><caption id="c1">h14</caption><tr><td>a</td></tr></table>
<table><caption id="c2">bb14</caption><tr><td>b</td></tr></table>
<table><caption id="c3">lh8</caption><tr><td>c</td></tr></table>
<table><caption id="c4">pad0</caption><tr><td>d</td></tr></table>
<table><caption id="c5">auto</caption><tr><td>e</td></tr></table>
</body>
</html>
