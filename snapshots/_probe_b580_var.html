<!doctype html><html><head><meta charset=utf-8><style>
body{font:12px monospace;margin:4px}
/* basic var */
#v1{--c:red;color:var(--c)}
/* var fallback when undefined */
#v2{color:var(--undefined,green)}
/* var in shorthand */
#v3{--w:30px;width:var(--w);height:20px;background:#eef}
/* var chain */
#v4{--a:var(--b);--b:blue;color:var(--a)}
/* var used before declared (cascade order) */
#v5{color:var(--late);--late:purple}
/* calc with var */
#v6{--n:10px;width:calc(var(--n) * 2);height:20px;background:#ffe}
/* invalid var value -> unset/inherit */
#v7{--bad:10px;color:var(--bad,red)} /* invalid color -> fallback */
/* var in registered shorthand-ish (border) */
#v8{--bw:3px;border:var(--bw) solid black;width:40px;height:20px}
/* empty var */
#v9{--empty:;color:var(--empty,green)}
/* nested fallback */
#v10{color:var(--x,var(--y,orange))}
/* var with space */
#v11{--sp:12 px;color:red;width:40px;height:20px;background:var(--sp)}
/* var on custom prop referencing another empty */
#v12{--e:;--f:var(--e);color:var(--f,teal)}
</style></head><body>
<div id=v1>v1</div>
<div id=v2>v2</div>
<div id=v3>v3</div>
<div id=v4>v4</div>
<div id=v5>v5</div>
<div id=v6>v6</div>
<div id=v7>v7</div>
<div id=v8>v8</div>
<div id=v9>v9</div>
<div id=v10>v10</div>
<div id=v11>v11</div>
<div id=v12>v12</div>
<script>
const ids=["v1","v2","v3","v4","v5","v6","v7","v8","v9","v10","v11","v12"];
const g=id=>{const e=document.getElementById(id);const s=getComputedStyle(e);
 const w=s.width!=="auto"?" w="+Math.round(e.getBoundingClientRect().width):"";
 return id+":color="+s.color+w;};
document.body.appendChild(document.createElement("div")).textContent=ids.map(g).join("#");
</script></body></html>
