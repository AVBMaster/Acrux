<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>b151 line-height smaller than the font box</title>
<style>
body { font: 16px "Segoe UI", sans-serif; margin: 0; padding: 0; }
table { border-collapse: separate; border-spacing: 0; margin-bottom: 8px; }
td, th { padding: 0; border: 0; }
.lh10 { line-height: 10px; }
.f40 { font-size: 40px; }
</style></head><body>
<div id="d1" class="lh10">x</div>
<div id="d2" class="lh10 f40">x</div>
<div id="d3">x</div>
<table id="t1"><tr><td id="c1" class="lh10">x</td></tr></table>
<table id="t2"><tr><td id="c2" class="lh10 f40">x</td></tr></table>
<table id="t3"><tr><td id="c3">x</td></tr></table>
<div id="w1"><span id="s1" class="lh10">x</span></div>
</body></html>
