<!DOCTYPE html><html><head><style>
body{margin:0;padding:10px}
#t{width:90px;height:60px;background:#c0c0c0;animation-timing-function:steps(2, jump-start);
   animation-name:kk; animation-duration:1s; animation-delay:-400ms; animation-play-state:paused}
@keyframes kk{ 0%{animation-timing-function:linear;opacity:1} 100%{opacity:0} }
#u{width:90px;height:60px;background:#c0c0c0;margin-top:6px;animation:kk 1s -400ms linear paused}
</style></head><body><div id="t"></div><div id="u"></div></body></html>
