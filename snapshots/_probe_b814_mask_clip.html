<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:8px;font:12px monospace}
</style></head><body>
<div id="out"></div>
<script>
const out=[];
function L(t,v){out.push("L~"+t+"~"+String(v).split(" ").join("_"));}
function gc(tag,css,props){
  if(typeof props==="string") props=[props];
  const d=document.createElement("div");d.setAttribute("style",css);document.body.appendChild(d);
  const cs=getComputedStyle(d);
  for(const p of props){const v=cs.getPropertyValue(p).trim();L(tag,p+"="+(v===""?"(empty)":v.split(" ").join("_")));}
  d.remove();
}
// clip-path basic shapes
gc("cp-none","clip-path:none","clip-path");
gc("cp-circle","clip-path:circle(50%)","clip-path");
gc("cp-circle-at","clip-path:circle(30px at 20px 20px)","clip-path");
gc("cp-ellipse","clip-path:ellipse(50% 30%)","clip-path");
gc("cp-inset","clip-path:inset(10px)","clip-path");
gc("cp-inset-round","clip-path:inset(10px round 5px)","clip-path");
gc("cp-polygon","clip-path:polygon(0 0,100% 0,100% 100%)","clip-path");
// mask longhands
gc("mk-image","-webkit-mask-image:url(x.png)","-webkit-mask-image");
gc("mk-mode","mask-mode:alpha","mask-mode");
gc("mk-mode-lum","mask-mode:luminance","mask-mode");
gc("mk-repeat","mask-repeat:no-repeat","mask-repeat");
gc("mk-clip","mask-clip:border-box","mask-clip");
gc("mk-origin","mask-origin:content-box","mask-origin");
gc("mk-composite","mask-composite:add","mask-composite");
// mask shorthand
gc("mk-sh","mask:url(x.png) no-repeat center","mask");
document.getElementById("out").textContent=out.join("\n");
</script></body></html>
