<!doctype html><html><head><meta charset="utf-8"></head><body>
<div id="stage" style="position:absolute;left:-4000px;top:0;width:300px;font:16px/20px Arial"></div>
<script>
const stage = document.getElementById('stage');
const L = [];
function go(label, inner) {
  stage.innerHTML = inner;
  const r = Array.from(stage.querySelector('#s').getClientRects());
  L.push(label + ' n=' + r.length + ' w=' + r.map(x => x.width.toFixed(2)).join(',') + ' x=' + r.map(x => (x.left + 4000).toFixed(2)).join(','));
}
go('inlineblock', '<span id="s">a<span style="display:inline-block;width:20px;height:10px"></span>b</span>');
go('replaced', '<span id="s">a<img src="x.png" width="20" height="10">b</span>');
go('nested', '<span id="s">a<span>b</span>c</span>');
go('trailing', '<span id="s">a<br>b<br></span>');
console.log(L.join('\n'));
</script></body></html>
