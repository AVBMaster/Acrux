<!doctype html><html><body><pre id=rec></pre><script>
const out=[];
function s(label,el,props){ try{ const cs=getComputedStyle(el); const parts=[];
  for(const p of props) parts.push(p+'='+cs.getPropertyValue(p));
  out.push(label+' '+parts.join(' | ')); }catch(e){ out.push(label+' ERR '+e.message); } }
function mk(css){const d=document.createElement('div');d.style.cssText=css;document.body.appendChild(d);return d;}
function sup(prop,val){ try{ return CSS.supports(prop,val)?'Y':'N'; }catch(e){ return 'ERR'; } }
// b434: animation longhands + newer timing/easing
s('an-name', mk('animation-name:slide'), ['animation-name']);
s('an-name-multi', mk('animation-name:slide,fade'), ['animation-name']);
s('an-dur', mk('animation-duration:2s,1s'), ['animation-duration']);
s('an-timing-linear', mk('animation-timing-function:linear'), ['animation-timing-function']);
s('an-timing-steps', mk('animation-timing-function:steps(4,jump-none)'), ['animation-timing-function']);
s('an-timing-bezier', mk('animation-timing-function:cubic-bezier(.2,.1,.3,1)'), ['animation-timing-function']);
s('an-iter', mk('animation-iteration-count:infinite'), ['animation-iteration-count']);
s('an-dir-alt', mk('animation-direction:alternate-reverse'), ['animation-direction']);
s('an-fill-both', mk('animation-fill-mode:both'), ['animation-fill-mode']);
s('an-play-pause', mk('animation-play-state:paused'), ['animation-play-state']);
s('an-delay-neg', mk('animation-delay:-1s'), ['animation-delay']);
s('an-composition', mk('animation-composition:add'), ['animation-composition']);
s('an-range', mk('animation-range:normal normal'), ['animation-range']);
s('an-shorthand', mk('animation:slide 2s linear infinite'), ['animation-name','animation-duration','animation-timing-function','animation-iteration-count']);
// transition longhands
s('tr-prop', mk('transition-property:width,height'), ['transition-property']);
s('tr-prop-all', mk('transition-property:all'), ['transition-property']);
s('tr-dur', mk('transition-duration:.5s'), ['transition-duration']);
s('tr-timing', mk('transition-timing-function:ease-in-out'), ['transition-timing-function']);
s('tr-behavior', mk('transition-behavior:allow-discrete'), ['transition-behavior']);
s('tr-shorthand', mk('transition:width 1s ease 0s'), ['transition-property','transition-duration','transition-timing-function','transition-delay']);
out.push('SUP animation-timing-function:steps(4,jump-none) = '+sup('animation-timing-function','steps(4,jump-none)'));
out.push('SUP animation-composition:add = '+sup('animation-composition','add'));
out.push('SUP transition-behavior:allow-discrete = '+sup('transition-behavior','allow-discrete'));
out.push('SUP animation-range:normal = '+sup('animation-range','normal'));
out.push('SUP animation-delay:-1s = '+sup('animation-delay','-1s'));
out.push('SUP transition-duration:-1s = '+sup('transition-duration','-1s'));
document.getElementById('rec').textContent=out.join('\n');
</script></body></html>
