<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body { font: 16px sans-serif; margin: 8px; }
p { margin: 4px 0; }
.a { text-decoration: underline dotted red; }
.b { text-decoration: underline rgb(255,0,0); }
.c { text-decoration: rgb(255,0,0) underline; }
.d { text-decoration: underline solid rgb(255,0,0); }
.e { text-decoration-line: underline; text-decoration-color: rgb(255,0,0); }
</style></head><body>
<p class="a">named color shorthand</p>
<p class="b">rgb after line</p>
<p class="c">rgb first</p>
<p class="d">rgb after style</p>
<p class="e">longhands only</p>
</body></html>
