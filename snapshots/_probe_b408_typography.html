<!doctype html><html><body><pre id=rec></pre><script>
const out=[];
function t(p,v){const el=document.createElement('div');document.body.appendChild(el);el.style.cssText='';el.style.setProperty(p,v);out.push(p+'='+JSON.stringify(v)+' sup='+CSS.supports(p,v)+' echo='+JSON.stringify(el.style.getPropertyValue(p)));el.remove();}
// text wrapping
t('text-wrap','wrap');
t('text-wrap','nowrap');
t('text-wrap','balance');
t('text-wrap','pretty');
t('text-wrap','stable');
t('text-wrap-mode','wrap');
t('text-wrap-mode','nowrap');
t('text-wrap-style','auto');
t('text-wrap-style','balance');
t('text-wrap-style','pretty');
t('text-wrap-style','stable');
// font-variant longhands
t('font-variant','normal');
t('font-variant','none');
t('font-variant','small-caps');
t('font-variant-caps','normal');
t('font-variant-caps','small-caps');
t('font-variant-caps','all-small-caps');
t('font-variant-caps','petite-caps');
t('font-variant-caps','all-petite-caps');
t('font-variant-caps','unicase');
t('font-variant-caps','titling');
t('font-variant-ligatures','normal');
t('font-variant-ligatures','none');
t('font-variant-ligatures','common-ligatures');
t('font-variant-ligatures','discretionary-ligatures');
t('font-variant-numeric','normal');
t('font-variant-numeric','lining-nums');
t('font-variant-numeric','oldstyle-nums');
t('font-variant-numeric','tabular-nums');
t('font-variant-numeric','proportional-nums');
t('font-variant-east-asian','normal');
t('font-variant-east-asian','ruby');
// font-feature-settings
t('font-feature-settings','normal');
t('font-feature-settings','"liga"');
t('font-feature-settings','"liga" 0');
t('font-feature-settings','"kern" 1, "liga" 0');
t('font-feature-settings','bogus');
// font-kerning / font-synthesis
t('font-kerning','auto');
t('font-kerning','normal');
t('font-kerning','none');
t('font-synthesis','none');
t('font-synthesis','weight');
t('font-synthesis','style');
t('font-synthesis','weight style');
document.getElementById('rec').textContent=out.join('\n');
console.log(out.join('\n'));
</script></body></html>
