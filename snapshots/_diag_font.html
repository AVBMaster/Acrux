<!doctype html><html><head><meta charset=utf-8><style>body{font:12px monospace;margin:0}
#f1{font:italic bold 16px/1.5 Georgia,serif}
#f2{font:bold 14px sans-serif}
#f3{font:italic 14px serif}
#f4{font:oblique 300 14px monospace}
#f5{font:small-caps bold 14px serif}
</style></head><body><meta charset=utf-8>
<div id=f1>f1</div><div id=f2>f2</div><div id=f3>f3</div><div id=f4>f4</div><div id=f5>f5</div>
<script>
const g=id=>{const s=getComputedStyle(document.getElementById(id));return id+":st="+s.fontStyle+" w="+s.fontWeight+" sz="+s.fontSize+" fam="+s.fontFamily;};
document.body.appendChild(document.createTextNode(["f1","f2","f3","f4","f5"].map(g).join(" ## ")));
</script></body></html>
