<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body { margin: 0; padding: 4px; font-family: Arial, sans-serif; font-size: 16px; line-height: 20px; }
#d1 { height: 14px; background: rgb(0,255,0); }
#t1 { border-collapse: collapse; width: 120px; }
#t1 caption { height: 14px; background: rgb(255,0,0); }
#t1 td { border: 1px solid rgb(0,0,0); }
#t2 { border-collapse: separate; width: 120px; }
#t2 caption { height: 14px; background: rgb(0,0,255); }
</style>
</head>
<body>
<div id="d1">x</div>
<table id="t1"><caption>capA</caption><tr><td>a</td></tr></table>
<table id="t2"><caption>capB</caption><tr><td>b</td></tr></table>
</body>
</html>
