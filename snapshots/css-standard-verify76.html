<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS Standard Verification Batch 76 — aspect-ratio in flex/grid items, contain, replaced in flex</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; font-size: 14px; }
h2 { background:#eee; padding:4px; margin:16px 0 8px; font-size:15px; }
.c { background:#cfe; border:1px solid #369; }

/* 1. aspect-ratio on a flex item with definite height */
.f1 { display:flex; height:80px; border:2px solid #939; }
.f1 .ar { aspect-ratio: 2/1; height:60px; align-self:flex-start; }

/* 2. aspect-ratio on a grid item with definite width */
.g1 { display:grid; grid-template-columns:100px 100px; border:2px solid #939; width:204px; }
.g1 .ar { aspect-ratio: 1/2; width:50px; }

/* 3. contain:content prevents size influence (layout containment) */
.con { width:150px; border:2px solid #939; contain: layout; }
.con .inner { height:40px; background:#fec; }

/* 4. replaced (img) as flex item with object-fit:cover */
.f2 { display:flex; width:200px; height:60px; border:2px solid #939; }
.f2 img { width:100%; height:100%; object-fit: cover; }
</style>
</head>
<body>

<h2>1. flex item aspect-ratio 2/1, height 60 → width 120</h2>
<div class="f1"><div class="c ar">A</div></div>

<h2>2. grid item aspect-ratio 1/2, width 50 → height 100</h2>
<div class="g1"><div class="c ar">B</div><div class="c">x</div></div>

<h2>3. contain:layout box, inner 40px</h2>
<div class="con"><div class="inner">inside</div></div>

<h2>4. img flex item object-fit:cover (stretched box)</h2>
<div class="f2"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAoAAAAKCAYAAACNMs+9AAAAFUlEQVR42mP8z8BQz0AEYBxVSF+FAP5FDvcfRYWgAAAAAElFTkSuQmCC"></div>

</body>
</html>
