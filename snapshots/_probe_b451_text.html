<!doctype html><html><body><pre id=rec></pre><script>
const out=[];
function s(label,css,props){ try{ const d=document.createElement('div'); d.style.cssText=css;
  document.body.appendChild(d); const cs=getComputedStyle(d); const parts=[];
  for(const p of props) parts.push(p+'='+cs.getPropertyValue(p));
  out.push(label+' '+parts.join(' | ')); d.remove(); }
  catch(e){ out.push(label+' ERR '+e.message); } }
// b451: text properties not yet swept
s('textalign','text-align:center',['text-align']);
s('textalign-justify','text-align:justify',['text-align']);
s('textalign-last','text-align-last:right',['text-align-last']);
s('textdeco-line','text-decoration:underline line-through',['text-decoration-line']);
s('textdeco-style','text-decoration:underline wavy',['text-decoration-style']);
s('textdeco-color','text-decoration:underline red',['text-decoration-color']);
s('textdeco-thick','text-decoration:underline 3px',['text-decoration-thickness']);
s('textshadow','text-shadow:2px 2px 4px gray',['text-shadow']);
s('textshadow-multi','text-shadow:1px 1px red,2px 2px blue',['text-shadow']);
s('textindent','text-indent:20px',['text-indent']);
s('textindent-neg','text-indent:-10px',['text-indent']);
s('texttransform-up','text-transform:uppercase',['text-transform']);
s('texttransform-cap','text-transform:capitalize',['text-transform']);
s('lineheight-num','line-height:1.5',['line-height']);
s('lineheight-px','line-height:24px',['line-height']);
s('verticalalign-sub','vertical-align:sub',['vertical-align']);
s('verticalalign-px','vertical-align:5px',['vertical-align']);
s('whitecollapse','white-space-collapse:collapse',['white-space-collapse']);
s('textwrap-pretty','text-wrap:pretty',['text-wrap']);
s('textwrap-balance','text-wrap:balance',['text-wrap']);
out.push('SUP text-align-last:right = '+(()=>{try{return CSS.supports('text-align-last','right')?'Y':'N';}catch(e){return 'ERR';}})());
out.push('SUP text-decoration-thickness:3px = '+(()=>{try{return CSS.supports('text-decoration-thickness','3px')?'Y':'N';}catch(e){return 'ERR';}})());
out.push('SUP white-space-collapse:collapse = '+(()=>{try{return CSS.supports('white-space-collapse','collapse')?'Y':'N';}catch(e){return 'ERR';}})());
out.push('SUP text-wrap:balance = '+(()=>{try{return CSS.supports('text-wrap','balance')?'Y':'N';}catch(e){return 'ERR';}})());
document.getElementById('rec').textContent=out.join('\n');
</script></body></html>
