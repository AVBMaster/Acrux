<!doctype html><html><body><pre id=rec></pre><script>
const out=[];
function s(label,css,props){ try{ const d=document.createElement('div'); d.style.cssText=css;
  document.body.appendChild(d); const cs=getComputedStyle(d); const parts=[];
  for(const p of props) parts.push(p+'='+cs.getPropertyValue(p));
  out.push(label+' '+parts.join(' | ')); d.remove(); }
  catch(e){ out.push(label+' ERR '+e.message); } }
// isolated: only the logical property, no physical overflow to conflict
s('oi-only','overflow-inline:hidden',['overflow-inline','overflow-x']);
s('ob-only','overflow-block:clip',['overflow-block','overflow-y']);
s('oi-then-phys','overflow-inline:hidden;overflow-x:auto',['overflow-inline','overflow-x']);
s('phys-then-oi','overflow-x:auto;overflow-inline:hidden',['overflow-inline','overflow-x']);
s('both-logical','overflow-inline:hidden;overflow-block:clip',['overflow-inline','overflow-block','overflow-x','overflow-y']);
document.getElementById('rec').textContent=out.join('\n');
</script></body></html>
