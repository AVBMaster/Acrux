<!doctype html>
<html><head><meta charset="utf-8"><title>b313 corner and calc-size</title>
<style>
  body { margin: 0; font: 12px/1.3 monospace; }
  .row { position: relative; height: 30px; }
  .box { position: absolute; left: 0; top: 3px; height: 24px; width: 120px; }
  #wrap { width: 200px; }
  #wrap > div { height: 20px; }
</style></head>
<body>
<div class="row"><div class="box" id="c1" style="corner-shape: round; border-radius: 24px; background: #ff8080"></div></div>
<div class="row"><div class="box" id="c2" style="corner-shape: scoop; border-radius: 24px; background: #80ff80"></div></div>
<div class="row"><div class="box" id="c3" style="corner-shape: notch; border-radius: 24px; background: #8080ff"></div></div>
<div class="row"><div class="box" id="c4" style="corner-shape: superellipse(2); border-radius: 24px; background: #ffff80"></div></div>
<div class="row"><div class="box" id="w1" style="width: calc-size(auto, size + 20px); height: 20px; background: #ff80ff"></div></div>
<div class="row"><div class="box" id="w2" style="width: calc-size(auto, 100% - 20px); height: 20px; background: #80ffff"></div></div>
<div class="row"><div class="box" id="w3" style="width: calc-size(100px, size); height: 20px; background: #c0c0c0"></div></div>
<div class="row"><div class="box" id="w4" style="width: 100px; height: 20px; background: #ff8040"></div></div>
<div id="wrap"></div>
<script>
// b313_corner_calcsize
function build() {
const rows = [];
const specs = [["corner-shape","scoop"],["corner-top-left-shape","notch"],["corner-shape","superellipse(2)"],["corner-shape","uncurved"],["corner-top-right-shape","bevel"],["corner-shape","round"],["width","calc-size(auto, size + 20px)"],["width","calc-size(auto, 100% - 20px)"],["width","calc-size(100px, size)"],["line-height","calc-size(auto, size)"]];
for (let i = 0; i < specs.length; i++) {
const el = document.createElement('div');
document.body.appendChild(el);
  el.style.setProperty(specs[i][0], specs[i][1]);
  rows.push('v' + i + '|' + specs[i][0] + '|sup=' + (CSS.supports(specs[i][0], specs[i][1]) ? 1 : 0)
      + '|echo=' + el.style.getPropertyValue(specs[i][0])
      + '|comp=' + getComputedStyle(el).getPropertyValue(specs[i][0]));
  el.remove();
}
const ids = ["c1","c2","c3","c4","w1","w2","w3","w4"];
for (let i = 0; i < ids.length; i++) {
const el = document.getElementById(ids[i]);
const r = el.getBoundingClientRect();
rows.push(ids[i] + '|w=' + (Math.round(r.width * 100) / 100)
    + '|h=' + (Math.round(r.height * 100) / 100)
    + '|comp=' + getComputedStyle(el).width);
}
document.body.insertAdjacentHTML('beforeend',
    '<pre id="record" style="font:10px/1.35 monospace;white-space:pre-wrap"></pre>');
// textContent, not HTML: a value carrying '<' is otherwise read as a tag and vanishes.
document.getElementById('record').textContent = rows.join('\n');
console.log(rows.join('\n'));
}
build();
</script></body></html>
