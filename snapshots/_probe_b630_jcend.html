<!doctype html><html><head><meta charset="utf-8"><style>body{margin:8px}.g{display:grid;width:200px;height:80px;border:1px solid #999}.it{width:30px;height:20px;background:tomato}</style></head><body><div id="out"></div>
<script>
const out=[];
for(const v of ["end","flex-end","right","center"]){
  const h=document.createElement("div");h.className="g";h.style.justifyContent=v;
  for(let i=0;i<2;i++){const k=document.createElement("div");k.className="it";h.appendChild(k);}
  document.body.appendChild(h);
  const kids=[...h.children].map((k,i)=>{const r=k.getBoundingClientRect();return "k"+i+"@x"+Math.round(r.x);}).join(",");
  out.push(["L","jc="+v,"kids="+kids].join("~"));
  h.remove();
}
document.getElementById("out").textContent=out.join("\n");
</script></body></html>
