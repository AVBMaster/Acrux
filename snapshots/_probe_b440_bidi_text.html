<!doctype html><html><body><pre id=rec></pre><script>
const out=[];
function s(label,el,props){ try{ const cs=getComputedStyle(el); const parts=[];
  for(const p of props) parts.push(p+'='+cs.getPropertyValue(p));
  out.push(label+' '+parts.join(' | ')); }catch(e){ out.push(label+' ERR '+e.message); } }
function mk(css){const d=document.createElement('div');d.style.cssText=css;document.body.appendChild(d);return d;}
function sup(prop,val){ try{ return CSS.supports(prop,val)?'Y':'N'; }catch(e){ return 'ERR'; } }
// b440: bidi + writing-mode + text shaping
s('dir-ltr', mk('direction:ltr'), ['direction']);
s('dir-rtl', mk('direction:rtl'), ['direction']);
s('unicode-bidi-norm', mk('unicode-bidi:normal'), ['unicode-bidi']);
s('unicode-bidi-embed', mk('unicode-bidi:embed'), ['unicode-bidi']);
s('unicode-bidi-override', mk('unicode-bidi:bidi-override'), ['unicode-bidi']);
s('unicode-bidi-isolate', mk('unicode-bidi:isolate'), ['unicode-bidi']);
s('writing-horiz', mk('writing-mode:horizontal-tb'), ['writing-mode']);
s('writing-vert-rl', mk('writing-mode:vertical-rl'), ['writing-mode']);
s('writing-vert-lr', mk('writing-mode:vertical-lr'), ['writing-mode']);
s('writing-sideways', mk('writing-mode:sideways-lr'), ['writing-mode']);
s('text-orient-mixed', mk('writing-mode:vertical-rl;text-orientation:mixed'), ['text-orientation']);
s('text-orient-upright', mk('writing-mode:vertical-rl;text-orientation:upright'), ['text-orientation']);
s('text-orient-sideways', mk('writing-mode:vertical-rl;text-orientation:sideways'), ['text-orientation']);
s('text-combine', mk('text-combine-upright:all'), ['text-combine-upright']);
s('word-spacing', mk('word-spacing:5px'), ['word-spacing']);
s('letter-spacing', mk('letter-spacing:2px'), ['letter-spacing']);
s('white-space-nowrap', mk('white-space:nowrap'), ['white-space']);
s('white-space-pre', mk('white-space:pre-wrap'), ['white-space']);
s('word-break-all', mk('word-break:break-all'), ['word-break']);
s('overflow-wrap', mk('overflow-wrap:anywhere'), ['overflow-wrap']);
s('hyphens-auto', mk('hyphens:auto'), ['hyphens']);
s('line-break-strict', mk('line-break:strict'), ['line-break']);
s('tab-size', mk('tab-size:8'), ['tab-size']);
out.push('SUP unicode-bidi:isolate = '+sup('unicode-bidi','isolate'));
out.push('SUP writing-mode:vertical-rl = '+sup('writing-mode','vertical-rl'));
out.push('SUP text-orientation:upright = '+sup('text-orientation','upright'));
out.push('SUP hyphens:auto = '+sup('hyphens','auto'));
out.push('SUP line-break:strict = '+sup('line-break','strict'));
out.push('SUP tab-size:8 = '+sup('tab-size','8'));
document.getElementById('rec').textContent=out.join('\n');
</script></body></html>
