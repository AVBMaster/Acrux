<!doctype html><html><head><meta charset="utf-8"></head><body><script>
const out = [];
const t=(prop,v)=>{ const d=document.createElement('div'); d.style.setProperty(prop, v); out.push(prop+' <'+v+'> => get['+d.style.getPropertyValue(prop)+'] cssText['+d.style.cssText+'] attr['+d.getAttribute('style')+']'); };
t('border','medium none currentcolor');
t('border-top','medium none currentcolor');
t('border-inline','medium none currentcolor');
t('border','1px solid red');
t('border','medium solid red');
const d2 = document.createElement('div');
d2.setAttribute('style','border: medium none currentcolor');
out.push('from-attr cssText['+d2.style.cssText+'] get-border['+d2.style.getPropertyValue('border')+'] get-style['+d2.style.getPropertyValue('border-style')+'] length='+d2.style.length+' attr['+d2.getAttribute('style')+']');
console.log(out.join('\n'));
</script></body></html>
