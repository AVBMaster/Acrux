<!DOCTYPE html><html><head><style>
body { margin: 0; }
.b { width: 220px; height: 100px; border: 2px solid rgb(0,255,0);
     background-color: rgb(255,255,255);
     background-image: linear-gradient(rgb(255,0,0), rgb(255,0,0));
     background-size: 30px 30px; }
#t2 { background-position: 20px 20px; }
#t3 { background-position: 60px 60px; }
#t4 { background-repeat: no-repeat; background-position: 60px 60px; }
#t5 { background-repeat: no-repeat; background-position: right 20px bottom 10px; }
</style></head><body>
<div class="b" id="t1"></div><div class="b" id="t2"></div><div class="b" id="t3"></div>
<div class="b" id="t4"></div><div class="b" id="t5"></div>
</body></html>
