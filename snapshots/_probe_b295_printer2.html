<!doctype html>
<html><head><meta charset="utf-8"><title>b295 printer2 probe</title></head>
<body>
<div id="host"></div>
<script>
// The other half of the printing question. A first sweep found two rules: six significant digits
// of the number the page wrote, and that same six after the number has been cut at seven decimals.
// This page asks which property answers which, and asks the properties that hold a plain number
// rather than a length, because those print through the same serializer.
function build() {
const host = document.createElement('div');
document.body.appendChild(host);
const rows = [];
let index = 0;

const props = ['right', 'bottom', 'inset', 'min-width', 'min-height', 'max-height',
               'inline-size', 'block-size', 'min-inline-size', 'max-block-size',
               'margin-block-start', 'padding-inline-end', 'contain-intrinsic-size',
               'text-size-adjust', 'flex-grow', 'opacity', 'order', 'z-index', 'widows',
               'orphans', 'grid-auto-rows', 'tab-size', 'stroke-dashoffset', 'aspect-ratio',
               'shape-image-threshold', 'font-weight', 'scale', 'zoom'];
const numbers = ['0.000123456789', '0.01234565', '12345.6789', '0.0000123456789'];

for (const prop of props) {
  const withUnit = ['right', 'bottom', 'inset', 'min-width', 'min-height', 'max-height',
                    'inline-size', 'block-size', 'min-inline-size', 'max-block-size',
                    'margin-block-start', 'padding-inline-end', 'grid-auto-rows',
                    'stroke-dashoffset'].includes(prop);
  for (const bare of numbers) {
    const value = withUnit ? bare + 'px' : bare;
    const el = document.createElement('div');
    host.appendChild(el);
    el.style.setProperty(prop, value);
    rows.push(index + '|' + prop + '|' + value
        + '|sup=' + (CSS.supports(prop, value) ? 1 : 0)
        + '|echo=' + el.style.getPropertyValue(prop)
        + '|comp=' + getComputedStyle(el).getPropertyValue(prop));
    index++;
  }
}

window.__probe = rows.join('\n');
console.log(window.__probe);
}
build();
</script>
</body></html>
