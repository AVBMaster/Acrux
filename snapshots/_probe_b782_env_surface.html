<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:8px;font:12px monospace}
</style></head><body>
<div id="out"></div>
<script>
const out=[];
function t(tag,css,prop){
  const d=document.createElement("div");d.setAttribute("style",css);document.body.appendChild(d);
  const v=getComputedStyle(d).getPropertyValue(prop).trim();
  out.push("L~"+tag+"~"+prop+"="+(v===""?"(empty)":v.split(" ").join("_")));d.remove();
}
t("sai-top","padding:env(safe-area-inset-top)","padding-top");
t("sai-right","padding:env(safe-area-inset-right)","padding-right");
t("sai-bottom","padding:env(safe-area-inset-bottom)","padding-bottom");
t("sai-left","padding:env(safe-area-inset-left)","padding-left");
t("calc-0","padding:calc(env(safe-area-inset-top))","padding-top");
t("calc-10","padding:calc(env(safe-area-inset-top) + 10px)","padding-top");
t("fallback-ignored","padding:env(safe-area-inset-top, 7px)","padding-top");
t("margin-0","margin:env(safe-area-inset-top)","margin-top");
t("width-0","width:env(safe-area-inset-top)","width");
t("min-env","width:min(env(safe-area-inset-top), 50px)","width");
t("clamp-env","width:clamp(0px, env(safe-area-inset-top), 50px)","width");
t("two-env","padding:calc(env(safe-area-inset-top) + env(safe-area-inset-bottom))","padding-top");
t("known-fb-calc","padding:calc(env(safe-area-inset-top, 5px) + 3px)","padding-top");
t("unknown-no-fb","padding:env(safe-area-bogus)","padding-top");
t("unknown-fb","padding:env(safe-area-bogus, 9px)","padding-top");
t("unknown-nested-fb","padding:env(safe-area-bogus, env(safe-area-inset-top, 4px))","padding-top");
document.getElementById("out").textContent=out.join("\n");
</script></body></html>
