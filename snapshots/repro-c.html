<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body { margin: 0; font: 14px sans-serif; }
h4 { margin: 8px 8px 4px; color: #222; }
.effects { display: flex; flex-wrap: wrap; gap: 8px; width: 560px; padding: 8px;
           background: #eef; border: 2px solid #333; margin: 10px; }
.effects .box { width: 70px; height: 50px; background: #4a90d9; color: #fff; }
.grid { display: grid; grid-template-columns: 100px 100px 100px; grid-template-rows: 50px 50px;
        margin: 12px; width: 300px; }
.grid > div { color: #fff; }
.g1 { background: #d2691e; } .g2 { background: #6a5acd; } .g3 { background: #2e8b57; }
.multi { display: flex; flex-wrap: wrap; align-content: center; width: 300px; height: 160px;
         gap: 4px; background: #eee; margin: 12px; border: 1px solid #888; }
.multi i { width: 90px; height: 30px; background: teal; }
</style></head>
<body>
<h4>1. flex-wrap (expect 7 boxes per row inside 560px content)</h4>
<div class="effects">
  <div class="box">1</div><div class="box">2</div><div class="box">3</div><div class="box">4</div>
  <div class="box">5</div><div class="box">6</div><div class="box">7</div><div class="box">8</div>
  <div class="box">9</div><div class="box">10</div>
</div>
<h4>3. grid (three equal columns, no seams)</h4>
<div class="grid">
  <div class="g1">a</div><div class="g2">b</div><div class="g3">c</div>
  <div class="g3">d</div><div class="g1">e</div><div class="g2">f</div>
</div>
<h4>4. multi-line align-content center</h4>
<div class="multi"><i></i><i></i><i></i><i></i><i></i><i></i></div>
</body></html>
