<!doctype html><html><body><pre id=rec></pre><script>
const out=[];
function s(label,css,props){ try{ const d=document.createElement('div'); d.style.cssText=css;
  document.body.appendChild(d); const cs=getComputedStyle(d); const parts=[];
  for(const p of props) parts.push(p+'='+cs.getPropertyValue(p));
  out.push(label+' '+parts.join(' | ')); d.remove(); }
  catch(e){ out.push(label+' ERR '+e.message); } }
// b465: table layout
s('disp-table','display:table',['display']);
s('disp-trow','display:table-row',['display']);
s('disp-tcell','display:table-cell',['display']);
s('disp-tcol','display:table-column',['display']);
s('disp-tcap','display:table-caption',['display']);
s('disp-tcolgrp','display:table-column-group',['display']);
s('disp-trowgrp','display:table-row-group',['display']);
s('disp-tfootgrp','display:table-footer-group',['display']);
s('disp-t-ihg','display:inline-table',['display']);
s('bd-collapse','border-collapse:collapse',['border-collapse']);
s('bd-separate','border-collapse:separate',['border-collapse']);
s('bd-spacing','border-spacing:5px 10px',['border-spacing']);
s('empty-cells','empty-cells:hide',['empty-cells']);
s('cap-side','caption-side:bottom',['caption-side']);
s('table-layout','table-layout:fixed',['table-layout']);
s('vert-align-top','vertical-align:top',['vertical-align']);
s('vert-align-mid','vertical-align:middle',['vertical-align']);
s('vert-align-base','vertical-align:baseline',['vertical-align']);
out.push('SUP display:table = '+(()=>{try{return CSS.supports('display','table')?'Y':'N';}catch(e){return 'ERR';}})());
out.push('SUP border-collapse:collapse = '+(()=>{try{return CSS.supports('border-collapse','collapse')?'Y':'N';}catch(e){return 'ERR';}})());
out.push('SUP border-spacing:5px 10px = '+(()=>{try{return CSS.supports('border-spacing','5px 10px')?'Y':'N';}catch(e){return 'ERR';}})());
out.push('SUP empty-cells:hide = '+(()=>{try{return CSS.supports('empty-cells','hide')?'Y':'N';}catch(e){return 'ERR';}})());
document.getElementById('rec').textContent=out.join('\n');
</script></body></html>
