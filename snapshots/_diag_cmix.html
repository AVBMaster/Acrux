<!doctype html><html><head><meta charset=utf-8><style>body{font:14px monospace;margin:0}
#a{color:color-mix(in srgb,red,blue)}
#b{color:color-mix(in oklab,red,blue)}
#c{color:color-mix(in oklab,red 30%,blue)}
#d{color:color-mix(in srgb,red 30%,blue)}
</style></head><body><meta charset=utf-8>
<div id=a>a</div><div id=b>b</div><div id=c>c</div><div id=d>d</div>
<script>
const hex=c=>{const m=/rgba?\(([^)]+)\)/.exec(c);if(!m)return c;const p=m[1].split(/[,\s\/]+/).filter(x=>x).map(Number);return "rgb"+p.slice(0,3).join(",");};
const g=id=>{const e=document.getElementById(id);return id+"="+hex(getComputedStyle(e).color);};
document.body.appendChild(document.createTextNode(["a","b","c","d"].map(g).join("#")));
</script></body></html>
