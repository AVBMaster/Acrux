<!DOCTYPE html><head><style>
body{margin:24px;font:16px Arial}
.wrap{display:inline-block;vertical-align:top;margin-right:40px;background:#eef;border:1px solid #888;padding:2px}
.c1{width:min-content}
.c2{width:min-content;overflow-wrap:anywhere}
.c3{width:min-content;overflow-wrap:break-word}
.c4{width:min-content;word-break:break-all}
.c5{width:80px;overflow-wrap:anywhere;background:#fec}
.box{display:inline-block;width:80px;background:#fec;margin-right:30px}
.bw{overflow-wrap:break-word}
.ba{word-break:break-all}
</style><body>
<div class="wrap c1">Antidisestablishmentarianism</div>
<div class="wrap c2">Antidisestablishmentarianism</div>
<div class="wrap c3">Antidisestablishmentarianism</div>
<div class="wrap c4">Antidisestablishmentarianism</div>
<div class="box">Antidisestablishmentarianism</div>
<div class="box bw">Antidisestablishmentarianism</div>
<div class="box ba">Antidisestablishmentarianism</div>
</body></html>
