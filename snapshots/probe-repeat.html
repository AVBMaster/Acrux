<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body { margin: 8px; font-family: Arial; }
.tile { width: 150px; height: 40px; background-image: linear-gradient(#e33,#33e); background-size: 20px 20px; margin-bottom: 6px; }
.r-space { background-repeat: space; }
.r-round { background-repeat: round; }
.r-repeat { background-repeat: repeat; }
.r-none { background-repeat: no-repeat; }
.r-x { background-repeat: repeat-x; }
</style></head><body>
<div class="tile r-space"></div>
<div class="tile r-round"></div>
<div class="tile r-repeat"></div>
<div class="tile r-none"></div>
<div class="tile r-x"></div>
</body></html>
