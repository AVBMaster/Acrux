<!doctype html><html><body><pre id=rec></pre><script>
const out=[];
function s(label,el,props){ try{ const cs=getComputedStyle(el); const parts=[];
  for(const p of props) parts.push(p+'='+cs.getPropertyValue(p));
  out.push(label+' '+parts.join(' | ')); }catch(e){ out.push(label+' ERR '+e.message); } }
function mk(css){const d=document.createElement('div');d.style.cssText=css;document.body.appendChild(d);return d;}
// b438: box-family echo rounding of a seven-decimal value / a binary tie.
// A width the reference prices and prints back — where does it cut the digits?
const vals=[
 ['w-7dec','100.1234567px'],
 ['w-8dec','100.12345678px'],
 ['w-binary','0.1px'],
 ['w-binary2','33.33333333px'],
 ['w-long','123456.7890123px'],
 ['w-small','0.0000001px'],
 ['w-tie','2.00000005px'],
 ['w-ml','calc(100px / 3)'],
 ['w-em','1.23456789em'],
 ['w-pct','33.33333333%'],
];
for(const [name,v] of vals){
  const d=mk('width:'+v+';height:10px;');
  s(name,d,['width']);
  d.remove();
}
// same values on margin-top (a non-box-family length that also echoes)
for(const [name,v] of vals){
  const d=mk('margin-top:'+v+';width:10px;height:10px;');
  s('mt-'+name,d,['margin-top']);
  d.remove();
}
document.getElementById('rec').textContent=out.join('\n');
</script></body></html>
