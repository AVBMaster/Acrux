<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>b270 caret probe</title>
<style>body{font:12px monospace;margin:0}</style></head><body>
<pre id="report"></pre>
<script>
var CASES = ["auto","bar","block","underline","none","caret","bar block","auto, bar",""];
var host = document.createElement('div'); document.body.appendChild(host);
function spec(v){ host.setAttribute('style',''); host.style.setProperty('caret-shape',v); return host.style.getPropertyValue('caret-shape'); }
function comp(v){ host.setAttribute('style',''); host.style.setProperty('caret-shape',v); return getComputedStyle(host).getPropertyValue('caret-shape'); }
function sup(v){ try { return CSS.supports('caret-shape',v)?'Y':'N'; } catch(e){ return 'E'; } }
var out=[];
for (var i=0;i<CASES.length;i++){ var v=CASES[i]; out.push(i+'|caret-shape['+v+']|S='+spec(v)+'|C='+comp(v)+'|K='+sup(v)); }
document.getElementById('report').textContent = out.join('\n');
console.log(out.join('\n'));
</script></body></html>
