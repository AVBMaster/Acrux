<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  body { font-family: Arial; margin: 8px; }
  div { line-height: normal; }
  .e { text-emphasis: filled dot; }
  .u { text-emphasis: filled dot; text-emphasis-position: under; }
  .o { text-emphasis: open dot; }
  .w { text-emphasis: filled circle; }
</style></head><body>
<div style="font-size:10px">plain</div>
<div class="e" style="font-size:10px">over</div>
<div class="u" style="font-size:10px">under</div>
<div style="font-size:14px">plain</div>
<div class="e" style="font-size:14px">over</div>
<div class="u" style="font-size:14px">under</div>
<div style="font-size:20px">plain</div>
<div class="e" style="font-size:20px">over</div>
<div class="u" style="font-size:20px">under</div>
<div class="o" style="font-size:20px">open</div>
<div class="w" style="font-size:20px">circle</div>
<div style="font-size:32px">plain</div>
<div class="e" style="font-size:32px">over</div>
<div class="u" style="font-size:32px">under</div>
<div style="font-size:48px">plain</div>
<div class="e" style="font-size:48px">over</div>
<div class="u" style="font-size:48px">under</div>
</body></html>
