<!doctype html><html><head><meta charset="utf-8"><title>b312 calc layout</title>
<style>
  body { margin: 0; font: 16px/1 monospace; background: #ffffff; }
  .row { position: relative; height: 20px; }
  .box { position: absolute; left: 0; top: 0; height: 20px; background: #ff8080; }
  #a { width: calc(10px + (1em + 2px)); }
  #b { width: calc((1em + 2px) + 10px); }
  #c { width: calc(10px + 2 * 1em); }
  #d { width: calc(1em + 10px); }
  #e { width: calc(100% - (1em + 20px)); }
  #f { width: calc(anchor-size(width) + 10px); }
  #g { width: minmax(10px, 20px); }
  #h { width: calc(20px / 3); }
</style></head>
<body>
<div class="row"><div class="box" id="a"></div></div>
<div class="row"><div class="box" id="b"></div></div>
<div class="row"><div class="box" id="c"></div></div>
<div class="row"><div class="box" id="d"></div></div>
<div class="row"><div class="box" id="e"></div></div>
<div class="row"><div class="box" id="f"></div></div>
<div class="row"><div class="box" id="g"></div></div>
<div class="row"><div class="box" id="h"></div></div>
<script>
// record
function build() {
  const rows = [];
  for (const id of ['a','b','c','d','e','f','g','h']) {
    const el = document.getElementById(id);
    const r = el.getBoundingClientRect();
    rows.push(id + '|w=' + (Math.round(r.width * 100) / 100)
      + '|echo=' + el.style.width + '|comp=' + getComputedStyle(el).width);
  }
  document.body.insertAdjacentHTML('beforeend',
    '<pre id="record" style="font:11px/1.3 monospace;white-space:pre-wrap;position:absolute;left:0;top:170px">'
    + rows.join('\n') + '</pre>');
  console.log(rows.join('\n'));
}
build();
</script></body></html>
