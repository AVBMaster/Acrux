<!doctype html><html><body><pre id="rec"></pre><script>
const out=[];
function s(label,css,prop){ try{ const d=document.createElement('div'); d.style.cssText=css;
  document.body.appendChild(d); out.push(label+' '+prop+'='+JSON.stringify(getComputedStyle(d)[prop])); d.remove(); }
  catch(e){ out.push(label+' ERR '+e.message); } }
// angle units
s('deg','transform:rotate(90deg)','transform');
s('grad','transform:rotate(100grad)','transform');
s('rad','transform:rotate(1.5708rad)','transform');
s('turn','transform:rotate(0.25turn)','transform');
// time units (transition-duration)
s('ms','transition-duration:100ms','transitionDuration');
s('s','transition-duration:1s','transitionDuration');
s('time-calc','transition-duration:calc(1s / 2)','transitionDuration');
// resolution
// length units
s('em','width:10em','width');
s('rem','width:10rem','width');
s('ex','width:10ex','width');
s('ch','width:10ch','width');
s('vw','width:10vw','width');
s('vh','width:10vh','width');
s('vmin','width:10vmin','width');
s('vmax','width:10vmax','width');
s('cm','width:1cm','width');
s('mm','width:10mm','width');
s('in','width:1in','width');
s('pt','width:72pt','width');
s('pc','width:6pc','width');
document.getElementById('rec').textContent=out.join('\n');
</script></body></html>
