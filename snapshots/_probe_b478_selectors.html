<!doctype html><html><body><pre id=rec></pre><script>
const out=[];
function t(label,selector){ try{
  const d=document.createElement('div'); d.className='test'; d.id='target';
  d.setAttribute('data-x','hello');
  const inner=document.createElement('span'); inner.className='inner'; d.appendChild(inner);
  document.body.appendChild(d);
  const matches=d.matches(selector);
  out.push(label+' -> '+(matches?'MATCH':'no'));
  document.body.removeChild(d);
 }catch(e){ out.push(label+' ERR '+e.message); } }
// b478: selector functions
t(':is(div)','div');
t(':is(.test)','div:is(.test)');
t(':is(#target)','div:is(#target)');
t(':is(div,.test)','div:is(div,.test)');
t(':is(div p)','div:is(div p)');
t(':where(.test)','div:where(.test)');
t(':where(div,.test)','div:where(div,.test)');
t(':has(.inner)','div:has(.inner)');
t(':has(span)','div:has(span)');
t(':has(p)','div:has(p)');
t(':not(.other)','div:not(.other)');
t(':not(div)','div:not(div)');
t(':not(.other,.other2)','div:not(.other,.other2)');
t(':is(div):is(.test)','div:is(div):is(.test)');
t(':is(div > span)','div:is(div > span)');
t(':has(> span)','div:has(> span)');
out.push('SUP :is(div) = '+(()=>{try{return CSS.supports('selector(:is(div))')?'Y':'N';}catch(e){return 'ERR';}})());
out.push('SUP :has(.inner) = '+(()=>{try{return CSS.supports('selector(:has(.inner))')?'Y':'N';}catch(e){return 'ERR';}})());
out.push('SUP :where(div) = '+(()=>{try{return CSS.supports('selector(:where(div))')?'Y':'N';}catch(e){return 'ERR';}})());
out.push('SUP :not(.other) = '+(()=>{try{return CSS.supports('selector(:not(.other))')?'Y':'N';}catch(e){return 'ERR';}})());
document.getElementById('rec').textContent=out.join('\n');
</script></body></html>
