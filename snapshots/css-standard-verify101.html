<!DOCTYPE html><head><style>
body{margin:20px;font:14px Arial}
.c1{columns:3;background:#cfe;padding:0;column-gap:20px;width:300px;height:120px;column-rule:2px solid red}
.c1 p{margin:0 0 4px}
.c2{column-width:100px;column-gap:10px;width:300px;background:#fec;height:80px}
.c3{column-count:2;width:200px;background:#cef;height:60px;column-rule:4px dashed blue}
</style><body>
<div class="c1"><p>one</p><p>two</p><p>three</p><p>four</p><p>five</p><p>six</p><p>seven</p><p>eight</p><p>nine</p><p>ten</p></div>
<div class="c2"><p>a b c d e f g h i j k l m n o p q r s t u v w x y z aa bb cc dd ee ff gg hh ii jj</p></div>
<div class="c3"><p>left column text here</p><p>right column text here</p></div>
</body></html>
