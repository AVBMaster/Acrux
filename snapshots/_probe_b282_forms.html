<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>b282 probe 3 — speak, lab forms, mix spaces, grid-area parts</title></head><body>
<div id="probe" style="font-size:16px;color:rgb(9,9,9);width:200px"></div>
<pre id="report"></pre>
<script>
var host = document.getElementById('probe');
function spec(p,v){ host.setAttribute('style','font-size:16px;color:rgb(9,9,9);width:200px'); host.style.setProperty(p,v); return host.style.getPropertyValue(p); }
function comp(p,v){ host.setAttribute('style','font-size:16px;color:rgb(9,9,9);width:200px'); host.style.setProperty(p,v); return getComputedStyle(host).getPropertyValue(p); }
var CASES = [
  ['speak','auto'],['speak','none'],['speak','normal'],['speak','spell-out'],['speak','never'],
  ['speak','always'],['speak','once'],['speak','off'],['speak','muted'],['speak','BOTH'],
  ['color','lab(50% 20 30 / 50%)'],['color','lch(50% 30 50grad)'],['color','lch(50% 30 none)'],
  ['color','lab(none 20 30)'],['color','oklch(50% none 120 / none)'],
  ['color','color(srgb-linear 0.5 0 0)'],['color','color(xyz 0.1 0.2 0.3)'],
  ['color','color-mix(in lab, red, blue)'],['color','color-mix(in oklch, red 30%, blue)'],
  ['color','color-mix(in hsl, red, blue)'],['color','color-mix(in srgb-linear, red, blue)'],
  ['color','color-mix(in srgb, red, blue 100%)'],['color','color-mix(in oklab, red, blue 40%)'],
  ['grid-area','auto / 1 / auto / 2'],['grid-area','1 / auto'],['grid-area','span 2 / 3'],
  ['grid-row','1 / 3'],['grid-column','span 2'],
  ['shape-outside','border-box circle(50%)'],['shape-outside','polygon(0 0, 10px 0, 0 10px)'],
  ['shape-image-threshold','25%'],['shape-margin','2em'],
  ['list-style-type','HEX'],['list-style-type','Cjk-decimal'],['list-style-type','NONE'],
  ['list-style-type','STRING']
];
var out = [];
for (var i=0;i<CASES.length;i++) {
  var c = CASES[i];
  out.push(i + '|' + c[0] + '|' + c[1] + '|' + spec(c[0],c[1]) + '|' + comp(c[0],c[1]));
}
var text = out.join('\n');
document.getElementById('report').textContent = text;
console.log(text);
</script></body></html>
