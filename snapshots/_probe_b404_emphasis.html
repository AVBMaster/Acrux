<!doctype html><html><body><pre id=rec></pre><script>
const out=[];
function t(p,v){const el=document.createElement('div');document.body.appendChild(el);el.style.cssText='';el.style.setProperty(p,v);out.push(p+'='+JSON.stringify(v)+' sup='+CSS.supports(p,v)+' echo='+JSON.stringify(el.style.getPropertyValue(p)));el.remove();}
// text emphasis
t('text-emphasis','none');
t('text-emphasis','filled');
t('text-emphasis','open');
t('text-emphasis','dot');
t('text-emphasis','circle');
t('text-emphasis','double-circle');
t('text-emphasis','triangle');
t('text-emphasis','sesame');
t('text-emphasis','filled dot');
t('text-emphasis','open circle red');
t('text-emphasis','bogus');
t('text-emphasis-color','red');
t('text-emphasis-color','currentcolor');
t('text-emphasis-style','none');
t('text-emphasis-style','filled sesame');
t('text-emphasis-position','over');
t('text-emphasis-position','under');
t('text-emphasis-position','over right');
// text-decoration longhands (verify still clean)
t('text-decoration-line','underline');
t('text-decoration-line','overline');
t('text-decoration-line','line-through');
t('text-decoration-line','underline overline');
t('text-decoration-line','none');
t('text-decoration-line','bogus');
t('text-decoration-style','solid');
t('text-decoration-style','wavy');
t('text-decoration-style','double');
t('text-decoration-color','red');
t('text-decoration-thickness','auto');
t('text-decoration-thickness','2px');
t('text-decoration-skip-ink','none');
t('text-decoration-skip-ink','auto');
t('text-underline-offset','auto');
t('text-underline-offset','3px');
t('text-underline-position','auto');
t('text-underline-position','under');
t('text-underline-position','left');
t('text-decoration','none');
t('text-decoration','underline');
t('text-decoration','underline wavy red');
document.getElementById('rec').textContent=out.join('\n');
console.log(out.join('\n'));
</script></body></html>
