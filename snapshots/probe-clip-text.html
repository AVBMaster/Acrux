<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body { margin: 0; padding: 0; background: rgb(255,255,255); }
#t { position: absolute; left: 0; top: 0; left: 0; top: 0; font-family: Arial; font-size: 40px;
     background: linear-gradient(to right, rgb(255,0,0), rgb(0,0,255));
     -webkit-background-clip: text; background-clip: text; color: transparent; }
#u { position: absolute; left: 0; top: 60px; left: 0; top: 60px; font-family: Arial; font-size: 40px;
     background: linear-gradient(to right, rgb(255,0,0), rgb(0,0,255)); color: transparent; }
</style>
</head>
<body>
<div id="t">TEXT</div>
<div id="u">TEXT</div>
</body>
</html>
