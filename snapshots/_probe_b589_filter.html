<!doctype html><html><head><meta charset=utf-8><style>
body{font:12px monospace;margin:4px}
/* filter functions */
#f1{filter:blur(2px);width:40px;height:20px;background:#eef}
#f2{filter:brightness(1.5);width:40px;height:20px;background:#eef}
#f3{filter:grayscale(1);width:40px;height:20px;background:#eef}
#f4{filter:sepia(0.5);width:40px;height:20px;background:#eef}
#f5{filter:saturate(2);width:40px;height:20px;background:#eef}
#f6{filter:hue-rotate(90deg);width:40px;height:20px;background:#eef}
#f7{filter:invert(1);width:40px;height:20px;background:#eef}
#f8{filter:opacity(0.5);width:40px;height:20px;background:#eef}
#f9{filter:drop-shadow(2px 2px 2px red);width:40px;height:20px;background:#eef}
#fa{filter:blur(1px) brightness(2);width:40px;height:20px;background:#eef}
/* clip-path shapes */
#k1{clip-path:circle(20px at 20px 20px);width:40px;height:40px;background:#eef}
#k2{clip-path:ellipse(20px 10px at 20px 20px);width:40px;height:40px;background:#eef}
#k3{clip-path:inset(5px 10px);width:40px;height:40px;background:#eef}
#k4{clip-path:polygon(50% 0,100% 100%,0 100%);width:40px;height:40px;background:#eef}
/* mask */
#m1{mask-image:linear-gradient(black,transparent);width:40px;height:20px;background:red}
#m2{-webkit-mask-image:linear-gradient(black,transparent);width:40px;height:20px;background:red}
</style></head><body><meta charset=utf-8>
<div id=f1>f1</div><div id=f2>f2</div><div id=f3>f3</div><div id=f4>f4</div>
<div id=f5>f5</div><div id=f6>f6</div><div id=f7>f7</div><div id=f8>f8</div>
<div id=f9>f9</div><div id=fa>fa</div>
<div id=k1>k1</div><div id=k2>k2</div><div id=k3>k3</div><div id=k4>k4</div>
<div id=m1>m1</div><div id=m2>m2</div>
<script>
const ids=["f1","f2","f3","f4","f5","f6","f7","f8","f9","fa","k1","k2","k3","k4","m1","m2"];
const g=id=>{const s=getComputedStyle(document.getElementById(id));
 return id+":f="+String(s.filter).split(",").join("/").slice(0,40)+"|cp="+String(s.clipPath).split(",").join("/").slice(0,30)+"|mi="+String(s.maskImage||s.webkitMaskImage||"-").slice(0,20);};
document.body.appendChild(document.createElement("div")).textContent=ids.map(g).join(" ## ");
</script></body></html>
