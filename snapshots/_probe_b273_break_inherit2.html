<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>b273 break inherit2</title>
<style>body{font:12px monospace;margin:0}#p{break-inside:avoid-column}</style></head><body>
<div id="p"><div id="kid">x</div></div>
