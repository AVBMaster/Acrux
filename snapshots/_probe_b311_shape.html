<!doctype html>
<html><head><meta charset="utf-8"><title>b311 shape</title></head>
<body>
<div id="host"></div>
<script>
// b311_shape
function build() {
const host = document.createElement('div');
document.body.appendChild(host);
const rows = [];
const cases = [["offset-path","xywh(1 2 3 4)"],["offset-path","circle(10)"],["offset-path","circle(0)"],["offset-path","ellipse(10 20)"],["offset-path","inset(1)"],["offset-path","inset(0 round 1)"],["offset-path","inset(10px round 5)"],["offset-path","xywh(0 0 10px 10px)"],["clip-path","inset(1)"],["clip-path","circle(50%)"],["clip-path","circle(10)"],["clip-path","polygon(50% 0, 0 100%, 100% 100%)"],["object-view-box","inset(1)"],["object-view-box","inset(0)"],["object-view-box","xywh(0 0 10px 10px)"],["object-view-box","xywh(1 2 3 4)"],["offset-distance","50%"],["offset-distance","10px"]];
for (let i = 0; i < cases.length; i++) {
const el = document.createElement('div');
host.appendChild(el);
  el.style.setProperty(cases[i][0], cases[i][1]);
  rows.push(i + '|' + cases[i][0] + '|' + cases[i][1]
      + '|sup=' + (CSS.supports(cases[i][0], cases[i][1]) ? 1 : 0)
      + '|echo=' + el.style.getPropertyValue(cases[i][0])
      + '|comp=' + getComputedStyle(el).getPropertyValue(cases[i][0]));
}
document.body.insertAdjacentHTML('beforeend',
    '<pre id="record" style="font:10px/1.35 monospace;white-space:pre-wrap">'
    + rows.join('\n') + '</pre>');
console.log(rows.join('\n'));
host.remove();
}
build();
</script>
</body></html>
