<!doctype html><html><head><style>body{font:20px monospace;white-space:pre;margin:0}
.wrap{width:200px;height:100px;background:#eef}
#st{position:sticky;top:50px;width:60px;height:30px;background:#dfd}
#after{width:60px;height:20px;background:#fdd}
</style></head><body>
<div class=wrap>wrap</div>
<div id=st>sticky</div>
<div id=after>after</div>
<script>const g=id=>{const r=document.getElementById(id).getBoundingClientRect();return id+"="+Math.round(r.width)+"x"+Math.round(r.height)+"@"+Math.round(r.left)+","+Math.round(r.top);};
document.body.appendChild(document.createTextNode(g("wrap")+"#"+g("st")+"#"+g("after")));</script></body></html>
