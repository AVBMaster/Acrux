<!doctype html><html><body><pre id=rec></pre><script>
const out=[];
function s(label,css,props){ try{ const d=document.createElement('div'); d.style.cssText=css;
  document.body.appendChild(d); const cs=getComputedStyle(d); const parts=[];
  for(const p of props) parts.push(p+'='+cs.getPropertyValue(p));
  out.push(label+' '+parts.join(' | ')); d.remove(); }
  catch(e){ out.push(label+' ERR '+e.message); } }
// b468: transition + animation computed values
s('tr-none','transition:none',['transition']);
s('tr-all','transition:all',['transition']);
s('tr-width','transition:width',['transition-property','transition-duration']);
s('tr-dur','transition:width 2s',['transition-property','transition-duration']);
s('tr-full','transition:width 2s ease-in-out 0.5s',['transition-property','transition-duration','transition-timing-function','transition-delay']);
s('tr-multi','transition:width 1s, height 2s',['transition-property','transition-duration']);
s('tr-timing-linear','transition:width 1s linear',['transition-timing-function']);
s('tr-timing-ease','transition:width 1s ease',['transition-timing-function']);
s('tr-timing-bezier','transition:width 1s cubic-bezier(0.25,0.1,0.25,1)',['transition-timing-function']);
s('tr-timing-steps','transition:width 1s steps(5)',['transition-timing-function']);
s('tr-delay','transition:width 1s ease 2s',['transition-delay']);
s('an-name','animation:slide 2s',['animation-name','animation-duration']);
s('an-name-only','animation-name:slide',['animation-name']);
s('an-none','animation:none',['animation-name']);
s('an-iter','animation:slide 2s linear infinite',['animation-iteration-count']);
s('an-dir','animation:slide 2s reverse',['animation-direction']);
s('an-fill','animation:slide 2s forwards',['animation-fill-mode']);
s('an-play','animation-play-state:paused',['animation-play-state']);
s('an-timing','animation:slide 2s cubic-bezier(0.25,0.1,0.25,1)',['animation-timing-function']);
s('an-delay','animation:slide 2s ease-in 1s',['animation-delay']);
out.push('SUP transition:width 2s = '+(()=>{try{return CSS.supports('transition','width 2s')?'Y':'N';}catch(e){return 'ERR';}})());
out.push('SUP animation:slide 2s = '+(()=>{try{return CSS.supports('animation','slide 2s')?'Y':'N';}catch(e){return 'ERR';}})());
out.push('SUP transition:width 1s cubic-bezier(0.25,0.1,0.25,1) = '+(()=>{try{return CSS.supports('transition','width 1s cubic-bezier(0.25,0.1,0.25,1)')?'Y':'N';}catch(e){return 'ERR';}})());
out.push('SUP animation-play-state:paused = '+(()=>{try{return CSS.supports('animation-play-state','paused')?'Y':'N';}catch(e){return 'ERR';}})());
document.getElementById('rec').textContent=out.join('\n');
</script></body></html>
