<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  body { font-family: Arial; font-size: 16px; margin: 8px; }
  h2 { font-size: 14px; background: #eee; margin: 8px 0 4px; }
  .b { width: 100px; height: 60px; margin-bottom: 30px; }
</style></head><body>
<h2>1. outline follows per-corner border-radius</h2>
<div class="b" style="border-radius: 30px 0 30px 0; outline: 4px solid #e33; background:#fd8"></div>
<div class="b" style="border-radius: 50%; outline: 4px solid #e33; background:#fd8"></div>
<div class="b" style="border-radius: 20px / 60px; outline: 4px solid #e33; outline-offset: 5px; background:#fd8"></div>
<div class="b" style="border-radius: 0 40px 0 40px; outline: 3px dashed #e33; background:#fd8"></div>
<h2>2. box-shadow follows elliptical / percentage radius</h2>
<div class="b" style="border-radius: 50%; box-shadow: 0 8px 12px #36c; background:#fff"></div>
<div class="b" style="border-radius: 40px 0 40px 0; box-shadow: 0 8px 12px #36c; background:#fff"></div>
<div class="b" style="border-radius: 30px 0 30px 0 / 60px 0 60px 0; box-shadow: 0 8px 12px #0a0; background:#fff"></div>
<div class="b" style="border-radius: 50%; box-shadow: inset 0 0 0 6px #c33; background:#fff"></div>
<h2>3. gradient background clipped by radius</h2>
<div class="b" style="border-radius: 50%; background: linear-gradient(90deg,#f00,#00f)"></div>
<div class="b" style="border-radius: 50% / 100%; background: linear-gradient(180deg,#0f0,#00f)"></div>
<div class="b" style="border-radius: 40px 0 40px 0; background: repeating-linear-gradient(90deg,#333 0 10px,#eee 10px 20px)"></div>
<h2>4. non-uniform colours on a rounded border</h2>
<div class="b" style="border: 8px solid; border-color:#f00 #0f0 #00f #0ff; border-radius: 24px"></div>
<div class="b" style="border: 8px solid; border-color:#f00 #0f0 #00f #0ff; border-radius: 50%"></div>
</body></html>
