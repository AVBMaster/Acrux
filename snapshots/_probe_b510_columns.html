<!doctype html><html><body><pre id=rec></pre><script>
const out=[];
function s(label,css,props){ try{ const d=document.createElement('div'); d.style.cssText=css;
  document.body.appendChild(d); const cs=getComputedStyle(d); const parts=[];
  for(const p of props) parts.push(p+'='+cs.getPropertyValue(p));
  out.push(label+' '+parts.join(' | ')); d.remove(); }
  catch(e){ out.push(label+' ERR '+e.message); } }
// multicol
s('cols-2','columns:2',['column-count','column-width']);
s('cols-100px','columns:100px',['column-count','column-width']);
s('col-count','column-count:3',['column-count']);
s('col-width','column-width:150px',['column-width']);
s('col-width-auto','column-width:auto',['column-width']);
s('col-gap-c','column-gap:20px',['column-gap']);
s('col-rule','column-rule:1px solid red',['column-rule-width','column-rule-style','column-rule-color']);
s('col-rule-style','column-rule-style:dashed',['column-rule-style']);
s('col-span','column-span:none',['column-span']);
s('col-span-all','column-span:all',['column-span']);
s('col-fill','column-fill:balance',['column-fill']);
s('col-fill-auto','column-fill:auto',['column-fill']);
// writing shorthand aliases for column-break
s('cbrk-inside','column-break-inside:avoid',['break-inside']);
s('cbrk-after','column-break-after:always',['break-after']);
// @page-relevant
s('orphans-2','orphans:2',['orphans']);
s('widows-2','widows:2',['widows']);
s('size-page','size:A4',['size']);
s('size-px','size:800px 600px',['size']);
// caption-side / empty-cells / table-layout
s('cap-top','caption-side:top',['caption-side']);
s('cap-bottom','caption-side:bottom',['caption-side']);
s('empty-hide','empty-cells:hide',['empty-cells']);
s('tlayout-fixed','table-layout:fixed',['table-layout']);
s('tlayout-auto','table-layout:auto',['table-layout']);
document.getElementById('rec').textContent=out.join('\n');
</script></body></html>
