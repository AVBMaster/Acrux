<!doctype html><html><head><meta charset="utf-8"><style>body{margin:8px;font:14px monospace}</style></head><body><div id="out"></div>
<script>
const out=[];
function L(t,v){out.push("L~"+t+"~"+String(v).split(" ").join("_"));}
function gc(tag,css,prop){
  const d=document.createElement("div");d.setAttribute("style",css);document.body.appendChild(d);
  const v=getComputedStyle(d).getPropertyValue(prop).trim();
  L(tag,prop+"="+(v===""?"(empty)":v.split(" ").join("_")));d.remove();
}
// page-break properties
gc("pbb-always","page-break-before:always","page-break-before");
gc("pbb-auto","page-break-before:auto","page-break-before");
gc("pbb-avoid","page-break-before:avoid","page-break-before");
gc("pbb-left","page-break-before:left","page-break-before");
gc("pbb-right","page-break-before:right","page-break-before");
gc("pbb-recto","page-break-before:recto","page-break-before");
gc("pbb-verso","page-break-before:verso","page-break-before");
gc("pba-always","page-break-after:always","page-break-after");
gc("pba-auto","page-break-after:auto","page-break-after");
gc("pba-avoid","page-break-after:avoid","page-break-after");
gc("pba-left","page-break-after:left","page-break-after");
gc("pba-right","page-break-after:right","page-break-after");
gc("pbi-avoid","page-break-inside:avoid","page-break-inside");
gc("pbi-auto","page-break-inside:auto","page-break-inside");
// break properties
gc("bk-before-auto","break-before:auto","break-before");
gc("bk-before-avoid","break-before:avoid","break-before");
gc("bk-before-page","break-before:page","break-before");
gc("bk-before-col","break-before:column","break-before");
gc("bk-before-region","break-before:region","break-before");
gc("bk-after-auto","break-after:auto","break-after");
gc("bk-after-avoid","break-after:avoid","break-after");
gc("bk-after-page","break-after:page","break-after");
gc("bk-after-col","break-after:column","break-after");
gc("bk-inside-auto","break-inside:auto","break-inside");
gc("bk-inside-avoid","break-inside:avoid","break-inside");
gc("bk-inside-avoid-page","break-inside:avoid-page","break-inside");
gc("bk-inside-avoid-col","break-inside:avoid-column","break-inside");
// orphans and widows
gc("orph-1","orphans:1","orphans");
gc("orph-3","orphans:3","orphans");
gc("wid-1","widows:1","widows");
gc("wid-2","widows:2","widows");
// box-decoration-break
gc("bdb-clone","box-decoration-break:clone","box-decoration-break");
gc("bdb-slice","box-decoration-break:slice","box-decoration-break");
// column-fill
gc("cf-balance","column-fill:balance","column-fill");
gc("cf-auto","column-fill:auto","column-fill");
document.getElementById("out").textContent=out.join("\n");
</script></body></html>
