<!doctype html><html><head><meta charset=utf-8><style>
body{font:12px monospace;margin:4px}
input[type=text]{width:120px;height:24px;border:1px solid #000;padding:2px}
input[type=checkbox]{width:14px;height:14px}
input[type=radio]{width:14px;height:14px}
input[type=range]{width:100px}
select{width:100px;height:24px}
textarea{width:120px;height:40px;border:1px solid #000}
button{width:60px;height:24px;border:1px solid #000;background:#eee}
input:focus{outline:2px solid blue}
input:disabled{background:#ddd}
input[readonly]{background:#ffd}
input:checked+span{color:red}
fieldset{border:2px solid #000;width:200px}
legend{padding:0 4px}
</style></head><body>
<input type=text value="hello" id=i1>
<input type=checkbox id=i2 checked>
<input type=radio id=i3>
<input type=range id=i4 min=0 max=10 value=5>
<select id=s1><option>a</option><option selected>b</option></select>
<textarea id=ta>text</textarea>
<button id=btn>Click</button>
<input type=text id=i5 disabled>
<input type=text id=i6 readonly value="ro">
<fieldset id=fs><legend>Legend</legend><input type=text value=x></fieldset>
<script>
const ids=["i1","i2","i3","i4","s1","ta","btn","i5","i6","fs"];
const g=id=>{const e=document.getElementById(id);const s=getComputedStyle(e);const r=e.getBoundingClientRect();
 return id+"="+Math.round(r.width)+"x"+Math.round(r.height)+" app="+s.appearance+" dis="+s.disabled+" bord="+s.borderTopWidth+" bg="+s.backgroundColor.split("(")[0];};
document.body.appendChild(document.createElement("div")).textContent=ids.map(g).join("#");
</script></body></html>
