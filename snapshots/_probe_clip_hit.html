<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>probe clip hit semantics</title>
<style>
  html,body{margin:0;padding:0}
  .box{position:relative;width:200px;height:60px;margin:0 0 20px 0}
  #a{position:absolute;left:0;top:0;width:200px;height:60px;background:#f80;clip-path:inset(0 100px 0 0)}
  #a .kid{position:absolute;left:150px;top:10px;width:30px;height:30px;background:#0a0}
  #b{position:absolute;left:0;top:0;width:200px;height:60px;background:#8f8;
      -webkit-mask-image:linear-gradient(#000,#000);mask-image:linear-gradient(transparent,transparent)}
  #c{position:absolute;left:250px;top:0;width:60px;height:60px;background:#88f;transform:rotate(45deg)}
  #c .kid{position:absolute;left:10px;top:10px;width:20px;height:20px;background:#00f;clip-path:inset(0 10px 0 0)}
</style></head><body>
<div class="box"><div id="a"><div class="kid" id="akid"></div></div></div>
<div class="box"><div id="b"></div></div>
<div class="box"><div id="c"><div class="kid" id="ckid"></div></div></div>
</body></html>
