<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>b135 marker with and without inline child</title>
<style>
body { font: 16px "Segoe UI", sans-serif; margin: 0; padding: 0; }
ul { margin: 0; padding: 0 0 0 80px; }
li { margin-bottom: 4px; background: rgb(240,240,240); }
.n { list-style-type: decimal; }
.d { list-style-type: disc; }
.c { list-style-type: cjk-decimal; }
.ins { list-style-position: inside; }
span { background: rgb(255,200,200); }
em { background: rgb(200,255,200); }
</style>
</head>
<body>
<ul class="n">
  <li id="t1">plain text Alpha</li>
  <li id="t2"><span>Alpha</span></li>
  <li id="t3">text then <span>span</span></li>
  <li id="t4"><em>emphasis</em> tail</li>
  <li id="t5"><span>Alpha</span> and text</li>
</ul>
<ul class="d ins" id="ins">
  <li id="s1">plain text Alpha</li>
  <li id="s2"><span>Alpha</span></li>
</ul>
<ol class="c" id="cjk">
  <li id="u1">plain text Alpha</li>
  <li id="u2"><span>Alpha</span></li>
</ol>
</body>
</html>
