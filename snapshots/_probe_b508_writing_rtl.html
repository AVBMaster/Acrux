<!doctype html><html><body><pre id=rec></pre><script>
const out=[];
function s(label,css,props){ try{ const d=document.createElement('div'); d.style.cssText=css;
  document.body.appendChild(d); const cs=getComputedStyle(d); const parts=[];
  for(const p of props) parts.push(p+'='+cs.getPropertyValue(p));
  out.push(label+' '+parts.join(' | ')); d.remove(); }
  catch(e){ out.push(label+' ERR '+e.message); } }
// writing-mode
s('wm-h-tb','writing-mode:horizontal-tb',['writing-mode']);
s('wm-v-rl','writing-mode:vertical-rl',['writing-mode']);
s('wm-v-lr','writing-mode:vertical-lr',['writing-mode']);
s('wm-sideways','writing-mode:sideways',['writing-mode']);
// direction
s('dir-ltr','direction:ltr',['direction']);
s('dir-rtl','direction:rtl',['direction']);
// text-orientation
s('to-mixed','writing-mode:vertical-rl;text-orientation:mixed',['text-orientation']);
s('to-upright','writing-mode:vertical-rl;text-orientation:upright',['text-orientation']);
s('to-sideways','writing-mode:vertical-rl;text-orientation:sideways',['text-orientation']);
// bidi-override / isolate
s('ubo-normal','unicode-bidi:normal',['unicode-bidi']);
s('ubo-embed','unicode-bidi:embed',['unicode-bidi']);
s('ubo-override','unicode-bidi:bidi-override',['unicode-bidi']);
s('ubo-isolate','unicode-bidi:isolate',['unicode-bidi']);
s('ubo-isolate-override','unicode-bidi:isolate-override',['unicode-bidi']);
s('ubo-plaintext','unicode-bidi:plaintext',['unicode-bidi']);
// logical props under vertical writing mode
s('mi-vert','writing-mode:vertical-rl;margin-inline:10px',['margin-top','margin-bottom']);
s('pi-vert','writing-mode:vertical-rl;padding-inline:8px',['padding-top','padding-bottom']);
s('mw-vert','writing-mode:vertical-rl;max-width:100px',['max-width','max-height']);
// text-align under rtl
s('ta-start-rtl','direction:rtl;text-align:start',['text-align']);
s('ta-end-rtl','direction:rtl;text-align:end',['text-align']);
document.getElementById('rec').textContent=out.join('\n');
</script></body></html>
