<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;font:16px/20px Arial}#log{font:12px monospace;white-space:pre}</style></head>
<body><div id="stage" style="position:absolute;left:-4000px;top:0"></div><div id="log"></div><script>
var log=document.getElementById('log'),stage=document.getElementById('stage');
function emit(t){log.textContent+=t+'\n';}
var cases=[
 ['pad-zero','<span id="s" style="padding:0">a<br>b</span>'],
 ['border-zero','<span id="s" style="border:0 solid red">a<br>b</span>'],
 ['margin-zero','<span id="s" style="margin:0">a<br>b</span>'],
 ['outline-zero','<span id="s" style="outline:0 solid red">a<br>b</span>'],
 ['bg-white','<span id="s" style="background:#fff">a<br>b</span>'],
 ['bgimg','<span id="s" style="background:url(x.png)">a<br>b</span>'],
 ['boxdecoration-clone','<span id="s" style="box-decoration-break:clone;padding:0 6px">a<br>b</span>'],
 ['slice-pad-3line','<span id="s" style="padding:0 6px;border:2px solid #333">a<br>b<br>c</span>'],
 ['slice-softwrap','<span id="s" style="padding:0 6px;border:2px solid #333">aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa b</span>'],
 ['slice-softwrap-clone','<span id="s" style="box-decoration-break:clone;padding:0 6px;border:2px solid #333">aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa b</span>'],
 ['pad-softwrap','<span id="s" style="padding:0 6px">aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa b</span>'],
 ['border-softwrap','<span id="s" style="border:2px solid #333">aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa b</span>']
];
for(var i=0;i<cases.length;i++){
 stage.innerHTML='<div style="width:300px">'+cases[i][1]+'</div>';
 var s=stage.querySelector('#s'),r=s.getClientRects();
 var parts=[];for(var j=0;j<r.length;j++)parts.push('['+Math.round(r[j].left+4000)+','+Math.round(r[j].top)+','+Math.round(r[j].width)+','+Math.round(r[j].height)+']');
 emit(cases[i][0]+' n='+r.length+' '+parts.join(''));
}
stage.innerHTML='';
console.log(log.textContent);
</script></body></html>
