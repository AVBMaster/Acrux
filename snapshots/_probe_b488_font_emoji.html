<!doctype html><html><body><pre id=rec></pre><script>
const out=[];
function s(label,css,props){ try{ const d=document.createElement('div'); d.style.cssText=css;
  document.body.appendChild(d); const cs=getComputedStyle(d); const parts=[];
  for(const p of props) parts.push(p+'='+cs.getPropertyValue(p));
  out.push(label+' '+parts.join(' | ')); d.remove(); }
  catch(e){ out.push(label+' ERR '+e.message); } }
// b488: font-language-override, font-variant-position, font-variant-emoji, text-emphasis details
s('flo-normal','font-language-override:normal',['font-language-override']);
s('flo-jpn','font-language-override:"JPN"',['font-language-override']);
s('flo-str','font-language-override:"ENG"',['font-language-override']);
s('fvp-normal','font-variant-position:normal',['font-variant-position']);
s('fvp-sub','font-variant-position:sub',['font-variant-position']);
s('fvp-super','font-variant-position:super',['font-variant-position']);
s('fve-normal','font-variant-emoji:normal',['font-variant-emoji']);
s('fve-text','font-variant-emoji:text',['font-variant-emoji']);
s('fve-emoji','font-variant-emoji:emoji',['font-variant-emoji']);
s('fve-unicode','font-variant-emoji:unicode',['font-variant-emoji']);
s('te-none','text-emphasis:none',['text-emphasis','text-emphasis-style','text-emphasis-color']);
s('te-dot','text-emphasis:dot',['text-emphasis','text-emphasis-style','text-emphasis-color']);
s('te-circle-red','text-emphasis:circle red',['text-emphasis','text-emphasis-style','text-emphasis-color']);
s('te-sesame','text-emphasis:sesame',['text-emphasis','text-emphasis-style','text-emphasis-color']);
s('te-double-circle','text-emphasis:double-circle',['text-emphasis','text-emphasis-style','text-emphasis-color']);
s('te-triangle','text-emphasis:triangle',['text-emphasis','text-emphasis-style','text-emphasis-color']);
s('te-filled','text-emphasis:filled',['text-emphasis','text-emphasis-style','text-emphasis-color']);
s('te-open','text-emphasis:open',['text-emphasis','text-emphasis-style','text-emphasis-color']);
s('te-dot-sesame','text-emphasis:dot sesame',['text-emphasis','text-emphasis-style','text-emphasis-color']);
s('tes-filled-circle','text-emphasis-style:filled circle',['text-emphasis-style']);
s('tes-open-dot','text-emphasis-style:open dot',['text-emphasis-style']);
s('tes-str','text-emphasis-style:"*"',['text-emphasis-style']);
s('tecm','text-emphasis-color:currentColor',['text-emphasis-color']);
s('teca-over','text-emphasis-position:over right',['text-emphasis-position']);
s('teca-under','text-emphasis-position:under left',['text-emphasis-position']);
s('teca-over-left','text-emphasis-position:over left',['text-emphasis-position']);
s('fl-normal','font-language-override:normal',['font-language-override']);
document.getElementById('rec').textContent=out.join('\n');
</script></body></html>
