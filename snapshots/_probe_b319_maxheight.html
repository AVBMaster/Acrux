<!doctype html>
<html><head><meta charset="utf-8"><title>b319 max-height computed</title></head>
<body>
<pre id="record" style="font:10px/1.35 monospace;white-space:pre-wrap"></pre>
<script>
const host=document.createElement('div');host.style.width='600px';document.body.appendChild(host);
const rows=[];
const cases=[
 ['max-height','auto'],
 ['max-height','none'],
 ['max-height','calc-size(auto, size)'],
 ['max-height','calc-size(auto, size + 1em)'],
 ['max-height','calc-size(100px, size + 1em)'],
 ['max-width','auto'],
 ['max-inline-size','auto']];
for (const [p,v] of cases){
const d=document.createElement('div'); d.style.width='600px'; host.appendChild(d);
d.style.setProperty(p,v);
rows.push(p+'='+v+' || spec='+JSON.stringify(d.style.getPropertyValue(p))+' || comp='+getComputedStyle(d).getPropertyValue(p));
d.remove();}
document.getElementById('record').textContent=rows.join('\n');
console.log(rows.join('\n'));
</script></body></html>
