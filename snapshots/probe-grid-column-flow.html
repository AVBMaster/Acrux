<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body { margin: 0; padding: 0; background: rgb(255,255,255); }
#gaf { display: grid; grid-auto-flow: column; grid-template-rows: 20px 20px; grid-auto-columns: 30px; gap: 4px; width: 120px; }
#gaf div { background: rgb(255,0,0); height: 20px; }
#gaf .b { background: rgb(0,0,255); }
/* dense column flow: the 1x1 item backfills the hole left by the 2-row item */
#cd { display: grid; grid-auto-flow: column dense; grid-template-rows: 20px 20px; grid-auto-columns: 30px; gap: 0; }
#cd div { background: rgb(255,0,0); }
#cd .tall { grid-row: span 2; background: rgb(0,0,255); }
</style>
</head>
<body>
<div id="gaf"><div>1</div><div class="b">2</div><div>3</div><div class="b">4</div></div>
<div id="cd"><div class="tall">a</div><div>b</div><div>c</div><div>d</div></div>
</body>
</html>
