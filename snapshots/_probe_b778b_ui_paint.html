<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:10px;background:#fff;font:12px monospace}
.row{margin:8px 0}
.o1{width:90px;height:50px;background:#cfc;outline:3px solid red;outline-offset:5px;display:inline-block;vertical-align:top}
.o2{width:90px;height:50px;background:#ccf;outline:2px dashed blue;outline-offset:-8px;display:inline-block;vertical-align:top;margin-left:20px}
.o3{width:90px;height:50px;background:#fcc;outline:dotted green;outline-offset:0;display:inline-block;vertical-align:top;margin-left:20px}
.o4{width:90px;height:50px;background:#ffc;outline:6px double purple;display:inline-block;vertical-align:top;margin-left:20px}
</style></head><body>
<div class="row"><div class="o1"></div><div class="o2"></div><div class="o3"></div><div class="o4"></div></div>
<div class="row">
<label><input type="checkbox" checked style="accent-color:#e33;width:22px;height:22px"> accent red</label>
<label><input type="radio" checked style="accent-color:#3a3;width:22px;height:22px"> accent green</label>
<label><input type="checkbox" checked style="accent-color:auto;width:22px;height:22px"> accent auto</label>
</div>
</body></html>
