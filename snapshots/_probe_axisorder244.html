<!DOCTYPE html><html><head><style>
/* One <div> per case; the JS below reads the three position properties back. */
.c { background-image: url(a.png); }
#a1 { background-position: 10px 20px; }
#a2 { background-position: 10px; }
#a3 { background-position: center; }
#a4 { background-position: right 10px bottom 20px; }
#a5 { background-position: 10px 20px, 30px; }
#b1 { background-position-x: 30px; background-position: 10px 20px; }
#b2 { background-position: 10px 20px; background-position-x: 30px; }
#b3 { background-position-y: 40px; background-position: 10px 20px; }
#b4 { background-position-x: 30px; background-position: inherit; }
#c1 { background: url(x.png) 10px 20px; background-position-x: 30px; }
#c2 { background-position-x: 30px; background: url(x.png) 10px 20px; }
#c3 { background-position: 5px 6px; background: url(x.png); }
#c4 { background-position: 5px 6px; background: url(x.png) top; }
#c5 { background: url(x.png) right 10px; }
#d1 { background-position-x: 10px, 20px; background-position-y: 5px; }
#d2 { background-position: 10px 20px; background-position-x: 30px, 40px; }
#e1 { background-position-x: calc(100% - 10px); }
#e2 { background-position-x: right 10px; }
#e3 { background-position-x: 10px 20px; }
#e4 { background-position: top 10px; }
#e5 { background-position-x: bottom; }
#f1 { background-position: 10% 20%; background: url(x.png) 30px 40px; background-position-y: 50px; }
</style></head><body>
<div class="c" id="a1"></div><div class="c" id="a2"></div><div class="c" id="a3"></div>
<div class="c" id="a4"></div><div class="c" id="a5"></div>
<div class="c" id="b1"></div><div class="c" id="b2"></div><div class="c" id="b3"></div>
<div class="c" id="b4"></div>
<div id="c1"></div><div id="c2"></div><div id="c3"></div><div id="c4"></div><div id="c5"></div>
<div class="c" id="d1"></div><div class="c" id="d2"></div>
<div class="c" id="e1"></div><div class="c" id="e2"></div><div class="c" id="e3"></div>
<div class="c" id="e4"></div><div class="c" id="e5"></div>
<div class="c" id="f1"></div>
<script>
window.__probe = function () {
  var out = {};
  document.querySelectorAll('div').forEach(function (el) {
    var cs = getComputedStyle(el);
    out[el.id] = {
      p: cs.backgroundPosition,
      x: cs.backgroundPositionX,
      y: cs.backgroundPositionY,
      i: cs.backgroundImage
    };
  });
  return out;
};
</script>
</body></html>
