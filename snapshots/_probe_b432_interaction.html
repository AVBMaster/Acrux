<!doctype html><html><body><pre id=rec></pre><script>
const out=[];
function s(label,el,props){ try{ const cs=getComputedStyle(el); const parts=[];
  for(const p of props) parts.push(p+'='+cs.getPropertyValue(p));
  out.push(label+' '+parts.join(' | ')); }catch(e){ out.push(label+' ERR '+e.message); } }
function mk(css){const d=document.createElement('div');d.style.cssText=css;document.body.appendChild(d);return d;}
function sup(prop,val){ try{ return CSS.supports(prop,val)?'Y':'N'; }catch(e){ return 'ERR'; } }
// b432: newer visual/interaction properties
s('overlay-auto', mk('overlay:auto'), ['overlay']);
s('overlay-none', mk('overlay:none'), ['overlay']);
s('content-visibility-vis', mk('content-visibility:visible'), ['content-visibility']);
s('content-visibility-hid', mk('content-visibility:hidden'), ['content-visibility']);
s('content-visibility-auto', mk('content-visibility:auto'), ['content-visibility']);
s('cursor-pointer', mk('cursor:pointer'), ['cursor']);
s('cursor-grab', mk('cursor:grab'), ['cursor']);
s('cursor-bogus', mk('cursor:bogus'), ['cursor']);
s('cursor-url', mk('cursor:url(x.png), auto'), ['cursor']);
s('user-select-none', mk('user-select:none'), ['user-select']);
s('user-select-all', mk('user-select:all'), ['user-select']);
s('pointer-events-none', mk('pointer-events:none'), ['pointer-events']);
s('resize-both', mk('resize:both'), ['resize']);
s('resize-block', mk('resize:block'), ['resize']);
s('touch-action-none', mk('touch-action:none'), ['touch-action']);
s('touch-action-pan-x', mk('touch-action:pan-x pan-y'), ['touch-action']);
s('overscroll-contain', mk('overscroll-behavior:contain'), ['overscroll-behavior']);
s('overscroll-x-y', mk('overscroll-behavior-x:contain;overscroll-behavior-y:none'), ['overscroll-behavior-x','overscroll-behavior-y']);
s('isolation-isolate', mk('isolation:isolate'), ['isolation']);
s('mix-blend-multiply', mk('mix-blend-mode:multiply'), ['mix-blend-mode']);
s('backdrop-filter-blur', mk('backdrop-filter:blur(5px)'), ['backdrop-filter']);
s('will-change-trans', mk('will-change:transform'), ['will-change']);
s('will-change-multi', mk('will-change:transform,opacity'), ['will-change']);
out.push('SUP overlay:auto = '+sup('overlay','auto'));
out.push('SUP overlay:bogus = '+sup('overlay','bogus'));
out.push('SUP cursor:grab = '+sup('cursor','grab'));
out.push('SUP cursor:bogus = '+sup('cursor','bogus'));
out.push('SUP user-select:none = '+sup('user-select','none'));
out.push('SUP resize:both = '+sup('resize','both'));
out.push('SUP touch-action:none = '+sup('touch-action','none'));
out.push('SUP touch-action:bogus = '+sup('touch-action','bogus'));
out.push('SUP overscroll-behavior:contain = '+sup('overscroll-behavior','contain'));
out.push('SUP backdrop-filter:blur(5px) = '+sup('backdrop-filter','blur(5px)'));
document.getElementById('rec').textContent=out.join('\n');
</script></body></html>
