<!doctype html>
<!-- css-standard-verify249: transform-style, the 'inherit'/'all: initial' routes through the
  CSS Transforms family, and the ASCII case-insensitivity of a unit and a keyword.

  What each row asserts:
   * 'transform-style' is 'flat | preserve-3d', initial 'flat'; a keyword is case-insensitive and
     a second token, a comma or 'auto' takes the declaration down with it.
   * 'inherit' answers with the parent's COMPUTED value, so a parent written 'transform-origin:
     10px 20px' hands down the canonical pair, and 'all: initial' puts every property of the
     family back on its initial value -- which is 'none' for the four that hold a length or a
     list, 'visible'/'flat'/'view-box' for the three keywords, and '50% 50%' for an origin.
   * a dimension's unit is matched without case ('10PX', '1Q', '1IN', '1PC', '1E2DEG'), so is a
     keyword ('LEFT TOP', 'HiDdEn', 'Border-Box'), and a scientific-notation number is a number.
   * the origin of a 200x100 box is reported in pixels, so a zero depth is dropped, 'top' is the
     vertical axis moving on its own, and a third token on 'perspective-origin' is not in the
     grammar at all.

  The four painted boxes prove the same values are what the renderer used: a unit written in
  capitals, an angle written in scientific notation, a scale written in percentages and an origin
  written as keywords all have to arrive at the same pixels the reference engine draws.
--><style>

  #report div { white-space: pre; font: 12px Consolas, monospace; color: rgb(0,0,0); }

  #stage { position: absolute; left: 20px; top: 20px; width: 280px; height: 260px; }
  .frame { position: absolute; width: 60px; height: 60px; border: 1px dotted rgb(0,0,0); }
  .box { position: absolute; width: 60px; height: 60px; background: rgb(255,0,0); }
  #k1 { left: 100px; top: 10px; }
  #b1 { left: 100px; top: 10px; translate: 40PX 30PX; }
  #k2 { left: 10px; top: 100px; }
  #b2 { left: 10px; top: 100px; rotate: 1e2deg; }
  #k3 { left: 100px; top: 100px; }
  #b3 { left: 100px; top: 100px; scale: 50% 1e2%; }
  #k4 { left: 10px; top: 10px; }
  #b4 { left: 10px; top: 10px; transform-origin: LEFT TOP; rotate: 45deg; }
</style></head><body>
