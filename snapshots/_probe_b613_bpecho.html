<!doctype html><html><head><style>div{width:50px;height:20px}</style></head><body>
<script>
const out=[];
const cases=[["background-position","center"],["background-position","top left"],["mask-position","center"],["mask-position","top left"]];
for(const [p,v] of cases){
  const el=document.createElement("div");document.body.appendChild(el);
  el.style.setProperty(p,v);
  out.push("L|"+p+":"+v+"|echo="+el.style.getPropertyValue(p));
  el.remove();
}
document.body.appendChild(document.createElement("div")).textContent=out.join("#");
</script></body></html>
