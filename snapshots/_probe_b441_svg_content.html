<!doctype html><html><body><pre id=rec></pre><script>
const out=[];
function s(label,el,props){ try{ const cs=getComputedStyle(el); const parts=[];
  for(const p of props) parts.push(p+'='+cs.getPropertyValue(p));
  out.push(label+' '+parts.join(' | ')); }catch(e){ out.push(label+' ERR '+e.message); } }
function mk(css){const d=document.createElement('div');d.style.cssText=css;document.body.appendChild(d);return d;}
function svgEl(css){ const s=document.createElementNS('http://www.w3.org/2000/svg','rect'); s.style.cssText=css; document.body.appendChild(s); return s; }
function sup(prop,val){ try{ return CSS.supports(prop,val)?'Y':'N'; }catch(e){ return 'ERR'; } }
// b441: SVG presentation + fill/stroke + markers
s('fill-red', svgEl('fill:red'), ['fill']);
s('fill-cur', svgEl('fill:currentColor'), ['fill']);
s('fill-none', svgEl('fill:none'), ['fill']);
s('fill-opacity', svgEl('fill:red;fill-opacity:0.5'), ['fill','fill-opacity']);
s('stroke-width', svgEl('stroke:blue;stroke-width:3'), ['stroke','stroke-width']);
s('stroke-linejoin', svgEl('stroke:red;stroke-linejoin:round'), ['stroke-linejoin']);
s('stroke-dasharray', svgEl('stroke:red;stroke-dasharray:4 2'), ['stroke-dasharray']);
s('stroke-dashoffset', svgEl('stroke:red;stroke-dashoffset:5'), ['stroke-dashoffset']);
s('marker-start', svgEl('marker-start:url(#m)'), ['marker-start']);
s('paint-order', svgEl('paint-order:stroke fill'), ['paint-order']);
s('shape-render', svgEl('shape-rendering:crispEdges'), ['shape-rendering']);
s('vector-effect', svgEl('vector-effect:non-scaling-stroke'), ['vector-effect']);
// generated content + quotes
s('content-none', mk('content:none'), ['content']);
s('content-str', mk('content:"abc"'), ['content']);
s('content-counter', mk('content:counter(x)'), ['content']);
s('content-attr', mk('content:attr(data-x)'), ['content']);
s('content-open', mk('content:open-quote'), ['content']);
s('quotes', mk('quotes:"«" "»"'), ['quotes']);
s('counter-reset', mk('counter-reset:x 5'), ['counter-reset']);
s('counter-incr', mk('counter-increment:x'), ['counter-increment']);
out.push('SUP fill:red = '+sup('fill','red'));
out.push('SUP stroke-dasharray:4 2 = '+sup('stroke-dasharray','4 2'));
out.push('SUP paint-order:stroke fill = '+sup('paint-order','stroke fill'));
out.push('SUP content:counter(x) = '+sup('content','counter(x)'));
document.getElementById('rec').textContent=out.join('\n');
</script></body></html>
