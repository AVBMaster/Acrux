<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>b271 harvest</title>
<style>body{font:12px monospace;margin:0}#cb{width:300px;font-size:16px}
.c1{color:red} .c2{color:#00f} .c3{color:#0a0}</style></head><body>
<div id="cb"><div id="h"></div></div>
<pre id="report"></pre>
<script>
var CASES = [
  ["box-shadow","2px 2px 3px","c1"],
  ["box-shadow","1px 2px 3px 4px blue inset","c2"],
  ["box-shadow","5px 5px",""],
  ["box-shadow","0 0 0 2px","c3"],
  ["box-shadow","2px 2px 3px, 4px 4px red","c1"],
  ["counter-increment","a 1 b",""],
  ["counter-increment","a",""],
  ["counter-increment","none",""],
  ["counter-increment","a -1 b 2",""],
  ["counter-increment","x 3 x",""],
  ["counter-reset","a",""],
  ["counter-reset","c reverse",""]
];
var h = document.getElementById('h');
function run(p,v,cls){ h.setAttribute('style',''); if(cls) h.className=cls; else h.className='';
  h.style.setProperty(p,v);
  return [h.style.getPropertyValue(p), getComputedStyle(h).getPropertyValue(p)]; }
var out=[];
for (var i=0;i<CASES.length;i++){ var r=run(CASES[i][0],CASES[i][1],CASES[i][2]);
  out.push(i+'|'+CASES[i][0]+'|'+CASES[i][1]+'|'+CASES[i][2]+'|S='+r[0]+'|C='+r[1]); }
document.getElementById('report').textContent=out.join('\n');
console.log(out.join('\n'));
</script></body></html>
