<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS Standard Verification Batch 78 — background shorthand position/size + layers, border-radius slash, box-shadow spread, font line-height</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; font-size: 14px; }
h2 { background:#eee; padding:4px; margin:16px 0 8px; font-size:15px; }

/* 1. background shorthand with position/size, two layers */
.bg { width:220px; height:100px; border:2px solid #939; margin:8px 0;
      background: right 20px bottom 10px / 30px 30px linear-gradient(#f00,#f00),
                  left top / 50px 50px linear-gradient(#00f,#00f), #eef; }

/* 2. border-radius slash 4/4 */
.r { width:160px; height:80px; background:#cfe; border:2px solid #369; margin:8px 0;
     border-radius: 40px 20px 30px 10px / 10px 30px 20px 40px; }

/* 3. box-shadow inset with spread */
.sh { width:160px; height:60px; background:#fff; border:1px solid #ccc; margin:12px;
      box-shadow: inset 0 0 0 10px #fa0, 5px 5px 0 2px #06c; }

/* 4. font shorthand with line-height */
.f { font: italic bold 16px/1.5 Arial, sans-serif; background:#eef; }
</style>
</head>
<body>

<h2>1. background: right20 bottom10/30x30 red, left top/50x50 blue, base #eef</h2>
<div class="bg"></div>

<h2>2. border-radius 40 20 30 10 / 10 30 20 40</h2>
<div class="r"></div>

<h2>3. box-shadow inset 10px spread orange + outset 5px 5px 0 2px blue</h2>
<div class="sh"></div>

<h2>4. font: italic bold 16px/1.5 Arial</h2>
<p class="f">The quick brown fox</p>

</body>
</html>
