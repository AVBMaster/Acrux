<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:8px;font:14px monospace}
.row{white-space:pre;font:12px monospace}
li::marker{color:#c00;font-weight:bold;font-size:1.2em}
</style></head><body><div id="out"></div>
<script>
const out=[];
function L(t,v){out.push("L~"+t+"~"+String(v).split(" ").join("_"));}
function gc(tag,css,prop){
  const d=document.createElement("div");d.setAttribute("style",css);document.body.appendChild(d);
  const v=getComputedStyle(d).getPropertyValue(prop).trim();
  L(tag,prop+"="+(v===""?"(empty)":v.split(" ").join("_")));d.remove();
}
// list-style-type values
gc("lst-none","list-style-type:none","list-style-type");
gc("lst-disc","list-style-type:disc","list-style-type");
gc("lst-circle","list-style-type:circle","list-style-type");
gc("lst-square","list-style-type:square","list-style-type");
gc("lst-decimal","list-style-type:decimal","list-style-type");
gc("lst-decimal-zero","list-style-type:decimal-leading-zero","list-style-type");
gc("lst-lower-roman","list-style-type:lower-roman","list-style-type");
gc("lst-upper-roman","list-style-type:upper-roman","list-style-type");
gc("lst-lower-alpha","list-style-type:lower-alpha","list-style-type");
gc("lst-upper-alpha","list-style-type:upper-alpha","list-style-type");
gc("lst-lower-greek","list-style-type:lower-greek","list-style-type");
gc("lst-lower-latin","list-style-type:lower-latin","list-style-type");
gc("lst-upper-latin","list-style-type:upper-latin","list-style-type");
gc("lst-armenian","list-style-type:armenian","list-style-type");
gc("lst-georgian","list-style-type:georgian","list-style-type");
gc("lst-disclosure-closed","list-style-type:disclosure-closed","list-style-type");
gc("lst-disclosure-open","list-style-type:disclosure-open","list-style-type");
// list-style-position
gc("lsp-outside","list-style-position:outside","list-style-position");
gc("lsp-inside","list-style-position:inside","list-style-position");
// list-style shorthand
gc("ls-shorthand","list-style:square inside","list-style-type");
gc("ls-shorthand-pos","list-style:square inside","list-style-position");
// ::marker computed values
const li=document.createElement("li");li.textContent="item";document.body.appendChild(li);
const mk=getComputedStyle(li,"::marker");
L("marker-color",mk.color.split(" ").join("_"));
L("marker-font-weight",mk.fontWeight);
L("marker-font-size",mk.fontSize);
L("marker-content",mk.content===""?"(empty)":mk.content.split(" ").join("_"));
li.remove();
// list-style-image
gc("lsi-none","list-style-image:none","list-style-image");
gc("lsi-url","list-style-image:url('icon.png')","list-style-image");
document.getElementById("out").textContent=out.join("\n");
</script></body></html>
