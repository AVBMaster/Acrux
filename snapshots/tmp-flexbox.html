<!DOCTYPE html><html><head><style>
body{margin:0;padding:10px;background:#fff}
.row{display:flex;gap:12px;margin-bottom:8px}
.b{width:80px;height:60px;border:1px solid #000;background:#c0c0c0;box-sizing:border-box}
#anim{animation:w 1s linear -400ms paused}
@keyframes w{from{width:64px}to{width:100px}}
</style></head><body>
<div class="row"><div class="b" id="a1"></div></div>
<div class="row"><div class="b" id="a2"></div></div>
<div class="row"><div class="b" id="anim"></div></div>
</body></html>
