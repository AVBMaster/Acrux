<!DOCTYPE html><head><style>
body{margin:20px;font:16px Arial}
.t{width:100px;border:1px solid #999;white-space:nowrap;overflow:hidden;margin-bottom:8px}
.e1{text-overflow:ellipsis}
.e2{text-overflow:clip}
.e3{text-overflow:"→"}
.rtl{direction:rtl}
</style><body>
<div class="t e1">This is a very long text that overflows</div>
<div class="t e2">This is a very long text that overflows</div>
<div class="t e3">This is a very long text that overflows</div>
<div class="t e1 rtl">هذا نص طويل جدا يتجاوز الحد</div>
</body></html>
