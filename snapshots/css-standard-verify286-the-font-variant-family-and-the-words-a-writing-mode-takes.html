<!DOCTYPE html>

<title>css-standard-verify286 — the font-variant family and the words a writing mode takes</title>
<style>
body { font: 14px/1.4 monospace; color: rgb(9,9,9); margin: 8px; background: #fff; }
h2 { font-size: 15px; margin: 12px 0 4px; }
/* paint guard: the values that must change what is drawn, not just what is said */
#pg-v { writing-mode: vertical-rl; width: 120px; height: 40px; background: rgb(255,128,128); }
#pg-c { font-variant-caps: small-caps; font-size: 20px; }
#pg-k { font-kerning: none; letter-spacing: 0; font-size: 20px; }
#pg-o { font-optical-sizing: none; font-size: 20px; }
#pg-b { direction: rtl; unicode-bidi: bidi-override; width: 200px; font-size: 20px; }
/* What the guard proves, and what it does not: the vertical box draws a rotated line, 'small-caps'
 * draws real small capitals, and a 'direction: rtl' line is placed against the right edge. The
 * override keyword is accepted and painted, but the engine does not yet reverse the visual order of
 * the text it names — measured, the reference engine puts the first character at x=198 of this box
 * and the last at x=98, where ours keeps 'abc' at x=98. That gap is #279. */
</style></head><body>
<h2>paint guard (a vertical box, small caps, killed kerning, a right-to-left line)</h2>
<div id="pg-v">VERTICAL</div>
<p id="pg-c">Small Caps Text</p>
<p id="pg-k">AVKTY</p>
<p id="pg-o">Optical</p>
<p id="pg-b">abc def ghi</p>
<h2>value rows</h2>
