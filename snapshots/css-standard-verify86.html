<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:20px;font:14px Arial}
table{border-collapse:separate;border-spacing:0;width:300px}
td,th{border:1px solid #333;padding:2px}
caption{caption-side:top;background:#eee}
.w50{width:50px}
.w100{width:100px}
</style></head><body>
<table>
<caption>Cap</caption>
<tr><td class="w50">A</td><td class="w100">B</td><td>C</td></tr>
<tr><td colspan="2">D spans A+B</td><td>E</td></tr>
<tr><td>F</td><td rowspan="2">G spans 2 rows</td><td>H</td></tr>
<tr><td>I</td><td>J</td></tr>
</table>
</body></html>
