<!doctype html><html><head><meta charset="utf-8"><style>
body{font:12px monospace;margin:8px}
.row{white-space:pre;font:12px monospace}
div{width:80px;height:40px}
</style></head><body>
<div id="out"></div>
<script>
const out=[];
const cases=[
  ["border-width","thin"],
  ["border-width","medium"],
  ["border-width","thick"],
  ["border-width","1px 2px 3px 4px"],
  ["border-style","solid dashed"],
  ["border-color","red blue green"],
  ["border-radius","10px 20px"],
  ["border-radius","50%"],
  ["border-radius","10px 20px 30px 40px / 5px 10px"],
  ["border-top-left-radius","10px 20px"],
  ["outline-width","thin"],
  ["outline-style","dashed"],
  ["outline-color","invert"],
  ["outline","2px solid red"],
  ["outline-offset","-4px"],
  ["border-collapse","collapse"],
  ["border-spacing","5px 10px"],
];
for(const [p,v] of cases){
  const el=document.createElement("div");
  el.style.setProperty(p,v);document.body.appendChild(el);
  const sup=CSS.supports(p,v)?"Y":"n";
  const comp=(getComputedStyle(el).getPropertyValue(p)||"(empty)").replace(/[ ,]+/g,"_");
  out.push(["L",p+"="+v.replace(/[ ,]+/g,"_"),"sup="+sup,"comp="+comp].join("~"));
  el.remove();
}
document.getElementById("out").textContent=out.join("\n");
</script></body></html>
