<!doctype html><html><body><pre id="rec"></pre><script>
const out=[];
function s(label,css,props){ try{ const d=document.createElement('div'); d.style.cssText=css;
  document.body.appendChild(d); const cs=getComputedStyle(d); const parts=[];
  for(const p of props) parts.push(p+'='+cs.getPropertyValue(p));
  out.push(label+' '+parts.join(' | ')); d.remove(); }
  catch(e){ out.push(label+' ERR '+e.message); } }
// logical props under vertical writing mode (this round's inline-axis fix verification)
s('mi-vert-rl','writing-mode:vertical-rl;margin-inline:10px',['margin-top','margin-bottom']);
s('mi-vert-lr','writing-mode:vertical-lr;margin-inline:10px',['margin-top','margin-bottom']);
s('pi-vert-rl','writing-mode:vertical-rl;padding-inline:8px',['padding-top','padding-bottom']);
s('me-block-rl','writing-mode:vertical-rl;margin-block:6px',['margin-left','margin-right']);
s('pe-block-rl','writing-mode:vertical-rl;padding-block:4px',['padding-left','padding-right']);
// block axis under vertical
s('bsi-vert','writing-mode:vertical-rl;border-block-start:2px solid red',['border-left-width','border-right-width']);
// horizontal regression guard
s('mi-horiz','margin-inline:12px',['margin-left','margin-right']);
s('pi-horiz','padding-inline:6px',['padding-left','padding-right']);
s('me-block-h','margin-block:9px',['margin-top','margin-bottom']);
// border-inline under horizontal
s('bi-horiz','border-inline:3px solid blue',['border-left-width','border-right-width']);
// inset under vertical
s('ii-vert','writing-mode:vertical-rl;inset-inline:7px',['top','bottom']);
s('ib-vert','writing-mode:vertical-rl;inset-block:9px',['left','right']);
document.getElementById('rec').textContent=out.join('\n');
</script></body></html>
