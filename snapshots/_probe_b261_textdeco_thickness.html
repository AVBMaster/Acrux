<!DOCTYPE html>
<html><head><meta charset="utf-8"></head><body>
<script>
const vals = [
  'overline 3px solid blue',
  'underline 2px',
  'underline auto',
  'underline 50%',
  'underline dashed 3px red',
  '3px underline solid red',
  'underline solid',
  'underline currentcolor',
  'line-through wavy green',
  'underline overline',
  'none',
  'spelling-error',
  'grammar-error',
  'underline skip-ink',
  'blink'
];
const lines = [];
for (const v of vals) {
  const d = document.createElement('div');
  d.style.setProperty('text-decoration', v);
  lines.push(v + ' => [' + d.style.getPropertyValue('text-decoration') + '] th='
    + d.style.getPropertyValue('text-decoration-thickness') + ' st='
    + d.style.getPropertyValue('text-decoration-style') + ' cl='
    + d.style.getPropertyValue('text-decoration-color') + ' ln='
    + d.style.getPropertyValue('text-decoration-line'));
}
document.body.textContent = lines.join('\n');
</script>
</body></html>
