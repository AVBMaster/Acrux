<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:8px;font:14px monospace}
.row{white-space:pre;font:12px monospace}
/* CSS nesting */
.outer{color:blue;& .inner{color:red}}
/* nesting with @media */
.nest-media{color:black;@media(min-width:0px){color:purple}}
</style></head><body><div id="out"></div>
<script>
const out=[];
function L(t,v){out.push("L~"+t+"~"+String(v).split(" ").join("_"));}
// CSS nesting: .outer .inner
const outer=document.createElement("div");outer.className="outer";
const inner=document.createElement("span");inner.className="inner";inner.textContent="x";
outer.appendChild(inner);document.body.appendChild(outer);
L("nest-parent",getComputedStyle(outer).color.split(" ").join("_"));
L("nest-child",getComputedStyle(inner).color.split(" ").join("_"));
outer.remove();
// nesting with media
const nm=document.createElement("div");nm.className="nest-media";document.body.appendChild(nm);
L("nest-media",getComputedStyle(nm).color.split(" ").join("_"));
nm.remove();
// scroll-snap properties (computed)
function gc(tag,css,prop){
  const d=document.createElement("div");d.setAttribute("style",css);document.body.appendChild(d);
  const v=getComputedStyle(d).getPropertyValue(prop).trim();
  L(tag,prop+"="+(v===""?"(empty)":v.split(" ").join("_")));d.remove();
}
gc("ss-type","scroll-snap-type:y mandatory","scroll-snap-type");
gc("ss-align","scroll-snap-align:start","scroll-snap-align");
gc("ss-stop","scroll-snap-stop:normal","scroll-snap-stop");
gc("ss-margin","scroll-margin:10px","scroll-margin");
gc("ss-padding","scroll-padding:10px","scroll-padding");
// overscroll-behavior
gc("osb-contain","overscroll-behavior:contain","overscroll-behavior");
gc("osb-x-none","overscroll-behavior-x:none","overscroll-behavior-x");
// scroll-behavior
gc("sb-smooth","scroll-behavior:smooth","scroll-behavior");
document.getElementById("out").textContent=out.join("\n");
</script></body></html>
