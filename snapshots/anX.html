<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body{margin:0;font:14px sans-serif;color:#222;background:#fff}
h4{margin:10px 8px 4px}
.c{position:relative;background:#f7f7f7;border:1px solid #bbb;margin:8px;width:400px;padding:6px}
.f{float:left;width:100px;height:50px;background:#f99;margin:2px}
.f2{float:right;width:120px;height:70px;background:#9f9;margin:2px}
.txt{background:#ffffcc}
.clr{clear:both}
.ib{display:inline-block;width:60px;height:30px;background:#9cf;margin:2px;vertical-align:top}
/* overflow */
.ov{width:150px;height:60px;border:2px solid #369;background:#eef;overflow:hidden;margin:8px}
.oa{width:150px;height:60px;border:2px solid #369;background:#eef;overflow:auto;margin:8px}
.ovsc{width:150px;height:60px;border:2px solid #369;background:#eef;overflow:scroll;margin:8px}
/* positioning */
.p1{position:relative;top:8px;left:20px;width:100px;height:30px;background:#c9f;margin:4px}
.p2{position:absolute;top:4px;right:4px;width:80px;height:24px;background:#fc9}
.p3{position:absolute;bottom:4px;left:4px;width:80px;height:24px;background:#9cf}
.z1{position:absolute;top:10px;left:10px;width:80px;height:40px;background:red;z-index:1}
.z2{position:absolute;top:20px;left:30px;width:80px;height:40px;background:blue;z-index:2}
.z3{position:absolute;top:30px;left:50px;width:80px;height:40px;background:green}
/* static abs (no insets) */
.st{position:absolute;width:60px;height:20px;background:#0a0;color:#fff}
.vis{visibility:hidden}
.hid{display:none}
</style></head>
<body><span class="txt">Text before floats. This paragraph is long enough to demonstrate how inline content flows around floated boxes on both sides of the container when there is sufficient width available for wrapping.</span></body></html>
