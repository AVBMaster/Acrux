<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS Standard Verification Batch 89 — grid/flex content alignment (place-content, justify/align-content space-*)</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; font-size: 14px; }
h2 { background:#eee; padding:4px; margin:14px 0 6px; font-size:15px; }
.g { display:grid; grid-template-columns:40px 40px; grid-template-rows:30px 30px; gap:4px; width:200px; height:120px; border:1px solid #939; margin-bottom:12px; }
.g div { background:#cfe; }
.pc { place-content:space-between center; }   /* align-content:space-between, justify-content:center */
.ac { align-content:end; justify-content:space-around; }
.f { display:flex; width:300px; height:40px; border:1px solid #090; justify-content:space-evenly; }
.f div { width:40px; height:30px; background:#fec; }
</style>
</head>
<body>

<h2>1. grid place-content: space-between / center (exp col x=79,123 row y=21,111)</h2>
<div class="g pc"><div>1</div><div>2</div><div>3</div><div>4</div></div>

<h2>2. grid align-content:end + justify-content:space-around (exp col x=50,152)</h2>
<div class="g ac"><div>1</div><div>2</div><div>3</div><div>4</div></div>

<h2>3. flex justify-content:space-evenly (exp x=66,151,236)</h2>
<div class="f"><div>1</div><div>2</div><div>3</div></div>

</body>
</html>
