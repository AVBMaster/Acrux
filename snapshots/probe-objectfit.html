<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body { margin: 0; padding: 0; background: rgb(255,255,255); }
img { position: absolute; display: block; }
#g1 { left: 0; top: 0; width: 40px; height: 40px; }
#g2 { left: 50px; top: 0; width: 80px; height: 40px; object-fit: contain; background: rgb(0,0,0); }
#g3 { left: 0; top: 60px; width: 20px; height: 40px; object-fit: cover; }
#g4 { left: 50px; top: 60px; width: 80px; height: 20px; object-fit: fill; }
#g5 { left: 0; top: 110px; width: 20px; height: 20px; object-fit: scale-down; }
#g6 { left: 50px; top: 110px; width: 160px; height: 80px; object-fit: contain; object-position: right bottom; background: rgb(0,0,0); }
</style>
</head>
<body>
<img id="g1" src="quad40.png">
<img id="g2" src="quad40.png">
<img id="g3" src="quad40.png">
<img id="g4" src="quad40.png">
<img id="g5" src="quad40.png">
<img id="g6" src="quad40.png">
</body>
</html>
