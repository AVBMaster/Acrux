<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:8px;font:12px monospace}
.p1::before{content:"BEFORE-"}
.p2::after{content:"-AFTER"}
.p3::before{content:attr(data-x)}
.p4::marker{color:red}
.lst{list-style:disc;padding-left:30px}
</style></head><body>
<div class="p1" id="p1">body</div>
<div class="p2" id="p2">body</div>
<div class="p3" id="p3" data-x="ATTR">body</div>
<ul class="lst" id="lst"><li id="li1">item</li></ul>
<div id="out"></div>
<script>
const out=[];
function L(t,v){out.push("L~"+t+"~"+String(v).split(" ").join("_"));}
function gcp(tag,el,pseudo,prop){
  try{const v=getComputedStyle(el,pseudo).getPropertyValue(prop).trim();
  L(tag,prop+"="+(v===""?"(empty)":v.split(" ").join("_")));}catch(e){L(tag,"ERR");}
}
gcp("p1-before-content",document.getElementById("p1"),"::before","content");
gcp("p2-after-content",document.getElementById("p2"),"::after","content");
gcp("p3-attr-content",document.getElementById("p3"),"::before","content");
gcp("li-marker-color",document.getElementById("li1"),"::marker","color");
gcp("li-marker-content",document.getElementById("li1"),"::marker","content");
gcp("p1-before-display",document.getElementById("p1"),"::before","display");
// element (non-pseudo) reads its own
gcp("el-display",document.getElementById("p1"),"","display");
document.getElementById("out").textContent=out.join("\n");
</script></body></html>
