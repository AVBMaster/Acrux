<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>b275 echo forms</title>
<style>body{font:12px monospace;margin:0}</style></head><body>
<div id="probe"></div>
<pre id="report"></pre>
<script>
var CASES = [
  ["grid-auto-flow","row"],["grid-auto-flow","column"],["grid-auto-flow","dense"],
  ["grid-auto-flow","row dense"],["grid-auto-flow","dense row"],["grid-auto-flow","column dense"],
  ["grid-auto-flow","dense column"],["grid-auto-flow","row row"],
  ["mask-position","center"],["mask-position","top"],["mask-position","left"],
  ["mask-position","center center"],["mask-position","10px 20px"],["mask-position","top left"],
  ["clip-path","border-box circle(50%)"],["clip-path","circle(50%)"],
  ["clip-path","margin-box circle(50%)"],["clip-path","content-box inset(0)"],
  ["paint-order","normal"],["paint-order","stroke"],["paint-order","stroke fill"],
  ["paint-order","stroke normal fill"],["paint-order","fill stroke"],
  ["paint-order","markers stroke fill"],["paint-order","stroke stroke"],
  ["marker-start","none"],["marker-start","url(a.png)"],["marker-start","url(#m)"],["marker-start","bogus"],
  ["marker-end","url(#m)"],["marker-mid","url(#m)"],
  ["filter","drop-shadow(1px 2px 3px red)"],["filter","drop-shadow(red 1px 2px 3px)"],
  ["filter","drop-shadow(1px 2px)"],["filter","drop-shadow(1px 2px 3px)"]
];
var host = document.getElementById('probe');
function spec(p,v){ host.setAttribute('style',''); host.style.setProperty(p,v); return host.style.getPropertyValue(p); }
function comp(p,v){ host.setAttribute('style',''); host.style.setProperty(p,v); return getComputedStyle(host).getPropertyValue(p); }
var out=[];
for (var i=0;i<CASES.length;i++){ var p=CASES[i][0],v=CASES[i][1];
  out.push(i+'|'+p+'|'+v+'|S='+spec(p,v)+'|C='+comp(p,v)); }
document.getElementById('report').textContent=out.join('\n');
console.log(out.join('\n'));
</script></body></html>
