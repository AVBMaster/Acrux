<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>b291 probe 7 &#8212; the guards, with every box of a stated size</title>
<style>
body { font: 14px/18px monospace; color: rgb(9,9,9); margin: 8px; background: rgb(255,255,255); }
.bar { display: block; width: 40px; height: 10px; }
#g-1 { display: flex; width: 200px; height: 12px; background: rgb(240,240,240); }
#g-2 { caption-side: bottom; border-collapse: separate; border-spacing: 0; table-layout: fixed; width: 120px; }
#g-2c { height: 10px; background: rgb(255,0,0); }
#g-2 td { height: 10px; }
#g-3 { table-layout: fixed; width: 120px; border-spacing: 4px 6px; }
#g-3 td { height: 10px; background: rgb(200,200,200); }
#g-4 { table-layout: fixed; width: 120px; border-collapse: collapse; border-spacing: 4px 6px; }
#g-4 td { height: 10px; background: rgb(200,200,200); }
#g-5 { display: grid; grid-auto-rows: 40px; width: 60px; }
#g-6 { width: 100px; height: 20px; visibility: hidden; background: rgb(0,255,0); }
#g-6next { width: 100px; height: 20px; background: rgb(0,0,255); }
#g-7 { display: flex; width: 200px; height: 12px; background: rgb(240,240,240); }
#g-7c { order: 1; }
</style></head><body>
<div id="g-1"><span class="bar" id="g-1a" style="background:rgb(255,128,128)"></span><span class="bar" id="g-1b" style="background:rgb(128,255,128)"></span><span class="bar" id="g-1c" style="background:rgb(128,128,255);order:-1"></span></div>
<table id="g-2"><caption id="g-2c"></caption><tr id="g-2r"><td></td></tr></table>
<table id="g-3"><tr><td id="g-3a"></td><td id="g-3b"></td></tr><tr><td id="g-3c"></td><td id="g-3d"></td></tr></table>
<table id="g-4"><tr><td id="g-4a"></td><td id="g-4b"></td></tr><tr><td id="g-4c"></td><td id="g-4d"></td></tr></table>
<div id="g-5"><span id="g-5a"></span><span id="g-5b"></span></div>
<div><div id="g-6"></div><div id="g-6next"></div></div>
<div id="g-7"><span class="bar" id="g-7a" style="background:rgb(255,128,128)"></span><span class="bar" id="g-7b" style="background:rgb(128,255,128)"></span><span class="bar" id="g-7c" style="background:rgb(128,128,255)"></span></div>
<pre id="report"></pre>
<script>
/* Seven declarations a page can also see. Every box states its own size, so none of these numbers
 * is a distance the viewport or a font metric could move. */
function r(id) { var e = document.getElementById(id); var b = e.getBoundingClientRect(); return { l: b.left, t: b.top, w: b.width, h: b.height, r: b.right, b: b.bottom }; }
function n(v) { return v.toFixed(1); }
var out = [];
var g1 = r('g-1'), a = r('g-1a'), b = r('g-1b'), c = r('g-1c');
out.push('g1|cfirst=' + n(c.l - g1.l) + '|asecond=' + n(a.l - g1.l) + '|bthird=' + n(b.l - g1.l) + '|cwidth=' + n(c.w));
var cap = r('g-2c'), row = r('g-2r'), t2 = r('g-2');
out.push('g2|capBelowRow=' + n(cap.t - row.b) + '|capHeight=' + n(cap.h) + '|tableWidth=' + n(t2.w));
var a3 = r('g-3a'), b3 = r('g-3b'), c3 = r('g-3c');
out.push('g3|hgap=' + n(b3.l - a3.r) + '|vgap=' + n(c3.t - a3.b) + '|leftpad=' + n(a3.l - r('g-3').l) + '|cellwidth=' + n(a3.w));
var a4 = r('g-4a'), b4 = r('g-4b'), c4 = r('g-4c');
out.push('g4|hgap=' + n(b4.l - a4.r) + '|vgap=' + n(c4.t - a4.b) + '|cellwidth=' + n(a4.w));
var a5 = r('g-5a'), b5 = r('g-5b');
out.push('g5|rowh=' + n(a5.h) + '|secondTop=' + n(b5.t - a5.t));
var h6 = r('g-6'), x6 = r('g-6next');
out.push('g6|hiddenHolds=' + n(x6.t - h6.t) + '|hiddenWidth=' + n(h6.w));
var g7 = r('g-7'), a7 = r('g-7a'), b7 = r('g-7b'), c7 = r('g-7c');
out.push('g7|aFirst=' + n(a7.l - g7.l) + '|bSecond=' + n(b7.l - g7.l) + '|cLast=' + n(c7.l - g7.l));
document.getElementById('report').textContent = out.join('\n');
console.log(out.join('\n'));
</script></body></html>
