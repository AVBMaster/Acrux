<!doctype html><html><head><style>
  .wrap { container-type: inline-size; container-name: card; width: 300px; }
  @container card (min-width: 200px) { .mark { background: lime; } }
  @container (orientation: landscape) { .mark2 { background: cyan; } }
  .cw { container-type: inline-size; }
  .item { color: black; }
  @container cw (width > 100px) { .item { color: crimson; } }
</style></head><body>
<div class="wrap" id="wrap"><div class="mark" id="mark">mark</div><div class="mark2" id="mark2">mark2</div></div>
<div class="cw" id="cw"><div class="item" id="item">item</div></div>
<pre id="rec"></pre>
<script>
const out=[];
function g(id,p){ const e=document.getElementById(id);
  out.push(id+' '+p+'='+JSON.stringify(getComputedStyle(e).getPropertyValue(p))); }
g('wrap','container-type');
g('wrap','container-name');
g('mark','background-color');
g('mark2','background-color');
g('item','color');
out.push('supports @container='+CSS.supports('container-type','inline-size'));
document.getElementById('rec').textContent=out.join('\n');
</script></body></html>
