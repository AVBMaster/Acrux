<!doctype html><html><head><meta charset=utf-8><style>
body{font:12px monospace;margin:0}
.row{white-space:pre;font:12px monospace}
#g1{display:grid;grid-template-columns:100px 1fr 2fr;width:300px;border:1px solid #000;gap:0}
#g2{display:grid;grid-template-columns:100px 1fr 2fr;width:300px;border:1px solid #000;gap:6px}
#g3{display:grid;grid-template-columns:1fr 1fr;width:200px;border:1px solid #000;gap:0}
#g4{display:grid;grid-template-columns:1fr 1fr;width:200px;border:1px solid #000;gap:20px}
#g5{display:grid;grid-template-columns:50px 1fr;width:200px;border:1px solid #000;gap:10px}
.c{border:1px solid #999;min-height:20px}
</style></head><body>
<div id=out></div>
<div id=g1><div class=c>1</div><div class=c>2</div><div class=c>3</div></div>
<div id=g2><div class=c>1</div><div class=c>2</div><div class=c>3</div></div>
<div id=g3><div class=c>1</div><div class=c>2</div></div>
<div id=g4><div class=c>1</div><div class=c>2</div></div>
<div id=g5><div class=c>1</div><div class=c>2</div></div>
<script>
const out=document.getElementById("out");
function row(t){const d=document.createElement("div");d.className="row";d.textContent=t;out.appendChild(d);}
for(const id of ["g1","g2","g3","g4","g5"]){
  const e=document.getElementById(id);const r=e.getBoundingClientRect();
  const kids=[...e.children].map(k=>{const b=k.getBoundingClientRect();return Math.round(b.width);}).join(",");
  row("L|"+id+"|box="+Math.round(r.width)+"|colwidths="+kids);
}
</script></body></html>
