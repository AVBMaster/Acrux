<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#fff}
.wrap{position:relative;width:240px;height:150px}
.box{position:absolute;left:0;top:0;width:30px;height:30px;background:#e33}
</style></head><body>
<div class="wrap">
<div class="box" id="m1" style="offset-path:path('M 10 10 L 200 10')"></div>
<div class="box" id="m2" style="offset-path:path('M 10 10 L 200 10');offset-distance:50%"></div>
<div class="box" id="m3" style="offset-path:path('M 10 10 L 200 10');offset-distance:100%"></div>
</div>
</body></html>
