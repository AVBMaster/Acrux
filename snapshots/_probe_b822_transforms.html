<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:8px;font:12px monospace}
</style></head><body>
<div id="out"></div>
<script>
const out=[];
function L(t,v){out.push("L~"+t+"~"+String(v).split(" ").join("_"));}
function gc(tag,css,props){
  if(typeof props==="string") props=[props];
  const d=document.createElement("div");d.setAttribute("style",css);document.body.appendChild(d);
  const cs=getComputedStyle(d);
  for(const p of props){const v=cs.getPropertyValue(p).trim();L(tag,p+"="+(v===""?"(empty)":v.split(" ").join("_")));}
  d.remove();
}
// transition longhands
gc("tr-prop","transition-property:opacity","transition-property");
gc("tr-dur","transition-duration:0.3s","transition-duration");
gc("tr-timing","transition-timing-function:ease-in","transition-timing-function");
gc("tr-delay","transition-delay:0.1s","transition-delay");
gc("tr-none","transition:none","transition-property");
gc("tr-all","transition:all 0.3s","transition-property");
// transform functions
gc("tf-none","transform:none","transform");
gc("tf-translate","transform:translate(10px,20px)","transform");
gc("tf-rotate","transform:rotate(45deg)","transform");
gc("tf-scale","transform:scale(1.5)","transform");
gc("tf-skew","transform:skew(10deg,20deg)","transform");
gc("tf-matrix","transform:matrix(1,2,3,4,5,6)","transform");
// transform-origin
gc("to-center","transform-origin:center","transform-origin");
gc("to-top-left","transform-origin:top left","transform-origin");
gc("to-px","transform-origin:10px 20px","transform-origin");
gc("to-pct","transform-origin:50% 50%","transform-origin");
// transform-style / perspective
gc("tstyle-flat","transform-style:flat","transform-style");
gc("tstyle-3d","transform-style:preserve-3d","transform-style");
gc("persp-500","perspective:500px","perspective");
gc("persp-none","perspective:none","perspective");
document.getElementById("out").textContent=out.join("\n");
</script></body></html>
