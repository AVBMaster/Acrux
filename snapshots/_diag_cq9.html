<!doctype html><html><head><meta charset=utf-8><style>
body{margin:0}
#cw{container-type:inline-size;container-name:card;width:200px;height:30px;margin-bottom:40px}
#cn{container-type:inline-size;width:180px;height:30px}
#cw>span,#cn>span{display:block;width:50px;height:30px}
@container card (min-width:150px){#cw>span{background:red}}
@container (min-width:150px){#cn>span{background:green}}
</style></head><body><meta charset=utf-8>
<div id=cw><span>a</span></div>
<div id=cn><span>b</span></div>
<script>
const g=id=>{const e=document.getElementById(id);const s=getComputedStyle(e);return id+" bg="+s.backgroundColor+" display="+s.display;};
document.body.appendChild(document.createTextNode(["cw","cn"].map(g).join(" ## ")));
</script></body></html>
