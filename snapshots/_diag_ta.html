<!doctype html><html><head><meta charset=utf-8><style>
#t1{transition:width 2s linear;height:20px}
#t2{transition:width 2s,height 1s;height:20px}
#t3{transition-property:opacity,transform;transition-duration:1s,2s,3s;height:20px}
#t4{transition:all .5s ease-in-out;height:20px}
#t5{transition:none;height:20px}
#a2{animation-name:spin;animation-duration:2s;animation-iteration-count:3;height:20px}
#a3{animation:fade 1s 2 alternate both;height:20px}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
</style></head><body>
<div id=t1>t1</div><div id=t2>t2</div><div id=t3>t3</div><div id=t4>t4</div><div id=t5>t5</div>
<div id=a2>a2</div><div id=a3>a3</div>
<script>
const ids=["t1","t2","t3","t4","t5","a2","a3"];
const g=id=>{const s=getComputedStyle(document.getElementById(id));
 return id+":tp="+s.transitionProperty+"|td="+s.transitionDuration+"|tf="+s.transitionTimingFunction+"|tn="+s.transitionName+"|an="+s.animationName+"|ad="+s.animationDuration+"|ac="+s.animationIterationCount+"|af="+s.animationFillMode+"|adir="+s.animationDirection;};
document.body.appendChild(document.createElement("div")).textContent=ids.map(g).join("#");
</script></body></html>
