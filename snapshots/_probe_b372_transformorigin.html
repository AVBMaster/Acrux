<!doctype html><html><body><pre id=rec></pre><script>
const out=[];
function t(p,v){const box=document.createElement('div');document.body.appendChild(box);box.style.setProperty(p,v);out.push(p+'='+JSON.stringify(v)+' || sup='+CSS.supports(p,v)+' || echo='+JSON.stringify(box.style.getPropertyValue(p))+' || comp='+JSON.stringify(getComputedStyle(box).getPropertyValue(p)));box.remove();}
t('transform-origin','center');
t('transform-origin','left');
t('transform-origin','right');
t('transform-origin','top');
t('transform-origin','bottom');
t('transform-origin','left top');
t('transform-origin','right bottom');
t('transform-origin','top left');
t('transform-origin','bottom right');
t('transform-origin','50% 50%');
t('transform-origin','0 0');
t('transform-origin','10px 20px');
t('transform-origin','50% 50% 0');
t('transform-origin','10px 20px 30px');
t('transform-origin','left top 0');
t('transform-origin','right bottom 0');
t('transform-origin','bogus');
t('transform-origin','center center center');
t('transform-origin','left right');
t('transform-origin','top bottom');
t('transform-origin','50% 50% 50%');
t('transform-origin','0 0 0');
t('transform-origin','10px 20px 30px 40px');
t('transform-origin','inherit');
t('transform-origin','initial');
t('transform-origin','unset');
document.getElementById('rec').textContent=out.join('\n');
console.log(out.join('\n'));
</script></body></html>
