<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>b316 borders, radii, gutters, display and column breaks</title>
<style>
  body { margin: 0; font: 16px/1.2 monospace; background: #fff; color: #000; }
  .row { display: block; }
  /* Region 1: the same 4px solid rgb(255,0,0) border spelled four ways, then three refusals. */
  .b1 { width: 60px; height: 20px; background: rgb(0,128,0); }
  .a1 { border: 4px solid rgb(255,0,0); }
  .a2 { border: rgb(255,0,0) 4px solid; }
  .a3 { border: solid 4px rgb(255,0,0); }
  .a4 { border: rgb(255,0,0) solid 4px; }
  /* Refused: a second width, a second style, a comma list. All three must paint NO border. */
  .r1 { border: 4px 2px solid rgb(255,0,0); }
  .r2 { border: solid double rgb(255,0,0); }
  .r3 { border: 4px solid rgb(255,0,0), 2px solid rgb(0,0,255); }
  .r4 { border-color: rgb(255,0,0), rgb(0,0,255); border-style: solid; border-width: 4px; }
  /* Region 2: the corner's two radii, folded when equal. */
  .c1 { width: 80px; height: 40px; background: rgb(0,0,255); border-top-left-radius: 30px 30px; }
  .c2 { width: 80px; height: 40px; background: rgb(0,0,255); border-top-right-radius: 10px 40px; }
  .c3 { width: 80px; height: 40px; background: rgb(0,0,255); border-radius: 20px 20px / 20px 20px; }
  /* Region 3: the gutter pair in either word order. */
  .g { width: 120px; height: 60px; overflow: scroll; scrollbar-gutter: stable; background: rgb(255,255,0); }
  .g1 { scrollbar-gutter: both-edges stable; }
  .g2 { scrollbar-gutter: stable both-edges; }
  .g3 { scrollbar-gutter: stable stable; }
  .tall { height: 200px; }
  /* Region 4: display pairs the enum cannot spell. */
  .it { display: inline table; background: rgb(128,0,128); }
  .rb { display: block ruby; background: rgb(0,128,128); }
  .mt { display: math; background: rgb(255,165,0); }
  /* Region 5: the legacy column break. */
  .cols { columns: 2; column-width: 90px; width: 200px; height: 120px; background: #eee; }
  .brk { -webkit-column-break-before: always; background: rgb(255,0,255); }
</style></head>
<body>
<div class="row">
  <div class="b1 a1"></div><div class="b1 a2"></div><div class="b1 a3"></div><div class="b1 a4"></div>
</div>
<div class="row">
  <div class="b1 r1"></div><div class="b1 r2"></div><div class="b1 r3"></div><div class="b1 r4"></div>
</div>
<div class="row"><div class="c1"></div><div class="c2"></div><div class="c3"></div></div>
<div class="row"><div class="g g1"><div class="tall"></div></div><div class="g g2"><div class="tall"></div></div><div class="g g3"><div class="tall"></div></div></div>
<div class="row">line A<span class="it"><div>inline-table</div></span>line B<span class="mt">math</span></div>
<div class="row"><div class="rb">ruby box</div></div>
<div class="cols"><div>one</div><div class="brk">two</div></div>
</body></html>
