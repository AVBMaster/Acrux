<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:8px;font:14px monospace}
input::placeholder{color:#999;font-style:italic}
::selection{background:#b3d4fc;color:#000}
</style></head><body><div id="out"></div>
<script>
const out=[];
function L(t,v){out.push("L~"+t+"~"+String(v).split(" ").join("_"));}
function gc(tag,css,prop){
  const d=document.createElement("div");d.setAttribute("style",css);document.body.appendChild(d);
  const v=getComputedStyle(d).getPropertyValue(prop).trim();
  L(tag,prop+"="+(v===""?"(empty)":v.split(" ").join("_")));d.remove();
}
// text-shadow multi
gc("ts-single","text-shadow:1px 1px red","text-shadow");
gc("ts-blur","text-shadow:1px 1px 3px rgba(0,0,0,0.5)","text-shadow");
gc("ts-multi","text-shadow:1px 1px red,2px 2px blue","text-shadow");
gc("ts-none","text-shadow:none","text-shadow");
// text-emphasis longhands
gc("te-style-dot","text-emphasis-style:dot","text-emphasis-style");
gc("te-style-circle","text-emphasis-style:circle","text-emphasis-style");
gc("te-style-double-circle","text-emphasis-style:double-circle","text-emphasis-style");
gc("te-style-triangle","text-emphasis-style:triangle","text-emphasis-style");
gc("te-style-sesame","text-emphasis-style:sesame","text-emphasis-style");
gc("te-style-none","text-emphasis-style:none","text-emphasis-style");
gc("te-style-filled","text-emphasis-style:filled","text-emphasis-style");
gc("te-style-open","text-emphasis-style:open","text-emphasis-style");
// text-emphasis shorthand
gc("te-shorthand","text-emphasis:filled circle red","text-emphasis-style");
gc("te-shorthand-color","text-emphasis:filled dot #333","text-emphasis-color");
// text-underline-position
gc("tup-auto","text-underline-position:auto","text-underline-position");
gc("tup-from-font","text-underline-position:from-font","text-underline-position");
gc("tup-under","text-underline-position:under","text-underline-position");
gc("tup-right","text-underline-position:right","text-underline-position");
gc("tup-left","text-underline-position:left under","text-underline-position");
// ::placeholder pseudo-element
const inp=document.createElement("input");inp.type="text";inp.placeholder="enter text";document.body.appendChild(inp);
const ph=getComputedStyle(inp,"::placeholder");
L("placeholder-color",ph.color.split(" ").join("_"));
L("placeholder-style",ph.fontStyle);
inp.remove();
// ::selection pseudo-element
const seld=document.createElement("div");seld.textContent="selectable text";document.body.appendChild(seld);
const sel=getComputedStyle(seld,"::selection");
L("selection-bg",sel.backgroundColor.split(" ").join("_"));
seld.remove();
// ::marker pseudo-element
const li=document.createElement("li");li.textContent="list item";document.body.appendChild(li);
const mk=getComputedStyle(li,"::marker");
L("marker-color",mk.color.split(" ").join("_"));
li.remove();
document.getElementById("out").textContent=out.join("\n");
</script></body></html>
