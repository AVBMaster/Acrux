<!DOCTYPE html>
<html><head><style>
body { font-family: Arial; margin: 8px; background:#fff; }
.w25 { width: 25%; border: 3px solid #00c; height: 20px; }
.w50 { width: 50%; border: 3px solid #0c0; height: 20px; }
.w100 { width: 100%; border: 3px solid #c00; height: 20px; }
.wa { width: auto; border: 3px solid #000; height: 20px; }
.outer { width: 300px; border: 2px solid #888; }
.inner { width: 50%; border: 2px solid #f0f; height: 20px; }
</style></head><body>
<div class="w25"></div>
<div class="w50"></div>
<div class="w100"></div>
<div class="wa"></div>
<div class="outer"><div class="inner"></div></div>
</body></html>
