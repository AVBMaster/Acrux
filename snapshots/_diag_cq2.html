<!doctype html><html><head><meta charset=utf-8><style>
#cw{container-type:inline-size;container-name:card;width:200px}
#cn{container-type:inline-size;width:180px}
#cbig{container-type:inline-size;width:250px}
@container card (min-width:150px){#cw>span{background:red}}
@container (min-width:150px){#cn>span{background:green}}
@container (min-width:150px){#cbig>span{background:blue}}
</style></head><body><meta charset=utf-8>
<div id=cw><span>cw</span></div>
<div id=cn><span>cn</span></div>
<div id=cbig><span>cbig</span></div>
<script>
const g=id=>{const e=document.querySelector("#"+id+">span");const s=getComputedStyle(e);
 return id+"="+s.backgroundColor.split("(")[0]+"|"+s.background.slice(0,30);};
document.body.appendChild(document.createTextNode(["cw","cn","cbig"].map(g).join(" ## ")));
</script></body></html>
