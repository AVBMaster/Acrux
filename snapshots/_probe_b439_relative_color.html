<!doctype html><html><body><pre id=rec></pre><script>
const out=[];
function s(label,el,props){ try{ const cs=getComputedStyle(el); const parts=[];
  for(const p of props) parts.push(p+'='+cs.getPropertyValue(p));
  out.push(label+' '+parts.join(' | ')); }catch(e){ out.push(label+' ERR '+e.message); } }
function mk(css){const d=document.createElement('div');d.style.cssText=css;document.body.appendChild(d);return d;}
function sup(prop,val){ try{ return CSS.supports(prop,val)?'Y':'N'; }catch(e){ return 'ERR'; } }
// b439: relative color syntax (CSS Color 5) + color-mix forms
s('rel-rgb', mk('color:rgb(from #3498db r g b)'), ['color']);
s('rel-rgb-alpha', mk('color:rgb(from #3498db r g b / 0.5)'), ['color']);
s('rel-rgb-calc', mk('color:rgb(from #ff0000 calc(r*0.5) g b)'), ['color']);
s('rel-hsl', mk('color:hsl(from #3498db h s l)'), ['color']);
s('rel-hwb', mk('color:hwb(from #3498db h w b)'), ['color']);
s('rel-lab', mk('color:lab(from #3498db l a b)'), ['color']);
s('rel-oklch', mk('color:oklch(from #3498db l c h)'), ['color']);
s('rel-currentcolor', mk('color:rgb(from currentcolor r g b)'), ['color']);
s('rel-none', mk('color:rgb(from #3498db none g b)'), ['color']);
s('mix-basic', mk('color:color-mix(in srgb, red, blue)'), ['color']);
s('mix-pct', mk('color:color-mix(in srgb, red 25%, blue)'), ['color']);
s('mix-oklab', mk('color:color-mix(in oklab, red, blue)'), ['color']);
s('mix-alpha', mk('color:color-mix(in srgb, rgba(255,0,0,.5), blue)'), ['color']);
s('mix-bogus-space', mk('color:color-mix(in bogus, red, blue)'), ['color']);
s('bg-rel', mk('background-color:rgb(from #112233 r g b)'), ['background-color']);
out.push('SUP rgb(from #3498db r g b) = '+sup('color','rgb(from #3498db r g b)'));
out.push('SUP color-mix(in srgb,red,blue) = '+sup('color','color-mix(in srgb, red, blue)'));
out.push('SUP hwb(from #000 h w b) = '+sup('color','hwb(from #000000 h w b)'));
document.getElementById('rec').textContent=out.join('\n');
</script></body></html>
