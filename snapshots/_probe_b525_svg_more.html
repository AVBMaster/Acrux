<!doctype html><html><body><pre id="rec"></pre><script>
const out=[];
const ns='http://www.w3.org/2000/svg';
function sv(label,attrs){ try{
  const el=document.createElementNS(ns,attrs.tag||'rect');
  for(const k in attrs) if(k!=='tag') el.setAttribute(k,attrs[k]);
  document.body.appendChild(el);
  const cs=getComputedStyle(el);
  const keys=Object.keys(attrs).filter(k=>k!=='tag');
  const parts=keys.map(k=>k+'='+cs.getPropertyValue(k));
  out.push(label+' '+parts.join(' '));
  el.remove();
}catch(e){ out.push(label+' ERR '+e.message); } }
sv('linecap',{tag:'path','stroke-linecap':'round'});
sv('linejoin',{tag:'path','stroke-linejoin':'bevel'});
sv('fillrule',{tag:'path','fill-rule':'evenodd'});
sv('cliprule',{tag:'path','clip-rule':'evenodd'});
sv('dasharray',{tag:'path','stroke-dasharray':'5,3'});
sv('dashoffset',{tag:'path','stroke-dashoffset':'2'});
sv('miterlimit',{tag:'path','stroke-miterlimit':'8'});
sv('fillopacity',{tag:'rect','fill-opacity':'0.3'});
sv('strokeopacity',{tag:'rect','stroke-opacity':'0.7'});
sv('dominantbaseline',{tag:'text','dominant-baseline':'middle'});
sv('markerstart',{tag:'path','marker-start':'url(#m)'});
sv('stopcolor',{tag:'stop','stop-color':'red'});
sv('floodcolor',{tag:'feFlood','flood-color':'blue'});
document.getElementById('rec').textContent=out.join('\n');
</script></body></html>
