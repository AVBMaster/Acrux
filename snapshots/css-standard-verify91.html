<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:20px;font:16px Arial}
h2{background:#eee;padding:3px;margin:12px 0 6px;font-size:14px}
/* font shorthand: italic bold 14px/1.8 "Times New Roman" */
.f1{font:italic bold 14px/1.8 "Times New Roman",serif}
/* font shorthand numeric weight + line-height px */
.f2{font:600 20px/25px Arial}
/* font shorthand with line-height % */
.f3{font:400 18px/150% Arial}
/* text-transform boundaries */
.t1{text-transform:capitalize}
.t2{text-transform:uppercase}
.t3{text-transform:lowercase}
.t4{text-transform:full-width}
.t5{text-transform:capitalize;word-break:break-all}
</style></head><body>
<div class="f1">font shorthand italic bold 14/1.8</div>
<div class="f2">font 600 20/25px</div>
<div class="f3">font 400 18/150%</div>
<div class="t1">one-two three/four five.foo bar-baz</div>
<div class="t2">Mixed CaSe 123 àéç</div>
<div class="t3">MiXeD CaSe</div>
<div class="t5">Supercalifragilisticexpialidocious word</div>
</body></html>
