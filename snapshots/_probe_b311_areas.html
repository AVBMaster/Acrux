<!doctype html>
<html><head><meta charset="utf-8"><title>b311 areas</title></head>
<body>
<div id="host"></div>
<script>
// b311_areas
function build() {
const host = document.createElement('div');
document.body.appendChild(host);
const rows = [];
const cases = [["position-area","top center"],["position-area","center top"],["position-area","left center"],["position-area","center left"],["position-area","top span-left"],["position-area","span-left top"],["position-area","span-left center"],["position-area","bottom span-right"],["position-area","self-start center"],["position-area","center self-start"],["position-area","top self-start"],["position-area","block-start center"],["position-area","center block-start"],["position-area","block-start top"],["position-area","left top"],["position-area","top left"],["position-area","right bottom"],["position-area","block-start inline-end"],["position-area","inline-start block-end"],["position-area","block-end inline-start"],["position-area","inline-end inline-start"],["position-area","span-start center"],["position-area","span-top span-left"]];
for (let i = 0; i < cases.length; i++) {
const el = document.createElement('div');
host.appendChild(el);
  el.style.setProperty(cases[i][0], cases[i][1]);
  rows.push(i + '|' + cases[i][0] + '|' + cases[i][1]
      + '|sup=' + (CSS.supports(cases[i][0], cases[i][1]) ? 1 : 0)
      + '|echo=' + el.style.getPropertyValue(cases[i][0])
      + '|comp=' + getComputedStyle(el).getPropertyValue(cases[i][0]));
}
document.body.insertAdjacentHTML('beforeend',
    '<pre id="record" style="font:10px/1.35 monospace;white-space:pre-wrap">'
    + rows.join('\n') + '</pre>');
console.log(rows.join('\n'));
host.remove();
}
build();
</script>
</body></html>
