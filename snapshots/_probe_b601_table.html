<!doctype html><html><head><meta charset=utf-8><style>
body{font:12px monospace;margin:4px}
.row{white-space:pre;font:12px monospace}
table{border-collapse:separate;border-spacing:6px;margin:4px 0}
td{border:2px solid #000;padding:4px;min-width:30px;min-height:16px}
#e1 td:empty{background:transparent}
#e2 td:empty{background:red}
#e3{border-collapse:collapse}
#e3 td{border:2px solid #000}
#e4{border-collapse:collapse}
#e4 td{border:4px solid red}
#e5{border-collapse:collapse}
#e5 td{border:3px solid blue}
</style></head><body>
<div id=out></div>
<table id=t1><tr><td>A</td><td>B</td></tr><tr><td>C</td><td>D</td></tr></table>
<table id=e1><tr><td>full</td><td></td></tr></table>
<table id=e3><tr><td>X</td><td>Y</td></tr></table>
<script>
const out=document.getElementById("out");
function row(t){const d=document.createElement("div");d.className="row";d.textContent=t;out.appendChild(d);}
for(const id of ["t1","e1","e3"]){
  const e=document.getElementById(id);const r=e.getBoundingClientRect();
  const td=e.querySelector("td");const s=getComputedStyle(td);const b=td.getBoundingClientRect();
  row("L|"+id+"|table="+Math.round(r.width)+"x"+Math.round(r.height)+"|td="+Math.round(b.width)+"x"+Math.round(b.height)+"|bc="+s.borderCollapse+"|bsp="+(s.borderSpacing||"-"));
}
</script></body></html>
