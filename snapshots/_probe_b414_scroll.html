<!doctype html><html><body><pre id=rec></pre><script>
const out=[];
function probe(label, css, inner){
 const box=document.createElement('div');box.setAttribute('style',css);
 const kid=document.createElement('div');kid.setAttribute('style',inner);
 box.appendChild(kid);document.body.appendChild(box);
 out.push(label+' sw='+box.scrollWidth+' cw='+box.clientWidth+' sh='+box.scrollHeight+' ch='+box.clientHeight);
 box.remove();
}
probe('oh-auto-400','width:200px;height:50px','width:400px;height:50px');
probe('oh-hidden-400','width:200px;height:50px;overflow:hidden','width:400px;height:50px');
probe('oh-scroll-400','width:200px;height:50px;overflow:scroll','width:400px;height:50px');
probe('oh-auto-0','width:200px;height:50px','width:0;height:0');
probe('oh-auto-50','width:200px;height:50px','width:50px;height:50px');
document.getElementById('rec').textContent=out.join('\n');
console.log(out.join('\n'));
</script></body></html>
