  ['-webkit-mask-box-image-source', 'url(a.png) none'],

const lines = [];
for (const c of cases) {
  const d = document.createElement('div');
  d.style.setProperty(c[0], c[1]);
  const kept = d.style.cssText.replace(/-webkit-mask-box-image/g, 'mbi');
  lines.push(c[0].replace('-webkit-mask-box-image', 'mbi') + ' <' + c[1] + '> => '
    + (kept || 'REFUSED') + ' | shorthand reads [' + d.style.getPropertyValue(c[0]) + ']');

console.log(lines.join('\n'));
