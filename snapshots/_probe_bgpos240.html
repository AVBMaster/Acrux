<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body { margin:0; font: 12px Consolas, monospace; }
.b { width: 60px; height: 12px; background-color: rgb(0,0,255); }
#report div { white-space: pre; }
</style></head><body>
<div class="b" id="p01" style="background-position: top 10px"></div>
<div class="b" id="p02" style="background-position: 10px top"></div>
<div class="b" id="p03" style="background-position: left 10px top"></div>
<div class="b" id="p04" style="background-position: left 10px center"></div>
<div class="b" id="p05" style="background-position: center 10px top"></div>
<div class="b" id="p06" style="background-position: right 10px bottom 20px"></div>
<div class="b" id="p07" style="background-position: top 10px left 20px"></div>
<div class="b" id="p08" style="background-position: left 10px right"></div>
<div class="b" id="p09" style="background-position: center 10px 20px"></div>
<div class="b" id="p10" style="background-position: left top 10px"></div>
<div class="b" id="p11" style="background-position: left right"></div>
<div class="b" id="p12" style="background-position: top bottom"></div>
<div class="b" id="p13" style="background-position: center top"></div>
<div class="b" id="p14" style="background-position: top center"></div>
<div class="b" id="p15" style="background-position: bottom"></div>
<div class="b" id="p16" style="background-position: left 10px 20px"></div>
<div class="b" id="p17" style="background-position: 10px 20px top"></div>
<div class="b" id="p18" style="background-position: left 10% top 20%"></div>
<div id="report"></div>
<script>
const out = [];
const g = (id, prop) => getComputedStyle(document.getElementById(id)).getPropertyValue(prop);
for (let i = 1; i <= 18; i++) {
  const id = 'p' + String(i).padStart(2, '0');
  out.push(id + '=' + g(id, 'background-position'));
}
const rep = document.getElementById('report');
for (const line of out) { const d = document.createElement('div'); d.textContent = line; rep.appendChild(d); }
</script>
</body></html>
