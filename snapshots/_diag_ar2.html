<!doctype html><html><head><style>#a{aspect-ratio:2/1;height:60px}#b{aspect-ratio:2/1;width:100px}</style></head><body><div id=a>x</div><div id=b>y</div><div id=o></div><script>const g=(id)=>{const e=document.getElementById(id);return id+": ar="+getComputedStyle(e).aspectRatio+" w="+e.getBoundingClientRect().width.toFixed(1)+" h="+e.getBoundingClientRect().height.toFixed(1);};document.getElementById("o").textContent=g("a")+" | "+g("b");</script></body></html>
