<!doctype html><html><head><meta charset="utf-8"><style>body{margin:8px;font:14px monospace}</style></head><body><div id="out"></div>
<script>
const out=[];
function L(t,v){out.push("L~"+t+"~"+String(v).split(" ").join("_"));}
function rect(el){const r=el.getBoundingClientRect();return Math.round(r.x)+","+Math.round(r.y)+"_"+Math.round(r.width)+"x"+Math.round(r.height);}
// border-collapse:collapse with border
const tc=document.createElement("table");tc.style.cssText="border-collapse:collapse;width:300px";
const tr=document.createElement("tr");tc.appendChild(tr);
const td1=document.createElement("td");td1.style.border="2px solid red";td1.textContent="A";tr.appendChild(td1);
const td2=document.createElement("td");td2.style.border="2px solid blue";td2.textContent="B";tr.appendChild(td2);
document.body.appendChild(tc);
L("collapse-td1",rect(td1));
L("collapse-td2",rect(td2));
tc.remove();
// border-collapse:separate
const ts=document.createElement("table");ts.style.cssText="border-collapse:separate;border-spacing:5px;width:300px";
const trs=document.createElement("tr");ts.appendChild(trs);
const tds=document.createElement("td");tds.style.border="2px solid green";tds.textContent="A";trs.appendChild(tds);
document.body.appendChild(ts);
L("separate-td",rect(tds));
ts.remove();
// caption-side:top / bottom
function mkTable(captionSide){
  const t=document.createElement("table");t.style.width="200px";
  const cap=document.createElement("caption");cap.textContent="Caption";cap.style.captionSide=captionSide;
  t.appendChild(cap);
  const tr=document.createElement("tr");t.appendChild(tr);
  const td=document.createElement("td");td.textContent="cell";tr.appendChild(td);
  document.body.appendChild(t);return{t,cap};
}
const topT=mkTable("top");
L("caption-top-cap-y",Math.round(topT.cap.getBoundingClientRect().y));
L("caption-top-tbl-y",Math.round(topT.t.getBoundingClientRect().y));
topT.t.remove();
const botT=mkTable("bottom");
L("caption-bottom-cap-y",Math.round(botT.cap.getBoundingClientRect().y));
botT.t.remove();
// table-layout:fixed with explicit widths
const tf=document.createElement("table");tf.style.cssText="table-layout:fixed;width:300px";
const trf=document.createElement("tr");tf.appendChild(trf);
const tdf1=document.createElement("td");tdf1.style.width="100px";tdf1.textContent="A";trf.appendChild(tdf1);
const tdf2=document.createElement("td");tdf2.textContent="B";trf.appendChild(tdf2);
document.body.appendChild(tf);
L("fixed-td1-w",Math.round(tdf1.getBoundingClientRect().width));
L("fixed-td2-w",Math.round(tdf2.getBoundingClientRect().width));
tf.remove();
// empty-cells:hide
const eh=document.createElement("table");eh.style.cssText="border-collapse:separate;empty-cells:hide;width:200px;border-spacing:5px";
const treh=document.createElement("tr");eh.appendChild(treh);
const tde=document.createElement("td");tde.textContent="A";treh.appendChild(tde);
const tde2=document.createElement("td");treh.appendChild(tde2);
document.body.appendChild(eh);
L("empty-cells-td1",rect(tde));
eh.remove();
document.getElementById("out").textContent=out.join("\n");
</script></body></html>
