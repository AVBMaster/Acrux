<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body { margin: 0; padding: 0; background: rgb(255,255,255); }
div { position: absolute; }
/* repeat-x: 100x20 tile row */
#rx { left: 0; top: 0; width: 100px; height: 20px; background: url("quad40.png") repeat-x; }
/* repeat-y: 20x60 tile column */
#ry { left: 0; top: 30px; width: 20px; height: 60px; background: url("quad40.png") repeat-y; }
/* repeat round: 60x40 -> two tiles stretched to 30px each */
#rr { left: 120px; top: 0; width: 60px; height: 40px; background: url("quad40.png") no-repeat; background-repeat: round; }
/* negative position: image shifted -5,-5 and cropped */
#neg { left: 120px; top: 50px; width: 40px; height: 40px; background: url("quad40.png") no-repeat; background-position: -5px -5px; }
/* right bottom position in a bigger box */
#rb { left: 200px; top: 50px; width: 60px; height: 60px; background: url("quad40.png") no-repeat; background-position: right bottom; }
/* repeat space: 100x20 with two 40px tiles -> 20px gap between them */
#sp { left: 0; top: 100px; width: 100px; height: 20px; background: url("quad40.png") no-repeat; background-repeat: space; }
/* repeat space: 100px wide box, two 40px tiles + 20px gap */
#sp { left: 0; top: 100px; width: 100px; height: 20px; background: url("quad40.png") no-repeat; background-repeat: space; }
</style>
</head>
<body>
<div id="rx"></div>
<div id="ry"></div>
<div id="rr"></div>
<div id="neg"></div>
<div id="rb"></div>
<div id="sp"></div>
</body>
</html>
