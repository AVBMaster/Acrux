<!doctype html><html><head><meta charset="utf-8"><style>body{margin:8px;font:14px monospace}</style></head><body><div id="out"></div>
<script>
const out=[];
function L(t,v){out.push("L~"+t+"~"+String(v).split(" ").join("_"));}
function gc(tag,css,prop){
  const d=document.createElement("div");d.setAttribute("style",css);document.body.appendChild(d);
  const v=getComputedStyle(d).getPropertyValue(prop).trim();
  L(tag,prop+"="+(v===""?"(empty)":v.split(" ").join("_")));d.remove();
}
// linear-gradient
gc("lg-basic","background-image:linear-gradient(red,blue)","background-image");
gc("lg-angle","background-image:linear-gradient(45deg,red,blue)","background-image");
gc("lg-to-right","background-image:linear-gradient(to right,red,blue)","background-image");
gc("lg-to-bottom-right","background-image:linear-gradient(to bottom right,red,blue)","background-image");
gc("lg-multi","background-image:linear-gradient(red,yellow,green,blue)","background-image");
gc("lg-stops","background-image:linear-gradient(to right,red 0%,blue 100%)","background-image");
gc("lg-mid-stop","background-image:linear-gradient(to right,red 25%,blue 75%)","background-image");
gc("lg-repeat","background-image:repeating-linear-gradient(to right,red 0,red 10px,blue 10px,blue 20px)","background-image");
// radial-gradient
gc("rg-circle","background-image:radial-gradient(circle,red,blue)","background-image");
gc("rg-ellipse","background-image:radial-gradient(ellipse,red,blue)","background-image");
gc("rg-at","background-image:radial-gradient(circle at 50% 50%,red,blue)","background-image");
gc("rg-size","background-image:radial-gradient(circle 50px,red,blue)","background-image");
gc("rg-closest","background-image:radial-gradient(circle closest-side,red,blue)","background-image");
gc("rg-farthest","background-image:radial-gradient(circle farthest-corner,red,blue)","background-image");
gc("rg-repeat","background-image:repeating-radial-gradient(circle,red 0,red 5px,blue 5px,blue 10px)","background-image");
// conic-gradient
gc("cg-basic","background-image:conic-gradient(red,blue)","background-image");
gc("cg-from","background-image:conic-gradient(from 45deg,red,blue)","background-image");
gc("cg-at","background-image:conic-gradient(at 50% 50%,red,blue)","background-image");
gc("cg-from-at","background-image:conic-gradient(from 0deg at 50% 50%,red,blue)","background-image");
gc("cg-repeat","background-image:repeating-conic-gradient(red 0deg 90deg,blue 90deg 180deg)","background-image");
document.getElementById("out").textContent=out.join("\n");
</script></body></html>
